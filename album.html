<script>
/* ===== WEB (GitHub Pages): convierte los enlaces go:seccion en seccion.html. En App Creator no hace nada. ===== */
(function(){
  var web = /github\.io$/.test(location.hostname);
  window.igURL = function(u){
    u = String(u);
    if (!web || u.indexOf("go:") !== 0) return u;
    var s = u.slice(3);
    return (s === "inicio" ? "index" : s) + ".html";
  };
  if (!web) return;
  document.addEventListener("click", function(e){
    var a = e.target.closest && e.target.closest('a[href^="go:"]');
    if (a){ e.preventDefault(); location.href = igURL(a.getAttribute("href")); }
  }, true);
})();
</script>

  rosa:  { n:"Rosa",  meta:"#FFF1F6", cs:"light", v:{ "--bg":"#FFF1F6","--card":"#FFFFFF","--bd":"#F8D9E5","--ink":"#2B1420","--mu":"#7A5568","--chip":"#FFE3ED","--gold":"#B3245A","--hi":"#D63B7A","--on-hi":"#FFFFFF","--track":"#F8D9E5","--toff":"#EEBFD1","--nav":"#FFFFFF","--av1":"#FFFFFF","--av2":"#F8D9E5","--ok":"#0F7A44" } },

};
function aplicarTema(id) {
  var p = PALETAS[id] || PALETAS.noche, r = document.documentElement;
  for (var k in p.v) r.style.setProperty(k, p.v[k]);
  r.style.colorScheme = p.cs; r.setAttribute("data-tema", PALETAS[id] ? id : "noche");
  var m = document.querySelector('meta[name="theme-color"]'); if (m) m.setAttribute("content", p.meta);
}
function temaActual() { try { var t = localStorage.getItem(TEMA_KEY); return PALETAS[t] ? t : "noche"; } catch (e) { return "noche"; } }
aplicarTema(temaActual());
window.addEventListener("storage", function (e) { if (e.key === TEMA_KEY) aplicarTema(temaActual()); });
</script>

<style>

/* ---- sopa ---- */
.tablero{position:relative;touch-action:none;user-select:none;-webkit-user-select:none}
.g{position:relative;z-index:2;display:grid;grid-template-columns:repeat(var(--n),1fr);grid-auto-rows:1fr;aspect-ratio:1/1}

/* ---- palabras: solo texto, con la traducción debajo ---- */
.pal{display:grid;grid-template-columns:1fr 1fr;gap:14px 12px;padding:0 4px}

const RONDAS = [
  { n:"Ronda 1", d:"Calentamiento: una palabra va al revés", lado:8,  dirs:[[0,1],[1,0],[1,1],[0,-1]], rev:1, trampa:0,   aura:10, rar:"COMÚN", rc:"#8C8C96" },
  { n:"Ronda 2", d:"La mitad de las palabras van al revés", lado:9,  dirs:[[0,1],[1,0],[1,1],[0,-1],[-1,0],[-1,-1]], rev:2, trampa:.35, aura:10, rar:"RARA", rc:"#3FD8C8" },
  { n:"Ronda 3", d:"Más largas, al revés y en diagonal", lado:10, dirs:[[0,1],[1,0],[1,1],[0,-1],[-1,0],[-1,1],[-1,-1],[1,-1]], rev:3, trampa:.6, aura:10, rar:"ÉPICA", rc:"#8E5BD6" },
  { n:"Ronda 4", d:"Nivel experto: todas al revés y con letras trampa", lado:11, dirs:[[0,1],[1,0],[1,1],[0,-1],[-1,0],[-1,1],[-1,-1],[1,-1]], rev:4, trampa:.85, aura:10, rar:"LEGENDARIA", rc:"#FFC83D" }
];
// rev = cuántas palabras van al revés (de derecha a izquierda o de abajo hacia arriba) · trampa = qué tanto se rellena con letras de las mismas palabras para confundir
const VOCAB_DESDE = "2026-10-26";      // el mismo día de inicio del Vocabulario del día (así el tema coincide con el Inicio)
const AURA_REPETIR = 2;                // Aura por ronda si la vuelve a jugar el mismo día
const ALBUM_URL = "go:album";
const VOLVER_URL = "go:inicio";

const esc = t => String(t).replace(/[&<>"]/g, c => ({ "&":"\x26amp;", "<":"\x26lt;", ">":"\x26gt;", '"':"\x26quot;" }[c]));
const leer = k => { try { return JSON.parse(localStorage.getItem(k) || "null"); } catch (e) { return null; } };

const SPR = {
  llama:{p:{o:"#FF8A3D",y:"#FFC83D"},r:["...o....","..oo.o..","..ooo.o.",".oooooo.",".ooyyoo.","oooyyooo",".oyyyyo.","..yyyy.."]},
};
function sprite(n, s) {
  const d = SPR[n]; if (!d) return "";
  const h = d.r.length, w = d.r[0].length;
  let o = '<svg width="' + Math.round(s * w / h) + '" height="' + s + '" viewBox="0 0 ' + w + ' ' + h + '" shape-rendering="crispEdges" aria-hidden="true">';
  d.r.forEach((row, y) => row.split("").forEach((c, x) => { if (c !== ".") o += '<rect x="' + x + '" y="' + y + '" width="1" height="1" fill="' + d.p[c] + '"></rect>'; }));
  return o + "</svg>";
}

const BASE = ["...kkkkkk...","..kkkkkkkk..","..kwwwwwwk..","..hhhhhhhh..","..hwessewh..","..ssssssss..","..sssmmsss..","ggggqllqgggg","ggggqllqgggg","ggggzllzgggg","gggggllggggg","llgggllgggll","ssgggllgggss","ssppppppppss","..ppp..ppp..","..fff..fff.."];
const PAL = { S:"#E3A67C", k:"#151518", w:"#F2F4F8", h:"#8A5A33", e:"#3A2414", s:"#F2B98F", m:"#B8704F", M:"#7A1F1F", g:"#5A5A5E", l:"#C4C4C8", q:"#A0A0A5", z:"#0B0B0D", p:"#1A1A1E", f:"#F2F4F8", W:"#FFFFFF", r:"#FF8FA3", R:"#E5322B", T:"#FF6B5E", y:"#FFC83D" };
const solo = (r1, r2, c1, c2, k) => { const o = []; for (let r = r1; r <= r2; r++) for (let c = c1; c <= c2; c++) o.push([r, c, k]); return o; };
const rects = l => l.map(x => '<rect x="' + x[1] + '" y="' + x[0] + '" width="1" height="1" fill="' + PAL[x[2]] + '"></rect>').join("");
const arriba = (lado, top) => { const a = lado === "R" ? 10 : 0; return solo(top, top + 1, a, a + 1, "s").concat(solo(top + 2, top + 2, a, a + 1, "l"), solo(top + 3, 8, a, a + 1, "g")); };
const chispa = (x, y, d) => '<g class="chs" style="animation-delay:' + d + 's"><rect x="' + (x + 1) + '" y="' + y + '" width="1" height="3" fill="#FFC83D"></rect><rect x="' + x + '" y="' + (y + 1) + '" width="3" height="1" fill="#FFC83D"></rect></g>';

function alegre() {
  const g = BASE.map(f => f.split(""));
  [[6,4,7,"M"],[5,3,3,"M"],[5,8,8,"M"],[5,2,2,"r"],[5,9,9,"r"]].forEach(m => { for (let c = m[1]; c <= m[2]; c++) g[m[0]][c] = m[3]; });
  const cab = [], cue = [];
  g.forEach((fila, r) => fila.forEach((k, c) => { if (k === ".") return; if (r <= 6) cab.push([r, c, k]); else if (r <= 13 && (c >= 10 || c <= 1)) return; else cue.push([r, c, k]); }));
  return '<svg class="alegre" viewBox="-1 -2 14 18.8" shape-rendering="crispEdges" aria-hidden="true"><rect x="2" y="16" width="8" height=".6" fill="#000" opacity=".4"></rect><g class="mov">' + rects(cue) +

    chispa(-1, 0, 0) + chispa(11, 0, .4) + chispa(5, -2, .8) + '</svg>';
}
function pensativo() {
  const g = BASE.map(f => f.split(""));
  [[6,5,6,"s"],[6,6,7,"m"]].forEach(m => { for (let c = m[1]; c <= m[2]; c++) g[m[0]][c] = m[3]; });
  const cab = [], cue = [], rd = [], ld = [];
  g.forEach((fila, r) => fila.forEach((k, c) => {
    if (k === ".") return; const x = [r, c, k];
    if (r <= 6) cab.push(x); else if (r <= 13 && c >= 10) rd.push(x); else if (r <= 13 && c <= 1) ld.push(x); else cue.push(x);
  }));
  const r1 = solo(5, 6, 9, 10, "S").concat(solo(7, 7, 10, 11, "l"), solo(8, 8, 10, 11, "g"));
  const r2 = solo(6, 7, 9, 10, "S").concat(solo(8, 8, 10, 11, "l"));
  const q = rects([[-2,10,"y"],[-2,11,"y"],[-2,12,"y"],[-1,12,"y"],[0,11,"y"],[2,11,"y"]]);
  return '<svg class="pienso" viewBox="-1 -2 14 18.8" shape-rendering="crispEdges" aria-hidden="true"><rect x="2" y="16" width="8" height=".6" fill="#000" opacity=".4"></rect><g class="mov">' + rects(cue) +

    '<g class="r1">' + rects(r1) + '</g><g class="r2">' + rects(r2) + '</g></g><g class="q">' + q + '</g></svg>';
}
const clave = d => d.getFullYear() + "-" + (d.getMonth() + 1) + "-" + d.getDate();

const sinTilde = t => t.toLowerCase().normalize("NFD").replace(/[̀-ͯ]/g, "");
function diaDeHoy() {
  const q = String(VOCAB_DESDE).split("-").map(Number), h = new Date();
  return Math.floor((Date.UTC(h.getFullYear(), h.getMonth(), h.getDate()) - Date.UTC(q[0], (q[1] || 1) - 1, q[2] || 1)) / 864e5);
}
function sopaHoy() {
  const dias = diaDeHoy(), k = ((dias % SOPA_TEMAS.length) + SOPA_TEMAS.length) % SOPA_TEMAS.length;

function quieto() { return window.matchMedia && matchMedia("(prefers-reduced-motion: reduce)").matches; }

  const t = SOPA_TEMAS[temaSel], id = idDe(t);

  let d = 0;
  rondasDe(t).forEach((r, ri) => {
    const R = RONDAS[ri], n = r.filter(w => A[id + ":" + w[0]]).length;

<script>
(function () {
  var caja = document.getElementById("sinNet");
  if (!caja) return;

  /* personaje triste, llorando bajo una nube (si falla el dibujo, la guardia funciona igual) */
  try {
    PAL.t = "#6EC6FF"; PAL.q = "#A0A0A5";
    var g = BASE.map(function (f) { return f.split(""); });
    [[6,5,6,"s"],[5,5,6,"m"],[6,4,4,"m"],[6,7,7,"m"]].forEach(function (m) { for (var c = m[1]; c <= m[2]; c++) g[m[0]][c] = m[3]; });
    var l = []; g.forEach(function (f, r) { f.forEach(function (k, c) { if (k !== ".") l.push([r, c, k]); }); });
    document.getElementById("snPj").innerHTML = '<svg viewBox="-1 -3 14 19.8" shape-rendering="crispEdges" aria-hidden="true">' + rects(l) +
      '<g class="snA">' + rects([[5,3,"t"],[5,8,"t"],[7,3,"t"]]) + '</g>' +
      '<g class="snB">' + rects([[6,3,"t"],[6,8,"t"],[8,8,"t"]]) + '</g>' +
      rects(solo(-2,-2,3,8,"q").concat(solo(-1,-1,2,9,"q"))) + '</svg>';
  } catch (e) {}

  /* MODO PRUEBA: muestra una franja verde arriba con el estado de la conexión. Cuando termines de probar, déjalo en false. */
  var DEBUG = false;
  var panel = null;
  if (DEBUG) {
    panel = document.createElement("div");
    panel.style.cssText = "position:fixed;left:0;right:0;top:0;z-index:99999;background:#000;color:#0f0;font:11px monospace;padding:4px 6px;pointer-events:none";
    panel.textContent = "guardia v2 cargada...";
    document.body.appendChild(panel);
  }

  /* sondas de conexión: si una está bloqueada en la red del usuario, se prueba la otra.
     Solo cuenta como "hay internet" una respuesta de tipo opaque (la que da una petición real a otro sitio). */
  var SONDAS = ["https://clients3.google.com/generate_204", "https://www.gstatic.com/generate_204"];
  var fallos = 0, revisando = false, info = "";

  function probar(url) {
    return new Promise(function (res) {
      var c = new AbortController(), t = setTimeout(function () { c.abort(); }, 4000);
      fetch(url + "?t=" + Date.now(), { mode: "no-cors", cache: "no-store", signal: c.signal })
        .then(function (r) { clearTimeout(t); res(r.type); })
        .catch(function () { clearTimeout(t); res("falla"); });
    });
  }
  async function hayInternet() {
    var partes = ["onLine=" + navigator.onLine], ok = false;
    if (navigator.onLine) {
      for (var i = 0; i < SONDAS.length; i++) {
        var tipo = await probar(SONDAS[i]);
        partes.push("sonda" + (i + 1) + "=" + tipo);
        if (tipo === "opaque") { ok = true; break; }
      }
    }
    info = partes.join(" · ");
    return ok;
  }
  async function revisar() {
    if (revisando) return; revisando = true;
    var ok = await hayInternet();
    fallos = ok ? 0 : fallos + 1;
    /* sin conexión (modo avión) bloquea al instante; con wifi sin internet espera 2 fallos seguidos */
    caja.hidden = !(navigator.onLine === false || fallos >= 2);
    if (panel) panel.textContent = "guardia v2 · " + info + " · fallos=" + fallos + " · pantalla=" + (caja.hidden ? "oculta" : "VISIBLE");
    revisando = false;
    if (!ok && fallos < 2) setTimeout(revisar, 2000);
  }

  document.getElementById("snRe").addEventListener("click", revisar);
  addEventListener("online", revisar);
  addEventListener("offline", revisar);
  addEventListener("pageshow", revisar);
  document.addEventListener("visibilitychange", function () { if (!document.hidden) revisar(); });
  setInterval(revisar, 15000);
  revisar();
})();
</script>
