<script>
/* ===== WEB (GitHub Pages): convierte los enlaces go:seccion en seccion.html. En App Creator no hace nada. ===== */
(function(){
  var web = /github\.io$/.test(location.hostname);
  window.igURL = function(u){
    u = String(u);
    if (!web || u.indexOf("go:") !== 0) return u;
    var s = u.slice(3);
    return (s === "inicio" ? "index" : s) + ".html";
  };
  if (!web) return;
  document.addEventListener("click", function(e){
    var a = e.target.closest && e.target.closest('a[href^="go:"]');
    if (a){ e.preventDefault(); location.href = igURL(a.getAttribute("href")); }
  }, true);
})();
</script>

noche:{meta:"#000000",cs:"dark",v:{"--bg":"#000000","--card":"#141416","--bd":"#2A2A2E","--ink":"#F4F4F5","--mu":"#B8B8C0","--chip":"#222226","--gold":"#FFD166","--hi":"#FFFFFF","--on-hi":"#000000","--track":"#2A2A2E","--toff":"#3A3A40","--ok":"#7BE3A8","--mal":"#FF6B6B"}},

azul:{meta:"#EFF6FF",cs:"light",v:{"--bg":"#EFF6FF","--card":"#FFFFFF","--bd":"#D6E6F8","--ink":"#0E1B2B","--mu":"#4F647B","--chip":"#E0EFFD","--gold":"#0B5FB0","--hi":"#1C6FD6","--on-hi":"#FFFFFF","--track":"#D6E6F8","--toff":"#BDD6F0","--ok":"#0F7A44","--mal":"#C0262D"}}};
function aplicarTema(id){var p=PALETAS[id]||PALETAS.noche,r=document.documentElement;for(var k in p.v)r.style.setProperty(k,p.v[k]);r.style.colorScheme=p.cs;var m=document.querySelector('meta[name="theme-color"]');if(m)m.setAttribute("content",p.meta);}
function temaActual(){try{var t=localStorage.getItem(TEMA_KEY);return PALETAS[t]?t:"noche";}catch(e){return "noche";}}
aplicarTema(temaActual());
window.addEventListener("storage",function(e){if(e.key===TEMA_KEY)aplicarTema(temaActual());});

.esp:after{content:"";position:absolute;left:50%;top:0;bottom:0;width:6px;margin-left:-3px;z-index:2;background:linear-gradient(#E8F7FF,#8FD8FF,#E8F7FF);box-shadow:0 0 18px #8FD8FF;opacity:.85}

.lado.ok .lb,.lado.ver .lb{opacity:1}
.pide{display:flex;align-items:center;gap:12px;margin-top:10px;padding:10px 12px;border-radius:22px;background:linear-gradient(160deg,#0E2433,var(--card));border:1px solid #2F5A75}
.pide .play{flex:none;width:52px;height:52px;border-radius:50%;border:0;background:var(--hi);color:var(--on-hi);display:flex;align-items:center;justify-content:center;cursor:pointer;box-shadow:0 4px 0 rgba(128,128,128,.35)}
.pide .t{flex:1;min-width:0}.pide b{display:block;font-size:24px;font-weight:900;line-height:1.1}.pide b u{text-decoration:none;color:var(--cc)}

.op2{min-height:62px;padding:8px;border-radius:18px;border:1px solid var(--bd);background:var(--card);cursor:pointer;font:900 22px Nunito,sans-serif;touch-action:manipulation}

.op2.ok{border-color:var(--ok);background:color-mix(in srgb,var(--ok) 18%,var(--card))}.op2.mal{border-color:var(--mal);background:color-mix(in srgb,var(--mal) 16%,var(--card))}
.card2{margin-top:6px;animation:entra .35s ease}.card2.sale{animation:sale .25s ease forwards}
.par{display:flex;align-items:flex-end;justify-content:center;gap:10px;line-height:0}

/* ===== EJERCICIOS TIPO DUOLINGO ===== */

.pie{position:sticky;bottom:0;margin:18px -16px 0;padding:14px 16px calc(14px + env(safe-area-inset-bottom));background:var(--bg);border-top:1px solid var(--bd);transition:background .25s}

/* ===== APRENDE · ESCENA VIVA (personaje que reacciona) ===== */
.escv{position:relative;height:220px;margin-top:10px;border-radius:22px;overflow:hidden;background:linear-gradient(#061230,#163C6A 70%,#DCEBF7 70%,#B9D3E8)}

.escv.f-cabana{background:linear-gradient(#3A1E10,#5A2E16 72%,#7A4E22 72%,#5E3A16)}

.escv.f-lluvia:before{content:"";position:absolute;inset:0;z-index:3;pointer-events:none;background:repeating-linear-gradient(105deg,transparent 0 14px,rgba(150,190,230,.35) 14px 15px);animation:llu .5s linear infinite}

.escv .pjw{position:absolute;bottom:8%;z-index:2;line-height:0}
.escv .obw{position:absolute;bottom:8%;z-index:2;line-height:0}
.escv .bub{position:absolute;top:10%;z-index:4;padding:8px 12px;border-radius:16px 16px 16px 4px;background:#fff;color:#000;font-weight:900;font-size:15px;animation:pop .3s;max-width:46%}
.escv .zz{position:absolute;z-index:4;font:900 16px Nunito,sans-serif;color:#BDE8FF;animation:zz 2.4s ease-in infinite}

.pjw.tiembla svg{animation:tiem .12s linear infinite}.pjw.salta svg{animation:salta .5s ease 2}
.vap{animation:vapor 1.6s ease-in-out infinite}.ali{animation:aliento 1.8s ease-out infinite}.got{animation:gota 1.2s ease-in infinite}.bri{animation:brilla 1s ease-in-out infinite}.llama{animation:fuego .25s steps(2) infinite}
.fra{margin-top:12px;padding:14px;border-radius:20px;background:var(--card);border:1px solid var(--bd);text-align:center}

@keyframes tiem{0%{transform:translateX(-1.5px)}50%{transform:translateX(1.5px)}100%{transform:translateX(-1.5px)}}

const CLAVE = "ingles_gamer_nieve_repaso", CLAVE_A1 = "ingles_gamer_a1_repaso", CLAVE_AURA = "ingles_gamer_aura";
function clave(d) { return d.getFullYear() + "-" + (d.getMonth() + 1) + "-" + d.getDate(); }

function subirEstrellas(n) { const S = cargarS(); S.est[NIVEL.id] = Math.max(S.est[NIVEL.id] || 0, n); try { localStorage.setItem(CLAVE, JSON.stringify(S)); } catch (e) {} return S.est[NIVEL.id]; }
/* la racha del día es la misma de toda la app (la del Inicio) */
function marcarDia() {
  [CLAVE_A1, CLAVE].forEach(k => { const S = cargarS(k), hoy = new Date(), ayer = new Date(hoy.getTime() - 864e5), h = clave(hoy); if (S.dia.u === h) return; S.dia.r = (S.dia.u === clave(ayer)) ? S.dia.r + 1 : 1; S.dia.u = h; try { localStorage.setItem(k, JSON.stringify(S)); } catch (e) {} });
}
function leerAura() { let a = { t:0, r:0, e:0, g:{}, l:[] }; try { const x = JSON.parse(localStorage.getItem(CLAVE_AURA) || "null"); if (x && typeof x === "object") a = Object.assign(a, x); } catch (e) {} a.t = Math.max(0, +a.t || 0); a.e = Math.max(0, +a.e || 0); if (!a.g || typeof a.g !== "object") a.g = {}; if (!Array.isArray(a.l)) a.l = []; return a; }
function darAura(total) {
  total = Math.max(0, Math.round(+total || 0));
  const a = leerAura(), gk = "nieve_" + NIVEL.id, ya = +a.g[gk] || 0, dar = Math.max(0, total - ya);
  a.g[gk] = Math.max(ya, total); if (!dar) return 0;
  a.t += dar; a.e += dar; a.l = [[dar, NIVEL.nombre.slice(0, 30), Date.now()]].concat(a.l).slice(0, 20);
  try { localStorage.setItem(CLAVE_AURA, JSON.stringify(a)); } catch (e) { return 0; } return dar;
}

function pantallaAprende(i, lista, dibujo, alTerminar) {
  const w = lista[i], n = lista.length;

    '<div class="bts"><button type="button" class="btnB" id="bOir">' + ICO_ON + 'Escuchar</button><button type="button" class="btnG" id="bLen">' + ICO_LENTO + 'Lento</button></div>' +
    '<button type="button" class="ej" id="bEj"><span class="t"><b>' + ej + '</b><span>' + esc(w.ejEs) + '</span></span>' + ICO_EJ + '</button>' +

  const o = a.createOscillator(), g = a.createGain(), t = a.currentTime + t0;

  o.connect(g); g.connect(MASTER); o.start(t); o.stop(t + d + 0.05);

  const a = f ? prep(f) : null; if (!a || a.fallo) { voz(texto, rate); return; }
  try { a.muted = false; a.playbackRate = rate || 1; if (a.currentTime > 0) { try { a.currentTime = 0; } catch (e) {} } AUD = a; const p = a.play(); if (p && p.catch) p.catch(err => { if (!err || err.name !== "NotAllowedError") voz(texto, rate); }); } catch (e) { voz(texto, rate); }

    const hash = s => { let h = 5381; for (let i = 0; i < s.length; i++) h = ((h << 5) + h + s.charCodeAt(i)) | 0; return h; };
    const getMeta = () => { try { return JSON.parse(localStorage.getItem(META)) || {}; } catch (e) { return {}; } };
