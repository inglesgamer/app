<script>
/* ================== DATOS QUE PUEDES CAMBIAR ================== */
const TEMPORADA = { num:1, nombre:"Jurásica", fin:"2026-12-01" };   // mismo dato que en la Tienda
const PRECIO_PASE = 800;
/* 30 escalones. Cada uno se abre con 1 hueso. g = premio gratis, p = premio del Pase.
   {aura:n} o {item:"id de la Tienda"} (av18 Raptor, av19 Triceratops, sk8 Ámbar, mc7 Fósil, tt7 Cazador de dinos, mp7 Fondo Jurásico) */
const ESCALONES = [   /* g = gratis (Aura de 10 a 12 y algunas cosas comunes de la Tienda) · p = Pase */
  { g:{aura:10},       p:{aura:40} },        { g:{aura:10},       p:{item:"mc7"} },  { g:{aura:11},       p:{aura:40} },        { g:{item:"tt1"},    p:{item:"sk6"} },   { g:{aura:11},       p:{aura:50} },
  { g:{aura:12},       p:{item:"sk8"} },     { g:{aura:10},       p:{aura:50} },     { g:{item:"mc1"},    p:{item:"tt7"} },     { g:{aura:11},       p:{aura:50} },      { g:{aura:12},       p:{item:"av19"} },
  { g:{aura:10},       p:{aura:60} },        { g:{item:"sk1"},    p:{item:"mc4"} },  { g:{aura:11},       p:{aura:60} },        { g:{aura:12},       p:{item:"mp4"} },   { g:{aura:10},       p:{aura:60} },
  { g:{item:"av4"},    p:{item:"tt6"} },     { g:{aura:11},       p:{aura:70} },     { g:{aura:12},       p:{item:"mp7"} },     { g:{aura:10},       p:{aura:70} },      { g:{item:"mp11"},   p:{item:"av18"} },
  { g:{aura:11},       p:{aura:80} },        { g:{aura:12},       p:{item:"mc5"} },  { g:{aura:10},       p:{aura:80} },        { g:{item:"tt2"},    p:{item:"sk7"} },   { g:{aura:11},       p:{aura:100} },
  { g:{aura:12},       p:{item:"mp14"} },    { g:{aura:10},       p:{aura:100} },    { g:{item:"mp1"},    p:{item:"an8"} },     { g:{aura:12},       p:{aura:150} },     { g:{aura:12},       p:{item:"av15"} }
];
/* La sección de App Creator que muestra el anuncio con premio. Al volver al pase se desbloquea el 2.º minijuego del día.
   Si la dejas vacía, sale un anuncio de prueba de 5 segundos. */
const ANUNCIO_URL = "";
/* Minijuegos: salen 3 por día (rotan solos). Cada uno da 1 hueso la primera vez del día. */
const MINIJUEGOS = [
  { id:"huevos",  n:"Huevos sorpresa",   d:"Escucha qué animal sale del huevo" },
  { id:"comer",   n:"Alimenta al dino",  d:"Dale la fruta que te pide" },
  { id:"excavar", n:"Excava fósiles",    d:"Escucha y escribe la palabra" },
  { id:"volcan",  n:"Lluvia del volcán", d:"Toca la roca del color que oyes" }
];
const AUDIO_CARPETA = "https://inglesgamer.github.io/app/audios/";
/* ============================================================== */
const K_PASE = "ingles_gamer_pase", K_AURA = "ingles_gamer_aura", K_TIENDA = "ingles_gamer_tienda", K_REP = "ingles_gamer_a1_repaso", K_SON = "ingles_gamer_sonido";
const $ = id => document.getElementById(id);

function sprite(n, size, st) {
  const d = SPR[n]; if (!d) return "";
  const h = d.r.length, w = d.r[0].length;
  let o = '<svg class="px" width="' + Math.round(size * w / h) + '" height="' + size + '" viewBox="0 0 ' + w + ' ' + h + '" shape-rendering="crispEdges" aria-hidden="true"' + (st ? ' style="' + st + '"' : '') + '>';
  d.r.forEach((row, y) => row.split("").forEach((c, x) => { if (c !== ".") o += '<rect x="' + x + '" y="' + y + '" width="1.02" height="1.02" fill="' + d.p[c] + '"></rect>'; }));
  return o + "</svg>";
}
