<script>
/* ===== WEB (GitHub Pages): convierte los enlaces go:seccion en seccion.html. En App Creator no hace nada. ===== */
(function(){
  var web = /github\.io$/.test(location.hostname);
  window.igURL = function(u){
    u = String(u);
    if (!web || u.indexOf("go:") !== 0) return u;
    var s = u.slice(3);
    return (s === "inicio" ? "index" : s) + ".html";
  };
  if (!web) return;
  document.addEventListener("click", function(e){
    var a = e.target.closest && e.target.closest('a[href^="go:"]');
    if (a){ e.preventDefault(); location.href = igURL(a.getAttribute("href")); }
  }, true);
})();
</script>

const REP = SV('<path d="M3 12a9 9 0 1 0 3-6.7L3 8"/><path d="M3 3v5h5"/>', 20), LENTO = SV('<circle cx="12" cy="13" r="8"/><path d="M12 9v4l2 2M9 2h6"/>', 20), ALT = SV('<path d="M4 10v4h4l5 4V6L8 10z"/><path d="M16 9a4 4 0 0 1 0 6"/>', 20);
const slug = t => t.toLowerCase().replace(/[’']/g, "").replace(/[^a-z0-9]+/g, "-").replace(/^-|-$/g, "");
let audio = null; function oir(t, lento) { return new Promise(r => { try { if (audio) audio.pause(); audio = new Audio(AUD + slug(t) + ".mp3"); audio.playbackRate = lento ? .75 : 1; audio.onended = r; audio.onerror = () => setTimeout(r, 900); audio.play().catch(() => setTimeout(r, 900)); } catch (e) { r(); } }); }

let AC; function tono(f, t, d) { try { AC = AC || new (window.AudioContext || window.webkitAudioContext)(); const o = AC.createOscillator(), g = AC.createGain(), t0 = AC.currentTime + t; o.type = "triangle"; o.frequency.value = f; g.gain.setValueAtTime(.0001, t0); g.gain.exponentialRampToValueAtTime(.08, t0 + .02); g.gain.exponentialRampToValueAtTime(.0001, t0 + d); o.connect(g).connect(AC.destination); o.start(t0); o.stop(t0 + d + .05); } catch (e) {} }

const LLAMA = sprite("llama", 18);
const FB = '<div class="fb" id="fb"><div class="in"><div class="row"><span class="fbpj" id="fbPj"></span><div><b id="fbT"></b><p id="fbP"></p></div></div><button class="btn" id="fbB">Continuar</button></div></div>';

let VIDAS = 3;

const TOP = '<div class="top"><button class="x" id="xx" aria-label="Salir">✕</button><div class="prog"><i id="pr"></i></div><span class="vid" id="vid"></span></div>';
const VT = '<button class="vt" id="vt">Ver traducción</button>';

/* muestra la barra de abajo con nuestro personaje; si se acaban las vidas, al continuar sale «sin corazones» */

document.addEventListener("click", e => { if (e.target.closest("#xx")) { if (confirm("¿Salir del reto? Perderás este intento.")) { callar(); intro(); } } });
const diasFaltan = () => { const d = new Date().getDay(); return d === 1 ? 7 : (8 - d) % 7 || 7; };
function fin(ok, tot) {

/* ---------- 1. ESCENA ---------- */
function escena() {
  const S = C.escenas[IDX(C.escenas.length)], L = S.l, QS = L.filter(l => l.q).length, g = S.bg;
  VIDAS = 3; $("app").innerHTML = TOP + tag() + VT + '<div class="esc" style="background:linear-gradient(' + g[0] + ',' + g[1] + ' 58%,' + g[2] + ' 58%,' + g[3] + ')"><span class="ven"></span><span class="mesa"></span><span class="p1" id="p1">' + sprite(S.pj[0], 120) + '</span><span class="p2" id="p2">' + sprite(S.pj[1], 120) + '</span><span class="burb b1" id="b1"></span><span class="burb b2" id="b2"></span></div>' +
    '<div class="ctrl"><button id="bRep">' + REP + 'Repetir</button><button id="bLen">' + LENTO + 'Lento</button></div><div class="preg" id="pg">Escucha…</div><div class="op" id="op"></div><div class="tr" id="tr"></div><button class="btn" id="bOk" style="display:none">Comprobar</button>' + FB;

      $("tr").textContent = l.es; await new Promise(r => setTimeout(r, 500)); i++; }

  }

  $("bOk").onclick = () => { const l = L[i], ok = sel === l.q; esperando = false; [...$("op").children].forEach(x => { if (x.dataset.o === l.q) x.classList.add("ok"); else if (x.dataset.o === sel) x.classList.add("mal"); });

  $("fbB").onclick = () => { $("fb").className = "fb"; if (!VIDAS) return sinVidas(); $("op").innerHTML = ""; $("pg").textContent = "Escucha…"; $("bOk").style.display = "none"; i++; seguir(); };
  $("bRep").onclick = () => decir(L[Math.min(i, L.length - 1)]);
  $("bLen").onclick = () => { lento = !lento; $("bLen").classList.toggle("on", lento); };

/* ---------- 2. HISTORIA ---------- */
function historia() {
  const H = C.historia, n = IDX(H.caps.length), K = H.caps[n];
  const glos = s => s.replace(/[A-Za-z]+/g, w => K.g[w.toLowerCase()] ? '<u data-g="' + w.toLowerCase() + '">' + w + '</u>' : w);
  VIDAS = 3; $("app").innerHTML = TOP + tag() + '<div class="capl">' + H.caps.map((c, i) => '<span class="' + (i <= n ? "si" : "") + '"></span>').join("") + '</div>' +
    '<div class="cab">' + sprite(H.pj, 70) + '<div><b>Capítulo ' + (n + 1) + ': ' + K.t + '</b><small>' + H.nm + ' · lee y escucha</small></div></div>' +
    '<div class="ctrl"><button id="bOir">' + ALT + 'Escuchar todo</button><button id="bLen">' + LENTO + 'Lento</button></div>' + VT +
    '<div class="txt" id="txt">' + K.o.map((o, i) => '<p class="or" data-i="' + i + '">' + glos(o) + '</p><span class="ores">' + (K.es ? K.es[i] : "") + '</span>').join("") + '</div><div id="qz"></div>' +
    '<button class="btn" id="bQ" style="margin-top:14px">Responder ' + K.q.length + ' preguntas</button><div class="glo" id="glo"></div>' + FB;
  let lento = false, q = 0, ac = 0, todo = false, tg;

  $("bQ").onclick = () => { todo = false; callar(); preg(); };
  $("qz").onclick = e => { const b = e.target.closest("button"); if (!b || b.disabled) return; const x = K.q[q], ok = +b.dataset.i === x[2]; if (ok) { ac++; bien(); } else malS();
    [...b.parentNode.children].forEach(c => { c.disabled = true; if (+c.dataset.i === x[2]) c.classList.add("ok"); else if (c === b) c.classList.add("mal"); });

  $("fbB").onclick = () => { $("fb").className = "fb"; if (!VIDAS) return sinVidas(); q++; if (q < K.q.length) return preg(); fin(ac, K.q.length); };

/* ---------- 3. REPITE ENCIMA ---------- */
function repite() {
  const S = C.repite[IDX(C.repite.length)], F = S.f, SR = window.SpeechRecognition || window.webkitSpeechRecognition;
  VIDAS = 3; $("app").innerHTML = TOP + tag() + '<h2>Escucha y repite encima · ' + S.nm + '</h2>' + VT + '<div class="onda" id="onda">' + "<i></i>".repeat(24) + '</div><div class="fr" id="fr"></div><div class="es2" id="es"></div>' +
    '<div class="ctrl"><button id="bOir">' + ALT + 'Escuchar</button><button id="bLen">' + LENTO + 'Lento</button></div><button class="mic" id="mic">' + SV('<rect x="9" y="3" width="6" height="11" rx="3"/><path d="M5 11a7 7 0 0 0 14 0M12 18v3"/>', 50, "#fff") + '</button>' +
    '<div class="est" id="est"></div><button class="yo" id="yo" hidden>No funciona el micrófono: lo dije en voz alta</button><button class="btn" id="sig" disabled>Siguiente</button>' + FB;
  let n = 0, lento = false, tot = 0, bienT = 0, anim, contado = false;
  const onda = on => { clearInterval(anim); const o = $("onda"); o.classList.toggle("on", on); [...o.children].forEach(i => i.style.height = "20px"); if (on) anim = setInterval(() => [...o.children].forEach(i => i.style.height = (12 + Math.random() * 56) + "px"), 120); };

  const pintar = () => { $("pr").style.width = (n / F.length * 100) + "%"; $("fr").innerHTML = pal(F[n][0]).map(w => '<span>' + w + '</span>').join(" "); $("es").textContent = F[n][1]; $("sig").disabled = true; contado = false;
    $("est").textContent = SR ? "Escucha y toca el micrófono para repetir" : "Escucha y repite en voz alta"; $("yo").hidden = !!SR; esc(); };
  $("bOir").onclick = esc; $("bLen").onclick = () => { lento = !lento; $("bLen").classList.toggle("on", lento); esc(); };
  $("yo").onclick = () => { if (!contado) { contado = true; tot += pal(F[n][0]).length; bienT += pal(F[n][0]).length; } $("sig").disabled = false; aviso(true, F[n][0]); };
  $("fbB").onclick = () => { $("fb").className = "fb"; if (!VIDAS) return sinVidas(); n++; if (n < F.length) return pintar(); fin(bienT, tot); };
  $("mic").onclick = () => {
    if (!SR) { $("yo").hidden = false; $("est").textContent = "Este celular no deja usar el micrófono aquí. Dila en voz alta y toca el botón de abajo."; return; }

    callar(); $("mic").classList.add("on"); $("est").textContent = "Te escucho…";
    rec.onresult = ev => { const dichas = new Set([...ev.results[0]].map(a => a.transcript).join(" ").toLowerCase().replace(/[’']/g, "").replace(/[^a-z ]/g, " ").split(/\s+/));
      const ws = pal(F[n][0]); let b = 0; $("fr").innerHTML = ws.map(w => { const ok = dichas.has(nrm(w)); if (ok) b++; return '<span class="' + (ok ? "ok" : "mal") + '">' + w + '</span>'; }).join(" ");
      if (!contado) { contado = true; tot += ws.length; bienT += b; }
      $("est").textContent = b === ws.length ? "¡Perfecto! " + b + " de " + ws.length : b + " de " + ws.length + " bien"; (b === ws.length ? bien : malS)(); $("sig").disabled = false;

let NOMBRE = "";

  if (RETO_N === 1) NOMBRE = C.escenas[IDX(C.escenas.length)].nm;
  if (RETO_N === 2) { const k = IDX(C.historia.caps.length); NOMBRE = "Capítulo " + (k + 1) + ": " + C.historia.caps[k].t; }
  if (RETO_N === 3) NOMBRE = C.repite[IDX(C.repite.length)].nm;
  const pj = RETO_N === 1 ? C.escenas[IDX(C.escenas.length)].pj[1] : RETO_N === 2 ? C.historia.pj : "av7";
  const txt = { 1:"Escucha una conversación y elige las palabras que faltan.", 2:"Lee y escucha el capítulo de esta semana, y responde las preguntas.", 3:"Escucha cada frase y repítela con el micrófono." }[RETO_N];
  $("app").innerHTML = '<div class="top"><button class="x" onclick="cerrar()" aria-label="Volver">✕</button><div style="flex:1"></div></div><div class="intro">' + tag() + sprite(pj, 120) + '<h1>' + NOMBRE + '</h1><p>' + txt + '</p>' +
    (ya ? '<span class="au">Ya lo hiciste esta semana · puedes repetirlo</span>' : '<span class="au">' + LLAMA + '+' + AURA_RETO + ' de Aura</span>') + '<p style="font-size:13px">Cambia en ' + d + (d === 1 ? ' día' : ' días') + '</p>' +
    '<div class="pie"><button class="btn" id="go">Empezar</button><button class="btn sec" onclick="cerrar()">Volver al inicio</button></div></div>';

}
