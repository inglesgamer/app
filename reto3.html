<script>
/* ===== WEB (GitHub Pages): convierte los enlaces go:seccion en seccion.html. En App Creator no hace nada. ===== */
(function(){
  var web = /github\.io$/.test(location.hostname);
  window.igURL = function(u){
    u = String(u);
    if (!web || u.indexOf("go:") !== 0) return u;
    var s = u.slice(3);
    return (s === "inicio" ? "index" : s) + ".html";
  };
  if (!web) return;
  document.addEventListener("click", function(e){
    var a = e.target.closest && e.target.closest('a[href^="go:"]');
    if (a){ e.preventDefault(); location.href = igURL(a.getAttribute("href")); }
  }, true);
})();
</script>

  noche: { n:"Noche", meta:"#000000", cs:"dark", v:{ "--bg":"#000000","--card":"#141416","--bd":"#2A2A2E","--ink":"#F4F4F5","--mu":"#B8B8C0","--chip":"#222226","--gold":"#FFD166","--hi":"#FFFFFF","--on-hi":"#000000","--track":"#2A2A2E","--toff":"#3A3A40","--nav":"#0E0E10","--av1":"#3A3A40","--av2":"#101012","--ok":"#7BE3A8" } },

  rosa:  { n:"Rosa",  meta:"#FFF1F6", cs:"light", v:{ "--bg":"#FFF1F6","--card":"#FFFFFF","--bd":"#F8D9E5","--ink":"#2B1420","--mu":"#7A5568","--chip":"#FFE3ED","--gold":"#B3245A","--hi":"#D63B7A","--on-hi":"#FFFFFF","--track":"#F8D9E5","--toff":"#EEBFD1","--nav":"#FFFFFF","--av1":"#FFFFFF","--av2":"#F8D9E5","--ok":"#0F7A44" } },

};
function aplicarTema(id) {
  var p = PALETAS[id] || PALETAS.noche, r = document.documentElement;
  for (var k in p.v) r.style.setProperty(k, p.v[k]);
  r.style.colorScheme = p.cs; r.setAttribute("data-tema", PALETAS[id] ? id : "noche");
  var m = document.querySelector('meta[name="theme-color"]'); if (m) m.setAttribute("content", p.meta);
}
function temaActual() { try { var t = localStorage.getItem(TEMA_KEY); return PALETAS[t] ? t : "noche"; } catch (e) { return "noche"; } }
aplicarTema(temaActual());
window.addEventListener("storage", function (e) { if (e.key === TEMA_KEY) aplicarTema(temaActual()); });
window.addEventListener("pageshow", function () { aplicarTema(temaActual()); });
</script>

<script type="module">
/* ===== NUBE: guarda tu progreso en tu cuenta y lo recupera. Este MISMO bloque va en todas las pantallas (justo antes de </body>). ===== */
import { initializeApp, getApps, getApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import { getAuth, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";
import { getFirestore, doc, getDoc, setDoc } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

const CONFIG = {
  apiKey: "AIzaSyDrBReVK9v1ioWfBIyMCnvtuUgbbWPcxTE",
  authDomain: "inglesgamer-5a3a9.firebaseapp.com",
  projectId: "inglesgamer-5a3a9",
  storageBucket: "inglesgamer-5a3a9.firebasestorage.app",
  messagingSenderId: "599532765222",
  appId: "1:599532765222:web:38fe3a7348b3c38e3426e7"
};

(function () {
  try {
    const PREF = "ingles_gamer_", META = "ig_nube_meta";
    const SKIP = /_(sesion|tema|sonido|buzon|buzon_pausa|acceso_modo)$/;
    const app = getApps().length ? getApp() : initializeApp(CONFIG);
    const auth = getAuth(app), db = getFirestore(app);
    let user = null, ocupado = false;

    const dormir = ms => new Promise(r => setTimeout(r, ms));
    const estado = (ok, e) => { try { localStorage.setItem("ig_nube_estado", JSON.stringify({ ok: !!ok, t: Date.now(), c: ok ? "" : String((e && (e.code || e.message)) || "error") })); } catch (x) {} };
    const ref = () => doc(db, "progreso", user.uid);
    const claves = () => { const k = []; try { for (let i = 0; i < localStorage.length; i++) { const n = localStorage.key(i); if (n.indexOf(PREF) === 0 && !SKIP.test(n)) k.push(n); } } catch (e) {} return k; };
    const snap = () => { const o = {}; claves().forEach(k => { o[k] = localStorage.getItem(k); }); return o; };
    const ser = o => JSON.stringify(Object.keys(o).sort().map(k => [k, o[k]]));
    const hash = s => { let h = 5381; for (let i = 0; i < s.length; i++) h = ((h << 5) + h + s.charCodeAt(i)) | 0; return h; };
    const getMeta = () => { try { return JSON.parse(localStorage.getItem(META)) || {}; } catch (e) { return {}; } };
    const setMeta = m => { try { localStorage.setItem(META, JSON.stringify(m)); } catch (e) {} };
    /* CORREGIDO: "vacío" = sin progreso real (solo el apodo/perfil no cuenta) */
    const vacio = o => !o || !(o.ingles_gamer_a1_repaso || o.ingles_gamer_aura || o.ingles_gamer_tienda);
    const limpiar = () => claves().forEach(k => localStorage.removeItem(k));
    const cambios = () => !!user && getMeta().uid === user.uid && hash(ser(snap())) !== getMeta().h;
    const puntos = d => {
      try {
        const a = JSON.parse(d.ingles_gamer_aura || "null") || {}, r = JSON.parse(d.ingles_gamer_a1_repaso || "null") || {};
        return (+a.t || 0) + Object.values(r.est || {}).reduce((x, y) => x + (+y || 0), 0);
      } catch (e) { return 0; }
    };

    async function subir() {
      const o = snap(), t = Date.now();
      await setDoc(ref(), { datos: o, t: t, v: 1 });
      setMeta({ uid: user.uid, t: t, h: hash(ser(o)) });
      estado(true);
    }
    function bajar(c) {
      limpiar();
      const d = c.datos || {};
      for (const k in d) if (k.indexOf(PREF) === 0 && !SKIP.test(k) && typeof d[k] === "string") localStorage.setItem(k, d[k]);
      setMeta({ uid: user.uid, t: c.t || Date.now(), h: hash(ser(snap())) });
    }

    async function sync(lanzar) {
      if (!user || ocupado) return "igual";
      ocupado = true;
      let res = "igual";
      try {
        const m = getMeta(), o = snap(), h = hash(ser(o)), s = await getDoc(ref()), c = s.exists() ? s.data() : null, cd = (c && c.datos) || {};
        if (m.uid && m.uid !== user.uid) {
          limpiar();
          if (c) bajar(c); else await subir();
          res = "bajado"; location.reload();
        } else if (m.uid !== user.uid) {
          if (c && (vacio(o) || puntos(cd) >= puntos(o))) { bajar(c); res = "bajado"; location.reload(); }
          else { await subir(); res = "subido"; }
        } else if (c && vacio(o) && !vacio(cd)) {
          bajar(c); res = "bajado"; location.reload();
        } else if (!c || h !== m.h) { await subir(); res = "subido"; }
        else if (c.t > m.t) { bajar(c); res = "bajado"; location.reload(); }
        else estado(true);
      } catch (e) { ocupado = false; estado(false, e); if (lanzar) throw e; return "igual"; }
      ocupado = false;
      return res;
    }

    const guardarYa = () => { if (cambios()) sync(); };
    onAuthStateChanged(auth, u => { user = u; if (u) sync(); });
    document.addEventListener("visibilitychange", () => { if (document.hidden) guardarYa(); else sync(); });
    addEventListener("pagehide", guardarYa);
    setInterval(guardarYa, 45000);

    window.IGNube = {
      listo: true,
      sincronizar: () => sync(),
      usuario: () => user,
      async subirYa() {
        for (let i = 0; i < 40 && !user; i++) await dormir(250);
        if (!user) throw new Error("sin-sesion");
        while (ocupado) await dormir(200);
        const r = await sync(true);
        if (r === "bajado") throw new Error("recargando");
      }
    };
  } catch (e) { console.error("[nube]", e); }
})();
</script>

<script type="module">
/* ===== FICHA: publica tu Aura, estrellas y racha en tu ficha pública (para el Ranking) ===== */
import { initializeApp, getApps, getApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import { getAuth, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";
import { getFirestore, doc, getDoc, updateDoc, serverTimestamp, collection, query, where, limit, getDocs } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

const CONFIG = {

  authDomain: "inglesgamer-5a3a9.firebaseapp.com",
  projectId: "inglesgamer-5a3a9",
  storageBucket: "inglesgamer-5a3a9.firebasestorage.app",
  messagingSenderId: "599532765222",
  appId: "1:599532765222:web:38fe3a7348b3c38e3426e7"
};
(function () {
  try {
    const app = getApps().length ? getApp() : initializeApp(CONFIG);
    const auth = getAuth(app), db = getFirestore(app);
    const CREADOR = "tZfZSV8kJ8emISaSpmVwsNzrueD2";
    const IDS = ["esc1","saludos","vocab","infopers","paises","numeros","colores","familia","hogar","objetos","animales","comidas","restaurante","esc2","viajes","verbos","vocab2","fechas","esc3","final"];
    const leer = k => { try { return JSON.parse(localStorage.getItem(k) || "null"); } catch (e) { return null; } };
    const clave = d => d.getFullYear() + "-" + (d.getMonth() + 1) + "-" + d.getDate();
    const aSemana = d => { const x = new Date(d.getFullYear(), d.getMonth(), d.getDate()); x.setDate(x.getDate() - ((x.getDay() + 6) % 7)); return clave(x); };
    const activo = () => { const v = leer("ingles_gamer_estado_activo"); return v === null ? true : !!v; };
    const estado = (ok, e) => { try { localStorage.setItem("ig_ficha_estado", JSON.stringify({ ok: !!ok, t: Date.now(), c: ok ? "" : String((e && (e.code || e.message)) || "error") })); } catch (x) {} };

    function calcular() {
      const perfil = leer("ingles_gamer_perfil"), auraG = leer("ingles_gamer_aura"), tienda = leer("ingles_gamer_tienda");
      const own = (tienda && Array.isArray(tienda.own)) ? tienda.own : [];

      if (av === 9) { if (!(user && user.uid === CREADOR)) av = 0; } else if (av > 1 && own.indexOf("av" + av) < 0) av = 0;
      const aura = Math.max(0, +(auraG && auraG.t) || 0);
      const rep = leer("ingles_gamer_a1_repaso") || {}, est = rep.est || {}, dia = rep.dia || { u: "", r: 0 };
      const e = id => Math.min(3, Math.max(0, +est[id] || 0));
      const estrellas = IDS.reduce((a, id) => a + e(id), 0);
      const niv = IDS.filter(id => e(id) >= 1).length, tres = IDS.filter(id => e(id) >= 3).length;
      const vivo = (dia.u === clave(new Date()) || dia.u === clave(new Date(Date.now() - 864e5))) && +dia.r > 0;
      const racha = vivo ? Math.min(+dia.r, 3650) : 0;
      const med = [];
      if (estrellas >= 1) med.push(0); if (racha >= 3) med.push(1); if (niv >= 10) med.push(2); if (tres >= 1) med.push(3);
      if (tres >= 5) med.push(4); if (e("verbos") >= 1) med.push(5); if (tres >= 10) med.push(6); if (e("final") >= 1) med.push(7);
      const b = leer("ingles_gamer_aura_base") || {}, h = new Date();
      const ks = { dia: clave(h), sem: aSemana(h), mes: h.getFullYear() + "-" + (h.getMonth() + 1) };
      ["dia", "sem", "mes"].forEach(p => { if (!b[p]) b[p] = { k: ks[p], v: 0 }; else if (b[p].k !== ks[p]) b[p] = { k: ks[p], v: aura }; });
      try { localStorage.setItem("ingles_gamer_aura_base", JSON.stringify(b)); } catch (x) {}
      /* LOOK equipado en la Tienda: skin (sk), marco (mc), título (tt) y fondo/mapa (mp) */
      const eq = (tienda && tienda.eq) || {};
      const pick = (k, max) => { const id = String(eq[k] || ""), n = id.indexOf(k) === 0 ? Number(id.slice(2)) : 0; return (n > 0 && n < max && own.indexOf(k + n) > -1) ? n : 0; };
      return { av, aura, est: estrellas, niv, racha, med, sem: Math.max(0, aura - (b.sem.v || 0)), mes: Math.max(0, aura - (b.mes.v || 0)),
               lsk: pick("sk", 9), lmc: pick("mc", 8), ltt: pick("tt", 17), lmp: pick("mp", 15) };
    }

    let user = null, ficha = null, ocupado = false, ultHash = "", ultT = 0;
    async function publicar(forzar) {
      if (!user || ocupado) return;
      const m = leer("ig_nube_meta") || {};
      if (m.uid !== user.uid) return;                 /* NUBE todavía no terminó de sincronizar */
      ocupado = true;
      try {
        const ref = doc(db, "jugadores", user.uid);

  a.g["reto" + RETO_N + "_" + SEMANA()] = n; a.l = [[n, txt, Date.now()]].concat(Array.isArray(a.l) ? a.l : []).slice(0, 20); guardar("ingles_gamer_aura", a);
}
const SV = (p, s, c) => '<svg width="' + s + '" height="' + s + '" viewBox="0 0 24 24" fill="none" stroke="' + (c || "currentColor") + '" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round">' + p + '</svg>';
const REP = SV('<path d="M3 12a9 9 0 1 0 3-6.7L3 8"/><path d="M3 3v5h5"/>', 20), LENTO = SV('<circle cx="12" cy="13" r="8"/><path d="M12 9v4l2 2M9 2h6"/>', 20), ALT = SV('<path d="M4 10v4h4l5 4V6L8 10z"/><path d="M16 9a4 4 0 0 1 0 6"/>', 20);
const slug = t => t.toLowerCase().replace(/[’']/g, "").replace(/[^a-z0-9]+/g, "-").replace(/^-|-$/g, "");
let audio = null; function oir(t, lento) { return new Promise(r => { try { if (audio) audio.pause(); audio = new Audio(AUD + slug(t) + ".mp3"); audio.playbackRate = lento ? .75 : 1; audio.onended = r; audio.onerror = () => setTimeout(r, 900); audio.play().catch(() => setTimeout(r, 900)); } catch (e) { r(); } }); }
function callar() { try { if (audio) audio.pause(); } catch (e) {} }
let AC; function tono(f, t, d) { try { AC = AC || new (window.AudioContext || window.webkitAudioContext)(); const o = AC.createOscillator(), g = AC.createGain(), t0 = AC.currentTime + t; o.type = "triangle"; o.frequency.value = f; g.gain.setValueAtTime(.0001, t0); g.gain.exponentialRampToValueAtTime(.08, t0 + .02); g.gain.exponentialRampToValueAtTime(.0001, t0 + d); o.connect(g).connect(AC.destination); o.start(t0); o.stop(t0 + d + .05); } catch (e) {} }
const bien = () => { tono(660, 0, .15); tono(990, .1, .25); }, malS = () => tono(220, 0, .25);
const LLAMA = sprite("llama", 18);
const FB = '<div class="fb" id="fb"><div class="in"><b id="fbT"></b><p id="fbP"></p><button class="btn" id="fbB">Continuar</button></div></div>';
const TOP = '<div class="top"><button class="x" id="xx" aria-label="Salir">✕</button><div class="prog"><i id="pr"></i></div></div>';
const tag = () => '<span class="tag" style="background:' + INFO[RETO_N].bg + ';color:' + INFO[RETO_N].fg + '">RETO DE LA SEMANA · ' + INFO[RETO_N].t.toUpperCase() + '</span>';
function cerrar() { callar(); location.href = igURL("go:inicio"); }
document.addEventListener("click", e => { if (e.target.closest("#xx")) { if (confirm("¿Salir del reto? Perderás este intento.")) { callar(); intro(); } } });
const diasFaltan = () => { const d = new Date().getDay(); return d === 1 ? 7 : (8 - d) % 7 || 7; };
function fin(ok, tot) {
  callar(); const R = estado(), ya = !!R.h[RETO_N], gan = ya ? 0 : AURA_RETO;
  if (!ya) { R.h[RETO_N] = 1; R.t[RETO_N] = { nm:NOMBRE }; guardar("ingles_gamer_retos", R); darAura(gan, "Reto: " + INFO[RETO_N].t); }
  try { if (window.IGNube && IGNube.subirYa) IGNube.subirYa().then(() => { try { if (window.IGFicha) IGFicha.publicar(); } catch (e) {} }).catch(() => {}); } catch (e) {}
  const est = tot ? (ok >= tot ? 3 : ok >= Math.ceil(tot * .6) ? 2 : 1) : 3;
  $("app").innerHTML = "";
  if (window.IGFinal) IGFinal.mostrar({ aura:gan, estrellas:est, titulo:"¡Reto superado!", sub:INFO[RETO_N].t + " · " + NOMBRE + (tot ? " · " + ok + " de " + tot : ""), multi:false, alSalir:cerrar });
  else $("app").innerHTML = '<div class="intro"><h1>¡Reto superado!</h1><p>+' + gan + ' de Aura</p><div class="pie"><button class="btn" onclick="cerrar()">Volver al inicio</button></div></div>';
}
/* ---------- 1. ESCENA ---------- */
function escena() {
  const S = C.escenas[IDX(C.escenas.length)], L = S.l, QS = L.filter(l => l.q).length, g = S.bg;
  $("app").innerHTML = TOP + tag() + '<div class="esc" style="background:linear-gradient(' + g[0] + ',' + g[1] + ' 58%,' + g[2] + ' 58%,' + g[3] + ')"><span class="ven"></span><span class="mesa"></span><span class="p1" id="p1">' + sprite(S.pj[0], 120) + '</span><span class="p2" id="p2">' + sprite(S.pj[1], 120) + '</span><span class="burb b1" id="b1"></span><span class="burb b2" id="b2"></span></div>' +
    '<div class="ctrl"><button id="bRep">' + REP + 'Repetir</button><button id="bLen">' + LENTO + 'Lento</button></div><div class="preg" id="pg">Escucha…</div><div class="op" id="op"></div><div class="tr" id="tr"></div><button class="btn" id="bOk" style="display:none">Comprobar</button>' + FB;
  let i = 0, lento = false, sel = null, ac = 0, esperando = false;
  const decir = l => { const p = $("p" + l.w); p.classList.add("hab"); return oir(l.t, lento).then(() => p.classList.remove("hab")); };
  const burb = (l, h) => { const b = $("b" + l.w); b.innerHTML = h ? l.t.replace(new RegExp("\\b" + l.q + "\\b"), '<span class="hu" id="hu">?</span>') : l.t; b.classList.remove("on"); void b.offsetWidth; b.classList.add("on"); };
  async function seguir() {
    while (i < L.length) { const l = L[i]; $("pr").style.width = (i / L.length * 100) + "%"; burb(l, !!l.q); await decir(l);
      if (l.q) { esperando = true; sel = null; $("pg").textContent = "¿Qué palabra dijo?"; $("op").innerHTML = l.op.map(o => '<button data-o="' + o + '">' + o + '</button>').join(""); $("bOk").style.display = ""; $("bOk").disabled = true; return; }
      $("tr").textContent = l.es; await new Promise(r => setTimeout(r, 500)); i++; }
    fin(ac, QS);
  }
  $("op").onclick = e => { const b = e.target.closest("button"); if (!b || !esperando) return; sel = b.dataset.o; [...$("op").children].forEach(x => x.classList.toggle("sel", x === b)); $("bOk").disabled = false; };
  $("bOk").onclick = () => { const l = L[i], ok = sel === l.q; esperando = false; [...$("op").children].forEach(x => { if (x.dataset.o === l.q) x.classList.add("ok"); else if (x.dataset.o === sel) x.classList.add("mal"); });
    const hu = $("hu"); if (hu) hu.textContent = l.q; $("tr").textContent = l.es; if (ok) { ac++; bien(); } else malS();
    $("fbT").textContent = ok ? "¡Muy bien!" : "Casi"; $("fbP").textContent = ok ? l.t : "Dijo «" + l.q + "»: " + l.t; $("fb").className = "fb on " + (ok ? "ok" : "mal"); };
  $("fbB").onclick = () => { $("fb").className = "fb"; $("op").innerHTML = ""; $("pg").textContent = "Escucha…"; $("bOk").style.display = "none"; i++; seguir(); };
  $("bRep").onclick = () => decir(L[Math.min(i, L.length - 1)]);
  $("bLen").onclick = () => { lento = !lento; $("bLen").classList.toggle("on", lento); };
  seguir();
}
/* ---------- 2. HISTORIA ---------- */
function historia() {
  const H = C.historia, n = IDX(H.caps.length), K = H.caps[n];
  const glos = s => s.replace(/[A-Za-z]+/g, w => K.g[w.toLowerCase()] ? '<u data-g="' + w.toLowerCase() + '">' + w + '</u>' : w);
  $("app").innerHTML = TOP + tag() + '<div class="capl">' + H.caps.map((c, i) => '<span class="' + (i <= n ? "si" : "") + '"></span>').join("") + '</div>' +
    '<div class="cab">' + sprite(H.pj, 70) + '<div><b>Capítulo ' + (n + 1) + ': ' + K.t + '</b><small>' + H.nm + ' · lee y escucha</small></div></div>' +
    '<div class="ctrl"><button id="bOir">' + ALT + 'Escuchar todo</button><button id="bLen">' + LENTO + 'Lento</button></div>' +
    '<div class="txt" id="txt">' + K.o.map((o, i) => '<p class="or" data-i="' + i + '">' + glos(o) + '</p>').join("") + '</div><div id="qz"></div>' +
    '<button class="btn" id="bQ" style="margin-top:14px">Responder ' + K.q.length + ' preguntas</button><div class="glo" id="glo"></div>' + FB;
  let lento = false, q = 0, ac = 0, todo = false, tg;
  const leerL = async i => { document.querySelectorAll(".or").forEach(p => p.classList.toggle("act", +p.dataset.i === i)); await oir(K.o[i], lento); };
  $("bOir").onclick = async () => { if (todo) return; todo = true; for (let i = 0; i < K.o.length && todo; i++) await leerL(i); document.querySelectorAll(".or").forEach(p => p.classList.remove("act")); todo = false; };
  $("bLen").onclick = () => { lento = !lento; $("bLen").classList.toggle("on", lento); };
  $("txt").onclick = e => { const u = e.target.closest("u"); if (u) { $("glo").textContent = u.dataset.g + " = " + K.g[u.dataset.g][0]; $("glo").classList.add("on"); clearTimeout(tg); tg = setTimeout(() => { const g = $("glo"); if (g) g.classList.remove("on"); }, 2400); return; }
    const p = e.target.closest(".or"); if (p) { todo = false; leerL(+p.dataset.i); } };
  const preg = () => { const x = K.q[q]; $("pr").style.width = (q / K.q.length * 100) + "%"; $("qz").innerHTML = '<div class="q"><b>' + (q + 1) + '. ' + x[0] + '</b><div class="op uno">' + x[1].map((o, i) => '<button data-i="' + i + '">' + o + '</button>').join("") + '</div></div>'; $("bQ").style.display = "none"; $("qz").scrollIntoView({ behavior:"smooth", block:"start" }); };
  $("bQ").onclick = () => { todo = false; callar(); preg(); };
  $("qz").onclick = e => { const b = e.target.closest("button"); if (!b || b.disabled) return; const x = K.q[q], ok = +b.dataset.i === x[2]; if (ok) { ac++; bien(); } else malS();
    [...b.parentNode.children].forEach(c => { c.disabled = true; if (+c.dataset.i === x[2]) c.classList.add("ok"); else if (c === b) c.classList.add("mal"); });
    $("fbT").textContent = ok ? "¡Correcto!" : "Casi"; $("fbP").textContent = "Respuesta: " + x[1][x[2]]; $("fb").className = "fb on " + (ok ? "ok" : "mal"); };
  $("fbB").onclick = () => { $("fb").className = "fb"; q++; if (q < K.q.length) return preg(); fin(ac, K.q.length); };
}
/* ---------- 3. REPITE ENCIMA ---------- */
function repite() {
  const S = C.repite[IDX(C.repite.length)], F = S.f, SR = window.SpeechRecognition || window.webkitSpeechRecognition;
  $("app").innerHTML = TOP + tag() + '<h2>Escucha y repite encima · ' + S.nm + '</h2><div class="onda" id="onda">' + "<i></i>".repeat(24) + '</div><div class="fr" id="fr"></div><div class="es2" id="es"></div>' +
    '<div class="ctrl"><button id="bOir">' + ALT + 'Escuchar</button><button id="bLen">' + LENTO + 'Lento</button></div><button class="mic" id="mic">' + SV('<rect x="9" y="3" width="6" height="11" rx="3"/><path d="M5 11a7 7 0 0 0 14 0M12 18v3"/>', 50, "#fff") + '</button>' +
    '<div class="est" id="est"></div><button class="yo" id="yo" hidden>No funciona el micrófono: lo dije en voz alta</button><button class="btn" id="sig" disabled>Siguiente</button>';
  let n = 0, lento = false, tot = 0, bienT = 0, anim, contado = false;
  const onda = on => { clearInterval(anim); const o = $("onda"); o.classList.toggle("on", on); [...o.children].forEach(i => i.style.height = "20px"); if (on) anim = setInterval(() => [...o.children].forEach(i => i.style.height = (12 + Math.random() * 56) + "px"), 120); };
  const pal = t => t.replace(/[.!?,]/g, "").split(" ");
  const nrm = w => w.toLowerCase().replace(/[’']/g, "");
  const esc = async () => { onda(true); await oir(F[n][0], lento); onda(false); };
  const pintar = () => { $("pr").style.width = (n / F.length * 100) + "%"; $("fr").innerHTML = pal(F[n][0]).map(w => '<span>' + w + '</span>').join(" "); $("es").textContent = F[n][1]; $("sig").disabled = true; contado = false;
    $("est").textContent = SR ? "Escucha y toca el micrófono para repetir" : "Escucha y repite en voz alta"; $("yo").hidden = !!SR; esc(); };
  $("bOir").onclick = esc; $("bLen").onclick = () => { lento = !lento; $("bLen").classList.toggle("on", lento); esc(); };
  $("yo").onclick = () => { if (!contado) { contado = true; tot += pal(F[n][0]).length; bienT += pal(F[n][0]).length; } $("sig").disabled = false; };
  $("mic").onclick = () => {
    if (!SR) { $("yo").hidden = false; $("est").textContent = "Este celular no deja usar el micrófono aquí. Dila en voz alta y toca el botón de abajo."; return; }
    let rec; try { rec = new SR(); rec.lang = "en-US"; rec.maxAlternatives = 3; rec.interimResults = false; } catch (e) { $("yo").hidden = false; return; }
    callar(); $("mic").classList.add("on"); $("est").textContent = "Te escucho…";
    rec.onresult = ev => { const dichas = new Set([...ev.results[0]].map(a => a.transcript).join(" ").toLowerCase().replace(/[’']/g, "").replace(/[^a-z ]/g, " ").split(/\s+/));
      const ws = pal(F[n][0]); let b = 0; $("fr").innerHTML = ws.map(w => { const ok = dichas.has(nrm(w)); if (ok) b++; return '<span class="' + (ok ? "ok" : "mal") + '">' + w + '</span>'; }).join(" ");
      if (!contado) { contado = true; tot += ws.length; bienT += b; }
      $("est").textContent = b === ws.length ? "¡Perfecto! " + b + " de " + ws.length : b + " de " + ws.length + " bien · puedes intentar otra vez"; (b === ws.length ? bien : malS)(); $("sig").disabled = false; };
    rec.onerror = () => { $("est").textContent = "No te escuché. Toca otra vez."; $("yo").hidden = false; };
    rec.onend = () => $("mic").classList.remove("on");
    try { rec.start(); } catch (e) { $("yo").hidden = false; }
  };
  $("sig").onclick = () => { n++; if (n < F.length) return pintar(); fin(bienT, tot); };
  pintar();
}
let NOMBRE = "";
function intro() {
  callar(); const R = estado(), ya = !!R.h[RETO_N], d = diasFaltan();
  if (RETO_N === 1) NOMBRE = C.escenas[IDX(C.escenas.length)].nm;
  if (RETO_N === 2) { const k = IDX(C.historia.caps.length); NOMBRE = "Capítulo " + (k + 1) + ": " + C.historia.caps[k].t; }
  if (RETO_N === 3) NOMBRE = C.repite[IDX(C.repite.length)].nm;
  const pj = RETO_N === 1 ? C.escenas[IDX(C.escenas.length)].pj[1] : RETO_N === 2 ? C.historia.pj : "av7";
  const txt = { 1:"Escucha una conversación y elige las palabras que faltan.", 2:"Lee y escucha el capítulo de esta semana, y responde las preguntas.", 3:"Escucha cada frase y repítela con el micrófono." }[RETO_N];
  $("app").innerHTML = '<div class="top"><button class="x" onclick="cerrar()" aria-label="Volver">✕</button><div style="flex:1"></div></div><div class="intro">' + tag() + sprite(pj, 120) + '<h1>' + NOMBRE + '</h1><p>' + txt + '</p>' +
    (ya ? '<span class="au">Ya lo hiciste esta semana · puedes repetirlo</span>' : '<span class="au">' + LLAMA + '+' + AURA_RETO + ' de Aura</span>') + '<p style="font-size:13px">Cambia en ' + d + (d === 1 ? ' día' : ' días') + '</p>' +
    '<div class="pie"><button class="btn" id="go">Empezar</button><button class="btn sec" onclick="cerrar()">Volver al inicio</button></div></div>';
  $("go").onclick = () => { (RETO_N === 1 ? escena : RETO_N === 2 ? historia : repite)(); };
  const R2 = estado(); if (!R2.t[RETO_N]) { R2.t[RETO_N] = { nm:NOMBRE }; guardar("ingles_gamer_retos", R2); }
}
intro();
</script>
