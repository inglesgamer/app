<script>
/* ===== WEB (GitHub Pages): convierte los enlaces go:seccion en seccion.html. En App Creator no hace nada. ===== */
(function(){
  var web = /github\.io$/.test(location.hostname);
  window.igURL = function(u){
    u = String(u);
    if (!web || u.indexOf("go:") !== 0) return u;
    var s = u.slice(3);
    return (s === "inicio" ? "index" : s) + ".html";
  };
  if (!web) return;
  document.addEventListener("click", function(e){
    var a = e.target.closest && e.target.closest('a[href^="go:"]');
    if (a){ e.preventDefault(); location.href = igURL(a.getAttribute("href")); }
  }, true);
})();
</script>

<script>
/* ===== PALETAS: el mismo bloque del Inicio. La elección se guarda en "ingles_gamer_tema". ===== */
var TEMA_KEY = "ingles_gamer_tema";
var PALETAS = {
  noche: { n:"Noche", meta:"#000000", cs:"dark", v:{ "--bg":"#000000","--card":"#141416","--bd":"#2A2A2E","--ink":"#F4F4F5","--mu":"#B8B8C0","--chip":"#222226","--gold":"#FFD166","--hi":"#FFFFFF","--on-hi":"#000000","--track":"#2A2A2E","--toff":"#3A3A40","--nav":"#0E0E10","--av1":"#3A3A40","--av2":"#101012","--ok":"#7BE3A8" } },
  dia:   { n:"Día",   meta:"#F4F4F5", cs:"light", v:{ "--bg":"#F4F4F5","--card":"#FFFFFF","--bd":"#E4E4E7","--ink":"#0B0B0D","--mu":"#5C666B","--chip":"#EFEFF1","--gold":"#9A6000","--hi":"#0B0B0D","--on-hi":"#FFFFFF","--track":"#E4E4E7","--toff":"#D4D4D8","--nav":"#FFFFFF","--av1":"#FFFFFF","--av2":"#E4E4E7","--ok":"#0F7A44" } },
  rosa:  { n:"Rosa",  meta:"#FFF1F6", cs:"light", v:{ "--bg":"#FFF1F6","--card":"#FFFFFF","--bd":"#F8D9E5","--ink":"#2B1420","--mu":"#7A5568","--chip":"#FFE3ED","--gold":"#B3245A","--hi":"#D63B7A","--on-hi":"#FFFFFF","--track":"#F8D9E5","--toff":"#EEBFD1","--nav":"#FFFFFF","--av1":"#FFFFFF","--av2":"#F8D9E5","--ok":"#0F7A44" } },
  azul:  { n:"Azul",  meta:"#EFF6FF", cs:"light", v:{ "--bg":"#EFF6FF","--card":"#FFFFFF","--bd":"#D6E6F8","--ink":"#0E1B2B","--mu":"#4F647B","--chip":"#E0EFFD","--gold":"#0B5FB0","--hi":"#1C6FD6","--on-hi":"#FFFFFF","--track":"#D6E6F8","--toff":"#BDD6F0","--nav":"#FFFFFF","--av1":"#FFFFFF","--av2":"#D6E6F8","--ok":"#0F7A44" } }
};
function aplicarTema(id) {
  var p = PALETAS[id] || PALETAS.noche, r = document.documentElement;
  for (var k in p.v) r.style.setProperty(k, p.v[k]);
  r.style.colorScheme = p.cs; r.setAttribute("data-tema", PALETAS[id] ? id : "noche");
  var m = document.querySelector('meta[name="theme-color"]'); if (m) m.setAttribute("content", p.meta);
}
function temaActual() { try { var t = localStorage.getItem(TEMA_KEY); return PALETAS[t] ? t : "noche"; } catch (e) { return "noche"; } }
aplicarTema(temaActual());
window.addEventListener("storage", function (e) { if (e.key === TEMA_KEY) aplicarTema(temaActual()); });
</script>
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@600;700;800;900&display=swap" rel="stylesheet">
<style>
:root{--bg:#000;--card:#141416;--bd:#2A2A2E;--ink:#F4F4F5;--mu:#B8B8C0;--chip:#222226;--gold:#FFD166;--hi:#FFFFFF;--on-hi:#000000;--track:#2A2A2E;--toff:#3A3A40;--nav:#0E0E10;--ok:#7BE3A8;--wa:#1AA64F}
*{box-sizing:border-box}
html{height:100%}
body{margin:0;height:100vh;height:100dvh;display:flex;flex-direction:column;overflow:hidden;overscroll-behavior:none;background:var(--bg);color:var(--ink);font-family:Nunito,system-ui,sans-serif}
a{color:inherit;text-decoration:none}
a:focus-visible{outline:3px solid var(--hi);outline-offset:2px}
.app{width:100%;max-width:520px;margin:0 auto;flex:1;min-height:0;display:flex;flex-direction:column}

header{flex-shrink:0;display:flex;align-items:center;gap:12px;padding:calc(14px + env(safe-area-inset-top)) 16px 10px}
.back{flex:none;display:flex;align-items:center;justify-content:center;width:46px;height:46px;border-radius:50%;border:1px solid var(--bd);background:var(--card)}
.ch-ic{flex:none;display:flex;align-items:center;justify-content:center;width:46px;height:46px;border-radius:50%;background:var(--wa);color:#fff}
.ch-tx{min-width:0}
h1{margin:0;font-size:24px;font-weight:900;line-height:1.15;letter-spacing:-.01em}
.sub{margin:1px 0 0;font-size:14px;font-weight:700;color:var(--mu);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}

main{flex:1;min-height:0;overflow-y:auto;overscroll-behavior:none;padding:8px 16px 14px;display:flex;flex-direction:column;gap:12px;scrollbar-width:none}
main::-webkit-scrollbar{display:none}
main>*{flex-shrink:0}
.dia{align-self:center;margin-top:6px;padding:7px 16px;border-radius:99px;background:var(--chip);font-size:14px;font-weight:800;color:var(--mu)}
.nov{align-self:flex-start;width:100%;max-width:92%;padding:16px 16px 14px;border-radius:26px;border:1px solid var(--bd);background:var(--card)}
.nov h2{margin:0;font-size:18px;font-weight:900;line-height:1.25}
.nov p{margin:5px 0 0;font-size:16px;font-weight:600;line-height:1.5;color:var(--mu)}
.nov-pie{display:flex;align-items:center;justify-content:flex-end;gap:10px;margin-top:12px}
.nov-h{font-size:14px;font-weight:700;color:var(--mu)}
.vacio{margin:auto;max-width:260px;text-align:center;font-size:15px;font-weight:700;line-height:1.45;color:var(--mu)}

footer{flex-shrink:0;padding:10px 16px calc(14px + env(safe-area-inset-bottom));background:linear-gradient(transparent,var(--bg) 40%)}
.wa{display:flex;align-items:center;justify-content:center;gap:12px;height:58px;border-radius:99px;background:var(--wa);color:#fff;font-size:18px;font-weight:900;box-shadow:0 4px 0 rgba(0,0,0,.22)}
.wa:active{transform:translateY(2px)}

.toast{position:fixed;left:50%;bottom:calc(96px + env(safe-area-inset-bottom));transform:translateX(-50%);max-width:calc(100% - 32px);padding:11px 18px;border-radius:99px;background:var(--hi);color:var(--on-hi);font-size:14px;font-weight:900;text-align:center;opacity:0;pointer-events:none;transition:opacity .3s;z-index:20}
.toast.on{opacity:1}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>

<script>
/* ================= TUS DATOS: edita solo esta parte ================= */
// Enlace de tu canal de WhatsApp.
const CANAL_URL = "https://whatsapp.com/channel/0029Vb8uDUe1dAvwomgbCj0P";
const CANAL_SEGUIDORES = "1.2 mil seguidores";

// Cada novedad: id (número que sube de 1 en 1), f = fecha AAAA-MM-DD, h = hora (24 h), t = título, m = mensaje.
// Para agregar una nueva: copia una línea, ponle el id siguiente y escríbela al final.
// IMPORTANTE: cuando agregues una, sube también NOVEDADES_ULTIMA en el Inicio al mismo número. Así la campana muestra el punto rojo.
const NOVEDADES = [
  { id:1, f:"2026-10-25", h:"10:20", t:"3 niveles nuevos",     m:"Ya puedes jugar Países e idiomas y Números en el mapa." },
  { id:2, f:"2026-10-26", h:"08:05", t:"Vocabulario del día",  m:"Cada día aparece una palabra nueva en el Inicio. Escúchala y repítela en voz alta." },
  { id:3, f:"2026-10-26", h:"09:40", t:"Consejo del día",      m:"Juega 5 minutos para mantener tu racha." },
  { id:4, f:"2026-10-28", h:"22:43", t:"Cambios en el ranking", m:"Se hicieron cambios en el ranking: ahora hay un ranking mensual, además del ranking general de siempre." },
  { id:5, f:"2026-11-17", h:"18:00", t:"Un solo mapa",          m:"Verano, Nieve y Fuego ahora están en un solo mapa, en orden. Al reclamar un regalo de Aura ves cómo vas en tu liga." },
  { id:6, f:"2026-11-19", h:"12:00", t:"Niveles de hablar",     m:"Cada 5 niveles hay un nivel para practicar con el micrófono: di las frases en voz alta y gana Aura." },
  { id:7, f:"2026-11-19", h:"19:00", t:"Nueva liga semanal",    m:"El Ranking ahora es solo la liga semanal. El top 3 de cada liga gana un cofre con Aura y un trofeo: entre más alto el rango, mejor el premio." },
  { id:8, f:"2026-11-20", h:"10:00", t:"Logros con premio",     m:"Algunos logros dan títulos, una skin y un marco que solo se consiguen así. Reclámalos en tu Perfil: el punto rojo te avisa." },
  { id:9, f:"2026-11-20", h:"10:30", t:"Packs de la semana",    m:"En la Tienda hay 2 packs más baratos que cambian cada lunes. ¡Aprovéchalos antes de que se acaben!" },
  { id:10, f:"2026-11-21", h:"12:00", t:"Nueva racha",          m:"La racha ahora tiene su propia llama. Juega cada día para que no se apague y gana regalos de Aura." }
];
const CLAVE_NOVEDADES = "ingles_gamer_novedades_vistas";   // la misma clave que lee la campana del Inicio

/* ================= No necesitas tocar lo de abajo ================= */
const $ = id => document.getElementById(id);
const esc = t => String(t).replace(/[&<>"]/g, c => ({ "&":"\x26amp;", "<":"\x26lt;", ">":"\x26gt;", '"':"\x26quot;" }[c]));
const MESES = ["enero","febrero","marzo","abril","mayo","junio","julio","agosto","septiembre","octubre","noviembre","diciembre"];
const clave = d => d.getFullYear() + "-" + String(d.getMonth() + 1).padStart(2, "0") + "-" + String(d.getDate()).padStart(2, "0");
function etiquetaDia(f) {
  const hoy = new Date(), ayer = new Date(Date.now() - 864e5);
  if (f === clave(hoy)) return "Hoy";
  if (f === clave(ayer)) return "Ayer";
  const p = f.split("-").map(Number);
  return p[2] + " de " + MESES[p[1] - 1] + (p[0] !== hoy.getFullYear() ? " de " + p[0] : "");
}

$("sub").textContent = "Canal oficial · " + CANAL_SEGUIDORES;

function pintar() {
  const lista = NOVEDADES.slice().sort((a, b) => (a.f + a.h).localeCompare(b.f + b.h));
  let html = "", dia = "";
  lista.forEach(n => {
    if (n.f !== dia) { dia = n.f; html += '<div class="dia">' + esc(etiquetaDia(n.f)) + '</div>'; }
    html += '<article class="nov"><h2>' + esc(n.t) + '</h2><p>' + esc(n.m) + '</p>' +
      '<div class="nov-pie"><span class="nov-h">' + esc(n.h) + '</span></div></article>';
  });
  $("lista").innerHTML = html || '<div class="vacio">Todavía no hay novedades. Vuelve pronto.</div>';
  $("lista").scrollTop = $("lista").scrollHeight;          // como un chat: se ve lo más nuevo abajo
}

/* marca todo como leído: así la campana del Inicio quita el punto rojo */
function marcarLeidas() {
  const ultima = NOVEDADES.reduce((m, n) => Math.max(m, n.id), 0);
  try { localStorage.setItem(CLAVE_NOVEDADES, String(ultima)); } catch (e) {}
}

/* botón del canal */
let tt;
function say(m) { const t = $("toast"); t.textContent = m; t.classList.add("on"); clearTimeout(tt); tt = setTimeout(() => t.classList.remove("on"), 2200); }
if (CANAL_URL) $("wa").href = CANAL_URL;
$("wa").addEventListener("click", e => { if (!CANAL_URL) { e.preventDefault(); say("El canal de WhatsApp abre muy pronto."); } });

pintar(); marcarLeidas();
window.addEventListener("pageshow", () => { pintar(); marcarLeidas(); });
document.addEventListener("visibilitychange", () => { if (!document.hidden) { pintar(); marcarLeidas(); } });
</script>
</body>
