<script>
/* ===== WEB (GitHub Pages): convierte los enlaces go:seccion en seccion.html. En App Creator no hace nada. ===== */
(function(){
  var web = /github\.io$/.test(location.hostname);
  window.igURL = function(u){
    u = String(u);
    if (!web || u.indexOf("go:") !== 0) return u;
    var s = u.slice(3);
    return (s === "inicio" ? "index" : s) + ".html";
  };
  if (!web) return;
  document.addEventListener("click", function(e){
    var a = e.target.closest && e.target.closest('a[href^="go:"]');
    if (a){ e.preventDefault(); location.href = igURL(a.getAttribute("href")); }
  }, true);
})();
</script>

/* ===== PALETAS: una sola fuente de colores. La elección se guarda en "ingles_gamer_tema". ===== */
var TEMA_KEY = "ingles_gamer_tema";
var PALETAS = {
  noche: { n:"Noche", meta:"#000000", cs:"dark", v:{ "--bg":"#000000","--card":"#141416","--bd":"#2A2A2E","--ink":"#F4F4F5","--mu":"#B8B8C0","--chip":"#222226","--gold":"#FFD166","--hi":"#FFFFFF","--on-hi":"#000000","--track":"#2A2A2E","--toff":"#3A3A40","--nav":"#0E0E10","--av1":"#3A3A40","--av2":"#101012","--ok":"#7BE3A8" } },

  rosa:  { n:"Rosa",  meta:"#FFF1F6", cs:"light", v:{ "--bg":"#FFF1F6","--card":"#FFFFFF","--bd":"#F8D9E5","--ink":"#2B1420","--mu":"#7A5568","--chip":"#FFE3ED","--gold":"#B3245A","--hi":"#D63B7A","--on-hi":"#FFFFFF","--track":"#F8D9E5","--toff":"#EEBFD1","--nav":"#FFFFFF","--av1":"#FFFFFF","--av2":"#F8D9E5","--ok":"#0F7A44" } },
  azul:  { n:"Azul",  meta:"#EFF6FF", cs:"light", v:{ "--bg":"#EFF6FF","--card":"#FFFFFF","--bd":"#D6E6F8","--ink":"#0E1B2B","--mu":"#4F647B","--chip":"#E0EFFD","--gold":"#0B5FB0","--hi":"#1C6FD6","--on-hi":"#FFFFFF","--track":"#D6E6F8","--toff":"#BDD6F0","--nav":"#FFFFFF","--av1":"#FFFFFF","--av2":"#D6E6F8","--ok":"#0F7A44" } }
};
function aplicarTema(id) {
  var p = PALETAS[id] || PALETAS.noche, r = document.documentElement;
  for (var k in p.v) r.style.setProperty(k, p.v[k]);
  r.style.colorScheme = p.cs; r.setAttribute("data-tema", PALETAS[id] ? id : "noche");
  var m = document.querySelector('meta[name="theme-color"]'); if (m) m.setAttribute("content", p.meta);
}
function temaActual() { try { var t = localStorage.getItem(TEMA_KEY); return PALETAS[t] ? t : "noche"; } catch (e) { return "noche"; } }
aplicarTema(temaActual());
window.addEventListener("storage", function (e) { if (e.key === TEMA_KEY) aplicarTema(temaActual()); });
window.addEventListener("pageshow", function () { aplicarTema(temaActual()); });
</script>

<script type="module">
/* ===== NUBE: guarda tu progreso en tu cuenta y lo recupera. Este MISMO bloque va en todas las pantallas (justo antes de </body>). ===== */
import { initializeApp, getApps, getApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import { getAuth, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";
import { getFirestore, doc, getDoc, setDoc } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

const CONFIG = {
  apiKey: "AIzaSyDrBReVK9v1ioWfBIyMCnvtuUgbbWPcxTE",
  authDomain: "inglesgamer-5a3a9.firebaseapp.com",
  projectId: "inglesgamer-5a3a9",
  storageBucket: "inglesgamer-5a3a9.firebasestorage.app",
  messagingSenderId: "599532765222",
  appId: "1:599532765222:web:38fe3a7348b3c38e3426e7"
};

(function () {
  try {
    const PREF = "ingles_gamer_", META = "ig_nube_meta";
    const SKIP = /_(sesion|tema|sonido|buzon|buzon_pausa|acceso_modo)$/;
    const app = getApps().length ? getApp() : initializeApp(CONFIG);
    const auth = getAuth(app), db = getFirestore(app);
    let user = null, ocupado = false;

    const dormir = ms => new Promise(r => setTimeout(r, ms));
    const estado = (ok, e) => { try { localStorage.setItem("ig_nube_estado", JSON.stringify({ ok: !!ok, t: Date.now(), c: ok ? "" : String((e && (e.code || e.message)) || "error") })); } catch (x) {} };
    const ref = () => doc(db, "progreso", user.uid);
    const claves = () => { const k = []; try { for (let i = 0; i < localStorage.length; i++) { const n = localStorage.key(i); if (n.indexOf(PREF) === 0 && !SKIP.test(n)) k.push(n); } } catch (e) {} return k; };
    const snap = () => { const o = {}; claves().forEach(k => { o[k] = localStorage.getItem(k); }); return o; };
    const ser = o => JSON.stringify(Object.keys(o).sort().map(k => [k, o[k]]));
    const hash = s => { let h = 5381; for (let i = 0; i < s.length; i++) h = ((h << 5) + h + s.charCodeAt(i)) | 0; return h; };
    const getMeta = () => { try { return JSON.parse(localStorage.getItem(META)) || {}; } catch (e) { return {}; } };
    const setMeta = m => { try { localStorage.setItem(META, JSON.stringify(m)); } catch (e) {} };
    /* CORREGIDO: "vacío" = sin progreso real (solo el apodo/perfil no cuenta) */
    const vacio = o => !o || !(o.ingles_gamer_a1_repaso || o.ingles_gamer_aura || o.ingles_gamer_tienda);
    const limpiar = () => claves().forEach(k => localStorage.removeItem(k));
    const cambios = () => !!user && getMeta().uid === user.uid && hash(ser(snap())) !== getMeta().h;
    const puntos = d => {
      try {
        const a = JSON.parse(d.ingles_gamer_aura || "null") || {}, r = JSON.parse(d.ingles_gamer_a1_repaso || "null") || {};
        return (+a.t || 0) + Object.values(r.est || {}).reduce((x, y) => x + (+y || 0), 0);
      } catch (e) { return 0; }
    };

    async function subir() {
      const o = snap(), t = Date.now();
      await setDoc(ref(), { datos: o, t: t, v: 1 });
      setMeta({ uid: user.uid, t: t, h: hash(ser(o)) });
      estado(true);
    }
    function bajar(c) {
      limpiar();
      const d = c.datos || {};
      for (const k in d) if (k.indexOf(PREF) === 0 && !SKIP.test(k) && typeof d[k] === "string") localStorage.setItem(k, d[k]);
      setMeta({ uid: user.uid, t: c.t || Date.now(), h: hash(ser(snap())) });
    }

    async function sync(lanzar) {
      if (!user || ocupado) return "igual";
      ocupado = true;
      let res = "igual";
      try {
        const m = getMeta(), o = snap(), h = hash(ser(o)), s = await getDoc(ref()), c = s.exists() ? s.data() : null, cd = (c && c.datos) || {};
        if (m.uid && m.uid !== user.uid) {
          limpiar();
          if (c) bajar(c); else await subir();
          res = "bajado"; location.reload();
        } else if (m.uid !== user.uid) {
          if (c && (vacio(o) || puntos(cd) >= puntos(o))) { bajar(c); res = "bajado"; location.reload(); }
          else { await subir(); res = "subido"; }
        } else if (c && vacio(o) && !vacio(cd)) {
          bajar(c); res = "bajado"; location.reload();
        } else if (!c || h !== m.h) { await subir(); res = "subido"; }
        else if (c.t > m.t) { bajar(c); res = "bajado"; location.reload(); }
        else estado(true);
      } catch (e) { ocupado = false; estado(false, e); if (lanzar) throw e; return "igual"; }
      ocupado = false;
      return res;
    }

    const guardarYa = () => { if (cambios()) sync(); };
    onAuthStateChanged(auth, u => { user = u; if (u) sync(); });
    document.addEventListener("visibilitychange", () => { if (document.hidden) guardarYa(); else sync(); });
    addEventListener("pagehide", guardarYa);
    setInterval(guardarYa, 45000);

    window.IGNube = {
      listo: true,
      sincronizar: () => sync(),
      usuario: () => user,
      async subirYa() {
        for (let i = 0; i < 40 && !user; i++) await dormir(250);
        if (!user) throw new Error("sin-sesion");
        while (ocupado) await dormir(200);
        const r = await sync(true);
        if (r === "bajado") throw new Error("recargando");
      }
    };
  } catch (e) { console.error("[nube]", e); }
})();
</script>

<script type="module">
/* ===== FICHA: publica tu Aura, estrellas y racha en tu ficha pública (para el Ranking) ===== */
import { initializeApp, getApps, getApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import { getAuth, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";
import { getFirestore, doc, getDoc, updateDoc, serverTimestamp, collection, query, where, limit, getDocs } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

const CONFIG = {
  apiKey: "AIzaSyDrBReVK9v1ioWfBIyMCnvtuUgbbWPcxTE",
  authDomain: "inglesgamer-5a3a9.firebaseapp.com",
  projectId: "inglesgamer-5a3a9",
  storageBucket: "inglesgamer-5a3a9.firebasestorage.app",
  messagingSenderId: "599532765222",
  appId: "1:599532765222:web:38fe3a7348b3c38e3426e7"
};
(function () {
  try {
    const app = getApps().length ? getApp() : initializeApp(CONFIG);
    const auth = getAuth(app), db = getFirestore(app);
    const CREADOR = "tZfZSV8kJ8emISaSpmVwsNzrueD2";
    const IDS = ["esc1","saludos","vocab","infopers","paises","numeros","colores","familia","hogar","objetos","animales","comidas","restaurante","esc2","viajes","verbos","vocab2","fechas","esc3","final"];
    const leer = k => { try { return JSON.parse(localStorage.getItem(k) || "null"); } catch (e) { return null; } };
    const clave = d => d.getFullYear() + "-" + (d.getMonth() + 1) + "-" + d.getDate();
    const aSemana = d => { const x = new Date(d.getFullYear(), d.getMonth(), d.getDate()); x.setDate(x.getDate() - ((x.getDay() + 6) % 7)); return clave(x); };
    const activo = () => { const v = leer("ingles_gamer_estado_activo"); return v === null ? true : !!v; };
    const estado = (ok, e) => { try { localStorage.setItem("ig_ficha_estado", JSON.stringify({ ok: !!ok, t: Date.now(), c: ok ? "" : String((e && (e.code || e.message)) || "error") })); } catch (x) {} };

    function calcular() {
      const perfil = leer("ingles_gamer_perfil"), auraG = leer("ingles_gamer_aura"), tienda = leer("ingles_gamer_tienda");
      const own = (tienda && Array.isArray(tienda.own)) ? tienda.own : [];
      let av = perfil && Number(perfil.a) >= 0 && Number(perfil.a) < 20 ? Number(perfil.a) : 0;
      if (av === 9) { if (!(user && user.uid === CREADOR)) av = 0; } else if (av > 1 && own.indexOf("av" + av) < 0) av = 0;
      const aura = Math.max(0, +(auraG && auraG.t) || 0);
      const rep = leer("ingles_gamer_a1_repaso") || {}, est = rep.est || {}, dia = rep.dia || { u: "", r: 0 };
      const e = id => Math.min(3, Math.max(0, +est[id] || 0));
      const estrellas = IDS.reduce((a, id) => a + e(id), 0);
      const niv = IDS.filter(id => e(id) >= 1).length, tres = IDS.filter(id => e(id) >= 3).length;
      const vivo = (dia.u === clave(new Date()) || dia.u === clave(new Date(Date.now() - 864e5))) && +dia.r > 0;
      const racha = vivo ? Math.min(+dia.r, 3650) : 0;
      const med = [];
      if (estrellas >= 1) med.push(0); if (racha >= 3) med.push(1); if (niv >= 10) med.push(2); if (tres >= 1) med.push(3);
      if (tres >= 5) med.push(4); if (e("verbos") >= 1) med.push(5); if (tres >= 10) med.push(6); if (e("final") >= 1) med.push(7);
      const b = leer("ingles_gamer_aura_base") || {}, h = new Date();
      const ks = { dia: clave(h), sem: aSemana(h), mes: h.getFullYear() + "-" + (h.getMonth() + 1) };
      ["dia", "sem", "mes"].forEach(p => { if (!b[p]) b[p] = { k: ks[p], v: 0 }; else if (b[p].k !== ks[p]) b[p] = { k: ks[p], v: aura }; });
      try { localStorage.setItem("ingles_gamer_aura_base", JSON.stringify(b)); } catch (x) {}
      /* LOOK equipado en la Tienda: skin (sk), marco (mc), título (tt) y fondo/mapa (mp) */
      const eq = (tienda && tienda.eq) || {};
      const pick = (k, max) => { const id = String(eq[k] || ""), n = id.indexOf(k) === 0 ? Number(id.slice(2)) : 0; return (n > 0 && n < max && own.indexOf(k + n) > -1) ? n : 0; };
      return { av, aura, est: estrellas, niv, racha, med, sem: Math.max(0, aura - (b.sem.v || 0)), mes: Math.max(0, aura - (b.mes.v || 0)),
               lsk: pick("sk", 9), lmc: pick("mc", 8), ltt: pick("tt", 17), lmp: pick("mp", 15) };
    }

    let user = null, ficha = null, ocupado = false, ultHash = "", ultT = 0;
    async function publicar(forzar) {
      if (!user || ocupado) return;
      const m = leer("ig_nube_meta") || {};
      if (m.uid !== user.uid) return;                 /* NUBE todavía no terminó de sincronizar */
      ocupado = true;
      try {
        const ref = doc(db, "jugadores", user.uid);
        if (!ficha) { const s = await getDoc(ref); if (!s.exists()) return; ficha = s.data(); }
        const c = calcular(), aura = c.aura, h = new Date();   /* el Aura del ranking es el saldo: si gastas en la Tienda, baja */
        const datos = { av: c.av, est: c.est, niv: c.niv, racha: c.racha, med: c.med, vis: activo(), sk: aSemana(h), mk: h.getFullYear() + "-" + (h.getMonth() + 1), aura, sem: c.sem, mes: c.mes,
                        lsk: c.lsk, lmc: c.lmc, ltt: c.ltt, lmp: c.lmp };
        const hs = JSON.stringify(datos);
        if (!forzar && hs === ultHash && Date.now() - ultT < 240000) return;
        let a = +ficha.aura || 0;

const jugado = (isla, nivel) => { const m = MAPAS[isla]; return !!m && (+estMapa(m.clave)[nivel] || 0) >= 1; };
const temasJugados = () => { const v = TEMAS.map((t, i) => i).filter(i => { const x = TEMA_NIV[TEMAS[i].n]; return x && jugado(x[0], x[1]); }); return v.length ? v : [0, 1, 2, 3, 4]; };

function estado() { let R = leer("ingles_gamer_retos"); if (!R || R.sem !== SEMANA()) R = { sem:SEMANA(), t:{}, h:{} }; R.t = R.t || {}; R.h = R.h || {}; return R; }
function eleccion() {
  const R = estado(); if (R.t[RETO_N]) return R.t[RETO_N];
  const r = azar(hash(R.sem + "|" + RETO_N)), pick = v => v[Math.floor(r() * v.length)];
  let e;

  else if (RETO_N === 2) { const g = gramJugados(); if (g.length) { const i = pick(g); e = { gram:i, nm:GRAM[i].n }; } else { const i = pick(temasJugados()); e = { tema:i, nm:"Frases de " + TEMAS[i].n }; } }
  else { const v = temasJugados(); e = { temas:v, nm:v.length > 5 ? "Todo lo que has visto" : v.map(i => TEMAS[i].n).join(", ") }; }
  e.seed = hash(R.sem + "#" + RETO_N); R.t[RETO_N] = e; guardar("ingles_gamer_retos", R); return e;
}

/* ---- preguntas ---- */
const palabras = idx => { const v = {}; return [].concat(...idx.map(i => TEMAS[i].w)).filter(w => !v[w[0]] && (v[w[0]] = 1)); };
function opciones(ok, todas, n, r) { return mezclar([ok].concat(mezclar(Array.from(new Set(todas.filter(x => x !== ok))), r).slice(0, n - 1)), r); }
function crear(e) {
  const r = azar(e.seed ^ (Date.now() & 0xffff));   // cada intento cambia el orden, el tema es el de la semana
  if (RETO_N === 1) {
    let w = palabras([e.tema]); const extra = palabras(TEMAS.map((t, i) => i).filter(i => i !== e.tema));
    const ens = w.map(x => x[0]).concat(extra.map(x => x[0])), ess = w.map(x => x[1]).concat(extra.map(x => x[1]));
    w = mezclar(w, r); while (w.length < PREGS) w = w.concat(mezclar(w, r));
    return w.slice(0, PREGS).map((x, i) => {
      const tipo = ["en", "oir", "es", "frase"][i % 4];
      if (tipo === "frase" && x[2] && x[2].indexOf("*") > -1) return { tipo, q:x[2].replace(/\*[^*]+\*/, "___"), ok:x[0], op:opciones(x[0], ens.slice(0, 40), 4, r), oir:x[2].replace(/\*/g, ""), es:x[1] };
      if (tipo === "es") return { tipo, q:x[1], ok:x[0], op:opciones(x[0], ens.slice(0, 40), 4, r), oir:x[0] };
      return { tipo:tipo === "frase" ? "en" : tipo, q:x[0], ok:x[1], op:opciones(x[1], ess.slice(0, 40), 4, r), oir:x[0] };
    });
  }
  if (RETO_N === 2) {
    if (e.gram != null) return mezclar(GRAM[e.gram].q, r).slice(0, PREGS).map(q => ({ tipo:"gram", q:q[0], ok:q[1], op:mezclar(q.slice(1), r), oir:q[0].replace(/\s*\([^)]*\)/, "").replace("___", q[1]) }));
    const w = mezclar(palabras([e.tema]).filter(x => x[2] && x[2].indexOf("*") > -1), r), ens = palabras([e.tema]).map(x => x[0]);
    let v = w; while (v.length < PREGS) v = v.concat(mezclar(w, r));
    return v.slice(0, PREGS).map((x, i) => { const s = x[2].replace(/\*/g, ""), p = s.split(" ");

      return { tipo:"gram", q:x[2].replace(/\*[^*]+\*/, "___"), ok:x[0], op:opciones(x[0], ens, 3, r), oir:s }; });
  }
  const w = mezclar(palabras(e.temas), r), ess = w.map(x => x[1]);
  return w.map(x => ({ tipo:"oir", q:x[0], ok:x[1], op:opciones(x[1], ess, 4, r), oir:x[0] }));
}

function intro() {
  E = eleccion(); const R = estado(), hecho = !!R.h[RETO_N], I = INFO[RETO_N], dias = DIAS_LUNES();
  $("app").innerHTML = '<div class="top"><button type="button" class="x" data-a="cerrar" aria-label="Volver al inicio">' + svg('<path d="M6 6l12 12M18 6 6 18"/>', 26) + '</button></div>' +
    '<div class="intro"><div class="rt-ic n' + RETO_N + '">' + svg(I.ic, 54) + '</div>' +
    '<small class="k">RETO DE LA SEMANA · ' + RETO_N + ' DE 3</small><h1>' + I.t + '</h1>' +
    '<p class="tema">' + esc(E.nm) + '</p><p class="d">' + I.d + '</p>' +
    (hecho ? '<div class="ok">' + svg('<path d="M20 6 9 17l-5-5"/>', 20) + 'Completado esta semana · Vuelve el lunes por uno nuevo</div>'
           : '<div class="pr">' + LLAMA + '<b>+' + AURA_RETO + '</b> de Aura · cambia en ' + dias + (dias === 1 ? ' día' : ' días') + '</div>') +
    '</div><div class="pie"><button type="button" class="btn" data-a="empezar">' + (hecho ? "Jugar otra vez (sin Aura)" : "Empezar") + '</button></div>';
}
function empezar() { P = { q:crear(E), i:0, vidas:VIDAS, ok:0, arm:[], resp:false, t0:Date.now() }; if (RETO_N === 3) { P.fin = Date.now() + SEG3 * 1000; clearInterval(tReloj); tReloj = setInterval(reloj, 200); } pintar(); }
function reloj() { if (!P) return; const s = Math.max(0, Math.ceil((P.fin - Date.now()) / 1000)), e = $("rl"); if (e) { e.textContent = s; e.parentNode.classList.toggle("poco", s <= 10); }
  if (s <= 0) { clearInterval(tReloj); terminar(); } }
function cabeza() {
  if (RETO_N === 3) return '<div class="top"><button type="button" class="x" data-a="salir" aria-label="Salir">' + svg('<path d="M6 6l12 12M18 6 6 18"/>', 26) + '</button>' +
    '<div class="bar"><i style="width:' + Math.min(100, P.ok / META3 * 100) + '%"></i></div><div class="cnt"><b>' + P.ok + '</b>/' + META3 + '</div><div class="rlj">' + svg('<circle cx="12" cy="13" r="8"/><path d="M12 9v4l2 2M9 2h6"/>', 20) + '<b id="rl">' + Math.max(0, Math.ceil((P.fin - Date.now()) / 1000)) + '</b></div></div>';
  return '<div class="top"><button type="button" class="x" data-a="salir" aria-label="Salir">' + svg('<path d="M6 6l12 12M18 6 6 18"/>', 26) + '</button>' +
    '<div class="bar"><i style="width:' + (P.i / P.q.length * 100) + '%"></i></div><div class="vid">' + [0, 1, 2].map(k => CORAZON(k < P.vidas)).join("") + '</div></div>';
}
const BOCINA = (g) => '<button type="button" class="boc' + (g ? " g" : "") + '" data-a="oir" aria-label="Escuchar">' + svg('<path d="M11 5 6 9H2v6h4l5 4z"/><path d="M15.5 8.5a5 5 0 0 1 0 7M19 5a10 10 0 0 1 0 14"/>', g ? 44 : 24) + '</button>';
function pintar() {
  const q = P.q[P.i]; let h = cabeza() + '<div class="zona">';
  if (q.tipo === "oir") h += '<p class="ins">' + (RETO_N === 3 ? "¿Qué significa?" : "Escucha y elige qué significa") + '</p>' + BOCINA(true);
  else if (q.tipo === "en") h += '<p class="ins">¿Qué significa?</p><div class="pal">' + esc(q.q) + BOCINA() + '</div>';
  else if (q.tipo === "es") h += '<p class="ins">¿Cómo se dice en inglés?</p><div class="pal">' + esc(q.q) + '</div>';
  else if (q.tipo === "frase" || q.tipo === "gram") h += '<p class="ins">Completa la frase</p><div class="frase">' + esc(q.q).replace("___", '<span class="hueco">' + (P.resp ? esc(q.ok) : "&nbsp;") + '</span>') + '</div>';
  else if (q.tipo === "ordena") h += '<p class="ins">Ordena la frase</p><div class="arm">' + (P.arm.length ? P.arm.map(k => '<span>' + esc(q.fichas[k]) + '</span>').join("") : '<em>Toca las palabras en orden</em>') + '</div>' +
    '<div class="fch">' + q.fichas.map((f, k) => '<button type="button" data-f="' + k + '"' + (P.arm.indexOf(k) > -1 || P.resp ? " disabled" : "") + '>' + esc(f) + '</button>').join("") + '</div>' +
    (P.resp ? '' : '<button type="button" class="borra" data-a="borra">Borrar</button>');
  if (q.op) h += '<div class="ops' + (q.op.length === 3 ? " tres" : "") + '">' + q.op.map((o, k) => '<button type="button" data-o="' + k + '" class="' + (P.resp ? (o === q.ok ? "bien" : k === P.elegida ? "mal" : "") : "") + '"' + (P.resp ? " disabled" : "") + '>' + esc(o) + '</button>').join("") + '</div>';
  h += '</div>';
  if (P.resp && RETO_N !== 3) h += '<div class="panel ' + (P.acerto ? "bien" : "mal") + '"><div><b>' + (P.acerto ? "¡Muy bien!" : "Respuesta correcta:") + '</b>' + (P.acerto ? '' : '<span>' + esc(q.tipo === "ordena" ? q.ok : q.ok) + '</span>') + '</div><button type="button" class="btn" data-a="sig">Continuar</button></div>';
  $("app").innerHTML = h;
  if (!P.resp && (q.tipo === "oir")) setTimeout(() => oir(q.oir), 200);
}
function responder(ok) {
  const q = P.q[P.i]; P.resp = true; P.acerto = ok;
  if (ok) { P.ok++; sBien(); } else { P.vidas--; sMal(); }
  if (RETO_N === 3) { pintar(); setTimeout(() => { if (!P) return; P.resp = false; P.i++; if (P.i >= P.q.length) P.q = P.q.concat(crear(E)); pintar(); }, ok ? 450 : 900); return; }
  if (q.tipo === "es") setTimeout(() => oir(q.ok), 150);   /* solo palabras (tienen mp3); las frases no, para no usar la voz robot */
  pintar();
}
function siguiente() { callar(); if (P.vidas <= 0) return terminar(); P.i++; P.resp = false; P.arm = []; P.elegida = -1; if (P.i >= P.q.length) return terminar(); pintar(); }
function darAura(n, txt) {
  const a = leer("ingles_gamer_aura") || {}; a.t = Math.max(0, +a.t || 0) + n; a.e = Math.max(0, +a.e || 0) + n; a.g = a.g || {};
  a.g["reto" + RETO_N + "_" + SEMANA()] = n; a.l = [[n, txt, Date.now()]].concat(Array.isArray(a.l) ? a.l : []).slice(0, 20); guardar("ingles_gamer_aura", a);
}
function terminar() {
  clearInterval(tReloj); callar(); const p = P; P = null;
  const gano = RETO_N === 3 ? p.ok >= META3 : p.vidas > 0;
  if (!gano) {
    sMal();
    $("app").innerHTML = '<div class="intro perdio"><div class="rt-ic gris">' + svg(RETO_N === 3 ? '<circle cx="12" cy="13" r="8"/><path d="M12 9v4l2 2M9 2h6"/>' : '<path d="M12 21s-7.5-4.6-9.5-9.2C1 8.3 3.2 4.5 7 4.5c2.1 0 3.6 1.1 5 2.8 1.4-1.7 2.9-2.8 5-2.8 3.8 0 6 3.8 4.5 7.3C19.5 16.4 12 21 12 21z"/>', 54) + '</div>' +
      '<h1>' + (RETO_N === 3 ? "¡Se acabó el tiempo!" : "Te quedaste sin corazones") + '</h1><p class="d">' + (RETO_N === 3 ? "Lograste " + p.ok + " de " + META3 + " aciertos. ¡Casi! Inténtalo otra vez." : "Llegaste a la pregunta " + (p.i + 1) + " de " + p.q.length + ". Puedes intentarlo las veces que quieras esta semana.") + '</p></div>' +
      '<div class="pie"><button type="button" class="btn" data-a="empezar">Intentar de nuevo</button><button type="button" class="btn sec" data-a="cerrar">Volver al inicio</button></div>';
    return;
  }
  const R = estado(), ya = !!R.h[RETO_N], gan = ya ? 0 : AURA_RETO;
  if (!ya) { R.h[RETO_N] = 1; guardar("ingles_gamer_retos", R); darAura(gan, "Reto: " + INFO[RETO_N].t); }
  try { if (window.IGNube && IGNube.subirYa) IGNube.subirYa().then(() => { try { if (window.IGFicha) IGFicha.publicar(); } catch (e) {} }).catch(() => {}); } catch (e) {}
  const est = RETO_N === 3 ? (p.ok >= META3 + 6 ? 3 : p.ok >= META3 + 3 ? 2 : 1) : p.vidas;
  $("app").innerHTML = '';
  if (window.IGFinal) IGFinal.mostrar({ aura:gan, estrellas:est, titulo:"¡Reto superado!", sub:INFO[RETO_N].t + " · " + E.nm, multi:false, alSalir:() => { location.href = igURL("go:inicio"); } });
  else { $("app").innerHTML = '<div class="intro"><h1>¡Reto superado!</h1><p class="d">+' + gan + ' de Aura</p></div><div class="pie"><button type="button" class="btn" data-a="cerrar">Volver al inicio</button></div>'; }
}
document.addEventListener("click", ev => {
  const b = ev.target.closest("button"); if (!b) return; const a = b.dataset.a;
  if (a === "cerrar") return cerrar();
  if (a === "empezar") return empezar();
  if (a === "salir") { if (confirm("¿Salir del reto? Perderás este intento.")) { clearInterval(tReloj); P = null; callar(); intro(); } return; }
  if (!P) return; const q = P.q[P.i];
  if (a === "oir") return oir(q.oir);
  if (a === "sig") return siguiente();
  if (P.resp) return;
  if (b.dataset.o !== undefined) { P.elegida = +b.dataset.o; return responder(q.op[+b.dataset.o] === q.ok); }
  if (a === "borra") { P.arm.pop(); return pintar(); }
  if (b.dataset.f !== undefined) { const k = +b.dataset.f; if (P.arm.indexOf(k) > -1) return; P.arm.push(k); tono(500, 0, .06);
    const hecho = P.arm.map(x => q.fichas[x]).join(" ");
    if (P.arm.length === q.fichas.length) return responder(hecho === q.ok);
    return pintar(); }
});
window.addEventListener("pagehide", callar);
document.addEventListener("visibilitychange", () => { if (document.hidden) callar(); });
intro();
</script>
