*{box-sizing:border-box}body{margin:0;background:#000;color:#F4F4F5;font-family:Nunito,system-ui,sans-serif;font-weight:700}
.top{max-width:900px;margin:auto;padding:22px 18px 4px}.top h1{margin:0;font-size:30px;font-weight:900}.top p{margin:6px 0 0;color:#B8B8C0}
.tg{display:flex;gap:8px;margin-top:12px}.tg button{height:40px;padding:0 16px;border-radius:99px;border:1px solid #2A2A2E;background:#141416;color:#B8B8C0;font:800 14px Nunito,sans-serif;cursor:pointer}.tg button.on{background:#fff;color:#000}
.ops{max-width:900px;margin:auto;display:flex;gap:18px;overflow:auto;padding:16px 18px 40px}
.op{flex:none;width:310px}.op h3{margin:6px 0 2px;font-size:19px;font-weight:900}.op p{margin:0 0 10px;color:#B8B8C0;font-size:13.5px;min-height:74px}
.lbl{font-size:11px;font-weight:900;letter-spacing:.16em;color:#B8B8C0}
.rec{display:inline-block;margin-left:6px;padding:2px 8px;border-radius:99px;background:#FFD166;color:#2A1A00;font-size:10.5px;font-weight:900;vertical-align:middle}
.ph{position:relative;width:310px;height:660px;border-radius:38px;border:1px solid #2A2A2E;background:var(--bg);color:var(--ink);overflow:hidden;display:flex;flex-direction:column}
.sc{flex:1;overflow:hidden;padding:16px 14px 0;display:flex;flex-direction:column;gap:10px}
.sc>*{flex-shrink:0}
.nav{height:64px;flex:none;display:flex;justify-content:space-around;align-items:center;border-top:1px solid var(--bd);background:var(--card);border-radius:24px 24px 0 0;font-size:10px;color:var(--mu);font-weight:800}.nav b{color:var(--ink)}
.t1{font-size:28px;font-weight:900}
.st{font-size:11px;font-weight:900;letter-spacing:.14em;color:var(--mu);display:flex;justify-content:space-between;align-items:center}
.st b{padding:1px 8px;border-radius:99px;background:var(--mal);color:#fff;letter-spacing:0}
.av{display:inline-flex;align-items:flex-end;justify-content:center;border-radius:50%;overflow:hidden;flex:none;position:relative;border:3px solid var(--c,#9A6A3A)}
.c0{background:linear-gradient(#1F4D2C,#0D2615)}.c1{background:linear-gradient(#2C6DD6,#123A7A)}.c2{background:linear-gradient(#5B3FB0,#22164A)}.c3{background:linear-gradient(#B4582A,#5E2A10)}

/* ===== A · Vitrina del guerrero ===== */

.hA .r{display:flex;align-items:center;gap:12px;position:relative;z-index:1}
.ringW{position:relative;width:88px;height:88px;flex:none}
.ringW svg{position:absolute;inset:0;transform:rotate(-90deg)}.ringW circle{fill:none;stroke-width:6}.ringW .t{stroke:rgba(0,0,0,.25)}.ringW .p{stroke:#FFE07A;stroke-linecap:round;stroke-dasharray:251;stroke-dashoffset:84}
.ringW .av{position:absolute;left:9px;top:9px;border-color:transparent}
.hA .pct{position:absolute;left:50%;bottom:-6px;transform:translateX(-50%);padding:1px 7px;border-radius:99px;background:#FFE07A;color:#5A2A00;font-size:11px;font-weight:900}
.hA small{font-size:10.5px;font-weight:900;letter-spacing:.14em;opacity:.85}.hA .nm{display:block;font-size:20px;font-weight:900}
.hA .rec3{display:flex;gap:8px;margin-top:4px}.hA .rec3 span{font-size:12px;font-weight:800;opacity:.9}.hA .rec3 b{display:block;font-size:20px;opacity:1}
.hA .btnR{position:relative;z-index:1;margin-top:12px;background:#fff;color:#C2410C;box-shadow:0 4px 0 rgba(0,0,0,.25)}
.rowA{display:flex;align-items:center;gap:10px;padding:10px 12px;border-radius:20px;background:var(--card);border:1px solid var(--bd);position:relative;overflow:hidden}
.rowA:before{content:"";position:absolute;left:0;top:0;bottom:0;width:5px;background:var(--k)}
.rowA.w{--k:var(--ok)}.rowA.l{--k:var(--mal)}.rowA.e{--k:var(--azul)}
.rowA .vs{display:flex;align-items:center}.rowA .vs .av+.av{margin-left:-10px}
.rowA .i{flex:1;min-width:0}.rowA .i b{display:block;font-size:15px}.rowA .i small{font-size:12px;color:var(--mu);font-weight:800}
.badge{flex:none;display:flex;flex-direction:column;align-items:center;min-width:54px;padding:4px 8px;border-radius:14px;font-size:16px;font-weight:900;background:color-mix(in srgb,var(--k) 15%,transparent);color:var(--k)}.badge small{font-size:9.5px;letter-spacing:.08em}
.reto{display:flex;align-items:center;gap:10px;padding:10px 12px;border-radius:20px;color:#fff;background:linear-gradient(135deg,#2F6FD6,#123A7A);box-shadow:0 0 0 0 rgba(77,163,255,.5);animation:pulso 1.6s ease-out infinite}

.tile{border-radius:18px;padding:10px 6px;text-align:center;color:#fff}.tile i{font-style:normal;font-size:18px}.tile b{display:block;font-size:24px;font-weight:900;line-height:1.1}.tile small{font-size:10.5px;font-weight:900;letter-spacing:.08em;opacity:.9}

.match .m{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:6px;margin-top:6px}

.riv.reta{border:2px solid var(--azul);box-shadow:0 0 0 4px color-mix(in srgb,var(--azul) 20%,transparent)}
.riv .tag{align-self:flex-start;padding:2px 9px;border-radius:99px;background:var(--azul);color:#fff;font-size:10.5px;font-weight:900;letter-spacing:.08em}

.hD:before{content:"";position:absolute;inset:0;background:repeating-conic-gradient(from 0deg at 50% 120%,rgba(255,255,255,.06) 0 6deg,transparent 6deg 14deg)}
.hD>*{position:relative}.hD small{font-size:10.5px;letter-spacing:.16em;font-weight:900;color:#C9BEF0}
.hD .rk{font-size:24px;font-weight:900;margin-top:2px}.hD .rk em{font-style:normal;color:#FFD166}
.hD .vsb{display:flex;align-items:center;justify-content:center;gap:10px;margin-top:10px}

.hD .btnR{margin-top:12px}
.tabsD{display:flex;padding:4px;border-radius:99px;background:var(--card);border:1px solid var(--bd)}.tabsD span{flex:1;height:36px;border-radius:99px;display:flex;align-items:center;justify-content:center;gap:4px;font-size:13px;font-weight:900;color:var(--mu)}.tabsD span.on{background:var(--ink);color:var(--bg)}.tabsD i{font-style:normal;padding:0 6px;border-radius:99px;background:var(--mal);color:#fff;font-size:11px}
.cardD{display:flex;align-items:center;gap:10px;padding:10px;border-radius:20px;background:var(--card);border:1px solid var(--bd)}

.cardD .med.w{background:linear-gradient(#FFE07A,#E8A21C)}.cardD .med.l{background:var(--chip)}
.cardD .i{flex:1;min-width:0}.cardD b{display:block;font-size:15px}.cardD small{font-size:12px;color:var(--mu);font-weight:800}
.cardD .sc3{font-size:18px;font-weight:900}.cardD .aura{display:block;font-size:11px;color:var(--gold);font-weight:900;text-align:right}

function sprite(n, s) {
  const d = SPR[n]; if (!d) return "";
  const h = d.r.length, w = d.r[0].length;
  let o = '<svg width="' + Math.round(s * w / h) + '" height="' + s + '" viewBox="0 0 ' + w + ' ' + h + '" shape-rendering="crispEdges" aria-hidden="true">';
  d.r.forEach((row, y) => row.split("").forEach((c, x) => { if (c !== ".") o += '<rect x="' + x + '" y="' + y + '" width="1" height="1" fill="' + d.p[c] + '"></rect>'; }));
  return o + "</svg>";
}
