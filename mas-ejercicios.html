<script>
/* ===== WEB (GitHub Pages): convierte los enlaces go:seccion en seccion.html. En App Creator no hace nada. ===== */
(function(){
  var web = /github\.io$/.test(location.hostname);
  window.igURL = function(u){
    u = String(u);
    if (!web || u.indexOf("go:") !== 0) return u;
    var s = u.slice(3);
    return (s === "inicio" ? "index" : s) + ".html";
  };
  if (!web) return;
  document.addEventListener("click", function(e){
    var a = e.target.closest && e.target.closest('a[href^="go:"]');
    if (a){ e.preventDefault(); location.href = igURL(a.getAttribute("href")); }
  }, true);
})();
</script>

.u-tip2{display:flex;gap:8px;align-items:flex-start;margin-top:12px;padding:10px 12px;border-radius:14px;background:color-mix(in srgb,var(--gold) 12%,transparent);border:1.5px solid color-mix(in srgb,var(--gold) 40%,var(--line2));font-size:15px;font-weight:800;text-align:left;line-height:1.35}

.fwa{color:var(--gold);font-weight:900;line-height:1}
.fno{position:absolute;right:0;top:8%;bottom:8%;aspect-ratio:1;pointer-events:none}
.fno::before,.fno::after{content:'';position:absolute;left:46%;top:0;bottom:0;width:12%;min-width:3px;border-radius:3px;background:var(--mal);transform:rotate(45deg)}
.fno::after{transform:rotate(-45deg)}
.u-w{border-bottom:2px dashed var(--toff);padding-bottom:1px}
.u-nuevo{display:inline-flex;align-items:center;gap:6px;margin-bottom:8px;font-size:12px;font-weight:900;letter-spacing:.06em;color:var(--gold)}

.u-glo:before{content:"";position:absolute;left:-10px;bottom:16px;width:16px;height:16px;background:var(--bg);border-left:2px solid var(--line2);border-bottom:2px solid var(--line2);transform:rotate(45deg)}
.u-glo .ob{display:inline-block;vertical-align:middle;margin-left:4px;line-height:0}
.u-au{display:inline-flex;vertical-align:middle;margin-right:6px;color:var(--gold);cursor:pointer;border:0;background:none;padding:0}
.u-es{display:block;margin-top:4px;font-size:14px;font-weight:700;color:var(--mu)}
/* palabras con traducción al tocarlas */
.u-w{position:relative;cursor:pointer;border-bottom:2px dashed var(--toff)}
.u-tip{position:absolute;left:50%;bottom:calc(100% + 8px);transform:translateX(-50%);z-index:6;white-space:nowrap;padding:6px 10px;border-radius:10px;background:var(--ink);color:var(--bg);font-size:14px;font-weight:900;box-shadow:0 6px 16px rgba(0,0,0,.4);animation:entra .15s ease}
.u-tip:after{content:"";position:absolute;left:50%;top:100%;margin-left:-6px;border:6px solid transparent;border-top-color:var(--ink)}
.u-ops{display:grid;gap:10px;margin-top:20px}
.u-o{display:flex;align-items:center;gap:12px;min-height:56px;padding:12px 16px;border:2px solid var(--line2);border-bottom-width:4px;border-radius:16px;background:none;color:var(--ink);font:800 17px Nunito,sans-serif;text-align:left;cursor:pointer;touch-action:manipulation}

.u-o kbd{flex:none;width:28px;height:28px;border:2px solid var(--line2);border-radius:8px;display:flex;align-items:center;justify-content:center;font:800 13px Nunito;color:var(--mu)}

.u-lin{min-height:120px;margin-top:20px;padding:6px 0;background:linear-gradient(transparent 58px,var(--line2) 58px,var(--line2) 60px,transparent 60px) 0 0/100% 62px;display:flex;flex-wrap:wrap;align-content:flex-start;gap:6px}
.u-ban{display:flex;flex-wrap:wrap;justify-content:center;gap:8px;margin-top:20px}
.u-ch{display:inline-flex;align-items:center;gap:6px;height:50px;padding:0 16px;border:2px solid var(--line2);border-bottom-width:4px;border-radius:14px;background:var(--bg);color:var(--ink);font:800 18px Nunito,sans-serif;cursor:pointer;touch-action:manipulation}

.u-hueco{display:inline-block;min-width:96px;border-bottom:2px solid var(--toff);text-align:center;color:var(--gold)}
.u-cards{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:20px}
.u-card{display:flex;flex-direction:column;align-items:center;gap:6px;padding:14px 8px 12px;border:2px solid var(--line2);border-bottom-width:4px;border-radius:18px;background:none;color:var(--ink);font:800 17px Nunito,sans-serif;cursor:pointer}

.u-big{display:flex;justify-content:center;align-items:center;gap:14px;margin-top:4px}
.u-bigb{width:84px;height:84px;border-radius:20px;border:0;border-bottom:5px solid color-mix(in srgb,var(--hi) 55%,#777);background:var(--hi);color:var(--on-hi);display:flex;align-items:center;justify-content:center;cursor:pointer}

.u-ta{width:100%;min-height:110px;margin-top:20px;padding:14px;border:2px solid var(--line2);border-radius:16px;background:var(--card);color:var(--ink);font:700 18px Nunito,sans-serif;resize:none;outline:none}

.u-par{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:20px}
.u-par .u-ch{width:100%;height:56px;justify-content:center}
.u-par .u-ch.ok{border-color:var(--line2);color:var(--toff);pointer-events:none}.u-par .u-ch.ok svg{opacity:.3}
.u-par .u-ch.mal{border-color:var(--mal);color:var(--mal);animation:shk .3s}
/* palabra nueva */
.u-nw{display:flex;flex-direction:column;align-items:center;text-align:center;margin-top:4px}
.u-nw .ob{line-height:0;animation:bob 2.4s ease-in-out infinite}
.u-nw .pal{display:flex;align-items:center;gap:10px;margin-top:12px;font-size:40px;font-weight:900;line-height:1}
.u-nw .tra{margin-top:6px;font-size:21px;font-weight:900;color:var(--gold)}
.u-nw .lento2{margin-top:10px;display:inline-flex;align-items:center;gap:6px;height:38px;padding:0 14px;border-radius:99px;border:2px solid var(--line2);background:none;color:var(--ink);font:800 14px Nunito,sans-serif;cursor:pointer}
.u-ejx{display:flex;align-items:flex-end;gap:8px;margin-top:18px;width:100%}
.u-ejx>svg{width:84px;height:auto;flex:none;overflow:visible}
.u-ejx .u-glo{flex:1;margin-bottom:30px;text-align:left;font-size:17px}

/* completa la palabra */
.u-pal{display:flex;justify-content:center;align-items:center;gap:4px;margin-top:18px;flex-wrap:wrap}
.u-pal span{font-size:40px;font-weight:900;line-height:1}
.u-pal .esp{width:14px}
.u-pal input{width:40px;height:54px;padding:0;border:0;border-bottom:4px solid var(--gold);border-radius:8px 8px 4px 4px;background:color-mix(in srgb,var(--gold) 10%,transparent);color:var(--gold);text-align:center;font:900 36px Nunito,sans-serif;outline:none;caret-color:var(--gold)}
.u-pal input.ok{border-color:var(--ok);color:var(--ok);background:color-mix(in srgb,var(--ok) 12%,transparent)}.u-pal input.mal{border-color:var(--mal);color:var(--mal)}
.u-pist{display:flex;align-items:center;justify-content:center;gap:10px;margin-top:6px}.u-pist b{font-size:20px;color:var(--gold)}
/* pásala a negativa */
.u-camb{padding:14px;border-radius:18px;background:var(--card);border:1px solid var(--bd);text-align:center}
.u-camb .de{display:flex;align-items:center;justify-content:center;gap:8px;font-size:22px;font-weight:900}.u-camb small{display:block;font-size:13px;color:var(--mu);font-weight:700;margin-top:2px}
.u-flecha{display:flex;align-items:center;justify-content:center;gap:10px;margin:12px 0 0;color:var(--gold);font-weight:900;font-size:13px;letter-spacing:.08em}
.u-flecha:before,.u-flecha:after{content:"";flex:1;height:2px;background:var(--bd)}
/* ronda relámpago */
.u-rel{position:relative;width:96px;height:96px;margin:4px auto 0}
.u-rel svg.r{position:absolute;inset:0;transform:rotate(-90deg)}
.u-rel b{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-size:30px;font-weight:900}
.u-rel.urg b{color:var(--mal)}
.u-rond{text-align:center;font-size:13px;font-weight:900;color:var(--mu);letter-spacing:.08em;margin-top:6px}
.u-relq{display:flex;align-items:center;justify-content:center;gap:16px;margin-top:12px;min-height:110px}
.u-relq .fr{font-size:24px;font-weight:900;text-align:center}
.u-sino{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:16px}
.u-sino .u-o{justify-content:center;flex-direction:column;gap:4px;min-height:80px;font-size:17px}.u-sino .u-o svg{width:28px;height:28px}
.u-marc{display:flex;gap:6px;justify-content:center;margin-top:12px}.u-marc i{width:26px;height:8px;border-radius:9px;background:var(--bd)}.u-marc i.ok{background:var(--ok)}.u-marc i.mal{background:var(--mal)}
.u-go{display:block;margin:0 auto;height:50px;padding:0 26px;border:0;border-bottom:4px solid color-mix(in srgb,var(--hi) 55%,#777);border-radius:14px;background:var(--hi);color:var(--on-hi);font:900 15px Nunito,sans-serif;letter-spacing:.06em;text-transform:uppercase;cursor:pointer}
/* frase tocable: traducción completa */
.u-fr{position:relative;cursor:pointer;border-bottom:2px dashed var(--toff)}
.u-fr .u-tip{white-space:normal;width:max-content;max-width:240px;text-align:center}
/* los 4 conectores */
.u-l4{display:grid;gap:10px}
.u-l4i{display:flex;align-items:center;gap:12px;padding:12px 14px;border:2px solid var(--bd);border-bottom-width:4px;border-radius:18px;background:var(--card);color:var(--ink);font:inherit;text-align:left;cursor:pointer}
.u-l4i.oido{border-color:color-mix(in srgb,var(--gold) 55%,var(--bd))}
.u-l4i .w{flex:none;width:100px}.u-l4i .w b{display:block;font-size:21px;font-weight:900;line-height:1}.u-l4i .w em{display:block;font-style:normal;margin-top:3px;font-size:15px;font-weight:900;color:var(--gold)}
.u-l4i .x{flex:1;min-width:0}.u-l4i .e{display:block;font-size:15px;font-weight:800;line-height:1.3}.u-l4i .s{display:block;margin-top:2px;font-size:13px;font-weight:700;color:var(--mu)}
.u-l4i .o{flex:none;display:flex;gap:2px;line-height:0}
/* mini sopa de letras */
.u-sopa{display:grid;gap:5px;max-width:340px;margin:0 auto;touch-action:none;user-select:none}
.u-sl{aspect-ratio:1;border:0;border-radius:10px;background:var(--card);box-shadow:inset 0 0 0 2px var(--bd);color:var(--ink);font:900 20px Nunito,sans-serif;cursor:pointer;padding:0;transition:background .15s,transform .1s}
.u-sl.ini,.u-sl.tmp{background:color-mix(in srgb,var(--gold) 30%,var(--card));box-shadow:inset 0 0 0 2px var(--gold);transform:scale(1.05)}
.u-sl.ok{background:color-mix(in srgb,var(--ok) 30%,var(--card));box-shadow:inset 0 0 0 2px var(--ok);color:var(--ink)}
.u-sl.mal{background:color-mix(in srgb,var(--mal) 25%,var(--card))}
.u-spw{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;margin-top:14px}
.u-spw span{padding:7px 12px;border-radius:99px;border:2px solid var(--bd);font-size:14px;font-weight:800;color:var(--mu)}.u-spw span b{color:var(--ink)}
.u-spw span.ok{border-color:var(--ok);background:color-mix(in srgb,var(--ok) 14%,transparent);text-decoration:line-through}
/* conversación con huecos numerados */
.u-conv .hueco2{display:flex;align-items:center;gap:8px;padding:12px;border-radius:14px;border:2px dashed var(--bd);color:var(--mu);font-size:14px;font-weight:800}
.u-conv .hueco2.yo{flex-direction:row-reverse;text-align:right}
.u-conv .hueco2 .num{flex:none;width:24px;height:24px;border-radius:50%;background:var(--chip);display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:900;color:var(--ink)}
.u-conv .hueco2.pista2{border-color:var(--gold);color:var(--gold);animation:shk .35s}
.u-conv .bb .qn{display:block;font-size:11px;font-weight:900;letter-spacing:.06em;color:var(--mu);text-transform:uppercase;margin-bottom:2px}
.dormido .oc{animation:none}.dormido .cab{animation:nod 3s ease-in-out infinite alternate}.dormido .mov{animation:resp 3s ease-in-out infinite}.dormido .bo{animation:ua 2.4s step-end infinite}
/* liga semanal en la pantalla final */
.lgf{width:100%;margin:16px 0 4px;padding:14px;border-radius:20px;background:var(--card);border:1px solid var(--bd);text-align:left}
.lgf h3{display:flex;align-items:center;justify-content:space-between;margin:0 0 4px;font-size:12px;font-weight:900;letter-spacing:.12em;color:var(--mu)}
.lgf h3 span{letter-spacing:0;color:var(--gold);font-size:13px}
.lgf .tit{margin:0 0 10px;font-size:18px;font-weight:900}.lgf .tit b{color:var(--ok)}
.lgf .tb{position:relative;overflow:hidden;border-radius:14px}
.lgf .fl{position:absolute;left:0;right:0;height:46px;display:flex;align-items:center;gap:10px;padding:0 12px;border-radius:12px;transition:top .9s cubic-bezier(.3,1.2,.4,1),background .4s}
.lgf .fl .p{flex:none;width:28px;font-size:15px;font-weight:900;color:var(--mu)}
.lgf .fl .n{flex:1;min-width:0;font-size:15px;font-weight:800;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.lgf .fl .a{flex:none;display:flex;align-items:center;gap:4px;font-size:15px;font-weight:900}
.lgf .fl.yo{background:color-mix(in srgb,var(--gold) 18%,var(--card));box-shadow:inset 0 0 0 2px var(--gold);z-index:2}
.lgf .fl.yo .n{color:var(--ink)}
.lgf .fl.sube{animation:lgsube .9s ease}
.lgf .flecha2{display:inline-flex;align-items:center;gap:4px;margin-left:6px;padding:2px 8px;border-radius:99px;background:var(--ok);color:var(--bg);font-size:12px;font-weight:900}
.lgf .nota3{margin:10px 0 0;font-size:13px;font-weight:700;color:var(--mu)}
@keyframes lgsube{40%{transform:scale(1.04)}}
/* pista del conector (sale la primera vez) */
.u-pista{display:flex;align-items:center;gap:8px;margin:0 0 14px;padding:10px 14px;border-radius:16px;border:2px solid color-mix(in srgb,var(--gold) 45%,var(--bd));background:color-mix(in srgb,var(--gold) 8%,var(--card));animation:entra .3s ease}
.u-pista .k{display:inline-flex;align-items:center;gap:4px;padding:3px 8px;border-radius:99px;background:var(--gold);color:var(--bg);font-size:10.5px;font-weight:900;letter-spacing:.08em}
.u-pista .u-au{margin:0 0 0 4px}
.u-pista b{font-size:22px;font-weight:900}.u-pista .eq{color:var(--mu);font-weight:900}.u-pista .es{font-size:20px;font-weight:900;color:var(--gold)}
/* encuentra el error */
.u-ch.malw{border-color:var(--mal)!important;color:var(--mal)!important;background:color-mix(in srgb,var(--mal) 12%,transparent)!important}
.u-ch.fix{border-color:var(--ok)!important;color:var(--ok)!important;background:color-mix(in srgb,var(--ok) 12%,transparent)!important}
.u-ch.sel{border-color:var(--gold);background:color-mix(in srgb,var(--gold) 10%,transparent);color:var(--gold)}
.u-paso{display:none;margin-top:18px;padding-top:14px;border-top:2px dashed var(--bd)}.u-paso.on{display:block}
.u-paso p{margin:0 0 10px;font-weight:800;color:var(--mu);text-align:center}
/* ordena la conversación */
.u-conv{display:flex;flex-direction:column;gap:10px;min-height:180px;padding:12px;border-radius:20px;background:var(--card);border:1px solid var(--bd)}
.u-conv .fila{display:flex;align-items:flex-end;gap:8px;animation:entra .25s ease}
.u-conv .fila.yo{flex-direction:row-reverse}
.u-conv .fila>svg{width:42px;height:auto;flex:none;overflow:visible}
.u-conv .bb{max-width:74%;padding:9px 12px;border-radius:16px;font-size:16px;font-weight:800;line-height:1.35}
.u-conv .fila.el .bb{background:var(--chip);border-bottom-left-radius:4px}.u-conv .fila.yo .bb{background:color-mix(in srgb,var(--gold) 16%,var(--card));color:var(--ink);border-bottom-right-radius:4px}
.u-conv .bb small{display:block;font-size:12px;color:var(--mu);font-weight:700;margin-top:2px}
.u-conv .vacio{margin:auto;color:var(--toff);font-weight:800;font-size:14px}
#cvO .u-o{font-size:16px;min-height:50px}#cvO .u-o.ida{opacity:.2;pointer-events:none}
.u-o.mal{border-color:var(--mal);animation:shk .3s}
/* personajes extra */
.kb1{animation:ua .5s step-end infinite}.kb2{opacity:0;animation:ub .5s step-end infinite}
.idea .mov{animation:salta .5s ease-in-out infinite alternate}.idea .rd{opacity:0}.idea .r1{animation:ua .5s step-end infinite}.idea .r2{animation:ub .5s step-end infinite}
.cool .oc{animation:none}.cool .rd{opacity:0}.cool .r1{animation:ua 3s step-end infinite}.cool .r2{animation:ub 3s step-end infinite}.cool .gu{animation:kwink 3s step-end infinite}
.baile .mov{animation:salta .3s ease-in-out infinite alternate}.baile .rd{animation:ub .6s step-end infinite}.baile .r1{animation:ua .6s step-end infinite}.baile .ld{animation:ua .6s step-end infinite}.baile .l1{animation:ub .6s step-end infinite}
.sorpresa .oc{animation:none}.sorpresa .mov{animation:ksusto 1.6s ease-in-out infinite}.sorpresa .rd,.sorpresa .ld{opacity:0}.sorpresa .r1,.sorpresa .l1{opacity:1}
@keyframes ksusto{0%,70%,100%{transform:translateY(0)}75%{transform:translateY(-1px)}85%{transform:translateY(0)}}
/* pie con Comprobar */
.u-pie{position:sticky;bottom:0;z-index:4;margin:18px -16px 0;padding:16px 16px calc(18px + env(safe-area-inset-bottom));border-top:2px solid var(--line2);background:var(--bg);transition:background .2s}
.u-pie.ok{background:color-mix(in srgb,var(--ok) 15%,var(--bg));border-color:transparent}.u-pie.mal{background:color-mix(in srgb,var(--mal) 13%,var(--bg));border-color:transparent}
.rx-ok{animation:rxSalta .55s cubic-bezier(.3,1.6,.5,1) 2;filter:drop-shadow(0 0 10px color-mix(in srgb,var(--ok) 75%,transparent)) drop-shadow(0 0 22px color-mix(in srgb,var(--ok) 45%,transparent))}
.rx-mal{animation:rxSusto .12s linear 5;filter:drop-shadow(0 0 10px color-mix(in srgb,var(--mal) 75%,transparent)) drop-shadow(0 0 22px color-mix(in srgb,var(--mal) 40%,transparent))}
@keyframes rxSalta{0%,100%{transform:translateY(0)}45%{transform:translateY(-22px) scale(1.04)}}
@keyframes rxSusto{0%,100%{transform:translateX(0)}25%{transform:translateX(-4px)}75%{transform:translateX(4px)}}

.u-glo .ob{display:inline-flex!important;flex-direction:row;align-items:center;gap:4px;flex-wrap:nowrap}.u-glo .ob svg{display:block;flex:none}
.u-fb{display:none;align-items:center;gap:12px;margin-bottom:14px}
.u-pie.ok .u-fb,.u-pie.mal .u-fb{display:flex}
.u-fb .ic{position:relative;flex:none;width:92px;margin-top:-58px;display:block;line-height:0;background:none;border:0}
.u-fb .ic svg{display:block;width:92px;height:auto;overflow:visible;filter:drop-shadow(0 4px 0 rgba(0,0,0,.35))}

  [CLAVE_A1, CLAVE].forEach(k => { const S = cargarS(k), hoy = new Date(), ayer = new Date(hoy.getTime() - 864e5), h = clave(hoy); if (S.dia.u === h) return; S.dia.r = (S.dia.u === clave(ayer)) ? S.dia.r + 1 : 1; S.dia.u = h; try { localStorage.setItem(k, JSON.stringify(S)); } catch (e) {} });
