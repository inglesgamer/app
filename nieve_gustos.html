<script>
/* ===== WEB (GitHub Pages): convierte los enlaces go:seccion en seccion.html. En App Creator no hace nada. ===== */
(function(){
  var web = /github\.io$/.test(location.hostname);
  window.igURL = function(u){
    u = String(u);
    if (!web || u.indexOf("go:") !== 0) return u;
    var s = u.slice(3);
    return (s === "inicio" ? "index" : s) + ".html";
  };
  if (!web) return;
  document.addEventListener("click", function(e){
    var a = e.target.closest && e.target.closest('a[href^="go:"]');
    if (a){ e.preventDefault(); location.href = igURL(a.getAttribute("href")); }
  }, true);
})();
</script>

/* la racha del día es la misma de toda la app (la del Inicio) */

  [CLAVE_A1, CLAVE].forEach(k => { const S = cargarS(k), hoy = new Date(), ayer = new Date(hoy.getTime() - 864e5), h = clave(hoy); if (S.dia.u === h) return; S.dia.r = (S.dia.u === clave(ayer)) ? S.dia.r + 1 : 1; S.dia.u = h; try { localStorage.setItem(k, JSON.stringify(S)); } catch (e) {} });
}

  const a = leerAura(), gk = "nieve_" + NIVEL.id, ya = +a.g[gk] || 0, dar = Math.max(0, total - ya);
  a.g[gk] = Math.max(ya, total); if (!dar) return 0;

}

 const MAPA = [".XX...XX.","XXXX.XXXX","XXXXXXXXX","XXXXXXXXX",".XXXXXXX.","..XXXXX..","...XXX...","....X...."];
 let raiz, mock, L, pr, racha = 0, vidas = 3, timers = [];
 const mk = (c, h, css) => { const e = document.createElement("div"); e.className = c; if (h) e.innerHTML = h; if (css) e.style.cssText = css; return e; };

  let r = "";

  return '<svg class="hsv" viewBox="0 0 9 8" width="31" height="28" shape-rendering="crispEdges" aria-hidden="true">' + r + '</svg>';

 }
 function confetiR(n) {

  for (let k = 0; k < n; k++) { const a = R(-2.8, -.35), r = R(30, 95), e = mk("cf", "", "--dx:" + (Math.cos(a) * r).toFixed(1) + "px;--dy:" + (Math.sin(a) * r).toFixed(1) + "px;background:" + col[k % 5]); L.appendChild(e); setTimeout(() => e.remove(), 1050); }
 }
 function rayo() {
  const v = document.createElementNS(NS, "svg"); v.setAttribute("class", "bolt"); v.setAttribute("viewBox", "0 0 100 60"); v.setAttribute("preserveAspectRatio", "none");
  let x = R(6, 94), d = "M" + x.toFixed(1) + " 0"; [14, 30, 46, 60].forEach(y => { x = Math.max(2, Math.min(98, x + R(-10, 10))); d += " L" + x.toFixed(1) + " " + y; });
  v.innerHTML = '<path class="g" d="' + d + '"></path><path class="c" d="' + d + '"></path>'; L.appendChild(v); setTimeout(() => v.remove(), 360);

  if (x.head) L.appendChild(mk("rghead"));
  if (x.ring) L.appendChild(mk("rgring"));
  if (x.burst) timers.push(setInterval(() => confetiR(Math.round(x.conf / 2)), x.burst));
  if (x.rayo) {
   L.appendChild(mk("shine"));
   pr.classList.remove("flash"); void pr.offsetWidth; pr.classList.add("flash");

  }

  mock.classList.remove("shake", "err"); void mock.offsetWidth; mock.classList.add("shake", "err"); setTimeout(() => mock.classList.remove("shake", "err"), 520);

  iniciar(el) { raiz = el; mock = el.querySelector(".mock") || el; L = el.querySelector(".fxl"); pr = el.querySelector(".prog"); timers = []; pintarCorazones(); },
  acierto() { racha++; const nv = NIVELES.find(n => n.n === racha); if (nv) encender(nv); return racha; },
  error() { if (vidas <= 0) return false; apagar(); racha = 0; vidas--; pum(); return true; },
  reiniciar() { apagar(); racha = 0; vidas = 3; pintarCorazones(); },
  get racha() { return racha; },
  get vidas() { return vidas; }
 };
})();

/* frase con palabras que se pueden tocar para ver la traducción */
function frase(t) {
  let out = "", r = t;
  const claves = Object.keys(TRAD).sort((a, b) => b.length - a.length);
  while (r.length) {
    const k = claves.find(c => r.startsWith(c) && !/[a-z]/i.test(r.charAt(c.length) || " "));
    if (k) { out += '<span class="u-w" data-t="' + esc(TRAD[k]) + '">' + esc(k) + '</span>'; r = r.slice(k.length); }
    else { out += esc(r[0]); r = r.slice(1); }
  }
  return out;
}

              const tp = Math.min(Math.max(0, ag - bt.tp1), ficha.ag == null ? 1e9 : +ficha.ag);
              if (tp !== (+ficha.tp1 || 0)) { await updateDoc(ref, { tp1: tp }); ficha.tp1 = tp; }
            }
            /* LIGA SEMANAL: Aura ganada esta semana (ls) + grupo "semana|liga" (lgw). Al cambiar de semana se guarda la anterior en lsa/lgwa */
            const sk0 = aSemana(new Date()); let bs = leer("ingles_gamer_aura_sem") || {};
            if (bs.k !== sk0) { bs = { k:sk0, e:ag }; try { localStorage.setItem("ingles_gamer_aura_sem", JSON.stringify(bs)); } catch (x) {} }
            const Lg = leer("ingles_gamer_liga") || { lg:0 }, lgw = sk0 + "|" + (+Lg.lg || 0), ls = Math.min(Math.max(0, ag - (+bs.e || 0)), ficha.ag == null ? 1e9 : +ficha.ag), up = {};
            if (ficha.lgw && String(ficha.lgw).indexOf(sk0 + "|") !== 0 && ficha.lgwa !== ficha.lgw) { up.lsa = +ficha.ls || 0; up.lgwa = String(ficha.lgw); }
            if (ls !== ficha.ls || lgw !== ficha.lgw) { up.ls = ls; up.lgw = lgw; }
            if (Object.keys(up).length) { await updateDoc(ref, up); Object.assign(ficha, up); }
          } catch (e2) { try { localStorage.setItem("ig_ficha_temp", String((e2 && e2.code) || e2)); } catch (x) {} }
      } catch (e) { estado(false, e); } finally { ocupado = false; }
    }
    onAuthStateChanged(auth, u => { user = u; ficha = null; if (u) setTimeout(() => publicar(), 4000); });
    document.addEventListener("visibilitychange", () => { if (document.hidden) publicar(); else setTimeout(() => publicar(), 3000); });
    setInterval(() => { if (!document.hidden) publicar(); }, 60000);
    window.IGFicha = { publicar: () => publicar(true) };
  } catch (e) { console.error("[ficha]", e); }
})();
