<script>
/* ===== WEB (GitHub Pages): convierte los enlaces go:seccion en seccion.html. En App Creator no hace nada. ===== */
(function(){
  var web = /github\.io$/.test(location.hostname);
  window.igURL = function(u){
    u = String(u);
    if (!web || u.indexOf("go:") !== 0) return u;
    var s = u.slice(3);
    return (s === "inicio" ? "index" : s) + ".html";
  };
  if (!web) return;
  document.addEventListener("click", function(e){
    var a = e.target.closest && e.target.closest('a[href^="go:"]');
    if (a){ e.preventDefault(); location.href = igURL(a.getAttribute("href")); }
  }, true);
})();
</script>

.dec{flex:1;min-width:0}

const estrella = on => '<svg width="22" height="22" viewBox="0 0 24 24" aria-hidden="true"><path d="m12 2.5 2.9 6.2 6.6.8-4.9 4.6 1.3 6.7-5.9-3.4-5.9 3.4 1.3-6.7L2.5 9.5l6.6-.8z" style="fill:' + (on ? "var(--ink)" : "var(--toff)") + '"></path></svg>';
let tt;
function say(m) { const t = $("toast"); t.textContent = m; t.classList.add("on"); clearTimeout(tt); tt = setTimeout(() => t.classList.remove("on"), 2400); }
const sinAcentos = t => String(t || "").normalize("NFD").replace(/[̀-ͯ]/g, "").toLowerCase().replace(/[^a-z0-9]+/g, " ").trim();

/* ===== datos guardados (mismas claves que el resto de la app) ===== */
const leer = k => { try { return JSON.parse(localStorage.getItem(k) || "null"); } catch (e) { return null; } };
function datos() {
  const perfil = leer("ingles_gamer_perfil") || {}, tienda = leer("ingles_gamer_tienda") || {}, aura = leer("ingles_gamer_aura") || {};
  const rep = leer("ingles_gamer_a1_repaso") || {}, est = rep.est || {};
  const own = Array.isArray(tienda.own) ? tienda.own : [];
  let av = Number(perfil.a) >= 0 && Number(perfil.a) < AVATARES.length ? Number(perfil.a) : 0;
  if (av > 1 && av !== 9 && own.indexOf("av" + av) < 0) av = 0;
  const e = id => Math.min(3, Math.max(0, +est[id] || 0));
  let tot = TIENE_FINAL ? e("final") : 0, pasados = TIENE_FINAL && e("final") >= 1 ? 1 : 0;
  TEMAS.forEach(t => { tot += e(t[0]); if (e(t[0]) >= 1) pasados++; });
  const log = (Array.isArray(aura.l) ? aura.l : []).map(x => ({ n: +x[0] || 0, t: String(x[1] || "Actividad"), ts: +x[2] || 0 })).filter(x => x.ts > 0).sort((a, b) => b.ts - a.ts);
  return { av, e, tot, pasados, aura: Math.max(0, +aura.t || 0), log };
}
/* estrellas de un movimiento: se busca el nivel por su nombre (si no es un nivel, no se muestran) */
function estrellasDe(titulo, D) {
  const k = sinAcentos(titulo);
  const lista = TEMAS.map(t => [t[1], t[0]]).concat(TIENE_FINAL ? [["Jefe final", "final"]] : []);
  const h = lista.find(x => sinAcentos(x[0]) === k) || lista.find(x => k.indexOf(sinAcentos(x[0])) === 0);
  return h ? D.e(h[1]) : null;
}

/* ===== periodos ===== */
const dia0 = t => { const d = new Date(t); d.setHours(0, 0, 0, 0); return d.getTime(); };
const inicioSemana = () => { const d = new Date(); d.setHours(0, 0, 0, 0); d.setDate(d.getDate() - ((d.getDay() + 6) % 7)); return d.getTime(); };
const inicioMes = () => { const d = new Date(); return new Date(d.getFullYear(), d.getMonth(), 1).getTime(); };
const PER = [["sem", "Semana"], ["mes", "Mes"], ["tot", "Todo"]];
const desde = p => p === "sem" ? inicioSemana() : p === "mes" ? inicioMes() : 0;
let per = "sem", todo = false;
function cuando(ts) {
  const n = Math.round((dia0(Date.now()) - dia0(ts)) / 864e5);
  return n <= 0 ? "Hoy" : n === 1 ? "Ayer" : "Hace " + n + " días";
}
function frase(n) {
  if (n >= 7) return "¡Eres imparable!";
  if (n >= 3) return "¡Vas genial!";
  if (n >= 1) return "¡Buen ritmo!";
  return "¡Vamos a jugar!";
}

/* ===== pintar ===== */
function pintar() {
  const D = datos(), ini = desde(per);
  const mov = D.log.filter(x => x.ts >= ini);
  const lecc = per === "tot" ? Math.max(D.pasados, D.log.filter(x => x.n > 0).length) : mov.filter(x => x.n > 0).length;
  const ganada = mov.reduce((a, x) => a + (x.n > 0 ? x.n : 0), 0);
  const nombrePer = per === "sem" ? "Esta semana" : per === "mes" ? "Este mes" : "En total";

  $("tabs").innerHTML = PER.map(p => '<button type="button" role="tab" class="tab' + (per === p[0] ? " on" : "") + '" data-p="' + p[0] + '" aria-selected="' + (per === p[0]) + '">' + p[1] + '</button>').join("");

  $("mascota").innerHTML = '<div class="pj"><span class="mas m1" aria-hidden="true">+</span><span class="mas m2" aria-hidden="true">+</span><span class="mas m3" aria-hidden="true">+</span>' + sprite(AVATARES[D.av], 120) + '<i class="som" aria-hidden="true"></i></div>' +
    '<div class="dec"><span class="bub">' + frase(lecc) + '</span><p>' + nombrePer + ': +' + lecc + (lecc === 1 ? " lección" : " lecciones") + '</p></div>';

  const K = [
    [I.star, "Estrellas", D.tot, "de " + MAX_ESTRELLAS],
    [I.rayo, "Aura", D.aura, per === "tot" ? "total" : "+" + ganada + (per === "sem" ? " esta semana" : " este mes")],
    [I.meta, "Precisión", PRECISION(D), "respuestas correctas"],
    [I.libro, "Lecciones", lecc, "completadas"]
  ];
  $("kpis").innerHTML = K.map(k => '<div class="card k"><span class="et">' + ico(k[0], 22) + k[1] + '</span><b>' + k[2] + '</b><small>' + k[3] + '</small></div>').join("");

  const lista = todo ? mov : mov.slice(0, POR_DEFECTO);
  $("verTodo").hidden = mov.length <= POR_DEFECTO;
  $("verTodo").textContent = todo ? "Ver menos" : "Ver todo";
  $("hist").innerHTML = lista.length ? lista.map(x => {
    const s = estrellasDe(x.t, D);
    return '<div class="card fila"><span class="fav">' + sprite(AVATARES[D.av], 90) + '</span><span class="fi"><b>' + esc(x.t) + '</b><span>' + cuando(x.ts) + '</span></span>' +
      '<span class="fd">' + (s === null ? "" : '<span class="es" aria-label="' + s + ' de 3 estrellas">' + [0, 1, 2].map(i => estrella(i < s)).join("") + '</span>') +
      '<span class="au' + (x.n < 0 ? " neg" : "") + '">' + (x.n > 0 ? "+" : "") + x.n + '</span></span></div>';
  }).join("") : '<div class="card vacio"><b>Aún no hay actividad</b>Pasa niveles del Mapa y tu historial aparecerá aquí.</div>';
}

/* Precisión: aquí van tus aciertos y errores. Si tu juego los guarda, calcula el % y devuélvelo, por ejemplo: "86%". Mientras tanto se muestra "—". */
function PRECISION(D) { return "—"; }

/* ===== eventos ===== */
$("btnVolver").innerHTML = ico(I.back, 24);
$("btnShare").innerHTML = ico(I.share, 22);
document.addEventListener("click", async e => {
  const t = e.target.closest("[data-p]");
  if (t) { per = t.dataset.p; todo = false; pintar(); return; }
  if (e.target.closest("#verTodo")) { todo = !todo; pintar(); return; }
  if (e.target.closest("#btnShare")) {
    const D = datos(), txt = "Mis estadísticas en InglésGamer: " + D.tot + " estrellas y " + D.aura + " de Aura.";
    try { if (navigator.share) { await navigator.share({ text: txt }); return; } } catch (er) { if (er && er.name === "AbortError") return; }
    try { await navigator.clipboard.writeText(txt); say("Mensaje copiado, pégalo donde quieras"); } catch (er) { say("No se pudo compartir"); }
  }
});
pintar();
window.addEventListener("pageshow", pintar);
window.addEventListener("storage", e => { if (e.key && e.key.indexOf("ingles_gamer_") === 0) pintar(); });
document.addEventListener("visibilitychange", () => { if (!document.hidden) pintar(); });
</script>

<script type="module">
/* ===== NUBE: guarda tu progreso en tu cuenta y lo recupera. Este MISMO bloque va en Acceso, Inicio, Perfil, Mapa, Tienda y Ranking (justo antes de </body>). ===== */
import { initializeApp, getApps, getApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import { getAuth, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";
import { getFirestore, doc, getDoc, setDoc } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

const CONFIG = {
  apiKey: "AIzaSyDrBReVK9v1ioWfBIyMCnvtuUgbbWPcxTE",
  authDomain: "inglesgamer-5a3a9.firebaseapp.com",
  projectId: "inglesgamer-5a3a9",
  storageBucket: "inglesgamer-5a3a9.firebasestorage.app",
  messagingSenderId: "599532765222",
  appId: "1:599532765222:web:38fe3a7348b3c38e3426e7"
};

(function () {
  try {
    const PREF = "ingles_gamer_", META = "ig_nube_meta";
    const SKIP = /_(sesion|tema|sonido|buzon|buzon_pausa|acceso_modo)$/;
    const app = getApps().length ? getApp() : initializeApp(CONFIG);
    const auth = getAuth(app), db = getFirestore(app);
    let user = null, ocupado = false;

    const dormir = ms => new Promise(r => setTimeout(r, ms));
    const estado = (ok, e) => { try { localStorage.setItem("ig_nube_estado", JSON.stringify({ ok: !!ok, t: Date.now(), c: ok ? "" : String((e && (e.code || e.message)) || "error") })); } catch (x) {} };
    const ref = () => doc(db, "progreso", user.uid);
    const claves = () => { const k = []; try { for (let i = 0; i < localStorage.length; i++) { const n = localStorage.key(i); if (n.indexOf(PREF) === 0 && !SKIP.test(n)) k.push(n); } } catch (e) {} return k; };
    const snap = () => { const o = {}; claves().forEach(k => { o[k] = localStorage.getItem(k); }); return o; };
    const ser = o => JSON.stringify(Object.keys(o).sort().map(k => [k, o[k]]));
    const hash = s => { let h = 5381; for (let i = 0; i < s.length; i++) h = ((h << 5) + h + s.charCodeAt(i)) | 0; return h; };
    const getMeta = () => { try { return JSON.parse(localStorage.getItem(META)) || {}; } catch (e) { return {}; } };
    const setMeta = m => { try { localStorage.setItem(META, JSON.stringify(m)); } catch (e) {} };
    /* CORREGIDO: "vacío" = sin progreso real (solo el apodo/perfil no cuenta) */
    const vacio = o => !o || !(o.ingles_gamer_a1_repaso || o.ingles_gamer_aura || o.ingles_gamer_tienda);
    const limpiar = () => claves().forEach(k => localStorage.removeItem(k));
    const cambios = () => !!user && getMeta().uid === user.uid && hash(ser(snap())) !== getMeta().h;
    const puntos = d => {
      try {

        return (+a.t || 0) + Object.values(r.est || {}).reduce((x, y) => x + (+y || 0), 0);
      } catch (e) { return 0; }
    };

    async function subir() {
      const o = snap(), t = Date.now();
      await setDoc(ref(), { datos: o, t: t, v: 1 });
      setMeta({ uid: user.uid, t: t, h: hash(ser(o)) });
      estado(true);
    }
    function bajar(c) {
      limpiar();
      const d = c.datos || {};
      for (const k in d) if (k.indexOf(PREF) === 0 && !SKIP.test(k) && typeof d[k] === "string") localStorage.setItem(k, d[k]);
      setMeta({ uid: user.uid, t: c.t || Date.now(), h: hash(ser(snap())) });
    }

    async function sync(lanzar) {
      if (!user || ocupado) return "igual";
      ocupado = true;
      let res = "igual";
      try {
        const m = getMeta(), o = snap(), h = hash(ser(o)), s = await getDoc(ref()), c = s.exists() ? s.data() : null, cd = (c && c.datos) || {};
        if (m.uid && m.uid !== user.uid) {
          limpiar();
          if (c) bajar(c); else await subir();
          res = "bajado"; location.reload();
        } else if (m.uid !== user.uid) {
          if (c && (vacio(o) || puntos(cd) >= puntos(o))) { bajar(c); res = "bajado"; location.reload(); }
          else { await subir(); res = "subido"; }
        } else if (c && vacio(o) && !vacio(cd)) {
          bajar(c); res = "bajado"; location.reload();
        } else if (!c || h !== m.h) { await subir(); res = "subido"; }
        else if (c.t > m.t) { bajar(c); res = "bajado"; location.reload(); }
        else estado(true);
      } catch (e) { ocupado = false; estado(false, e); if (lanzar) throw e; return "igual"; }
      ocupado = false;
      return res;
    }

    const guardarYa = () => { if (cambios()) sync(); };
    onAuthStateChanged(auth, u => { user = u; if (u) sync(); });
    document.addEventListener("visibilitychange", () => { if (document.hidden) guardarYa(); else sync(); });
    addEventListener("pagehide", guardarYa);
    setInterval(guardarYa, 45000);

    window.IGNube = {
      listo: true,
      sincronizar: () => sync(),
      usuario: () => user,
      async subirYa() {
        for (let i = 0; i < 40 && !user; i++) await dormir(250);
        if (!user) throw new Error("sin-sesion");
        while (ocupado) await dormir(200);
        const r = await sync(true);
        if (r === "bajado") throw new Error("recargando");
      }
    };
  } catch (e) { console.error("[nube]", e); }
})();
</script>
<script>
/* ===== SONIDO AL TOCAR: "Burbuja" (el mismo de toda la app). Respeta el botón de sonido ("ingles_gamer_sonido" = "0" apagado). ===== */
(function () {
  var AC = null;
  function activo() { try { return localStorage.getItem("ingles_gamer_sonido") !== "0"; } catch (e) { return true; } }
  function burbuja() {
    if (!activo()) return;
    try {
      if (!AC) { var C = window.AudioContext || window.webkitAudioContext; if (!C) return; AC = new C(); }
      if (AC.state === "suspended") AC.resume();
      var o = AC.createOscillator(), g = AC.createGain(), t = AC.currentTime;
      o.type = "sine"; o.frequency.setValueAtTime(450, t); o.frequency.exponentialRampToValueAtTime(650, t + 0.056);
      g.gain.setValueAtTime(0.0001, t); g.gain.exponentialRampToValueAtTime(0.07, t + 0.008); g.gain.exponentialRampToValueAtTime(0.0001, t + 0.07);
      o.connect(g); g.connect(AC.destination); o.start(t); o.stop(t + 0.12);
    } catch (e) {}
  }
  /* suena al tocar botones y enlaces; la palabra del día no, porque ya reproduce su propio audio */
  document.addEventListener("click", function (e) {
    var t = e.target && e.target.closest ? e.target : null; if (!t) return;
    if (t.closest("#vocab,[data-sin-sonido]")) return;
    if (t.closest("button,a,[role=button]")) burbuja();
  }, true);
  window.IGBurbuja = burbuja;
})();
</script>
