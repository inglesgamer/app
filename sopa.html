<script>
/* ===== WEB (GitHub Pages): convierte los enlaces go:seccion en seccion.html. En App Creator no hace nada. ===== */
(function(){
  var web = /github\.io$/.test(location.hostname);
  window.igURL = function(u){
    u = String(u);
    if (!web || u.indexOf("go:") !== 0) return u;
    var s = u.slice(3);
    return (s === "inicio" ? "index" : s) + ".html";
  };
  if (!web) return;
  document.addEventListener("click", function(e){
    var a = e.target.closest && e.target.closest('a[href^="go:"]');
    if (a){ e.preventDefault(); location.href = igURL(a.getAttribute("href")); }
  }, true);
})();
</script>

<script>
/* ===== PALETAS: una sola fuente de colores. La elección se guarda en "ingles_gamer_tema". ===== */
var TEMA_KEY = "ingles_gamer_tema";
var PALETAS = {
  noche: { n:"Noche", meta:"#000000", cs:"dark", v:{ "--bg":"#000000","--card":"#141416","--bd":"#2A2A2E","--ink":"#F4F4F5","--mu":"#B8B8C0","--chip":"#222226","--gold":"#FFD166","--hi":"#FFFFFF","--on-hi":"#000000","--track":"#2A2A2E","--toff":"#3A3A40","--nav":"#0E0E10","--av1":"#3A3A40","--av2":"#101012","--ok":"#7BE3A8" } },

  rosa:  { n:"Rosa",  meta:"#FFF1F6", cs:"light", v:{ "--bg":"#FFF1F6","--card":"#FFFFFF","--bd":"#F8D9E5","--ink":"#2B1420","--mu":"#7A5568","--chip":"#FFE3ED","--gold":"#B3245A","--hi":"#D63B7A","--on-hi":"#FFFFFF","--track":"#F8D9E5","--toff":"#EEBFD1","--nav":"#FFFFFF","--av1":"#FFFFFF","--av2":"#F8D9E5","--ok":"#0F7A44" } },
  azul:  { n:"Azul",  meta:"#EFF6FF", cs:"light", v:{ "--bg":"#EFF6FF","--card":"#FFFFFF","--bd":"#D6E6F8","--ink":"#0E1B2B","--mu":"#4F647B","--chip":"#E0EFFD","--gold":"#0B5FB0","--hi":"#1C6FD6","--on-hi":"#FFFFFF","--track":"#D6E6F8","--toff":"#BDD6F0","--nav":"#FFFFFF","--av1":"#FFFFFF","--av2":"#D6E6F8","--ok":"#0F7A44" } }
};
function aplicarTema(id) {
  var p = PALETAS[id] || PALETAS.noche, r = document.documentElement;
  for (var k in p.v) r.style.setProperty(k, p.v[k]);
  r.style.colorScheme = p.cs; r.setAttribute("data-tema", PALETAS[id] ? id : "noche");
  var m = document.querySelector('meta[name="theme-color"]'); if (m) m.setAttribute("content", p.meta);
}
function temaActual() { try { var t = localStorage.getItem(TEMA_KEY); return PALETAS[t] ? t : "noche"; } catch (e) { return "noche"; } }
aplicarTema(temaActual());
window.addEventListener("storage", function (e) { if (e.key === TEMA_KEY) aplicarTema(temaActual()); });
</script>
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@600;700;800;900&display=swap" rel="stylesheet">
<style>
:root{--bg:#000;--card:#141416;--bd:#2A2A2E;--ink:#F4F4F5;--mu:#B8B8C0;--chip:#222226;--gold:#FFD166;--hi:#FFFFFF;--on-hi:#000000;--track:#2A2A2E;--toff:#3A3A40;--nav:#0E0E10;--av1:#3A3A40;--av2:#101012;--ok:#7BE3A8}
*{box-sizing:border-box}
html{height:100%}
body{margin:0;height:100vh;height:100dvh;display:flex;flex-direction:column;overflow:hidden;overscroll-behavior:none;background:var(--bg);color:var(--ink);font-family:Nunito,system-ui,sans-serif}
a{color:inherit;text-decoration:none}
button{font-family:inherit;color:inherit}
a:focus-visible,button:focus-visible{outline:3px solid var(--hi);outline-offset:2px}
.chip{display:flex;align-items:center;gap:6px;height:44px;padding:0 16px;border-radius:99px;border:1px solid var(--bd);background:var(--card);color:var(--gold);font-size:17px;font-weight:900}
.menu-btn{display:flex;align-items:center;justify-content:center;width:44px;height:44px;padding:0;cursor:pointer;border-radius:50%;border:1px solid var(--bd);background:var(--card)}
/* personajes animados */
.oc,.bo,.r1,.r2,.l1,.l2,.rb{opacity:0}
.oc{animation:parp 4s infinite}@keyframes parp{0%,92%,100%{opacity:0}94%,97%{opacity:1}}
.chs{transform-box:fill-box;transform-origin:center;animation:chisp 1s ease-in-out infinite}
@keyframes chisp{0%,100%{transform:scale(.3);opacity:.2}50%{transform:scale(1);opacity:1}}
@keyframes ua{0%{opacity:1}50%{opacity:0}}@keyframes ub{0%{opacity:0}50%{opacity:1}}
.alegre .mov{animation:salta .6s ease-in-out infinite alternate}@keyframes salta{from{transform:translateY(0)}to{transform:translateY(-1px)}}
.alegre .r1,.alegre .l1{animation:ua .6s step-end infinite}.alegre .r2,.alegre .l2{animation:ub .6s step-end infinite}.alegre .bo{animation:ua .3s step-end infinite}
.pienso .cab{animation:ladea 2s ease-in-out infinite alternate}@keyframes ladea{from{transform:translateX(-.15px)}to{transform:translateX(.25px)}}
.pienso .rd{opacity:0}.pienso .r1{animation:ua 1.2s step-end infinite}.pienso .r2{animation:ub 1.2s step-end infinite}
.pienso .q{animation:flota 1.6s ease-in-out infinite alternate}@keyframes flota{from{transform:translateY(0)}to{transform:translateY(-.6px)}}
.carro .mov,.carro .fuera{animation:vibra .12s linear infinite alternate}@keyframes vibra{from{transform:translateY(0)}to{transform:translateY(.15px)}}
.carro .ra{animation:ua .08s step-end infinite}.carro .rb{animation:ub .08s step-end infinite}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}.alegre .r1,.alegre .l1,.pienso .r1{opacity:1}}

.ok-ic{position:relative;width:104px;height:104px;animation:okpop .5s cubic-bezier(.2,1.4,.4,1) both}
.ok-ic svg{display:block;overflow:visible}
.ok-c{fill:color-mix(in srgb,var(--ok) 16%,transparent);stroke:var(--ok);stroke-width:3;stroke-dasharray:145;stroke-dashoffset:145;animation:okdraw .6s .1s ease forwards}
.ok-t{fill:none;stroke:var(--ok);stroke-width:4;stroke-linecap:round;stroke-linejoin:round;stroke-dasharray:40;stroke-dashoffset:40;animation:okdraw .4s .55s ease forwards}
.ok-d{position:absolute;left:50%;top:50%;width:8px;height:8px;margin:-4px;border-radius:50%;background:var(--c);opacity:0;animation:okchispa .9s .6s ease-out forwards}
.fb-done h3{margin:16px 0 4px;font-size:28px;font-weight:900}
.fb-done p{margin:0;max-width:300px;font-size:15px;font-weight:600;line-height:1.45;color:var(--mu)}
.fb-done .fb-send{margin-top:18px}
.spn{width:18px;height:18px;margin-right:8px;border-radius:50%;border:3px solid color-mix(in srgb,var(--on-hi) 30%,transparent);border-top-color:var(--on-hi);animation:giro .7s linear infinite}
@keyframes okpop{from{transform:scale(.4);opacity:0}to{transform:scale(1);opacity:1}}
@keyframes okdraw{to{stroke-dashoffset:0}}
@keyframes okchispa{0%{opacity:1;transform:rotate(var(--a)) translateY(-52px) scale(1)}100%{opacity:0;transform:rotate(var(--a)) translateY(-92px) scale(.4)}}
@media (prefers-reduced-motion:reduce){.ok-c,.ok-t{stroke-dashoffset:0}.ok-d{display:none}}

body{background:var(--bg)}
.app{width:100%;max-width:520px;margin:0 auto;flex:1;min-height:0;display:flex;flex-direction:column;position:relative}
header{flex-shrink:0;display:flex;align-items:center;gap:10px;padding:calc(14px + env(safe-area-inset-top)) 16px 8px}
.menu-btn{flex:none;display:flex;align-items:center;justify-content:center;width:44px;height:44px;padding:0;cursor:pointer;border-radius:50%;border:1px solid var(--bd);background:var(--card);color:var(--ink)}
.hd-tx{flex:1;min-width:0}
.hd-tx small{display:block;font-size:11px;font-weight:900;letter-spacing:.12em;color:var(--mu)}
.hd-tx b{display:block;margin-top:1px;font-size:22px;font-weight:900;line-height:1.1}
header .chip{padding:0 14px;gap:5px}
.fl{display:inline-flex}
main{flex:1;min-height:0;overflow-y:auto;overscroll-behavior:none;padding:6px 16px calc(18px + env(safe-area-inset-bottom));display:flex;flex-direction:column;gap:14px}
main>*{flex-shrink:0}

/* ---- sopa ---- */
.tablero{position:relative;touch-action:none;user-select:none;-webkit-user-select:none}
.g{position:relative;z-index:2;display:grid;grid-template-columns:repeat(var(--n),1fr);grid-auto-rows:1fr;aspect-ratio:1/1}
.g span{display:flex;align-items:center;justify-content:center;font-size:var(--fs,24px);font-weight:900;line-height:1;color:var(--ltr,var(--ink));transition:color .2s}
.g span.ini{color:var(--on-hi);background:var(--gold);border-radius:50%;animation:late .9s ease-in-out infinite}
.g span.hit{color:var(--ok)}
.g span.pop{animation:popL .45s cubic-bezier(.3,1.6,.5,1) both}
.g span.mal{color:#FF4D4D;animation:tiembla .45s ease}
.g span.pista{box-shadow:0 0 0 3px var(--gold);border-radius:50%;animation:late .6s ease-in-out infinite}
@keyframes late{50%{transform:scale(1.15)}}
@keyframes popL{0%{transform:scale(1)}45%{transform:scale(1.45)}100%{transform:scale(1)}}
@keyframes tiembla{20%,60%{transform:translateX(-5px)}40%,80%{transform:translateX(5px)}}
.caps{position:absolute;inset:0;z-index:1;pointer-events:none}
.cap{position:absolute;border-radius:99px;box-sizing:border-box}
.cap.ok{border:3px solid var(--cap,var(--ok));background:color-mix(in srgb,var(--cap,var(--ok)) 20%,transparent);box-shadow:0 0 16px color-mix(in srgb,var(--cap,var(--ok)) 45%,transparent);animation:traza .5s cubic-bezier(.2,.9,.3,1.2) both}
.cap.prev{border:3px solid var(--gold);background:color-mix(in srgb,var(--gold) 22%,transparent)}
@keyframes traza{from{clip-path:inset(0 100% 0 0 round 99px)}to{clip-path:inset(0 0 0 0 round 99px)}}
.chs2{position:absolute;z-index:4;width:8px;height:8px;margin:-4px;border-radius:50%;background:var(--c);pointer-events:none;animation:vuela .8s ease-out both}
@keyframes vuela{from{opacity:1;transform:rotate(var(--a)) translateY(0) scale(1.2)}to{opacity:0;transform:rotate(var(--a)) translateY(-46px) scale(.3)}}
.toast{position:absolute;left:50%;top:-8px;z-index:6;display:flex;align-items:center;gap:6px;padding:8px 16px;border-radius:99px;background:var(--hi);color:var(--on-hi);font-size:16px;font-weight:900;white-space:nowrap;box-shadow:0 10px 30px rgba(0,0,0,.35);pointer-events:none;animation:toast 1.8s ease both}
.toast small{font-size:14px;font-weight:700;opacity:.75}
@keyframes toast{0%{opacity:0;transform:translate(-50%,10px) scale(.7)}14%{opacity:1;transform:translate(-50%,0) scale(1.06)}24%{transform:translate(-50%,0) scale(1)}78%{opacity:1}100%{opacity:0;transform:translate(-50%,-14px)}}

/* ---- palabras: solo texto, con la traducción debajo ---- */
.pal{display:grid;grid-template-columns:1fr 1fr;gap:14px 12px;padding:0 4px}
.w b{position:relative;display:inline-flex;align-items:center;gap:6px;font-size:22px;font-weight:900;line-height:1.1;transition:color .3s}
.w b em{position:relative;font-style:normal}
.w b em::after{content:"";position:absolute;left:-4px;right:-4px;top:55%;height:3px;border-radius:3px;background:var(--ok);transform:scaleX(0);transform-origin:left center}
.w small{display:block;margin-top:2px;font-size:15px;font-weight:700;color:var(--mu)}
.w .tk{display:inline-flex;color:var(--ok);transform:scale(0)}
.w.ok b{color:var(--ok);animation:popL .45s ease}
.w.ok b em::after{animation:tacha .5s .25s cubic-bezier(.3,1.3,.5,1) both}
.w.ok .tk{animation:tkin .4s .65s cubic-bezier(.3,1.6,.5,1) both}
@keyframes tacha{from{transform:scaleX(0)}to{transform:scaleX(1)}}
@keyframes tkin{from{transform:scale(0) rotate(-40deg)}to{transform:scale(1) rotate(0)}}

/* ---- final ---- */
.fin{position:fixed;inset:0;z-index:70;display:flex;align-items:flex-end;justify-content:center;background:rgba(0,0,0,.72);animation:aparece .3s ease}
.fin[hidden]{display:none}
@keyframes aparece{from{opacity:0}to{opacity:1}}
.fin-box{width:100%;max-width:520px;padding:22px 18px calc(20px + env(safe-area-inset-bottom));border-radius:32px 32px 0 0;border:1px solid var(--bd);border-bottom:0;background:var(--card);text-align:center;animation:sube .45s cubic-bezier(.2,1.2,.4,1)}
@keyframes sube{from{transform:translateY(100%)}to{transform:none}}
.fin-box .ok-ic{margin:0 auto}
.fin-box h2{margin:12px 0 4px;font-size:30px;font-weight:900}
.fin-box p{margin:0;font-size:15px;font-weight:700;color:var(--mu)}
.estr{display:flex;justify-content:center;gap:8px;margin-top:14px}
.estr svg{width:42px;height:42px;fill:var(--toff);transform:scale(0);animation:estrella .5s cubic-bezier(.3,1.6,.5,1) both}
.estr svg.on{fill:var(--gold)}
@keyframes estrella{from{transform:scale(0) rotate(-60deg)}to{transform:scale(1) rotate(0)}}
.fin-dat{display:flex;justify-content:center;gap:22px;margin-top:14px;font-size:15px;font-weight:800;color:var(--mu)}
.fin-dat b{display:block;font-size:22px;color:var(--ink)}
.fin-dat .au b{display:inline-flex;align-items:center;gap:4px;color:var(--gold)}
.btn{display:flex;align-items:center;justify-content:center;width:100%;height:56px;margin-top:16px;border:0;border-radius:99px;cursor:pointer;background:var(--hi);color:var(--on-hi);font:900 17px Nunito,sans-serif;box-shadow:0 4px 0 rgba(128,128,128,.35)}
.btn:active{transform:translateY(2px)}
.btn.alt{margin-top:8px;background:transparent;color:var(--ink);box-shadow:none;border:1px solid var(--bd)}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}.estr svg,.w.ok .tk{transform:none}.w.ok b em::after{transform:scaleX(1)}}
/* guardia de internet */
#sinNet{position:fixed;inset:0;z-index:9999;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;padding:24px;text-align:center;background:radial-gradient(circle at 50% 35%,#1E1E22,#000)}
#sinNet[hidden]{display:none}
.sn-pj{width:110px}.sn-pj svg{display:block;width:100%;height:auto;overflow:visible;filter:grayscale(.6);animation:snNod 2.4s ease-in-out infinite alternate}
@keyframes snNod{from{transform:translateY(0)}to{transform:translateY(4px)}}
.sn-t{margin:0;font-size:26px;font-weight:900}
.sn-p{margin:0;max-width:280px;font-size:16px;font-weight:600;line-height:1.45;color:var(--mu)}
.sn-btn{height:50px;padding:0 26px;cursor:pointer;border:0;border-radius:99px;background:#fff;color:#000;font:900 15px Nunito,sans-serif}
.sn-btn:active{transform:translateY(2px)}
.snA,.snB{opacity:0;animation:snT1 1.2s step-end infinite}.snB{animation-name:snT2}
@keyframes snT1{0%{opacity:1}50%{opacity:0}}@keyframes snT2{0%{opacity:0}50%{opacity:1}}
@media (prefers-reduced-motion:reduce){.snA{opacity:1}}


/* ===== diseño C: la cinta ===== */
main{overflow:hidden;gap:10px;padding-bottom:calc(12px + env(safe-area-inset-bottom))}
.zona{flex:1 1 auto;min-height:0;display:flex;align-items:flex-start;justify-content:center}
.zona .tablero{flex:none;margin:0}
.pal{grid-template-columns:repeat(4,minmax(0,1fr));gap:4px 8px;padding:0 2px}
.w b{font-size:15px;gap:3px}
.w small{font-size:12px;margin-top:0}
.w .tk svg{width:13px;height:13px}
.hd-tx small span{color:var(--ink)}
.rondas{display:flex;gap:6px;padding:0 4px}
.rondas i{flex:1;height:6px;border-radius:99px;background:var(--track);transition:background .4s}
.rondas i.hecha{background:var(--lc)}
.rondas i.ahora{background:color-mix(in srgb,var(--lc) 45%,var(--track));animation:late 1.6s ease-in-out infinite}
.cinta{position:relative;margin:0 -16px 4px;padding:8px 16px;transform:rotate(-3deg);background:var(--lc);color:#0B0B0D;box-shadow:0 8px 0 color-mix(in srgb,var(--lc) 45%,#000);display:flex;justify-content:center;gap:8px;flex-wrap:wrap}
.cinta span{display:inline-flex;align-items:center;height:30px;padding:0 11px;border-radius:99px;background:rgba(0,0,0,.14);font-size:14px;font-weight:900;letter-spacing:.08em;color:rgba(0,0,0,.45)}
.cinta span.ok{background:#0B0B0D;color:var(--lc);letter-spacing:.06em;animation:popL .5s cubic-bezier(.3,1.6,.5,1)}
.tablero{--cap:var(--lc)}
.tablero.entra{animation:entra .5s cubic-bezier(.2,1.2,.4,1)}
@keyframes entra{from{opacity:0;transform:scale(.92)}to{opacity:1;transform:none}}
.g span.hit{color:var(--lc)}
.w.ok b{color:var(--lc)}
.w b em::after{background:var(--lc)}
.w .tk{color:var(--lc)}
.w.viejo b,.w.viejo b em::after,.w.viejo .tk{animation:none!important}.w.viejo b em::after{transform:scaleX(1)}.w.viejo .tk{transform:scale(1)}
.toast .nv{margin-left:4px;padding:2px 8px;border-radius:99px;background:#FF4D4D;color:#fff;font-size:10px;letter-spacing:.1em}
.aviso{position:fixed;left:50%;top:calc(80px + env(safe-area-inset-top));z-index:60;transform:translateX(-50%);padding:10px 18px;border-radius:99px;background:var(--hi);color:var(--on-hi);font-size:15px;font-weight:900;white-space:nowrap;box-shadow:0 10px 30px rgba(0,0,0,.4);animation:okpop .35s cubic-bezier(.2,1.4,.4,1) both}

/* entre rondas */
.entre{position:fixed;inset:0;z-index:65;display:flex;align-items:center;justify-content:center;padding:20px;background:rgba(0,0,0,.72);animation:aparece .3s ease}
.entre[hidden]{display:none}
.entre-box{position:relative;width:100%;max-width:360px;padding:26px 20px 20px;border-radius:32px;background:var(--card);border:1px solid var(--bd);text-align:center;animation:okpop .5s cubic-bezier(.2,1.4,.4,1) both}

.entre-sig{margin-top:18px;padding-top:16px;border-top:1px dashed var(--bd)}

.fin-alb{display:flex;align-items:center;justify-content:center;gap:8px;margin-top:14px;font-size:15px;font-weight:700;color:var(--mu)}

.btn svg{margin-right:8px}

<!-- guardia de internet: oculta mientras haya conexión -->
<div id="sinNet" role="alert" aria-live="assertive" hidden>
  <div class="sn-pj" id="snPj"></div>
  <h2 class="sn-t">Sin internet</h2>
  <p class="sn-p">Conéctate al wifi o activa tus datos móviles para seguir jugando.</p>
  <button type="button" class="sn-btn" id="snRe">Reintentar</button>
</div>

<div class="app">
  <header>
    <a class="menu-btn" href="go:inicio" aria-label="Volver al inicio"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 6l-6 6 6 6"></path></svg></a>
    <div class="hd-tx"><small><span id="ronda">RONDA 1 DE 4</span> · <span id="cuenta">0/4</span></small><b id="tema"></b></div>
    <div class="chip" id="chip"></div>
  </header>
  <main>
    <div class="rondas" id="rondas" aria-hidden="true"></div>

    }

    const guardarYa = () => { if (cambios()) sync(); };
    onAuthStateChanged(auth, u => { user = u; if (u) sync(); });
    document.addEventListener("visibilitychange", () => { if (document.hidden) guardarYa(); else sync(); });
    addEventListener("pagehide", guardarYa);
    setInterval(guardarYa, 45000);

    window.IGNube = {
      listo: true,
      sincronizar: () => sync(),
      usuario: () => user,
      async subirYa() {
        for (let i = 0; i < 40 && !user; i++) await dormir(250);
        if (!user) throw new Error("sin-sesion");
        while (ocupado) await dormir(200);
        const r = await sync(true);
        if (r === "bajado") throw new Error("recargando");
      }
    };
  } catch (e) { console.error("[nube]", e); }
})();
</script>
</body>
</html>
