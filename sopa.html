<script>
/* ===== WEB (GitHub Pages): convierte los enlaces go:seccion en seccion.html. En App Creator no hace nada. ===== */
(function(){
  var web = /github\.io$/.test(location.hostname);
  window.igURL = function(u){
    u = String(u);
    if (!web || u.indexOf("go:") !== 0) return u;
    var s = u.slice(3);
    return (s === "inicio" ? "index" : s) + ".html";
  };
  if (!web) return;
  document.addEventListener("click", function(e){
    var a = e.target.closest && e.target.closest('a[href^="go:"]');
    if (a){ e.preventDefault(); location.href = igURL(a.getAttribute("href")); }
  }, true);
})();
</script>

};
function aplicarTema(id) {
  var p = PALETAS[id] || PALETAS.noche, r = document.documentElement;
  for (var k in p.v) r.style.setProperty(k, p.v[k]);
  r.style.colorScheme = p.cs; r.setAttribute("data-tema", PALETAS[id] ? id : "noche");
  var m = document.querySelector('meta[name="theme-color"]'); if (m) m.setAttribute("content", p.meta);
}
function temaActual() { try { var t = localStorage.getItem(TEMA_KEY); return PALETAS[t] ? t : "noche"; } catch (e) { return "noche"; } }

window.addEventListener("storage", function (e) { if (e.key === TEMA_KEY) aplicarTema(temaActual()); });

<style>

/* ---- sopa ---- */
.tablero{position:relative;touch-action:none;user-select:none;-webkit-user-select:none}
.g{position:relative;z-index:2;display:grid;grid-template-columns:repeat(var(--n),1fr);grid-auto-rows:1fr;aspect-ratio:1/1}

.g span.pop{animation:popL .45s cubic-bezier(.3,1.6,.5,1) both}
.g span.mal{color:#FF4D4D;animation:tiembla .45s ease}

.caps{position:absolute;inset:0;z-index:1;pointer-events:none}
.cap{position:absolute;border-radius:99px;box-sizing:border-box}
.cap.ok{border:3px solid var(--cap,var(--ok));background:color-mix(in srgb,var(--cap,var(--ok)) 20%,transparent);box-shadow:0 0 16px color-mix(in srgb,var(--cap,var(--ok)) 45%,transparent);animation:traza .5s cubic-bezier(.2,.9,.3,1.2) both}
.cap.prev{border:3px solid var(--gold);background:color-mix(in srgb,var(--gold) 22%,transparent)}
@keyframes traza{from{clip-path:inset(0 100% 0 0 round 99px)}to{clip-path:inset(0 0 0 0 round 99px)}}

.toast{position:absolute;left:50%;top:-8px;z-index:6;display:flex;align-items:center;gap:6px;padding:8px 16px;border-radius:99px;background:var(--hi);color:var(--on-hi);font-size:16px;font-weight:900;white-space:nowrap;box-shadow:0 10px 30px rgba(0,0,0,.35);pointer-events:none;animation:toast 1.8s ease both}

@keyframes toast{0%{opacity:0;transform:translate(-50%,10px) scale(.7)}14%{opacity:1;transform:translate(-50%,0) scale(1.06)}24%{transform:translate(-50%,0) scale(1)}78%{opacity:1}100%{opacity:0;transform:translate(-50%,-14px)}}

/* ---- palabras: solo texto, con la traducción debajo ---- */
.pal{display:grid;grid-template-columns:1fr 1fr;gap:14px 12px;padding:0 4px}
.w b{position:relative;display:inline-flex;align-items:center;gap:6px;font-size:22px;font-weight:900;line-height:1.1;transition:color .3s}

  const d = $("pjTx"); d.className = "pj-tx " + (tipo || ""); d.innerHTML = html;
  d.classList.remove("in"); void d.offsetWidth; d.classList.add("in");
  $("pjVoz").style.visibility = tipo === "ej" ? "" : "hidden";
}
function pieReposo(id) {
  clearTimeout(P.quieto);
  P.quieto = setTimeout(() => { pj("dormido"); if (PIE === "C") decir('<span class="pj-es">Zzz… ¿seguimos? Busca las que faltan.</span>'); }, 14000);

function pieRonda() {
  P.ej = []; P.ver = -1;

              R.rev >= 4 ? "¡Ojo! Aquí todas van al revés y hay letras trampa." :

  if (P.ver < 0) decir('<span class="pj-es">Casi… prueba en otra dirección. Algunas van al revés.</span>', "mal");

function puntos() {

}
function caminar(x) { if (PIE !== "C") return; const f = $("pjFig"); f.classList.toggle("izq", x < P.x); P.x = x; f.style.left = x + "%"; }
$("pjVoz").addEventListener("click", () => { const p = P.ej[P.ver]; if (p) voz(p[2].replace(/\*/g, "")); });
if ($("pjDots")) $("pjDots").addEventListener("click", e => { const b = e.target.closest("button[data-i]"); if (b && P.ej[+b.dataset.i]) { P.ver = +b.dataset.i; verEjemplo(P.ej[P.ver], false); } });
$("pjFig").addEventListener("click", () => { pj(PIE_SI[Math.floor(Math.random() * PIE_SI.length)]); pieReposo(); });

eventos();
empezar(0);

<!-- ===== GUARDIA DE INTERNET (script aparte: si algo falla arriba, esta guardia sigue funcionando) ===== -->
<script>
(function () {
  var caja = document.getElementById("sinNet");
  if (!caja) return;

  /* personaje triste, llorando bajo una nube (si falla el dibujo, la guardia funciona igual) */
  try {
    PAL.t = "#6EC6FF"; PAL.q = "#A0A0A5";
    var g = BASE.map(function (f) { return f.split(""); });
    [[6,5,6,"s"],[5,5,6,"m"],[6,4,4,"m"],[6,7,7,"m"]].forEach(function (m) { for (var c = m[1]; c <= m[2]; c++) g[m[0]][c] = m[3]; });
    var l = []; g.forEach(function (f, r) { f.forEach(function (k, c) { if (k !== ".") l.push([r, c, k]); }); });
    document.getElementById("snPj").innerHTML = '<svg viewBox="-1 -3 14 19.8" shape-rendering="crispEdges" aria-hidden="true">' + rects(l) +
      '<g class="snA">' + rects([[5,3,"t"],[5,8,"t"],[7,3,"t"]]) + '</g>' +
      '<g class="snB">' + rects([[6,3,"t"],[6,8,"t"],[8,8,"t"]]) + '</g>' +
      rects(solo(-2,-2,3,8,"q").concat(solo(-1,-1,2,9,"q"))) + '</svg>';
  } catch (e) {}

  /* MODO PRUEBA: muestra una franja verde arriba con el estado de la conexión. Cuando termines de probar, déjalo en false. */
  var DEBUG = false;
  var panel = null;
  if (DEBUG) {
    panel = document.createElement("div");
    panel.style.cssText = "position:fixed;left:0;right:0;top:0;z-index:99999;background:#000;color:#0f0;font:11px monospace;padding:4px 6px;pointer-events:none";
    panel.textContent = "guardia v2 cargada...";
    document.body.appendChild(panel);
  }

  /* sondas de conexión: si una está bloqueada en la red del usuario, se prueba la otra.
     Solo cuenta como "hay internet" una respuesta de tipo opaque (la que da una petición real a otro sitio). */
  var SONDAS = ["https://clients3.google.com/generate_204", "https://www.gstatic.com/generate_204"];
  var fallos = 0, revisando = false, info = "";

  function probar(url) {
    return new Promise(function (res) {
      var c = new AbortController(), t = setTimeout(function () { c.abort(); }, 4000);
      fetch(url + "?t=" + Date.now(), { mode: "no-cors", cache: "no-store", signal: c.signal })
        .then(function (r) { clearTimeout(t); res(r.type); })
        .catch(function () { clearTimeout(t); res("falla"); });
    });
  }
  async function hayInternet() {
    var partes = ["onLine=" + navigator.onLine], ok = false;
    if (navigator.onLine) {
      for (var i = 0; i < SONDAS.length; i++) {
        var tipo = await probar(SONDAS[i]);
        partes.push("sonda" + (i + 1) + "=" + tipo);
        if (tipo === "opaque") { ok = true; break; }
      }
    }
    info = partes.join(" · ");
    return ok;
  }
  async function revisar() {
    if (revisando) return; revisando = true;
    var ok = await hayInternet();
    fallos = ok ? 0 : fallos + 1;
    /* sin conexión (modo avión) bloquea al instante; con wifi sin internet espera 2 fallos seguidos */
    caja.hidden = !(navigator.onLine === false || fallos >= 2);
    if (panel) panel.textContent = "guardia v2 · " + info + " · fallos=" + fallos + " · pantalla=" + (caja.hidden ? "oculta" : "VISIBLE");
    revisando = false;
    if (!ok && fallos < 2) setTimeout(revisar, 2000);
  }

  document.getElementById("snRe").addEventListener("click", revisar);
  addEventListener("online", revisar);
  addEventListener("offline", revisar);
  addEventListener("pageshow", revisar);
  document.addEventListener("visibilitychange", function () { if (!document.hidden) revisar(); });
  setInterval(revisar, 15000);
  revisar();
})();
</script>

<script type="module">

import { getFirestore, doc, getDoc, setDoc } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

const CONFIG = {
  apiKey: "AIzaSyDrBReVK9v1ioWfBIyMCnvtuUgbbWPcxTE",
  authDomain: "inglesgamer-5a3a9.firebaseapp.com",
  projectId: "inglesgamer-5a3a9",
  storageBucket: "inglesgamer-5a3a9.firebasestorage.app",
  messagingSenderId: "599532765222",
  appId: "1:599532765222:web:38fe3a7348b3c38e3426e7"
};

(function () {
  try {
    const PREF = "ingles_gamer_", META = "ig_nube_meta";
    const SKIP = /_(sesion|tema|sonido|buzon|buzon_pausa|acceso_modo)$/;
    const app = getApps().length ? getApp() : initializeApp(CONFIG);
    const auth = getAuth(app), db = getFirestore(app);
    let user = null, ocupado = false;

    const dormir = ms => new Promise(r => setTimeout(r, ms));
    const estado = (ok, e) => { try { localStorage.setItem("ig_nube_estado", JSON.stringify({ ok: !!ok, t: Date.now(), c: ok ? "" : String((e && (e.code || e.message)) || "error") })); } catch (x) {} };
    const ref = () => doc(db, "progreso", user.uid);
    const claves = () => { const k = []; try { for (let i = 0; i < localStorage.length; i++) { const n = localStorage.key(i); if (n.indexOf(PREF) === 0 && !SKIP.test(n)) k.push(n); } } catch (e) {} return k; };
    const snap = () => { const o = {}; claves().forEach(k => { o[k] = localStorage.getItem(k); }); return o; };
    const ser = o => JSON.stringify(Object.keys(o).sort().map(k => [k, o[k]]));
    const hash = s => { let h = 5381; for (let i = 0; i < s.length; i++) h = ((h << 5) + h + s.charCodeAt(i)) | 0; return h; };
    const getMeta = () => { try { return JSON.parse(localStorage.getItem(META)) || {}; } catch (e) { return {}; } };
    const setMeta = m => { try { localStorage.setItem(META, JSON.stringify(m)); } catch (e) {} };
    /* CORREGIDO: "vacío" = sin progreso real (solo el apodo/perfil no cuenta) */
    const vacio = o => !o || !(o.ingles_gamer_a1_repaso || o.ingles_gamer_aura || o.ingles_gamer_tienda);
    const limpiar = () => claves().forEach(k => localStorage.removeItem(k));
    const cambios = () => !!user && getMeta().uid === user.uid && hash(ser(snap())) !== getMeta().h;
    const puntos = d => {
      try {
        const a = JSON.parse(d.ingles_gamer_aura || "null") || {}, r = JSON.parse(d.ingles_gamer_a1_repaso || "null") || {};
        return (+a.t || 0) + Object.values(r.est || {}).reduce((x, y) => x + (+y || 0), 0);
      } catch (e) { return 0; }
    };

    async function subir() {
      const o = snap(), t = Date.now();
      await setDoc(ref(), { datos: o, t: t, v: 1 });
      setMeta({ uid: user.uid, t: t, h: hash(ser(o)) });
      estado(true);
    }
    function bajar(c) {
      limpiar();
      const d = c.datos || {};
      for (const k in d) if (k.indexOf(PREF) === 0 && !SKIP.test(k) && typeof d[k] === "string") localStorage.setItem(k, d[k]);
      setMeta({ uid: user.uid, t: c.t || Date.now(), h: hash(ser(snap())) });
    }

    async function sync(lanzar) {
      if (!user || ocupado) return "igual";
      ocupado = true;
      let res = "igual";
      try {
        const m = getMeta(), o = snap(), h = hash(ser(o)), s = await getDoc(ref()), c = s.exists() ? s.data() : null, cd = (c && c.datos) || {};
        if (m.uid && m.uid !== user.uid) {
          limpiar();
          if (c) bajar(c); else await subir();
          res = "bajado"; location.reload();
        } else if (m.uid !== user.uid) {
          if (c && (vacio(o) || puntos(cd) >= puntos(o))) { bajar(c); res = "bajado"; location.reload(); }
          else { await subir(); res = "subido"; }
        } else if (c && vacio(o) && !vacio(cd)) {
          bajar(c); res = "bajado"; location.reload();
        } else if (!c || h !== m.h) { await subir(); res = "subido"; }
        else if (c.t > m.t) { bajar(c); res = "bajado"; location.reload(); }
        else estado(true);
      } catch (e) { ocupado = false; estado(false, e); if (lanzar) throw e; return "igual"; }
      ocupado = false;
      return res;
    }

    const guardarYa = () => { if (cambios()) sync(); };
    onAuthStateChanged(auth, u => { user = u; if (u) sync(); });
    document.addEventListener("visibilitychange", () => { if (document.hidden) guardarYa(); else sync(); });
    addEventListener("pagehide", guardarYa);
    setInterval(guardarYa, 45000);

    window.IGNube = {
      listo: true,
      sincronizar: () => sync(),
      usuario: () => user,
      async subirYa() {
        for (let i = 0; i < 40 && !user; i++) await dormir(250);
        if (!user) throw new Error("sin-sesion");
        while (ocupado) await dormir(200);
        const r = await sync(true);
        if (r === "bajado") throw new Error("recargando");
      }
    };
  } catch (e) { console.error("[nube]", e); }
})();
</script>
