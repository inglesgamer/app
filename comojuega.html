<script>
/* ===== WEB (GitHub Pages): convierte los enlaces go:seccion en seccion.html. En App Creator no hace nada. ===== */
(function(){
  var web = /github\.io$/.test(location.hostname);
  window.igURL = function(u){
    u = String(u);
    if (!web || u.indexOf("go:") !== 0) return u;
    var s = u.slice(3);
    return (s === "inicio" ? "index" : s) + ".html";
  };
  if (!web) return;
  document.addEventListener("click", function(e){
    var a = e.target.closest && e.target.closest('a[href^="go:"]');
    if (a){ e.preventDefault(); location.href = igURL(a.getAttribute("href")); }
  }, true);
})();
</script>

function aplicarTema(id) {
  var p = PALETAS[id] || PALETAS.noche, r = document.documentElement;
  for (var k in p.v) r.style.setProperty(k, p.v[k]);
  r.style.colorScheme = p.cs; r.setAttribute("data-tema", PALETAS[id] ? id : "noche");

window.addEventListener("storage", function (e) { if (e.key === TEMA_KEY) aplicarTema(temaActual()); });

<style>
:root{--bg:#000;--card:#141416;--bd:#2A2A2E;--ink:#F4F4F5;--mu:#B8B8C0;--chip:#222226;--gold:#FFD166;--hi:#FFFFFF;--on-hi:#000000;--track:#2A2A2E;--toff:#3A3A40;--nav:#0E0E10;--av1:#3A3A40;--av2:#101012;--ok:#7BE3A8}
*{box-sizing:border-box}
html{height:100%}
body{margin:0;height:100vh;height:100dvh;display:flex;flex-direction:column;overflow:hidden;overscroll-behavior:none;background:var(--bg);color:var(--ink);font-family:Nunito,system-ui,sans-serif}
a{color:inherit;text-decoration:none}
button{font-family:inherit;color:inherit}
a:focus-visible,button:focus-visible{outline:3px solid var(--hi);outline-offset:2px}
.app{width:100%;max-width:520px;margin:0 auto;flex:1;min-height:0;display:flex;flex-direction:column}
header{flex-shrink:0;display:flex;align-items:center;gap:12px;padding:calc(14px + env(safe-area-inset-top)) 16px 10px}
.logo{flex:1;min-width:0;margin:0;font-size:clamp(20px,6.2vw,26px);font-weight:900;letter-spacing:-.01em;white-space:nowrap;overflow:hidden}.logo span{opacity:.55}
.menu-btn{display:flex;align-items:center;justify-content:center;width:44px;height:44px;padding:0;cursor:pointer;border-radius:50%;border:1px solid var(--bd);background:var(--card)}
main{flex:1;min-height:0;overflow-y:auto;overscroll-behavior:none;padding:6px 16px 22px;display:flex;flex-direction:column;gap:14px}
main>*{flex-shrink:0}
.card{background:var(--card);border:1px solid var(--bd);border-radius:28px}
.sr{display:inline-flex;gap:3px}.sr svg{display:block}.sr .f{fill:var(--hi)}.sr .e{fill:var(--toff)}

/* paso: personaje + título + texto */
.paso{padding:14px}
.paso-h{display:flex;align-items:center;gap:14px}
.st{flex:none;width:104px;height:104px;padding:4px;display:flex;align-items:flex-end;justify-content:center;overflow:hidden;border-radius:28px;border:1px solid var(--bd);background:radial-gradient(circle at 50% 30%,var(--av1),var(--av2))}
.st svg{display:block;width:100%;height:100%;overflow:visible}
.num{display:block;font-size:11px;font-weight:900;letter-spacing:.12em;color:var(--mu)}
.paso h2{margin:3px 0 0;font-size:23px;font-weight:900;line-height:1.15}
.paso p{margin:14px 2px 0;font-size:15px;font-weight:600;line-height:1.5;color:var(--mu)}
.paso p b{color:var(--ink)}
.extra{margin-top:14px}
.tip{display:flex;gap:8px;align-items:flex-start;margin-top:14px;padding:10px 14px;border-radius:18px;background:var(--chip);font-size:13px;font-weight:800;line-height:1.35}
.tip svg{flex:none;margin-top:1px;color:var(--gold)}

/* bienvenida (más grande) */
.hero{padding:18px 16px;text-align:center}
.hero .st{width:132px;height:132px;margin:0 auto 12px}
.hero h2{margin:0;font-size:26px;font-weight:900}
.hero p{margin:8px auto 0;max-width:380px;font-size:15px;font-weight:600;line-height:1.5;color:var(--mu)}

/* mini ejemplos */
.filas{display:flex;flex-direction:column;gap:8px}
.fila{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:10px 14px;border-radius:18px;background:var(--chip);font-size:14px;font-weight:800}
.fila small{font-size:12px;font-weight:700;color:var(--mu)}
.rangos{display:flex;flex-wrap:wrap;gap:8px}
.rk{display:inline-flex;align-items:center;gap:6px;padding:4px 12px 4px 8px;border-radius:99px;background:var(--hi);color:var(--on-hi);font-size:12px;font-weight:900;letter-spacing:.06em}
.rk svg{display:block}
.rc-days{display:grid;grid-template-columns:repeat(7,1fr);gap:6px;max-width:300px}
.rc-d{display:flex;flex-direction:column;align-items:center;gap:5px;font-size:11px;font-weight:800;color:var(--mu)}
.rc-d i{display:block;width:100%;max-width:28px;height:38px;border-radius:99px;background:var(--track)}
.rc-d.on i{background:var(--hi)}.rc-d.hoy span{color:var(--ink)}.rc-d.hoy i{outline:2px solid var(--hi);outline-offset:2px}
.tema-op{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.tm{height:48px;display:flex;align-items:center;justify-content:center;gap:8px;cursor:pointer;border-radius:16px;border:1px solid var(--bd);background:var(--chip);color:var(--ink);font:800 14px Nunito,sans-serif}
.tm.on{background:var(--hi);border-color:var(--hi);color:var(--on-hi)}

/* resumen y botón */
.res{padding:18px 16px}
.res h2{margin:0 0 12px;font-size:20px;font-weight:900}
.res ol{margin:0;padding:0;list-style:none;counter-reset:n;display:flex;flex-direction:column;gap:10px}
.res li{counter-increment:n;display:flex;align-items:center;gap:12px;font-size:15px;font-weight:700;line-height:1.35}
.res li::before{content:counter(n);flex:none;width:32px;height:32px;display:flex;align-items:center;justify-content:center;border-radius:50%;background:var(--hi);color:var(--on-hi);font-size:15px;font-weight:900}
.cta{display:flex;align-items:center;justify-content:center;gap:10px;height:60px;border-radius:99px;background:var(--hi);color:var(--on-hi);font-size:18px;font-weight:900;box-shadow:0 4px 0 rgba(128,128,128,.35)}
.cta:active{transform:translateY(2px)}

/* nav */
nav{flex-shrink:0;background:var(--nav);border-radius:28px 28px 0 0;border-top:1px solid var(--bd)}
nav .inner{max-width:520px;margin:0 auto;display:flex;padding:8px 6px max(12px,env(safe-area-inset-bottom))}
nav a{flex:1;min-width:0;min-height:56px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;color:var(--mu);font-size:11px;font-weight:700}

/* ================= PERSONAJES ANIMADOS ================= */
.oc,.bo,.r1,.r2,.l1,.l2{opacity:0}
.oc{animation:parp 4s infinite}
@keyframes parp{0%,92%,100%{opacity:0}94%,97%{opacity:1}}
.sp{transform-box:fill-box;transform-origin:center;animation:brilla 1s ease-in-out infinite}
@keyframes brilla{0%,100%{transform:scale(.3);opacity:.2}50%{transform:scale(1);opacity:1}}
@keyframes ua{0%{opacity:1}50%{opacity:0}}
@keyframes ub{0%{opacity:0}50%{opacity:1}}
@keyframes salta{from{transform:translateY(0)}to{transform:translateY(-1px)}}
@keyframes tiembla{from{transform:translateX(-.1px)}to{transform:translateX(.1px)}}
@keyframes vibra{from{transform:translateY(0)}to{transform:translateY(.15px)}}
@keyframes ladea{from{transform:translateX(-.15px)}to{transform:translateX(.25px)}}
@keyframes flota{from{transform:translateY(0)}to{transform:translateY(-.6px)}}
@keyframes galopa{from{transform:translateY(0)}to{transform:translateY(-.5px)}}
@keyframes wink{0%{opacity:0}60%{opacity:1}70%{opacity:0}100%{opacity:0}}
@keyframes sube2{0%{transform:translateY(0);opacity:0}15%{opacity:1}100%{transform:translateY(-3px);opacity:0}}
@keyframes cae2{0%{transform:translateY(-1px);opacity:0}15%{opacity:1}100%{transform:translateY(14px);opacity:0}}
@keyframes late{from{opacity:.15}to{opacity:.5}}
@keyframes tA{0%{opacity:1}33%{opacity:0}100%{opacity:0}}
@keyframes tB{0%{opacity:0}33%{opacity:1}66%{opacity:0}100%{opacity:0}}
.gu,.gl{opacity:0}
.cor{opacity:0;animation:sube2 2.4s linear infinite}
.q{animation:flota 1.6s ease-in-out infinite alternate}
.nieve{opacity:0;animation:cae2 2.2s linear infinite}
.rojo,.vena{animation:late 1s ease-in-out infinite alternate}
.rojo{opacity:.15}
.tA,.tB{opacity:0;animation:tA 1.8s step-end infinite}
.tB{animation-name:tB}
.m1{animation:ua .2s step-end infinite}.m2{opacity:0;animation:ub .2s step-end infinite}
.b1{animation:ua .5s step-end infinite}.b2{opacity:0;animation:ub .5s step-end infinite}
/* saludar */
.saludo .mov{animation:resp 2.4s ease-in-out infinite}
@keyframes resp{0%,100%{transform:translateY(0)}50%{transform:translateY(-.25px)}}
.saludo .rd{animation:sd 7s step-end infinite}
.saludo .r1{animation:s1 7s step-end infinite}
.saludo .r2{animation:s2 7s step-end infinite}
.saludo .bo{animation:sb 7s step-end infinite}
@keyframes sd{0%{opacity:1}10%{opacity:0}50%{opacity:1}100%{opacity:1}}
@keyframes s1{0%{opacity:0}10%{opacity:1}15%{opacity:0}20%{opacity:1}25%{opacity:0}30%{opacity:1}35%{opacity:0}40%{opacity:1}45%{opacity:0}100%{opacity:0}}
@keyframes s2{0%{opacity:0}15%{opacity:1}20%{opacity:0}25%{opacity:1}30%{opacity:0}35%{opacity:1}40%{opacity:0}45%{opacity:1}50%{opacity:0}100%{opacity:0}}
@keyframes sb{0%{opacity:0}10%{opacity:1}13%{opacity:0}15%{opacity:1}18%{opacity:0}20%{opacity:1}23%{opacity:0}25%{opacity:1}28%{opacity:0}30%{opacity:1}33%{opacity:0}35%{opacity:1}38%{opacity:0}40%{opacity:1}43%{opacity:0}45%{opacity:1}48%{opacity:0}100%{opacity:0}}
/* pensando */
.pienso .cab{animation:ladea 2s ease-in-out infinite alternate}
.pienso .rd{opacity:0}
.pienso .r1{animation:ua 1.2s step-end infinite}
.pienso .r2{animation:ub 1.2s step-end infinite}
/* ¡ups! */
.ups .mov{animation:tiembla .1s linear infinite alternate}
.ups .rd,.ups .ld{opacity:0}
.ups .r1,.ups .l1{opacity:1}
/* baile */
.baile .mov{animation:salta .3s ease-in-out infinite alternate}
.baile .rd{animation:ub .6s step-end infinite}
.baile .r1{animation:ua .6s step-end infinite}
.baile .ld{animation:ua .6s step-end infinite}
.baile .l1{animation:ub .6s step-end infinite}
/* caballo */
.caballo .mov,.caballo .atras,.caballo .fuera{animation:galopa .35s ease-in-out infinite alternate}
.caballo .hA{animation:ua .35s step-end infinite}
.caballo .hB{animation:ub .35s step-end infinite}
/* cool */
.cool .oc{animation:none}
.cool .rd{opacity:0}
.cool .r1{animation:ua 3s step-end infinite}.cool .r2{animation:ub 3s step-end infinite}
.cool .gu{animation:wink 3s step-end infinite}
/* idea */
.idea .mov{animation:salta .5s ease-in-out infinite alternate}
.idea .rd{opacity:0}
.idea .r1{animation:ua .5s step-end infinite}.idea .r2{animation:ub .5s step-end infinite}
/* héroes y retos */
@keyframes hd{0%{opacity:1}10%{opacity:0}100%{opacity:0}}
@keyframes h2{0%{opacity:0}10%{opacity:1}25%{opacity:0}100%{opacity:0}}
@keyframes h1{0%{opacity:0}25%{opacity:1}100%{opacity:1}}
.heroe .rd{animation:hd 5s step-end infinite}
.heroe .r2{animation:h2 5s step-end infinite}
.heroe .r1{animation:h1 5s step-end infinite}
.heroe .gu{animation:h1 5s step-end infinite}
.ejer .mov{animation:vibra .1s linear infinite alternate}
.ejer .rd,.ejer .ld{opacity:0}
.ejer .r1,.ejer .l1{animation:ua .8s step-end infinite}
.ejer .r2,.ejer .l2{animation:ub .8s step-end infinite}
.copa .mov{animation:salta .4s ease-in-out infinite alternate}
.copa .rd,.copa .ld{opacity:0}
.copa .r1,.copa .l2{animation:ua .4s step-end infinite}
.copa .r2,.copa .l1{animation:ub .4s step-end infinite}
.super .mov{animation:salta 1s ease-in-out infinite alternate}
.super .cab{animation:tiembla .06s linear infinite alternate}
.super .oc{animation:none}
.super .bo{animation:ua .3s step-end infinite}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}.cor{opacity:1}.rojo{opacity:.3}}
</style>

<script>

const NIVELES_TOTAL = 20;        // niveles del Mapa
/* Igual que en Inicio y Perfil: m = estrellas mínimas para llegar a ese rango */

const BASE = [
"...kkkkkk...","..kkkkkkkk..","..kwwwwwwk..","..hhhhhhhh..","..hwessewh..","..ssssssss..","..sssmmsss..",
"ggggqllqgggg","ggggqllqgggg","ggggzllzgggg","gggggllggggg","llgggllgggll","ssgggllgggss","ssppppppppss",
"..ppp..ppp..","..fff..fff.."
];
const PAL = { k:"#151518", w:"#F2F4F8", h:"#8A5A33", e:"#3A2414", s:"#F2B98F", m:"#B8704F", M:"#7A1F1F", g:"#5A5A5E", l:"#C4C4C8", q:"#A0A0A5", z:"#0B0B0D", p:"#1A1A1E", f:"#F2F4F8", W:"#FFFFFF", r:"#FF8FA3", t:"#6EC6FF", v:"#FF2D2D", S:"#E3A67C", H:"#FF4D8D", y:"#FFC83D", R:"#E5322B", N:"#2B1B12", B:"#8B5A2B", b:"#5E3E22", C:"#C98F6B", U:"#2E86DE", O:"#FF8A3D", T:"#FF6B5E", G:"#44444A", c:"#3FD8C8" };
const solo = (r1, r2, c1, c2, k) => { const o = []; for (let r = r1; r <= r2; r++) for (let c = c1; c <= c2; c++) o.push([r, c, k]); return o; };
const rects = l => l.map(x => '<rect x="' + x[1] + '" y="' + x[0] + '" width="1" height="1" fill="' + PAL[x[2]] + '"></rect>').join("");
const arriba = (lado, top) => { const a = lado === "R" ? 10 : 0; return solo(top, top + 1, a, a + 1, "s").concat(solo(top + 2, top + 2, a, a + 1, "l"), solo(top + 3, 8, a, a + 1, "g")); };
const lado = top => solo(top, top + 1, 11, 12, "s").concat(solo(top + 2, top + 2, 11, 12, "l"), solo(top + 3, 8, 10, 11, "g"));
const cara = () => solo(4, 5, 9, 10, "s").concat(solo(6, 6, 10, 11, "l"), solo(7, 8, 10, 11, "g"));
const chispa = (x, y, d) => '<g class="sp" style="animation-delay:' + d + 's"><rect x="' + (x + 1) + '" y="' + y + '" width="1" height="3" fill="#FFC83D"></rect><rect x="' + x + '" y="' + (y + 1) + '" width="3" height="1" fill="#FFC83D"></rect></g>';

const nota = (x, y, d) => '<g class="cor" style="animation-delay:' + d + 's">' + rects([[y,x+1,"y"],[y+1,x+1,"y"],[y+2,x,"y"],[y+2,x+1,"y"]]) + '</g>';

const bombilla = '<g class="b1">' + rects(solo(-3, -2, 4, 6, "y").concat([[-1,5,"q"]])) + '</g><g class="b2">' + rects(solo(-3, -2, 4, 6, "W").concat([[-1,5,"q"],[-3,3,"y"],[-3,7,"y"],[-2,2,"y"],[-2,8,"y"]])) + '</g>';
const barra = y => solo(y, y, -1, 12, "q").concat(solo(y - 2, y + 2, -1, -1, "z"), solo(y - 2, y + 2, 12, 12, "z"));

function dibujar(id) {
  const a = ACCIONES[id];
  const g = BASE.map(f => f.split(""));
  a.mod.forEach(m => { for (let c = m[1]; c <= m[2]; c++) g[m[0]][c] = m[3]; });
  const cab = [], cue = [], rd = [], ld = [];
  g.forEach((fila, r) => fila.forEach((k, c) => {
    if (k === ".") return;
    const x = [r, c, k];
    if (r <= 6) cab.push(x); else if (r <= 13 && c >= 10) rd.push(x); else if (r <= 13 && c <= 1) ld.push(x); else cue.push(x);
  }));
  const ojos = [[4,3,"e"],[4,4,"e"],[4,7,"e"],[4,8,"e"]];
  return '<svg class="' + id + '" viewBox="' + (a.vb || "-1 -2 14 18.8") + '" shape-rendering="crispEdges" role="img" aria-label="' + a.n + '">' +
    '<rect x="2" y="' + (a.sy || 16) + '" width="8" height=".6" fill="#000" opacity=".4"></rect><g class="atras">' + (a.atras || "") + '</g>' +
    '<g class="mov">' + rects(cue) +
    '<g class="cab">' + rects(cab) + '<g class="oc">' + rects(ojos) + '</g><g class="bo">' + rects(a.bo) + '</g>' + (a.extra || "") + '</g>' +
    '<g class="ld">' + rects(ld) + '</g><g class="l1">' + rects(a.l1 || []) + '</g><g class="l2">' + rects(a.l2 || []) + '</g>' +
    '<g class="rd">' + rects(rd) + '</g><g class="r1">' + rects(a.r1 || []) + '</g><g class="r2">' + rects(a.r2 || []) + '</g>' +
    '</g><g class="fuera">' + (a.fuera || "") + '</g></svg>';
}

function escudo(c, s) {
  const col = { b:c, f:"#1E1E24", s:"#F2F4F8" };
  let o = '<svg width="' + s + '" height="' + s + '" viewBox="0 0 8 8" shape-rendering="crispEdges" aria-hidden="true">';
  ESCUDO.forEach((row, y) => row.split("").forEach((ch, x) => { if (ch !== ".") o += '<rect x="' + x + '" y="' + y + '" width="1" height="1" fill="' + col[ch] + '"></rect>'; }));
  return o + "</svg>";
}

/* selector de apariencia (funciona de verdad) */
function pintarTema() {
  const cont = $("temaOp"); if (!cont) return;
  const act = temaActual();
  cont.innerHTML = Object.keys(PALETAS).map(id => '<button type="button" class="tm' + (id === act ? " on" : "") + '" data-tema="' + id + '" aria-pressed="' + (id === act) + '">' + svg(ICO_TEMA[id] || "", 20) + PALETAS[id].n + '</button>').join("");
}
pintarTema();
$("main").addEventListener("click", e => {
  const b = e.target.closest(".tm"); if (!b) return;
  try { localStorage.setItem(TEMA_KEY, b.dataset.tema); } catch (x) {}
  aplicarTema(b.dataset.tema); pintarTema();
});
window.addEventListener("storage", e => { if (e.key === TEMA_KEY) pintarTema(); });
