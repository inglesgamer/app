<!DOCTYPE html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Sonidos · correcto e incorrecto</title><link href="https://fonts.googleapis.com/css2?family=Nunito:wght@700;800;900&display=swap" rel="stylesheet">
<script>var TEMA_KEY = "ingles_gamer_tema";
var PALETAS = {
  noche: { n:"Noche", meta:"#000000", cs:"dark", v:{ "--bg":"#000000","--card":"#141416","--bd":"#2A2A2E","--ink":"#F4F4F5","--mu":"#B8B8C0","--chip":"#222226","--gold":"#FFD166","--hi":"#FFFFFF","--on-hi":"#000000","--track":"#2A2A2E","--toff":"#3A3A40","--nav":"#0E0E10","--av1":"#3A3A40","--av2":"#101012","--ok":"#7BE3A8" } },
  dia:   { n:"Día",   meta:"#F4F4F5", cs:"light", v:{ "--bg":"#F4F4F5","--card":"#FFFFFF","--bd":"#E4E4E7","--ink":"#0B0B0D","--mu":"#5C666B","--chip":"#EFEFF1","--gold":"#9A6000","--hi":"#0B0B0D","--on-hi":"#FFFFFF","--track":"#E4E4E7","--toff":"#D4D4D8","--nav":"#FFFFFF","--av1":"#FFFFFF","--av2":"#E4E4E7","--ok":"#0F7A44" } },
  rosa:  { n:"Rosa",  meta:"#FFF1F6", cs:"light", v:{ "--bg":"#FFF1F6","--card":"#FFFFFF","--bd":"#F8D9E5","--ink":"#2B1420","--mu":"#7A5568","--chip":"#FFE3ED","--gold":"#B3245A","--hi":"#D63B7A","--on-hi":"#FFFFFF","--track":"#F8D9E5","--toff":"#EEBFD1","--nav":"#FFFFFF","--av1":"#FFFFFF","--av2":"#F8D9E5","--ok":"#0F7A44" } },
  azul:  { n:"Azul",  meta:"#EFF6FF", cs:"light", v:{ "--bg":"#EFF6FF","--card":"#FFFFFF","--bd":"#D6E6F8","--ink":"#0E1B2B","--mu":"#4F647B","--chip":"#E0EFFD","--gold":"#0B5FB0","--hi":"#1C6FD6","--on-hi":"#FFFFFF","--track":"#D6E6F8","--toff":"#BDD6F0","--nav":"#FFFFFF","--av1":"#FFFFFF","--av2":"#D6E6F8","--ok":"#0F7A44" } }
};
function aplicarTema(id) {
  var p = PALETAS[id] || PALETAS.noche, r = document.documentElement;
  for (var k in p.v) r.style.setProperty(k, p.v[k]);
  r.style.colorScheme = p.cs; r.setAttribute("data-tema", PALETAS[id] ? id : "noche");
  var m = document.querySelector('meta[name="theme-color"]'); if (m) m.setAttribute("content", p.meta);
}

aplicarTema((function () { try { return localStorage.getItem(TEMA_KEY) || "noche"; } catch (e) { return "noche"; } })());
</script>
<style>
*{box-sizing:border-box}html,body{margin:0;background:var(--bg);color:var(--ink);font-family:Nunito,system-ui,sans-serif}
.wrap{max-width:480px;margin:0 auto;padding:16px 14px 40px}
h1{font-size:22px;margin:4px 0}p.s{margin:0 0 14px;color:var(--mu);font-weight:700;font-size:14px;line-height:1.4}
.op{margin-bottom:12px;padding:14px;border-radius:22px;background:var(--card);border:2px solid var(--bd)}
.op.act{border-color:var(--hi)}
.op h2{display:flex;align-items:center;gap:10px;margin:0 0 2px;font-size:18px}.op h2 i{font-style:normal;width:34px;height:34px;border-radius:50%;background:var(--hi);color:var(--on-hi);display:flex;align-items:center;justify-content:center;font-size:16px}
.op p{margin:0 0 10px 44px;color:var(--mu);font-size:13px;font-weight:700}
.bt{display:flex;gap:8px}
.bt button{flex:1;display:flex;flex-direction:column;align-items:center;gap:4px;padding:10px 4px;border-radius:16px;border:0;font:900 13px Nunito,sans-serif;cursor:pointer;box-shadow:0 4px 0 rgba(0,0,0,.25)}
.bt button:active{transform:translateY(3px);box-shadow:0 1px 0 rgba(0,0,0,.25)}
.ok{background:#3FC46A;color:#06290F}.ok3{background:#2E9E52;color:#fff}.no{background:#E5484D;color:#fff}
.tabs{position:sticky;top:0;z-index:5;display:flex;gap:6px;padding:8px 0;background:var(--bg)}
.tabs button{flex:1;padding:8px 0;border-radius:14px;border:2px solid var(--bd);background:var(--card);color:var(--ink);font:800 13px Nunito,sans-serif}
.tabs button.on{background:var(--hi);color:var(--on-hi);border-color:var(--hi)}
.nota{margin-top:14px;padding:12px;border-radius:16px;background:var(--chip);font-size:13px;font-weight:700;color:var(--mu)}
</style></head><body><div class="wrap">
<h1>Sonidos de correcto e incorrecto</h1>
<p class="s">Sube el volumen y quita el modo silencio. Toca cada botón. «3 seguidas» es como suena cuando aciertas varias seguidas (va subiendo).</p>
<div class="tabs" id="pals"></div>
<div id="ops"></div>
<p class="nota">El «0» es el sonido que tiene la app ahora, para comparar. Puedes elegir el correcto de uno y el incorrecto de otro.</p>
</div>
<script>
let AC = null, M = null;
function ac() { if (!AC) { AC = new (window.AudioContext || window.webkitAudioContext)(); M = AC.createGain(); M.gain.value = .9; M.connect(AC.destination); } if (AC.state === "suspended") AC.resume(); return AC; }
const T = () => ac().currentTime + .02;
/* tono simple con envolvente */
function tono(f, t, d, v, tipo, f2) { const a = ac(), o = a.createOscillator(), g = a.createGain(), t0 = T() + t;
  o.type = tipo || "sine"; o.frequency.setValueAtTime(f, t0); if (f2) o.frequency.exponentialRampToValueAtTime(f2, t0 + d);
  g.gain.setValueAtTime(.0001, t0); g.gain.exponentialRampToValueAtTime(v || .1, t0 + .012); g.gain.exponentialRampToValueAtTime(.0001, t0 + d);
  o.connect(g).connect(M); o.start(t0); o.stop(t0 + d + .05); }
/* campana / marimba: varios parciales */
function campana(f, t, d, v) { [[1, 1], [2.76, .35], [5.4, .15]].forEach(p => tono(f * p[0], t, d / p[0] * 1.2, (v || .12) * p[1])); }
function marimba(f, t, v) { tono(f, t, .45, v || .16); tono(f * 4, t, .08, (v || .16) * .35); tono(f * 10, t, .03, (v || .16) * .15); }
/* ruido filtrado (soplo) */
function soplo(t, d, f1, f2, v) { const a = ac(), n = a.sampleRate * d, b = a.createBuffer(1, n, a.sampleRate), c = b.getChannelData(0);
  for (let i = 0; i < n; i++) c[i] = Math.random() * 2 - 1;
  const s = a.createBufferSource(), fl = a.createBiquadFilter(), g = a.createGain(), t0 = T() + t; s.buffer = b; fl.type = "bandpass"; fl.Q.value = 3;
  fl.frequency.setValueAtTime(f1, t0); fl.frequency.exponentialRampToValueAtTime(f2, t0 + d);
  g.gain.setValueAtTime(.0001, t0); g.gain.exponentialRampToValueAtTime(v || .2, t0 + d * .3); g.gain.exponentialRampToValueAtTime(.0001, t0 + d);
  s.connect(fl).connect(g).connect(M); s.start(t0); }
const st = n => Math.pow(2, (n || 0) * 2 / 12);   /* cada acierto seguido sube 2 semitonos */
const PENTA = [523.25, 587.33, 659.25, 783.99, 880, 1046.5, 1174.66, 1318.5];
const OPS = [
 ["0", "Actual", "El que tiene la app hoy.",
   n => { tono(1318.5, 0, .09, .1, "square"); tono(1760, .08, .25, .09, "square"); tono(PENTA[Math.min(n || 0, 7)], .02, .3, .06, "triangle"); },
   () => { tono(330, 0, .14, .08, "triangle"); tono(262, .1, .22, .08, "triangle"); }],
 ["A", "Campanita", "Dos campanitas suaves hacia arriba. Error: un «bonk» grave y corto.",
   n => { const k = st(n); campana(880 * k, 0, .9, .13); campana(1318.5 * k, .1, 1.1, .12); },
   () => { tono(220, 0, .25, .22, "sine", 110); tono(110, 0, .2, .1, "triangle", 80); }],
 ["B", "Moneda arcade", "Estilo videojuego retro: «cling» rápido. Error: zumbido corto de dos golpes.",
   n => { const k = st(n); tono(987.77 * k, 0, .07, .08, "square"); tono(1318.5 * k, .07, .3, .08, "square"); },
   () => { tono(140, 0, .12, .09, "sawtooth"); tono(110, .15, .22, .09, "sawtooth"); }],
 ["C", "Burbuja", "Un «pop» que sube. Error: un «blup» que baja.",
   n => { const k = st(n); tono(420 * k, 0, .14, .18, "sine", 1100 * k); tono(1600 * k, .08, .06, .05, "sine"); },
   () => { tono(420, 0, .28, .2, "sine", 120); }],
 ["D", "Acorde brillante", "Tres notas rápidas (acorde mayor) con brillo. Error: dos notas chocando, suaves.",
   n => { const k = st(n); [523.25, 659.25, 783.99].forEach((f, i) => tono(f * k, i * .06, .5, .09, "triangle")); tono(2093 * k, .18, .4, .03, "sine"); },
   () => { tono(164.81, 0, .35, .1, "triangle"); tono(174.61, 0, .35, .1, "triangle"); }],
 ["E", "Xilófono", "Tres golpecitos de madera hacia arriba. Error: dos golpes graves hacia abajo.",
   n => { const k = st(n); marimba(1046.5 * k, 0); marimba(1318.5 * k, .08); marimba(1568 * k, .16, .18); },
   () => { marimba(196, 0, .22); marimba(146.83, .13, .22); }],
 ["F", "Mágico", "Destellos y un soplo que sube. Error: un soplo que baja con una nota grave.",
   n => { const k = st(n); soplo(0, .35, 800 * k, 4000 * k, .12); [1568, 2093, 2637].forEach((f, i) => tono(f * k, .12 + i * .05, .3, .05, "sine")); },
   () => { soplo(0, .4, 1200, 200, .14); tono(180, .05, .35, .1, "triangle", 120); }],
 ["G", "Suave y corto", "Muy discreto: un «tic» alegre. Error: un «tac» apagado. Bueno para no cansar.",
   n => { const k = st(n); tono(1174.66 * k, 0, .12, .1, "sine"); tono(1567.98 * k, .05, .18, .08, "sine"); },
   () => { tono(240, 0, .12, .14, "sine", 200); }]
];
document.getElementById("ops").innerHTML = OPS.map((o, i) => '<div class="op" id="op' + i + '"><h2><i>' + o[0] + '</i>' + o[1] + '</h2><p>' + o[2] + '</p><div class="bt">' +
  '<button class="ok" data-i="' + i + '" data-t="ok"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M4 12l5 5L20 6"/></svg>Correcto</button>' +
  '<button class="ok3" data-i="' + i + '" data-t="ok3"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M2 12l4 4 8-9M10 16l1 1 10-11"/></svg>3 seguidas</button>' +
  '<button class="no" data-i="' + i + '" data-t="no"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round"><path d="M6 6l12 12M18 6L6 18"/></svg>Incorrecto</button></div></div>').join("");
document.getElementById("ops").addEventListener("click", e => { const b = e.target.closest("button"); if (!b) return; const o = OPS[+b.dataset.i];
  document.querySelectorAll(".op").forEach(x => x.classList.toggle("act", x.id === "op" + b.dataset.i));
  if (b.dataset.t === "ok") o[3](0); else if (b.dataset.t === "no") o[4](); else [0, 1, 2].forEach(n => setTimeout(() => o[3](n), n * 650)); });
const PL = [["noche","Noche"],["dia","Día"],["rosa","Rosa"],["azul","Azul"]];
document.getElementById("pals").innerHTML = PL.map(p => '<button data-t="' + p[0] + '">' + p[1] + '</button>').join("");
document.getElementById("pals").onclick = e => { const b = e.target.closest("button"); if (!b) return; aplicarTema(b.dataset.t); document.querySelectorAll("#pals button").forEach(x => x.classList.toggle("on", x === b)); };
</script></body></html>
