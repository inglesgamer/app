<!DOCTYPE html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Retos de la semana: diseños</title>
<script>/* VISTA PREVIA: almacenamiento de mentiras, no toca el juego */(function(){var M={};var S={getItem:function(k){return k in M?M[k]:null},setItem:function(k,v){M[k]=String(v)},removeItem:function(k){delete M[k]},clear:function(){M={}},key:function(i){return Object.keys(M)[i]||null},get length(){return Object.keys(M).length}};try{Object.defineProperty(window,"localStorage",{value:S,configurable:true})}catch(e){}})();</script>
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@700;800;900&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box}body{margin:0;background:#000;color:#F4F4F5;font-family:Nunito,system-ui,sans-serif}
.w{max-width:520px;margin:0 auto;padding:16px 16px 40px}h1{margin:6px 0 2px;font-size:24px}.sub{margin:0 0 6px;color:#B8B8C0;font-weight:700}
.dz{margin-top:26px}.dz>.lab{display:inline-block;padding:4px 12px;border-radius:99px;background:#222226;font-weight:900;font-size:13px;color:#B8B8C0;margin-bottom:10px}
.t{margin:0;font-size:24px;font-weight:900;white-space:nowrap}
.hd{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:12px}
.pill{padding:6px 12px;border-radius:99px;background:#222226;font-size:13px;font-weight:900;color:#B8B8C0;white-space:nowrap}
.ic{flex:none;display:grid;place-items:center;border-radius:50%;color:#fff}
.au{display:inline-flex;align-items:center;gap:4px;font-weight:900;color:#FFC83D}
.ok{display:grid;place-items:center;border-radius:50%;background:#3FC46A;color:#06290F}
/* A */
.A .g{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.A .c{padding:14px 12px;border-radius:24px;background:#141416;border:1px solid #2A2A2E;position:relative}
.A .c b{display:block;margin-top:10px;font-size:16px}.A .c .au{font-size:14px;margin-top:2px}
.A .c.hecho{opacity:.65}.A .c .ok{position:absolute;top:10px;right:10px;width:24px;height:24px}
/* B */
.B .bar{height:10px;border-radius:99px;background:#2A2A2E;overflow:hidden;margin:0 0 12px}.B .bar i{display:block;height:100%;width:33%;border-radius:99px;background:linear-gradient(90deg,#3FA9FF,#A879FF,#FF8A3D)}
.B .f{display:flex;align-items:center;gap:12px;padding:12px 14px;margin-bottom:8px;border-radius:22px;background:#141416;border:1px solid #2A2A2E}
.B .f .tx{flex:1;min-width:0}.B .f b{display:block;font-size:17px}.B .f small{display:block;color:#B8B8C0;font-weight:700;font-size:13px}
.B .f .go{height:40px;padding:0 16px;border-radius:99px;background:#fff;color:#000;font-weight:900;display:flex;align-items:center;gap:5px}
.B .f.hecho .go{background:#1E3A28;color:#7BE3A8}
/* C */
.C .sc{display:flex;gap:10px;overflow-x:auto;margin:0 -16px;padding:0 16px 6px;scroll-snap-type:x mandatory;scrollbar-width:none}
.C .c{flex:0 0 72%;scroll-snap-align:start;padding:16px;border-radius:26px;color:#fff;position:relative;overflow:hidden;min-height:170px;display:flex;flex-direction:column}
.C .c::after{content:"";position:absolute;right:-30px;bottom:-30px;width:140px;height:140px;border-radius:50%;background:rgba(255,255,255,.14)}
.C .c small{font-size:12px;font-weight:900;letter-spacing:.12em;opacity:.85}.C .c b{font-size:24px;margin:2px 0 4px}.C .c p{margin:0;font-weight:800;opacity:.9;font-size:14px}
.C .c .pie{margin-top:auto;display:flex;align-items:center;justify-content:space-between;padding-top:14px;position:relative;z-index:1}
.C .c .jg{height:40px;padding:0 18px;border-radius:99px;background:#fff;color:#000;font-weight:900;display:flex;align-items:center}
.C .c .au2{padding:6px 10px;border-radius:99px;background:rgba(0,0,0,.25);font-weight:900}
.C .c.hecho .jg{background:rgba(0,0,0,.3);color:#fff}
/* D */
.D .card{padding:16px;border-radius:28px;background:#141416;border:1px solid #2A2A2E}
.D .top{display:flex;align-items:center;gap:14px;margin-bottom:14px}
.D .ring{position:relative;width:70px;height:70px;flex:none}.D .ring svg{transform:rotate(-90deg)}.D .ring span{position:absolute;inset:0;display:grid;place-items:center;font-weight:900;font-size:20px}
.D .top b{display:block;font-size:20px}.D .top small{color:#B8B8C0;font-weight:800}
.D .bt{display:flex;align-items:center;gap:12px;height:56px;padding:0 14px;border-radius:18px;margin-top:8px;color:#fff;font-weight:900;font-size:17px}
.D .bt .tx{flex:1}.D .bt .au{color:#fff;background:rgba(0,0,0,.22);padding:5px 10px;border-radius:99px;font-size:14px}
.D .bt.hecho{background:#1E1E22!important;color:#8A8A93}.D .bt.hecho .au{display:none}
</style></head><body><div class="w">
<h1>Retos de la semana</h1><p class="sub">4 diseños con los mismos colores. En el ejemplo ya hiciste Vocabulario (1 de 3).</p>
<div id="z"></div></div>
<script>
const SV = (p, s, st) => '<svg width="' + s + '" height="' + s + '" viewBox="0 0 24 24" fill="none" stroke="' + (st || "currentColor") + '" stroke-width="2.3" stroke-linecap="round" stroke-linejoin="round">' + p + '</svg>';
const ICO = { v:'<rect x="5" y="3" width="14" height="18" rx="2"/><path d="M9 8h6M9 12h6M9 16h4"/>', g:'<path d="M5 5h14v10H10l-5 4z"/><path d="M9 9h6M9 12h4"/>', e:'<path d="M4 10v4h4l5 4V6L8 10z"/><path d="M16 9a4 4 0 0 1 0 6"/>' };
const CHK = SV('<path d="M5 12.5 10 17 19 7"/>', 16);
const LL = '<svg width="16" height="16" viewBox="0 0 24 24"><path d="M12 2c1 3 6 6 6 12a6 6 0 0 1-12 0c0-3 2-4 2.5-6.5C10 9 10 11 10.5 12 11 9 11 5 12 2z" fill="#FF8A3D"/><path d="M12 11c.5 2 3 3 3 6a3 3 0 0 1-6 0c0-1.6 1.2-2.4 1.6-3.6.6.6.9 1.3 1 2 .3-1.4.2-3 .4-4.4z" fill="#FFC83D"/></svg>';
const R = [["v","Vocabulario","Palabras de tus niveles","#3FA9FF",1],["g","Gramática","Arma frases y conjuga","#A879FF",0],["e","Escucha","Oye y escoge lo correcto","#FF8A3D",0]];
const ic = (r, s) => '<span class="ic" style="width:' + s + 'px;height:' + s + 'px;background:' + r[3] + '">' + SV(ICO[r[0]], s * .5) + '</span>';
const D = {
 A:["A. Tarjetas (como ahora, arreglado)", () => '<div class="hd"><h2 class="t">Retos de la semana</h2><span class="pill">1 de 3 · 2 días</span></div><div class="g">' +
   R.map(r => '<div class="c' + (r[4] ? " hecho" : "") + '">' + (r[4] ? '<span class="ok">' + CHK + '</span>' : '') + ic(r, 44) + '<b>' + r[1] + '</b><span class="au">' + LL + '+50</span></div>').join("") + '</div>'],
 B:["B. Lista con barra", () => '<div class="hd"><h2 class="t">Retos de la semana</h2><span class="pill">Cambian en 2 días</span></div><div class="bar"><i></i></div>' +
   R.map(r => '<div class="f' + (r[4] ? " hecho" : "") + '">' + ic(r, 46) + '<div class="tx"><b>' + r[1] + '</b><small>' + r[2] + '</small></div><span class="go">' + (r[4] ? CHK + 'Hecho' : LL + '+50') + '</span></div>').join("")],
 C:["C. Tarjetas grandes de color (se deslizan)", () => '<div class="hd"><h2 class="t">Retos de la semana</h2><span class="pill">1 de 3</span></div><div class="sc">' +
   R.map((r, i) => '<div class="c' + (r[4] ? " hecho" : "") + '" style="background:linear-gradient(140deg,' + r[3] + ',' + ["#1C5FA8","#5B36A8","#B8461A"][i] + ')"><small>RETO ' + (i + 1) + ' DE 3</small><b>' + r[1] + '</b><p>' + r[2] + '</p><div class="pie"><span class="au2">' + (r[4] ? 'Ganaste 50' : '+50 Aura') + '</span><span class="jg">' + (r[4] ? CHK + '&nbsp;Hecho' : 'Jugar') + '</span></div></div>').join("") + '</div><p style="margin:8px 2px 0;color:#B8B8C0;font-weight:800;font-size:13px">Cambian en 2 días</p>'],
 D:["D. Una tarjeta con anillo", () => { const L = 2 * Math.PI * 28; return '<h2 class="t" style="margin-bottom:12px">Retos de la semana</h2><div class="card"><div class="top"><div class="ring"><svg width="70" height="70"><circle cx="35" cy="35" r="28" stroke="#2A2A2E" stroke-width="8" fill="none"/><circle cx="35" cy="35" r="28" stroke="#FFC83D" stroke-width="8" fill="none" stroke-linecap="round" stroke-dasharray="' + L + '" stroke-dashoffset="' + L * 2 / 3 + '"/></svg><span>1/3</span></div><div><b>¡Vas bien!</b><small>Te faltan 100 de Aura · cambian en 2 días</small></div></div>' +
   R.map(r => '<div class="bt' + (r[4] ? " hecho" : "") + '" style="background:' + r[3] + '">' + SV(ICO[r[0]], 22) + '<span class="tx">' + r[1] + '</span>' + (r[4] ? CHK : '<span class="au">+50</span>') + '</div>').join("") + '</div>'; }]
};
document.getElementById("z").innerHTML = Object.keys(D).map(k => '<div class="dz ' + k + '"><span class="lab">' + D[k][0] + '</span>' + D[k][1]() + '</div>').join("");
</script></body></html>
