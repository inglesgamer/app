<script>
/* ===== WEB (GitHub Pages): convierte los enlaces go:seccion en seccion.html. En App Creator no hace nada. ===== */
(function(){
  var web = /github\.io$/.test(location.hostname);
  window.igURL = function(u){
    u = String(u);
    if (!web || u.indexOf("go:") !== 0) return u;
    var s = u.slice(3);
    return (s === "inicio" ? "index" : s) + ".html";
  };
  if (!web) return;
  document.addEventListener("click", function(e){
    var a = e.target.closest && e.target.closest('a[href^="go:"]');
    if (a){ e.preventDefault(); location.href = igURL(a.getAttribute("href")); }
  }, true);
})();
</script>

<style>
/* ============ TEMA NOCHE (por defecto) ============ */
:root{
  --bg:#000;--ink:#F4F4F5;--mu:#B8B8C0;--card:#141416;--bd:#2A2A2E;--chip:#222226;--so:#3A3A40;

  --sk1:#040A1C;--sk2:#14305A;--se1:#1D5078;--se2:#0A2540;
  --m1:#1B2E52;--m2:#27406B;--fl:#FFFFFF;
  --tr:#6B4A2E;--l1:#0F4A45;--l2:#1A6B5E;--umb:#FF5A5A;--bt1:#E6F6FF;--bt2:#8CC4E4;

/* ============ TEMA DÍA ============ */
html[data-tema="dia"]{

  --m1:#A9CBE0;--m2:#C6DEEC;--fl:#8CC4E4;
  --tr:#8A5A32;--l1:#1E7A5A;--l2:#2FA074;--umb:#E5483C;--bt1:#FFFFFF;--bt2:#9FD0EA;
}
/* ============ TEMA ROSA ============ */
html[data-tema="rosa"]{
  --bg:#FFF1F6;--ink:#2B1420;--mu:#7A5568;--card:#FFFFFF;--bd:#F8D9E5;--chip:#FFE3ED;--so:#EEBFD1;
  --db:#D63B7A;--di:#fff;--lb:#FCE3EC;--li:#B58AA0;--lk:#F0C7D7;--gl:rgba(214,59,122,.18);--pg:#D63B7A;
  --p1:#FFFFFF;--p2:#F2B5CB;--sa:#FFF5F9;--sb:#F6CCDB;--fo:rgba(255,255,255,.95);
  --sk1:#FF9EC2;--sk2:#FFE8F1;--se1:#F58DB4;--se2:#D95D8E;
  --m1:#F0B5CB;--m2:#F8D3E1;--fl:#F2A3C0;
  --tr:#9A6A3A;--l1:#1E7A5A;--l2:#2FA074;--umb:#D63B7A;--bt1:#FFFFFF;--bt2:#F2B5CB;
}
/* ============ TEMA AZUL ============ */
html[data-tema="azul"]{
  --bg:#EFF6FF;--ink:#0E1B2B;--mu:#4F647B;--card:#FFFFFF;--bd:#D6E6F8;--chip:#E0EFFD;--so:#BDD6F0;
  --db:#1C6FD6;--di:#fff;--lb:#E3EEFA;--li:#8EA7C2;--lk:#C5D8EE;--gl:rgba(28,111,214,.18);--pg:#1C6FD6;
  --p1:#FFFFFF;--p2:#B7D1EE;--sa:#F4F9FF;--sb:#C4DAF2;--fo:rgba(255,255,255,.95);

*{box-sizing:border-box}
[hidden]{display:none!important}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:Nunito,system-ui,-apple-system,"Segoe UI",sans-serif}
a{color:inherit;text-decoration:none}
a:focus-visible,button:focus-visible{outline:3px solid var(--ink);outline-offset:3px}
.app{max-width:430px;min-height:100vh;margin:0 auto;position:relative;overflow-x:hidden;background:var(--bg);padding-bottom:calc(104px + env(safe-area-inset-bottom))}

/* ---------- cabecera ---------- */
.hd{position:sticky;top:0;z-index:20;display:flex;align-items:center;gap:10px;padding:calc(16px + env(safe-area-inset-top)) 16px 10px;background:var(--bg)}
.ti{flex:1;margin:0;font-size:28px;font-weight:900}
.bk{width:46px;height:46px;padding:0;border-radius:50%;background:var(--card);border:1px solid var(--bd);color:var(--ink);display:flex;align-items:center;justify-content:center;cursor:pointer}

/* ---------- tarjeta de arriba ---------- */
.wrap{padding:4px 16px 0}
.card{background:var(--card);border:1px solid var(--bd);border-radius:28px}
.hero{padding:14px 16px}
.hr{display:flex;gap:14px;align-items:center}
.hx{flex:1;min-width:0}
.hx b{font-size:20px;font-weight:900;line-height:1.15;display:block}
.sub{display:block;margin-top:2px;font-size:13px;font-weight:600;color:var(--mu)}
.chs{display:flex;flex-wrap:wrap;gap:8px;margin-top:8px}
.ch{display:flex;align-items:center;gap:6px;height:30px;padding:0 12px;border-radius:99px;background:var(--chip);font-weight:800;font-size:13px}

.pb{height:10px;border-radius:99px;background:var(--chip);margin-top:12px;overflow:hidden}

.lead{margin:14px 4px 0;font-size:14px;font-weight:600;color:var(--mu)}

/* ---------- estrellas ---------- */
.sr{display:inline-flex;gap:3px}
.sr .f{fill:var(--ink)}
.sr .e{fill:var(--so)}
.srw{display:flex;min-height:16px}

/* ---------- mapa ---------- */
.mp{position:relative;margin:14px 0 0;width:100%;overflow:hidden}
.sc{position:absolute;left:0;top:0;width:100%;height:100%;display:block}
.tr{stroke:var(--tr)}.l1{fill:var(--l1)}.l2{fill:var(--l2)}
.s-k1{stop-color:var(--sk1)}.s-k2{stop-color:var(--sk2)}.s-e1{stop-color:var(--se1)}.s-e2{stop-color:var(--se2)}

.hielo{animation:mece 6s ease-in-out infinite alternate}

.nb{animation:deriva 30s ease-in-out infinite alternate}
@keyframes deriva{from{transform:translateX(-10px)}to{transform:translateX(30px)}}

@keyframes tw{from{opacity:.35}to{opacity:.9}}

/* nieve cayendo */

.nv::before,.nv::after{content:"";position:absolute;inset:0}
.nv::before{background:radial-gradient(circle,var(--fl) 0 2.2px,transparent 3px) 0 0/64px 64px,radial-gradient(circle,var(--fl) 0 1.6px,transparent 2.4px) 30px 30px/96px 96px;opacity:.85;animation:cae 9s linear infinite}

.nv::after{animation-name:cae2}

.nodo{position:absolute;z-index:2;display:flex;flex-direction:column;align-items:center;gap:6px;padding:0;border:0;background:none;color:var(--ink);font:inherit;cursor:pointer;transform:translate(-50%,-38px);-webkit-tap-highlight-color:transparent}
.nodo.jefe{transform:translate(-50%,-48px)}
.nodo.bloq{cursor:not-allowed}
.nA{width:76px;height:76px;border-radius:50%;display:flex;align-items:center;justify-content:center;box-sizing:border-box;position:relative;z-index:1}
.nA.big{width:96px;height:96px}
.nA.done{background:var(--db);color:var(--di);box-shadow:0 4px 0 rgba(0,0,0,.25)}
.nA.open{background:var(--card);color:var(--ink);border:3px solid var(--ink);box-shadow:0 4px 0 rgba(0,0,0,.2)}
.nA.act{background:#fff;color:#000;border:4px solid #000;box-shadow:0 0 0 5px var(--ink),0 0 0 15px var(--gl);animation:glow 1.8s ease-in-out infinite}
.nA.big.act{box-shadow:0 0 0 5px #FF4D4D,0 0 0 15px rgba(255,77,77,.25)}
.nA.lock{background:var(--lb);border:2px solid var(--lk);color:var(--li)}
@keyframes glow{0%,100%{box-shadow:0 0 0 5px var(--ink),0 0 0 15px var(--gl)}50%{box-shadow:0 0 0 5px var(--ink),0 0 0 22px rgba(128,128,128,0)}}
.nodo:hover .nA.done,.nodo:hover .nA.open{transform:translateY(-2px)}
.lbl{white-space:nowrap;padding:4px 12px;border-radius:99px;background:var(--card);border:1px solid var(--bd);font-weight:800;font-size:13px;box-shadow:0 3px 0 rgba(0,0,0,.12)}
.lbl.l{color:var(--mu)}
.tg{position:absolute;top:-30px;left:50%;transform:translateX(-50%);padding:4px 12px;border-radius:99px;background:var(--ink);color:var(--bg);font-weight:900;font-size:11px;letter-spacing:.1em;white-space:nowrap;z-index:3}

/* nivel de escucha (tarjeta ancha) */
.nodo.esc{flex-direction:row;gap:12px;width:262px;height:72px;padding:0 14px;border-radius:26px;background:var(--card);border:2px solid var(--ink);box-shadow:0 5px 0 rgba(0,0,0,.18);text-align:left;transform:translate(-50%,-36px)}
.nodo.esc .ci{flex:none;width:48px;height:48px;border-radius:50%;background:var(--db);color:var(--di);display:flex;align-items:center;justify-content:center}
.nodo.esc .tx{min-width:0}
.nodo.esc small{display:block;font-size:10px;font-weight:900;letter-spacing:.12em;color:var(--mu)}
.nodo.esc b{display:block;font-size:16px;font-weight:900;line-height:1.2}
.nodo.esc.act{animation:glowP 1.8s ease-in-out infinite}
@keyframes glowP{0%,100%{box-shadow:0 5px 0 rgba(0,0,0,.18),0 0 0 5px var(--gl)}50%{box-shadow:0 5px 0 rgba(0,0,0,.18),0 0 0 12px rgba(128,128,128,0)}}
.nodo.esc.bloq{border-color:var(--lk);box-shadow:none;background:var(--card)}
.nodo.esc.bloq .ci{background:var(--lb);color:var(--li);border:2px solid var(--lk)}
.nodo.esc.bloq b{color:var(--mu)}

/* personajes */
.fx{position:absolute;z-index:1;transform:translateX(-50%);display:flex;flex-direction:column;align-items:center;gap:4px;pointer-events:none}
.bub{padding:4px 10px;border-radius:14px;background:#fff;color:#000;font-weight:800;font-size:12px;white-space:nowrap;box-shadow:0 2px 0 rgba(0,0,0,.2)}
.fx .sprw{display:block;animation:bob 2.6s ease-in-out infinite;animation-delay:var(--d,0s)}
.fx .sprw svg{display:block;filter:drop-shadow(0 4px 0 rgba(0,0,0,.25))}
.fx.zz .sprw{filter:grayscale(.8) brightness(.85)}
.fx.zz .bub{background:#D9D9DE}
@keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-5px)}}

/* aviso */
.toast{position:fixed;left:50%;bottom:calc(96px + env(safe-area-inset-bottom));transform:translateX(-50%);z-index:40;max-width:88%;padding:10px 16px;border-radius:99px;background:var(--ink);color:var(--bg);font-weight:800;font-size:14px;line-height:1.35;text-align:center;box-shadow:0 6px 18px rgba(0,0,0,.35)}

/* barra de abajo */
nav{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:100%;max-width:430px;z-index:30;display:flex;padding:8px 6px calc(14px + env(safe-area-inset-bottom));background:var(--card);border-radius:28px 28px 0 0;border-top:1px solid var(--bd)}

.sk{display:inline-flex}.sk svg{display:block;filter:drop-shadow(0 4px 0 rgba(0,0,0,.3))}
.arco{animation:hue 3s linear infinite}@keyframes hue{to{filter:hue-rotate(360deg)}}
.fr{display:inline-flex;align-items:flex-end;justify-content:center;overflow:hidden;border-radius:50%;border:5px solid var(--b,#9A6A3A);background:#0F0F12;box-shadow:0 0 var(--g,0px) var(--b)}
.m0{--b:#9A6A3A}.m1{--b:#9A9AA6}.m2{--b:#FFC83D;--g:14px}.m3{--b:#3FD8C8;--g:14px}.m5{--b:#E8F7FF;--g:18px}
.m4{animation:fuego 1s ease-in-out infinite alternate}.m6{animation:arcoB 3s linear infinite}
@keyframes fuego{from{border-color:#FF4D4D;box-shadow:0 0 8px #FF4D4D}to{border-color:#FFC83D;box-shadow:0 0 22px #FF8A3D}}
@keyframes arcoB{0%,100%{border-color:#FF4D4D}20%{border-color:#FFC83D}40%{border-color:#5DB33A}60%{border-color:#3FD8C8}80%{border-color:#8E5BD6}}
.lkfx{position:absolute;inset:0;overflow:hidden;pointer-events:none}.lkfx::before,.lkfx::after{content:"";position:absolute;inset:0}

.lk-sc{position:absolute;inset:0;z-index:0;overflow:hidden;pointer-events:none}
.lk-gr{position:absolute;left:0;right:0;bottom:0;height:22px;z-index:1;opacity:.9}

function textoTema(v) {
  if (v === null || v === undefined || v === "") return "";
  try {
    const j = JSON.parse(v);
    if (j && typeof j === "object") v = j.tema || j.apariencia || j.theme || j.modo || "";
    else v = j;
  } catch (e) {}
  return String(v).toLowerCase();
}
function leerTema() {
  let r = "";
  try {
    const q = new URLSearchParams(location.search).get("tema");
    if (q) r = q.toLowerCase();
  } catch (e) {}
  if (!r) {
    try {
      for (let i = 0; i < CLAVES_TEMA.length && !r; i++) r = textoTema(localStorage.getItem(CLAVES_TEMA[i]));
      if (!r) r = textoTema(JSON.parse(localStorage.getItem("ingles_gamer_perfil") || "null") && JSON.parse(localStorage.getItem("ingles_gamer_perfil")).tema);
    } catch (e) {}
  }
  return /rosa|pink/.test(r) ? "rosa" : /azul|blue/.test(r) ? "azul" : /d[ií]a|claro|light|day/.test(r) ? "dia" : "noche";
}

  if (!AC) { const C = window.AudioContext || window.webkitAudioContext; if (!C) return null; AC = new C(); MASTER = AC.createGain(); MASTER.gain.value = 0.9; MASTER.connect(AC.destination); }
  if (AC.state === "suspended") AC.resume();

    const o = a.createOscillator(), g = a.createGain(), t = a.currentTime;

}

      '<circle cx="40" cy="38" r="2" fill="#0B0B0D"></circle><circle cx="40" cy="48" r="2" fill="#0B0B0D"></circle><circle cx="40" cy="70" r="2" fill="#0B0B0D"></circle><circle cx="40" cy="80" r="2" fill="#0B0B0D"></circle>' +
      '<path d="M28 6h24v5H28z" fill="#2B2B33"></path><path d="M33 -4h14v10H33z" fill="#2B2B33" transform="translate(0 4)"></path></symbol>' +
    '</defs>';

  /* cielo */
  s += '<rect width="390" height="140" fill="url(#gk)"></rect>';
  /* noche: estrellas, luna, aurora */
  s += '<g class="only-n"><g fill="#fff" class="est">' +
    '<circle cx="30" cy="24" r="1.4"></circle><circle cx="80" cy="60" r="1"></circle><circle cx="130" cy="20" r="1.2"></circle><circle cx="190" cy="50" r="1.4"></circle><circle cx="240" cy="24" r="1"></circle><circle cx="60" cy="100" r="1"></circle><circle cx="160" cy="95" r="1.2"></circle><circle cx="350" cy="28" r="1.2"></circle><circle cx="270" cy="90" r="1"></circle></g>' +
    '<g class="aur"><path d="M0 50Q80 14 160 44T320 34T390 48L390 92Q320 102 240 84T80 94T0 88Z" fill="url(#ga)"></path></g>' +
    '<circle cx="312" cy="68" r="24" fill="#F4F4F5"></circle><circle cx="322" cy="61" r="21" fill="#0A1A36"></circle></g>';
  /* día: sol pálido y nubes */
  let rayos = "";
  for (let k = 0; k < 8; k++) rayos += '<path d="M312 28L312 18" transform="rotate(' + (k * 45) + ' 312 66)"></path>';
  s += '<g class="only-d"><circle cx="312" cy="66" r="60" fill="url(#gs)"></circle><circle cx="312" cy="66" r="24" fill="#FFF3B0"></circle>' +
    '<g stroke="#FFF3B0" stroke-width="3" stroke-linecap="round">' + rayos + '</g>' +
    '<g fill="#fff" opacity=".95" class="nb"><ellipse cx="80" cy="60" rx="34" ry="10"></ellipse><ellipse cx="102" cy="50" rx="22" ry="12"></ellipse><ellipse cx="60" cy="52" rx="16" ry="9"></ellipse></g>' +
    '<g fill="#fff" opacity=".8" class="nb"><ellipse cx="200" cy="100" rx="24" ry="7"></ellipse><ellipse cx="214" cy="93" rx="14" ry="8"></ellipse></g></g>';

  /* montañas nevadas */
  s += '<path class="mt1" d="M0 132L52 84L84 112L134 66L186 116L228 92L280 132Z"></path>' +
       '<path class="mt2" d="M200 132L292 62L324 94L350 76L392 132Z"></path>' +
       '<path fill="#fff" opacity=".95" d="M134 66L117 90L128 86L135 97L144 88L152 93Z"></path>' +
       '<path fill="#fff" opacity=".95" d="M292 62L274 86L285 82L293 93L302 83L311 89Z"></path>' +
       '<path fill="#fff" opacity=".9" d="M350 76L338 92L346 89L351 96L358 90Z"></path>';

  /* mar helado, horizonte y olas */
  s += '<rect y="130" width="390" height="180" fill="url(#gm)"></rect><rect y="129" width="390" height="2" fill="#fff" opacity=".4"></rect>';
  s += '<g fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round">' +
    '<path class="ond" opacity=".28" d="' + onda(160) + '"></path><path class="ond b" opacity=".28" d="' + onda(194) + '"></path>' +
    '<path class="ond" opacity=".28" d="' + onda(228) + '"></path><path class="ond b" opacity=".28" d="' + onda(262) + '"></path></g>';
  /* destellos de hielo */
  s += '<g fill="#fff" class="bri"><path d="M60 176l3-8 3 8-8-3 8-3z" transform="translate(0 0)"></path><circle cx="300" cy="212" r="2"></circle><circle cx="170" cy="250" r="2"></circle><circle cx="40" cy="270" r="1.6"></circle></g>';
  /* témpano flotante */
  s += '<g class="hielo"><g transform="translate(80 138)"><path d="M0 10L9 -8L17 2L26 -14L40 10Z" style="fill:var(--bt2)"></path><path d="M26 -14L19 -2L27 0L33 -6Z" style="fill:var(--bt1)"></path><path d="M9 -8L4 2L13 0Z" style="fill:var(--bt1)"></path></g></g>';

  /* suelo nevado */
  s += '<path d="M0 300 Q49 284 97 300 T195 300 T292 300 T390 300 V' + H + ' H0Z" style="fill:var(--sa);stroke:var(--fo)" stroke-width="6"></path>';
  s += '<path d="M0 314 Q49 298 97 314 T195 314 T292 314 T390 314" fill="none" style="stroke:var(--sb)" stroke-width="2" opacity=".5"></path>';
  s += '<g style="fill:var(--sb)" opacity=".7">';
  for (let k = 0, y = 340; y < H - 30; k++, y += 83) {
    s += '<circle cx="' + (20 + (97 * k) % 350) + '" cy="' + y + '" r="2.2"></circle>';
    s += '<circle cx="' + (20 + (97 * k + 300) % 350) + '" cy="' + (y + 15) + '" r="2.2"></circle>';
  }
  s += '</g>';

  /* pinos y muñecos, siempre del lado contrario al nivel */
  let j = 0;
  P.forEach(function (p, i) {
    const t = NODOS[i]; if (t.tipo === "escucha" || t.tipo === "final") return;
    const muneco = (j % 3 === 1), yc = p.y + 20; j++;
    const w = muneco ? 56 : 92, h = muneco ? 70 : 120, y = yc - h / 2, id = muneco ? "muneco" : "pino";
    if (p.x === XL) s += '<g transform="translate(' + (muneco ? 380 : 414) + ' 0) scale(-1 1)"><use href="#' + id + '" x="0" y="' + y + '" width="' + w + '" height="' + h + '"></use></g>';
    else s += '<use href="#' + id + '" x="' + (muneco ? 10 : -20) + '" y="' + y + '" width="' + w + '" height="' + h + '"></use>';
  });

  /* camino de hielo */
  let base = "", guia = "";
  for (let i = 0; i < P.length - 1; i++) {
    const a = P[i], b = P[i + 1], d = 'M' + a.x + ' ' + a.y + ' C' + a.x + ' ' + (a.y + PASO / 2) + ' ' + b.x + ' ' + (b.y - PASO / 2) + ' ' + b.x + ' ' + b.y;
    base += '<path d="' + d + '" fill="none" style="stroke:var(--p2)" stroke-width="46" stroke-linecap="round"></path>' +
            '<path d="' + d + '" fill="none" style="stroke:var(--p1)" stroke-width="38" stroke-linecap="round"></path>';
    if (est(NODOS[i].id) >= 1) guia += '<path d="' + d + '" fill="none" style="stroke:var(--pg)" stroke-width="9" stroke-linecap="round"></path>';
    else guia += '<path d="' + d + '" fill="none" style="stroke:var(--p2)" stroke-width="5" stroke-linecap="round" stroke-dasharray="2 12"></path>';
  }
  s += base + guia + '</svg>';
  return s;
}

function pctX(x) { return (x / W * 100).toFixed(3) + "%"; }

function nodosHTML(H, P, act) {
  let h = "";
  NODOS.forEach(function (t, i) {
    const e = est(t.id), bloq = !desbloq(i), esc = t.tipo === "escucha", fin = t.tipo === "final";
    const st = bloq ? "lock" : (i === act ? "act" : (e >= 1 ? "done" : "open"));
    const nombre = fin ? "Jefe final" : "Nivel " + (i + 1) + ": " + t.nombre;
    const abre = bloq ? '<button type="button" data-bloq="' + i + '"' : '<a href="' + t.url + '"';
    const cierra = bloq ? '</button>' : '</a>';
    const pos = ' style="left:' + pctX(P[i].x) + ';top:' + (P[i].y / H * 100).toFixed(3) + '%" aria-label="' + nombre + ', ' + (bloq ? 'bloqueado' : e + ' de 3 estrellas') + '"';
    const tag = i === act ? '<span class="tg">¡AQUÍ!</span>' : '';
    const cl = 'nodo ' + (bloq ? 'bloq ' : '') + (esc ? 'esc ' : '') + (fin ? 'jefe ' : '') + st;
    if (esc) {
      h += abre + ' class="' + cl + '"' + pos + '>' + tag +
        '<span class="ci">' + icono(bloq ? "candado" : t.spr, 26) + '</span>' +
        '<span class="tx"><small>ESCUCHA</small><b>' + t.nombre + '</b>' + (bloq ? '' : '<span class="srw">' + estrellasHTML(e, 15) + '</span>') + '</span>' + cierra;
      return;
    }
    const ic = fin ? icono("jefe", 46) : icono(bloq ? "candado" : t.spr, 38);
    h += abre + ' class="' + cl + '"' + pos + '>' + tag +
      '<span class="nA ' + st + (fin ? ' big' : '') + '">' + ic + '</span>' +
      '<span class="lbl' + (bloq ? ' l' : '') + '">' + (fin ? 'Jefe final' : (i + 1) + ' · ' + t.nombre) + '</span>' +
      (bloq ? '' : '<span class="srw">' + estrellasHTML(e, 16) + '</span>') + cierra;
  });
  return h;
}

function personajesHTML(H, P, act) {
  const am = amigos(), dichos = ["Great!", "Nice job!", "Well done!", "Awesome!"]; let h = "";
  P.forEach(function (p, i) {
    const t = NODOS[i];
    if (t.tipo === "escucha" || t.tipo === "final") return;
    const yo = (i === act), hecho = est(t.id) >= 1, bloq = !desbloq(i);
    if (!(yo || i % 3 === 1)) return;
    const spr = yo ? "av" + miAvatar() : am[i % am.length];
    const dicho = yo ? "Let’s go!" : (hecho ? dichos[i % 4] : "Zzz...");
    const x = p.x < XC ? p.x + 108 : p.x - 108;
    h += '<div class="fx' + (bloq ? ' zz' : '') + '" aria-hidden="true" style="left:' + pctX(x) + ';top:' + ((p.y - 66) / H * 100).toFixed(3) + '%;--d:-' + ((i * 0.7) % 2.6).toFixed(1) + 's">' +
      '<span class="bub">' + dicho + '</span><span class="sprw">' + (yo ? lookSkin(sprite(spr, 72)) : sprite(spr, 64)) + '</span></div>';
  });
  return h;
}

function pintarMapa() {
  const n = NODOS.length, H = Y0 + (n - 1) * PASO + 150, act = actualIdx();
  let c = 0;
  const P = NODOS.map(function (t, i) {
    let x;
    if (t.tipo === "escucha" || t.tipo === "final") x = XC;
    else { x = (c % 2 === 0) ? XL : XR; c++; }
    return { x: x, y: Y0 + i * PASO };
  });
  const m = $("mapa");
  m.style.aspectRatio = W + " / " + H;
  m.innerHTML = escenaHTML(H, P) + '<div class="nv" aria-hidden="true"></div>' + personajesHTML(H, P, act) + nodosHTML(H, P, act);
}
$("mapa").addEventListener("click", function (e) {
  const b = e.target.closest("[data-bloq]"); if (!b) return;
  const i = Number(b.dataset.bloq), t = NODOS[i];
  aviso(t.tipo === "final" ? "El jefe final se abre cuando pases todos los niveles." : "Primero pasa el nivel «" + NODOS[i - 1].nombre + "».");
});

/* ---------- arranque ---------- */
pintarHero();
pintarMapa();
function refrescar() {
  try { const g = JSON.parse(localStorage.getItem(CLAVE) || "null"); if (g && g.est) S = g; } catch (e) {}
  aplicarTema(); pintarHero(); pintarMapa();
}
window.addEventListener("pageshow", refrescar);
window.addEventListener("storage", function (e) { refrescar(); });
document.addEventListener("visibilitychange", function () { if (!document.hidden) refrescar(); });
</script>
