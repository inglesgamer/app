<script>
/* ===== WEB (GitHub Pages): convierte los enlaces go:seccion en seccion.html. En App Creator no hace nada. ===== */
(function(){
  var web = /github\.io$/.test(location.hostname);
  window.igURL = function(u){
    u = String(u);
    if (!web || u.indexOf("go:") !== 0) return u;
    var s = u.slice(3);
    return (s === "inicio" ? "index" : s) + ".html";
  };
  if (!web) return;
  document.addEventListener("click", function(e){
    var a = e.target.closest && e.target.closest('a[href^="go:"]');
    if (a){ e.preventDefault(); location.href = igURL(a.getAttribute("href")); }
  }, true);
})();
</script>

};
function aplicarTema(id) {
  var p = PALETAS[id] || PALETAS.noche, r = document.documentElement;
  for (var k in p.v) r.style.setProperty(k, p.v[k]);
  r.style.colorScheme = p.cs; r.setAttribute("data-tema", PALETAS[id] ? id : "noche");
  var m = document.querySelector('meta[name="theme-color"]'); if (m) m.setAttribute("content", p.meta);
}
function temaActual() { try { var t = localStorage.getItem(TEMA_KEY); return PALETAS[t] ? t : "noche"; } catch (e) { return "noche"; } }

<style>
:root{--bg:#000;--card:#141416;--bd:#2A2A2E;--ink:#F4F4F5;--mu:#B8B8C0;--chip:#222226;--gold:#FFD166;--hi:#FFFFFF;--on-hi:#000000;--track:#2A2A2E;--toff:#3A3A40;--nav:#0E0E10;--av1:#3A3A40;--av2:#101012;--ok:#7BE3A8}
*{box-sizing:border-box}
html{background:var(--bg)}
body{margin:0;background:var(--bg);color:var(--ink);font-family:Nunito,system-ui,sans-serif;-webkit-font-smoothing:antialiased}
a{color:inherit;text-decoration:none}
button{font-family:inherit}
a:focus-visible,button:focus-visible{outline:3px solid var(--hi);outline-offset:2px}
.app{max-width:520px;margin:0 auto;min-height:100vh;padding-bottom:calc(110px + env(safe-area-inset-bottom))}
header{padding:18px 20px 4px}
.logo{margin:0;font:900 26px Nunito,sans-serif;letter-spacing:-.01em}
.logo span{opacity:.55}
section{padding:20px 20px 0}
h2{margin:0;font:900 26px/1.1 Nunito,sans-serif;letter-spacing:-.01em}
.lead{margin:10px 0 0;font-size:15px;line-height:1.45;color:var(--mu)}
.sub-h{margin:0 0 12px;font:700 12px Nunito,sans-serif;letter-spacing:.08em;text-transform:uppercase;color:var(--mu)}

/* ---------- título de pantalla ---------- */
.hero{display:flex;align-items:center;gap:14px}
.hero .sp{flex-shrink:0;width:64px;height:64px;display:flex;align-items:center;justify-content:center;border-radius:16px;background:var(--chip);border:1.5px solid var(--bd);animation:flota 2.4s ease-in-out infinite}
@keyframes flota{0%,100%{transform:translateY(0)}50%{transform:translateY(-4px)}}

/* ---------- aura ---------- */
.aura-box{display:flex;align-items:center;gap:14px;margin-top:16px;padding:14px 16px;border-radius:20px;background:var(--hi);color:var(--on-hi)}
.aura-sp{display:inline-flex;transform-origin:50% 100%;animation:llamea 1.1s ease-in-out infinite}
.aura-box small{display:block;font:700 10px Nunito,sans-serif;letter-spacing:.1em;opacity:.8}
.aura-box b{display:block;margin-top:2px;font:800 34px/1 Nunito,sans-serif}
.aura-box p{flex:1;min-width:0;margin:0;font-size:13px;line-height:1.4;text-align:right;opacity:.9}
@keyframes llamea{0%,100%{transform:scale(1,1)}50%{transform:scale(.94,1.08)}}

/* ---------- niveles ---------- */
.niveles{display:flex;flex-direction:column;gap:14px}
.nivel{--lc:#5DB33A;position:relative;display:flex;align-items:center;gap:14px;width:100%;padding:14px;text-align:left;font:inherit;color:inherit;border-radius:20px;border:1.5px solid var(--bd);background:var(--card);transition:transform .15s}
a.nivel{border-color:var(--hi)}
a.nivel:hover{transform:translateY(-3px)}
.n-ic{flex-shrink:0;width:72px;height:72px;display:flex;align-items:center;justify-content:center;border-radius:16px;border:1.5px solid color-mix(in srgb,var(--lc) 60%,transparent);background:color-mix(in srgb,var(--lc) 16%,var(--chip))}
.n-ic svg{animation:flota 2.4s ease-in-out infinite}
.info{flex:1;min-width:0;display:flex;flex-direction:column;gap:5px}
.titulo{display:flex;align-items:baseline;flex-wrap:wrap;gap:2px 10px}
.codigo{font:800 22px Nunito,sans-serif;color:var(--lc)}
.nombre{font:700 17px Nunito,sans-serif}
.desc{font-size:14px;line-height:1.35;color:var(--mu)}
.dif{display:flex;align-items:center;gap:8px;margin-top:2px;font:700 11px Nunito,sans-serif;letter-spacing:.08em;color:var(--mu)}
.segs{display:grid;grid-template-columns:repeat(4,18px);gap:4px}
.segs i{height:8px;border-radius:99px;background:var(--track)}
.segs i.on{background:var(--lc)}
.chips{display:flex;align-items:center;flex-wrap:wrap;gap:8px;margin-top:6px}
.chip{display:inline-flex;align-items:center;gap:5px;min-height:30px;padding:0 10px;border-radius:99px;background:var(--chip);font:600 13px Nunito,sans-serif}
.play{display:inline-flex;align-items:center;min-height:34px;padding:0 14px;border-radius:99px;background:var(--hi);color:var(--on-hi);font:700 13px Nunito,sans-serif}
.flecha{flex-shrink:0;color:var(--lc)}

/* ---------- próximamente ---------- */
.prox{--lc:#8C8C96;cursor:pointer;border-color:var(--bd)!important;background:var(--bg)}
.prox .n-ic{border-color:var(--bd);background:var(--chip)}
.prox .n-ic svg{animation:none;opacity:.9}
.prox .codigo{color:var(--mu)}
.badge{align-self:flex-start;display:inline-flex;align-items:center;gap:6px;padding:4px 10px;border-radius:99px;background:var(--hi);color:var(--on-hi);font:700 11px Nunito,sans-serif;letter-spacing:.08em}
.badge i{width:6px;height:6px;border-radius:50%;background:var(--on-hi);animation:blink 1.2s ease-in-out infinite}
@keyframes blink{50%{opacity:.2}}
.load{display:flex;align-items:center;gap:8px;margin-top:4px;font:700 11px Nunito,sans-serif;letter-spacing:.04em;color:var(--mu)}
.bar{flex:1;height:8px;border-radius:99px;background:var(--track);overflow:hidden}
.bar i{display:block;height:100%;border-radius:99px;background:var(--hi)}
.prox.sacudir{animation:shake .4s ease}
@keyframes shake{0%,100%{transform:translateX(0)}20%,60%{transform:translateX(-6px)}40%,80%{transform:translateX(6px)}}
.toast{position:fixed;left:50%;bottom:calc(96px + env(safe-area-inset-bottom));transform:translate(-50%,20px);opacity:0;pointer-events:none;z-index:30;max-width:calc(100% - 40px);padding:12px 18px;border-radius:16px;background:var(--ink);color:var(--bg);font:700 15px Nunito,sans-serif;text-align:center;transition:opacity .25s,transform .25s}

nav{position:fixed;bottom:0;left:0;right:0;z-index:10;background:var(--nav);border-top:1.5px solid var(--bd)}
nav .inner{max-width:520px;margin:0 auto;display:flex;padding:8px 8px max(10px,env(safe-area-inset-bottom))}
nav a{flex:1;min-width:0;min-height:54px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;color:var(--mu);font-size:11px;font-weight:600;white-space:nowrap}
nav a:hover{color:var(--ink)}
nav a.on{color:var(--ink);font-weight:800}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>

function sprite(n, size, pal) {
  const d = SPR[n]; if (!d) return "";
  const p = pal ? Object.assign({}, d.p, pal) : d.p;
  const h = d.r.length, w = d.r[0].length;
  let o = '<svg width="' + Math.round(size * w / h) + '" height="' + size + '" viewBox="0 0 ' + w + ' ' + h + '" shape-rendering="crispEdges" aria-hidden="true">';
  d.r.forEach((row, y) => row.split("").forEach((c, x) => { if (c !== ".") o += '<rect x="' + x + '" y="' + y + '" width="1" height="1" fill="' + p[c] + '"></rect>'; }));
  return o + "</svg>";
}

/* ---------- personaje elegido en el Perfil (0 a 9, igual que en el Inicio) ---------- */
function miAvatar() {
  try {
    const g = JSON.parse(localStorage.getItem("ingles_gamer_perfil") || "null"), a = g ? Number(g.a) : 0;
    const t = JSON.parse(localStorage.getItem("ingles_gamer_tienda") || "null"), own = (t && Array.isArray(t.own)) ? t.own : [];
    if (!(a >= 0 && a <= 9)) return 0;
    if (a > 1 && own.indexOf("av" + a) < 0) return 0;      /* si no lo tiene comprado, se ve el Constructor */
    return a;
  } catch (e) { return 0; }
}

/* ---------- Aura (la misma que se guarda en el Perfil) ---------- */
function totalAura() {
  try { const g = JSON.parse(localStorage.getItem("ingles_gamer_aura") || "null"); return Math.max(0, +(g && g.t) || 0); } catch (e) { return 0; }
}
function pintarJugador() {
  $("heroSp").innerHTML = sprite("av" + miAvatar(), 44);
  $("aura").innerHTML = '<span class="aura-sp">' + sprite("llama", 50) + '</span><div><small>TU AURA</small><b>' + totalAura() + '</b></div><p>Cada nivel que pasas te da Aura.</p>';
}
pintarJugador();
/* al volver de jugar (o al cambiar el tema en otra pantalla) todo se actualiza solo */
window.addEventListener("pageshow", function () { aplicarTema(temaActual()); pintarJugador(); });
document.addEventListener("visibilitychange", function () { if (!document.hidden) { aplicarTema(temaActual()); pintarJugador(); } });
window.addEventListener("storage", function (e) { if (/^ingles_gamer_/.test(e.key || "")) pintarJugador(); });

/* ---------- niveles ---------- */
const ICON_ARROW = '<svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m9 6 6 6-6 6"></path></svg>';
$("niveles").innerHTML = NIVELES.map(n => {
  let dif = ""; for (let i = 0; i < 4; i++) dif += '<i' + (i < n.dificultad ? ' class="on"' : '') + '></i>';
  const cab = '<div class="titulo"><span class="codigo">' + esc(n.codigo) + '</span><span class="nombre">' + esc(n.nombre) + '</span></div>';
  if (n.proximo) {
    const p = n.progreso || 0;
    return '<button type="button" class="nivel prox" data-nivel="' + esc(n.codigo) + '" aria-label="Nivel ' + esc(n.codigo) + ': próximamente">' +
      '<div class="n-ic" style="--lc:' + n.c + '">' + sprite("candado", 44) + '</div>' +
      '<div class="info">' + cab + '<span class="badge"><i></i>PRONTO</span><div class="desc">' + esc(n.desc) + '</div>' +
      '<div class="load"><span>CARGANDO</span><span class="bar"><i style="width:' + p + '%"></i></span><span>' + p + '%</span></div></div></button>';
  }
  return '<a class="nivel" style="--lc:' + n.c + '" href="' + n.url + '" aria-label="Nivel ' + esc(n.codigo) + ': ' + esc(n.nombre) + '">' +
    '<div class="n-ic">' + sprite(n.spr, 48) + '</div>' +
    '<div class="info">' + cab + '<div class="desc">' + esc(n.desc) + '</div>' +
    '<div class="dif"><span>NIVEL</span><span class="segs" aria-hidden="true">' + dif + '</span></div>' +
    '<div class="chips"><span class="chip">' + sprite("llama", 16) + ' Gana Aura</span><span class="play">JUGAR ▶</span></div></div>' +
    '<div class="flecha">' + ICON_ARROW + '</div></a>';
}).join("");

/* Al tocar un nivel próximo: se sacude y sale un aviso */
const toast = $("toast"); let tt;
$("niveles").addEventListener("click", e => {
  const c = e.target.closest(".prox"); if (!c) return;
  c.classList.remove("sacudir"); void c.offsetWidth; c.classList.add("sacudir");
  sonido("bloqueado");
  toast.textContent = "🔒 El nivel " + c.dataset.nivel + " llega muy pronto. ¡Prepárate!";
  toast.classList.add("show"); clearTimeout(tt);
  tt = setTimeout(() => toast.classList.remove("show"), 2400);
});

/* ---------- navegación ---------- */
$("navbar").innerHTML = NAV.map(n => '<a' + (n.activo ? ' class="on" aria-current="page"' : '') + ' href="' + n.url + '"><svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">' + n.icono + '</svg>' + n.nombre + '</a>').join("");
</script>
</body>
</html>
