<script>
/* ===== WEB (GitHub Pages): convierte los enlaces go:seccion en seccion.html. En App Creator no hace nada. ===== */
(function(){
  var web = /github\.io$/.test(location.hostname);
  window.igURL = function(u){
    u = String(u);
    if (!web || u.indexOf("go:") !== 0) return u;
    var s = u.slice(3);
    return (s === "inicio" ? "index" : s) + ".html";
  };
  if (!web) return;
  document.addEventListener("click", function(e){
    var a = e.target.closest && e.target.closest('a[href^="go:"]');
    if (a){ e.preventDefault(); location.href = igURL(a.getAttribute("href")); }
  }, true);
})();
</script>

<script>
/* Paletas: las mismas del Inicio (clave "ingles_gamer_tema"). Si el jugador elige Día, Rosa o Azul en el Inicio, el Perfil también. */
var TEMA_KEY = "ingles_gamer_tema";
var PALETAS = {
  noche: { meta:"#000000", cs:"dark", v:{ "--bg":"#000000","--card":"#141416","--bd":"#2A2A2E","--ink":"#F4F4F5","--mu":"#B8B8C0","--chip":"#222226","--hi":"#FFFFFF","--on-hi":"#000000","--track":"#2A2A2E","--toff":"#3A3A40","--nav":"#0E0E10","--line":"rgba(255,255,255,.22)" } },
  dia:   { meta:"#F4F4F5", cs:"light", v:{ "--bg":"#F4F4F5","--card":"#FFFFFF","--bd":"#E4E4E7","--ink":"#0B0B0D","--mu":"#5C666B","--chip":"#EFEFF1","--hi":"#0B0B0D","--on-hi":"#FFFFFF","--track":"#E4E4E7","--toff":"#D4D4D8","--nav":"#FFFFFF","--line":"rgba(0,0,0,.16)" } },
  rosa:  { meta:"#FFF1F6", cs:"light", v:{ "--bg":"#FFF1F6","--card":"#FFFFFF","--bd":"#F8D9E5","--ink":"#2B1420","--mu":"#7A5568","--chip":"#FFE3ED","--hi":"#D63B7A","--on-hi":"#FFFFFF","--track":"#F8D9E5","--toff":"#EEBFD1","--nav":"#FFFFFF","--line":"rgba(160,40,95,.20)" } },
  azul:  { meta:"#EFF6FF", cs:"light", v:{ "--bg":"#EFF6FF","--card":"#FFFFFF","--bd":"#D6E6F8","--ink":"#0E1B2B","--mu":"#4F647B","--chip":"#E0EFFD","--hi":"#1C6FD6","--on-hi":"#FFFFFF","--track":"#D6E6F8","--toff":"#BDD6F0","--nav":"#FFFFFF","--line":"rgba(20,85,170,.20)" } }
};
function aplicarTema(id) {
  var p = PALETAS[id] || PALETAS.noche, r = document.documentElement;
  for (var k in p.v) r.style.setProperty(k, p.v[k]);
  r.style.colorScheme = p.cs;
  var m = document.querySelector('meta[name="theme-color"]'); if (m) m.setAttribute("content", p.meta);
}
function temaActual() { try { var t = localStorage.getItem(TEMA_KEY); return PALETAS[t] ? t : "noche"; } catch (e) { return "noche"; } }
aplicarTema(temaActual());
window.addEventListener("storage", function (e) { if (e.key === TEMA_KEY) aplicarTema(temaActual()); });
window.addEventListener("pageshow", function () { aplicarTema(temaActual()); });
</script>

$("btnDel2").addEventListener("click", async () => {
  const user = auth.currentUser, pass = $("delPass").value;
  if (!user) { irAcceso(); return; }
  if (!pass) { msg("Escribe tu contraseña para confirmar."); return; }
  $("btnDel2").disabled = true; msg("Eliminando…");
  try {
    /* 1) Reautenticar primero: si la contraseña falla, no se borra nada */
    await reauthenticateWithCredential(user, EmailAuthProvider.credential(user.email, pass));
    const uid = user.uid, refJ = doc(db, "jugadores", uid);
    const f = (await getDoc(refJ)).data() || {};
    /* 2) Solicitudes y amistades donde participas */
    for (const campo of ["de", "para"]) {
      const q = await getDocs(query(collection(db, "amistades"), where(campo, "==", uid)));
      for (const d of q.docs) await deleteDoc(d.ref);
    }
    /* 3) Código y apodo (liberan el apodo para otras personas) */
    if (f.cod) await deleteDoc(doc(db, "codigos", f.cod));
    if (f.nl) await deleteDoc(doc(db, "apodos", f.nl));
    /* 4) Progreso guardado en la nube (Google Play exige borrar todos los datos de la cuenta).
          Si las reglas de Firestore aún no permiten borrarlo, NO se detiene la eliminación de la cuenta. */
    try { await deleteDoc(doc(db, "progreso", uid)); } catch (e) { console.warn("[eliminar] no se pudo borrar progreso/" + uid, e); }
    /* 5) Ficha y cuenta */
    await deleteDoc(refJ);
    await deleteUser(user);
    limpiarLocal(); irAcceso();
  } catch (e) {
    const c = (e && e.code) || "";
    msg(c === "auth/wrong-password" || c === "auth/invalid-credential" ? "Contraseña incorrecta."
      : c === "auth/too-many-requests" ? "Demasiados intentos. Espera un momento."
      : "No se pudo eliminar. Revisa tu internet e intenta otra vez.");
    $("btnDel2").disabled = false;
    console.error(e);
  }
});
</script>

<script>
/* guardia de internet (script aparte) */
(function () {
  var caja = document.getElementById("sinNet"), fallos = 0, revisando = false;
  var SONDAS = ["https://clients3.google.com/generate_204", "https://www.gstatic.com/generate_204"];
  function probar(u) { return new Promise(function (res) { var c = new AbortController(), t = setTimeout(function () { c.abort(); }, 4000); fetch(u + "?t=" + Date.now(), { mode:"no-cors", cache:"no-store", signal:c.signal }).then(function (r) { clearTimeout(t); res(r.type); }).catch(function () { clearTimeout(t); res("falla"); }); }); }
  async function hay() { if (!navigator.onLine) return false; for (var i = 0; i < SONDAS.length; i++) { if (await probar(SONDAS[i]) === "opaque") return true; } return false; }
  async function revisar() { if (revisando) return; revisando = true; var ok = await hay(); fallos = ok ? 0 : fallos + 1; caja.hidden = !(navigator.onLine === false || fallos >= 2); revisando = false; if (!ok && fallos < 2) setTimeout(revisar, 2000); }
  document.getElementById("snRe").addEventListener("click", revisar);
  addEventListener("online", revisar); addEventListener("offline", revisar); addEventListener("pageshow", revisar);
  document.addEventListener("visibilitychange", function () { if (!document.hidden) revisar(); });
  setInterval(revisar, 15000); revisar();
})();
</script>
<script type="module">
/* ===== NUBE: guarda tu progreso en tu cuenta y lo recupera. Este MISMO bloque va en Acceso, Inicio, Perfil, Mapa, Tienda y Ranking (justo antes de </body>). ===== */
import { initializeApp, getApps, getApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import { getAuth, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";
import { getFirestore, doc, getDoc, setDoc } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

const CONFIG = {
  apiKey: "AIzaSyDrBReVK9v1ioWfBIyMCnvtuUgbbWPcxTE",
  authDomain: "inglesgamer-5a3a9.firebaseapp.com",
  projectId: "inglesgamer-5a3a9",
  storageBucket: "inglesgamer-5a3a9.firebasestorage.app",
  messagingSenderId: "599532765222",
  appId: "1:599532765222:web:38fe3a7348b3c38e3426e7"
};

(function () {
  try {
    const PREF = "ingles_gamer_", META = "ig_nube_meta";
    const SKIP = /_(sesion|tema|sonido|buzon|buzon_pausa|acceso_modo)$/;
    const app = getApps().length ? getApp() : initializeApp(CONFIG);
    const auth = getAuth(app), db = getFirestore(app);
    let user = null, ocupado = false;

    const dormir = ms => new Promise(r => setTimeout(r, ms));
    const estado = (ok, e) => { try { localStorage.setItem("ig_nube_estado", JSON.stringify({ ok: !!ok, t: Date.now(), c: ok ? "" : String((e && (e.code || e.message)) || "error") })); } catch (x) {} };
    const ref = () => doc(db, "progreso", user.uid);
    const claves = () => { const k = []; try { for (let i = 0; i < localStorage.length; i++) { const n = localStorage.key(i); if (n.indexOf(PREF) === 0 && !SKIP.test(n)) k.push(n); } } catch (e) {} return k; };
    const snap = () => { const o = {}; claves().forEach(k => { o[k] = localStorage.getItem(k); }); return o; };
    const ser = o => JSON.stringify(Object.keys(o).sort().map(k => [k, o[k]]));
    const hash = s => { let h = 5381; for (let i = 0; i < s.length; i++) h = ((h << 5) + h + s.charCodeAt(i)) | 0; return h; };
    const getMeta = () => { try { return JSON.parse(localStorage.getItem(META)) || {}; } catch (e) { return {}; } };
    const setMeta = m => { try { localStorage.setItem(META, JSON.stringify(m)); } catch (e) {} };
    /* CORREGIDO: "vacío" = sin progreso real (solo el apodo/perfil no cuenta) */
    const vacio = o => !o || !(o.ingles_gamer_a1_repaso || o.ingles_gamer_aura || o.ingles_gamer_tienda);
    const limpiar = () => claves().forEach(k => localStorage.removeItem(k));
    const cambios = () => !!user && getMeta().uid === user.uid && hash(ser(snap())) !== getMeta().h;
    const puntos = d => {
      try {
        const a = JSON.parse(d.ingles_gamer_aura || "null") || {}, r = JSON.parse(d.ingles_gamer_a1_repaso || "null") || {};
        return (+a.t || 0) + Object.values(r.est || {}).reduce((x, y) => x + (+y || 0), 0);
      } catch (e) { return 0; }
    };

    async function subir() {
      const o = snap(), t = Date.now();
      await setDoc(ref(), { datos: o, t: t, v: 1 });
      setMeta({ uid: user.uid, t: t, h: hash(ser(o)) });
      estado(true);
    }
    function bajar(c) {
      limpiar();
      const d = c.datos || {};
      for (const k in d) if (k.indexOf(PREF) === 0 && !SKIP.test(k) && typeof d[k] === "string") localStorage.setItem(k, d[k]);
      setMeta({ uid: user.uid, t: c.t || Date.now(), h: hash(ser(snap())) });
    }

    async function sync(lanzar) {
      if (!user || ocupado) return "igual";
      ocupado = true;
      let res = "igual";
      try {
        const m = getMeta(), o = snap(), h = hash(ser(o)), s = await getDoc(ref()), c = s.exists() ? s.data() : null, cd = (c && c.datos) || {};
        if (m.uid && m.uid !== user.uid) {
          limpiar();
          if (c) bajar(c); else await subir();
          res = "bajado"; location.reload();
        } else if (m.uid !== user.uid) {
          if (c && (vacio(o) || puntos(cd) >= puntos(o))) { bajar(c); res = "bajado"; location.reload(); }
          else { await subir(); res = "subido"; }
        } else if (c && vacio(o) && !vacio(cd)) {
          bajar(c); res = "bajado"; location.reload();
        } else if (!c || h !== m.h) { await subir(); res = "subido"; }
        else if (c.t > m.t) { bajar(c); res = "bajado"; location.reload(); }
        else estado(true);
      } catch (e) { ocupado = false; estado(false, e); if (lanzar) throw e; return "igual"; }
      ocupado = false;
      return res;
    }

    const guardarYa = () => { if (cambios()) sync(); };
    onAuthStateChanged(auth, u => { user = u; if (u) sync(); });
    document.addEventListener("visibilitychange", () => { if (document.hidden) guardarYa(); else sync(); });
    addEventListener("pagehide", guardarYa);
    setInterval(guardarYa, 45000);

    window.IGNube = {
      listo: true,
      sincronizar: () => sync(),
      usuario: () => user,
      async subirYa() {
        for (let i = 0; i < 40 && !user; i++) await dormir(250);
        if (!user) throw new Error("sin-sesion");
        while (ocupado) await dormir(200);
        const r = await sync(true);
        if (r === "bajado") throw new Error("recargando");
      }
    };
  } catch (e) { console.error("[nube]", e); }
})();
</script>
