<script>
/* ===== WEB (GitHub Pages): convierte los enlaces go:seccion en seccion.html. En App Creator no hace nada. ===== */
(function(){
  var web = /github\.io$/.test(location.hostname);
  window.igURL = function(u){
    u = String(u);
    if (!web || u.indexOf("go:") !== 0) return u;
    var s = u.slice(3);
    return (s === "inicio" ? "index" : s) + ".html";
  };
  if (!web) return;
  document.addEventListener("click", function(e){
    var a = e.target.closest && e.target.closest('a[href^="go:"]');
    if (a){ e.preventDefault(); location.href = igURL(a.getAttribute("href")); }
  }, true);
})();
</script>

<style>

  return mezclar(banco, r).slice(0, PREGUNTAS).map((w, i) => {
    const otros = mezclar(banco.filter(x => x[0] !== w[0]), r).slice(0, 3), tipo = i % 3;
    if (tipo === 0) return { q:"¿Cómo se dice", h:"«" + w[1] + "»?", ok:w[0], op:mezclar([w[0]].concat(otros.map(x => x[0])), r) };
    if (tipo === 1) return { q:"¿Qué significa", h:"«" + w[0] + "»?", ok:w[1], op:mezclar([w[1]].concat(otros.map(x => x[1])), r) };
    return { q:"Completa la frase", h:w[2].replace(/\*[^*]+\*/, "____"), ok:w[0], op:mezclar([w[0]].concat(otros.map(x => x[0])), r) };
  });
}

/* ================= ESTADO ================= */
let ME = null, YO = null, AMIGOS = [], DUELOS = [], cargando = true, error = "";
let vista = "lista", sel = { amigo:"", tema:-1, ap:0 }, actual = null, partida = null, ocupado = false;
const JUG = {};
const vencido = d => !d.rb && Date.now() > (+d.vence || 0);
const soyA = d => d.a === ME.uid;
const otroDe = d => soyA(d) ? { uid:d.b, n:d.bn, av:d.bav, lsk:d.bl && d.bl[0], lmc:d.bl && d.bl[1], lmp:d.bl && d.bl[2] } : { uid:d.a, n:d.an, av:d.aav, lsk:d.al && d.al[0], lmc:d.al && d.al[1], lmp:d.al && d.al[2] };
function resultado(d) {   // "gana" | "pierde" | "empate" | null (sin terminar), desde MI punto de vista
  if (d.est === "rech") return soyA(d) ? "rech" : "rechYo";
  if (!d.rb) return vencido(d) ? (soyA(d) ? "gana" : "vencido") : null;
  const yo = soyA(d) ? d.ra : d.rb, el = soyA(d) ? d.rb : d.ra;
  if (yo.p !== el.p) return yo.p > el.p ? "gana" : "pierde";
  if (Math.abs(yo.ms - el.ms) < 500) return "empate";
  return yo.ms < el.ms ? "gana" : "pierde";
}

/* ---- cobrar los duelos terminados (una sola vez por duelo, en este teléfono) ---- */
function cobrar() {
  const R = REG(); let msg = "";
  DUELOS.forEach(d => {
    if (R.cob.indexOf(d.id) > -1) return;
    const res = resultado(d), ap = +d.ap || 0, pague = soyA(d) || R.pag.indexOf(d.id) > -1;
    if (!res || res === "vencido" || res === "rechYo") { if (res) R.cob.push(d.id); return; }
    if (res === "rech") { if (ap) moverAura(ap, 0, "Duelo rechazado: devuelto"); }
    else if (res === "gana") { moverAura((pague ? ap : 0) + ap * (d.rb ? 1 : 0) + PREMIO.gana, ap * (d.rb ? 1 : 0) + PREMIO.gana, "Duelo ganado vs " + otroDe(d).n); R.g++; msg = "¡Ganaste el duelo contra " + otroDe(d).n + "!"; }
    else if (res === "empate") { moverAura((pague ? ap : 0) + PREMIO.empate, PREMIO.empate, "Duelo empatado"); R.e++; }
    else if (res === "pierde") { R.p++; }
    R.cob.push(d.id);
  });
  R.cob = R.cob.slice(-200); R.pag = R.pag.slice(-200); guardar("ingles_gamer_duelos", R);
  if (msg) { say(msg); try { if (window.IGNube && IGNube.subirYa) IGNube.subirYa(); } catch (e) {} }
}

/* ================= CARGA ================= */
async function cargarAmigos() {
  const a = await getDocs(query(collection(db, "amistades"), where("de", "==", ME.uid)));
  const b = await getDocs(query(collection(db, "amistades"), where("para", "==", ME.uid)));
  const ids = []; a.forEach(d => { if (d.data().estado === "aceptada") ids.push(d.data().para); }); b.forEach(d => { if (d.data().estado === "aceptada") ids.push(d.data().de); });
  AMIGOS = (await Promise.all(Array.from(new Set(ids)).map(async u => { try { const s = await getDoc(doc(db, "jugadores", u)); if (!s.exists()) return null; const x = s.data();
    return JUG[u] = { uid:u, n:String(x.n || "Jugador"), av:+x.av || 0, lsk:+x.lsk || 0, lmc:+x.lmc || 0, lmp:+x.lmp || 0, ult:x.ult && x.ult.toMillis ? x.ult.toMillis() : 0 }; } catch (e) { return null; } }))).filter(Boolean)
    .sort((x, y) => y.ult - x.ult);
}
async function cargarDuelos() {
  const col = collection(db, "duelos"), m = {};
  const [a, b] = await Promise.all([getDocs(query(col, where("a", "==", ME.uid), limit(40))), getDocs(query(col, where("b", "==", ME.uid), limit(40)))]);
  a.forEach(d => { m[d.id] = Object.assign({ id:d.id }, d.data()); }); b.forEach(d => { m[d.id] = Object.assign({ id:d.id }, d.data()); });
  DUELOS = Object.values(m).sort((x, y) => (+y.t || 0) - (+x.t || 0));
}
async function iniciar() {
  cargando = true; error = ""; pintar();
  try { await Promise.all([cargarAmigos(), cargarDuelos()]); cobrar(); } catch (e) { error = e.code || e.message || "error"; }
  cargando = false;
  const con = leer("ig_duelo_con"); try { localStorage.removeItem("ig_duelo_con"); } catch (e) {}
  if (con && con.u && AMIGOS.some(x => x.uid === con.u)) { sel = { amigo:con.u, tema:-1, ap:0 }; vista = "nuevo"; }
  pintar();
}

/* ================= VISTAS ================= */
const temaN = t => t >= 0 && TEMAS[t] ? TEMAS[t].n : "Al azar";
const quedan = d => { const ms = Math.max(0, (+d.vence || 0) - Date.now()), h = Math.floor(ms / 36e5); return h ? h + " h" : Math.max(1, Math.round(ms / 6e4)) + " min"; };
function filaDuelo(d, extra, boton) {
  const o = otroDe(d);
  return '<button type="button" class="fila card" data-duelo="' + esc(d.id) + '">' + look(o, 52) + '<span class="info"><span class="nombre" style="display:block">' + esc(o.n) + '</span><span class="dsub">' + esc(temaN(d.tema)) + (d.ap ? ' · ' + llama(13) + d.ap : '') + ' · ' + extra + '</span></span>' + (boton || '') + '</button>';
}
function vistaLista() {
  if (cargando) return '<div class="card vacio">Cargando duelos…</div>';
  if (error) return '<div class="card vacio"><b>No se pudieron cargar los duelos</b>' + esc(error) + '<div style="margin-top:14px"><button type="button" class="btn" data-acc="reintentar">Reintentar</button></div></div>';
  const R = REG(), turno = DUELOS.filter(d => !soyA(d) && !d.rb && d.est !== "rech" && !vencido(d));
  const espera = DUELOS.filter(d => soyA(d) && !d.rb && d.est !== "rech" && !vencido(d));
  const fin = DUELOS.filter(d => resultado(d) && resultado(d) !== "rechYo").slice(0, 12);
  const etq = { gana:'<b class="w">Ganaste</b>', pierde:'<b class="l">Perdiste</b>', empate:'<b>Empate</b>', vencido:'<b class="l">No jugaste</b>', rech:'<b>Rechazado</b>' };
  return '<div class="card dhero"><div class="dh-top">' + look(miLook(), 64) + '<div><small>TUS DUELOS</small><div class="dh-st"><span><b class="w">' + R.g + '</b>Ganados</span><span><b class="l">' + R.p + '</b>Perdidos</span><span><b>' + R.e + '</b>Empates</span></div></div></div>' +
    '<button type="button" class="btn or" data-acc="nuevo">' + ic("bolt", 20) + ' Nuevo reto</button></div>' +
    (turno.length ? '<div class="sec"><span>TE RETARON</span><b>' + turno.length + '</b></div>' + turno.map(d => filaDuelo(d, 'quedan ' + quedan(d), '<span class="chip or">Jugar</span>')).join("") : "") +
    (espera.length ? '<div class="sec"><span>ESPERANDO A TU AMIGO</span><b>' + espera.length + '</b></div>' + espera.map(d => filaDuelo(d, 'quedan ' + quedan(d), '<span class="chip">' + d.ra.p + '/' + PREGUNTAS + '</span>')).join("") : "") +
    (fin.length ? '<div class="sec"><span>TERMINADOS</span></div>' + fin.map(d => filaDuelo(d, etq[resultado(d)] || "", d.rb ? '<span class="chip">' + (soyA(d) ? d.ra.p + "–" + d.rb.p : d.rb.p + "–" + d.ra.p) + '</span>' : '')).join("") : "") +
    (!turno.length && !espera.length && !fin.length ? '<div class="card vacio"><b>Aún no tienes duelos</b>Reta a un amigo: juegas 10 preguntas y él tiene ' + PLAZO_H + ' h para superarte.</div>' : "");
}
function vistaNuevo() {
  if (!AMIGOS.length) return '<div class="card vacio"><b>Necesitas amigos para retar</b>Agrégalos desde el Ranking con su código.<div style="margin-top:14px"><a class="btn" href="go:ranking">Ir al Ranking</a></div></div>';
  const s = saldo();
  return '<div class="sec" style="margin-top:0"><span>1 · ELIGE A QUIÉN RETAR</span></div>' +
    AMIGOS.map(j => '<button type="button" class="fila card' + (sel.amigo === j.uid ? " sel" : "") + '" data-amigo="' + esc(j.uid) + '">' + look(j, 48) + '<span class="info"><span class="nombre" style="display:block">' + esc(j.n) + '</span></span><span class="rad"></span></button>').join("") +
    '<div class="sec"><span>2 · TEMA</span></div><div class="card chips">' + [-1].concat(TEMAS.map((t, i) => i)).map(i => '<button type="button" class="chip' + (sel.tema === i ? " on" : "") + '" data-tema="' + i + '">' + esc(temaN(i)) + '</button>').join("") + '</div>' +
    '<div class="sec"><span>3 · APUESTA</span><b>Tienes ' + s + '</b></div><div class="card chips">' + APUESTAS.map(a => '<button type="button" class="chip' + (sel.ap === a ? " on" : "") + '" data-ap="' + a + '"' + (a > s ? " disabled" : "") + '>' + (a ? llama(14) + a : "Sin apuesta") + '</button>').join("") + '</div>' +
    '<p class="nota">Juegas ahora tus ' + PREGUNTAS + ' preguntas. Tu amigo tendrá ' + PLAZO_H + ' h para jugar las mismas. Gana quien acierte más; si empatan, el más rápido. El ganador se lleva la apuesta de los dos + ' + PREMIO.gana + ' de Aura.</p>' +
    '<button type="button" class="btn or big" data-acc="jugarNuevo"' + (sel.amigo ? "" : " disabled") + '>Jugar y enviar reto</button>';
}
function vistaJuego() {
  const P = partida, q = P.qs[P.i], pct = Math.round(P.i / PREGUNTAS * 100);
  return '<div class="jtop"><span>Pregunta ' + (P.i + 1) + ' / ' + PREGUNTAS + '</span><span id="reloj">' + reloj() + '</span></div><div class="bar"><i style="width:' + pct + '%"></i></div>' +
    '<div class="card jq"><small>' + esc(q.q) + '</small><b>' + esc(q.h) + '</b></div>' +
    '<div class="opts">' + q.op.map((o, i) => '<button type="button" class="op" data-op="' + i + '">' + esc(o) + '</button>').join("") + '</div>' +
    '<div class="card fila jvs" style="cursor:default">' + look(miLook(), 40) + '<span class="info"><span class="nombre" style="display:block">Tú · ' + P.r.split("").filter(c => c === "1").length + ' aciertos</span></span><span class="chip">' + (P.d ? esc(otroDe(P.d).n) + ' ya jugó' : 'Tu amigo juega después') + '</span></div>';
}
const reloj = () => { const s = Math.floor((Date.now() - partida.t0) / 1000); return Math.floor(s / 60) + ":" + String(s % 60).padStart(2, "0"); };
const tiempo = ms => { const s = Math.round(ms / 1000); return Math.floor(s / 60) + ":" + String(s % 60).padStart(2, "0"); };
function tiras(r) { return '<div class="tira">' + String(r || "").split("").map(c => '<i class="' + (c === "1" ? "si" : "no") + '"></i>').join("") + '</div>'; }
function vistaDuelo() {
  const d = DUELOS.find(x => x.id === actual); if (!d) return vistaLista();
  const o = otroDe(d), yo = soyA(d) ? d.ra : d.rb, el = soyA(d) ? d.rb : d.ra, res = resultado(d), m = miLook();
  if (!soyA(d) && !d.rb && d.est !== "rech" && !vencido(d)) {   // me retaron y no he jugado
    return '<div class="card dres reto">' + look(o, 88, "#FF8A3D") + '<small>' + esc(o.n.toUpperCase()) + ' TE RETÓ</small><b>' + esc(temaN(d.tema)) + '</b>' +
      '<div class="dmeta"><span class="chip">' + PREGUNTAS + ' preguntas</span>' + (d.ap ? '<span class="chip">Apuesta ' + llama(14) + d.ap + '</span>' : '') + '<span class="chip">Quedan ' + quedan(d) + '</span></div>' +
      '<p class="nota" style="text-align:center">Su puntaje se revela cuando termines.' + (d.ap ? ' Para aceptar pones ' + d.ap + ' de Aura (tienes ' + saldo() + ').' : '') + '</p></div>' +
      '<button type="button" class="btn or big" data-acc="aceptar"' + (d.ap > saldo() ? " disabled" : "") + '>' + (d.ap > saldo() ? "No tienes Aura suficiente" : "Aceptar y jugar") + '</button><button type="button" class="btn out" data-acc="rechazar">Rechazar</button>';
  }
  const vs = '<div class="card dvs"><div class="p">' + look(m, 64, res === "gana" ? "#5DD879" : "") + '<b>Tú</b><span>' + (yo ? yo.p + '/' + PREGUNTAS : '—') + '</span><small>' + (yo ? tiempo(yo.ms) : '') + '</small></div><span class="vsx">VS</span>' +
    '<div class="p">' + look(o, 64, res === "pierde" ? "#5DD879" : "") + '<b>' + esc(o.n) + '</b><span>' + (el ? el.p + '/' + PREGUNTAS : '⏳') + '</span><small>' + (el ? tiempo(el.ms) : 'quedan ' + quedan(d)) + '</small></div></div>';
  const tit = { gana:"¡Ganaste!", pierde:"Perdiste", empate:"¡Empate!", rech:"Rechazó el reto", vencido:"No alcanzaste a jugar" }[res] || "Esperando a " + o.n;
  const sub = res === "gana" ? '<span class="chip or">+' + ((+d.ap || 0) * (d.rb ? 1 : 0) + PREMIO.gana) + ' ' + llama(14) + ' Aura</span>' + (!d.rb ? '<p class="nota" style="text-align:center">' + esc(o.n) + ' no jugó a tiempo.</p>' : '')
    : res === "empate" ? '<span class="chip">+' + PREMIO.empate + ' ' + llama(14) + ' Aura</span>' : res === "pierde" && d.ap ? '<span class="chip">−' + d.ap + ' ' + llama(14) + '</span>'
    : res === "rech" && d.ap ? '<span class="chip">Te devolvimos ' + d.ap + ' de Aura</span>' : !res ? '<p class="nota" style="text-align:center">Te avisamos aquí cuando juegue. Si no juega en ' + quedan(d) + ', ganas tú.</p>' : '';
  const det = d.rb ? '<div class="card"><div class="sec" style="margin:0 0 8px"><span>PREGUNTA POR PREGUNTA</span></div><div class="trow"><span>Tú</span>' + tiras(yo.r) + '</div><div class="trow"><span>' + esc(o.n) + '</span>' + tiras(el.r) + '</div></div>' : yo ? '<div class="card"><div class="sec" style="margin:0 0 8px"><span>TUS RESPUESTAS</span></div>' + tiras(yo.r) + '</div>' : '';
  return '<div class="card dres ' + (res || "") + '"><small>DUELO · ' + esc(temaN(d.tema).toUpperCase()) + '</small><h2>' + tit + '</h2>' + sub + '</div>' + vs + det +
    (res ? '<button type="button" class="btn or big" data-acc="revancha" data-u="' + esc(o.uid) + '">' + (res === "pierde" ? "Revancha" : "Retar otra vez") + '</button>' : '') +
    '<button type="button" class="btn out" data-acc="volver">Mis duelos</button>';
}
function pintar() {
  const t = { lista:"Duelos", nuevo:"Nuevo reto", juego:"Duelo", duelo:"Duelo" }[vista];
  $("titulo").textContent = t;
  $("btnVolver").hidden = vista === "lista";
  $("cont").innerHTML = vista === "nuevo" ? vistaNuevo() : vista === "juego" ? vistaJuego() : vista === "duelo" ? vistaDuelo() : vistaLista();
  document.body.classList.toggle("jugando", vista === "juego");
}

/* ================= JUEGO ================= */
let tReloj = null;
function empezar(tema, seed, d) {
  partida = { qs:crearPreguntas(tema, seed), i:0, r:"", t0:Date.now(), tema, seed, d, bloq:false };
  vista = "juego"; pintar(); clearInterval(tReloj); tReloj = setInterval(() => { const r = $("reloj"); if (r && partida) r.textContent = reloj(); }, 500);
}
function responder(i) {
  const P = partida; if (!P || P.bloq) return; P.bloq = true;
  const q = P.qs[P.i], ok = q.op[i] === q.ok, bs = document.querySelectorAll(".op");
  bs[i].classList.add(ok ? "si" : "no"); if (!ok) bs[q.op.indexOf(q.ok)].classList.add("si");
  try { if (window.IGSonido) IGSonido(ok ? "ok" : "mal"); } catch (e) {}
  P.r += ok ? "1" : "0";
  setTimeout(() => { P.i++; P.bloq = false; if (P.i >= PREGUNTAS) terminar(); else pintar(); }, ok ? 550 : 1100);
}
async function terminar() {
  clearInterval(tReloj);
  const P = partida, res = { p:P.r.split("").filter(c => c === "1").length, ms:Date.now() - P.t0, r:P.r };
  $("cont").innerHTML = '<div class="card vacio">Enviando…</div>';
  try {
    if (P.d) {   // respondo a un reto
      await updateDoc(doc(db, "duelos", P.d.id), { rb:res, est:"fin" });
      P.d.rb = res; P.d.est = "fin"; actual = P.d.id;
    } else {     // creo un reto nuevo
      const m = miLook(), j = JUG[sel.amigo], ref = doc(collection(db, "duelos")), ahora = Date.now();
      const d = { a:ME.uid, b:j.uid, an:m.n, bn:j.n, aav:m.av, bav:j.av, al:[m.lsk, m.lmc, m.lmp], bl:[j.lsk, j.lmc, j.lmp],
        tema:P.tema, seed:P.seed, ap:sel.ap, ra:res, rb:null, est:"esp", t:ahora, vence:ahora + PLAZO_H * 36e5 };
      await setDoc(ref, d);
      if (sel.ap) { moverAura(-sel.ap, 0, "Apuesta duelo vs " + j.n); const R = REG(); R.pag.push(ref.id); guardar("ingles_gamer_duelos", R); }
      DUELOS.unshift(Object.assign({ id:ref.id }, d)); actual = ref.id;
    }
    partida = null; cobrar(); vista = "duelo"; pintar();
    try { if (window.IGNube && IGNube.subirYa) IGNube.subirYa().then(() => { try { if (window.IGFicha) IGFicha.publicar(); } catch (e) {} }); } catch (e) {}
  } catch (e) {
    $("cont").innerHTML = '<div class="card vacio"><b>No se pudo enviar</b>' + esc(e.code || e.message || "error") + '<div style="margin-top:14px"><button type="button" class="btn" data-acc="reenviar">Reintentar</button></div></div>';
  }
}

/* ================= EVENTOS ================= */
document.addEventListener("click", async e => {
  const b = e.target.closest("button,[data-duelo]"); if (!b || b.disabled) return;
  if (b.id === "btnVolver") { if (vista === "juego" && !confirm("¿Salir del duelo? Perderás esta partida.")) return; clearInterval(tReloj); partida = null; vista = "lista"; pintar(); return; }
  if (b.dataset.op !== undefined) return responder(+b.dataset.op);
  if (b.dataset.duelo) { actual = b.dataset.duelo; vista = "duelo"; pintar(); return; }
  if (b.dataset.amigo) { sel.amigo = b.dataset.amigo; pintar(); return; }
  if (b.dataset.tema !== undefined) { sel.tema = +b.dataset.tema; pintar(); return; }
  if (b.dataset.ap !== undefined) { sel.ap = +b.dataset.ap; pintar(); return; }
  const a = b.dataset.acc; if (!a || ocupado) return;
  if (a === "reintentar") return iniciar();
  if (a === "reenviar") return terminar();
  if (a === "volver") { vista = "lista"; pintar(); return; }
  if (a === "nuevo") { sel = { amigo:AMIGOS[0] && AMIGOS.length === 1 ? AMIGOS[0].uid : "", tema:-1, ap:0 }; vista = "nuevo"; pintar(); return; }
  if (a === "revancha") { sel = { amigo:b.dataset.u, tema:-1, ap:0 }; vista = "nuevo"; pintar(); return; }
  if (a === "jugarNuevo") { if (sel.ap > saldo()) return say("No tienes Aura suficiente"); empezar(sel.tema, Math.floor(Math.random() * 1e9), null); return; }
  const d = DUELOS.find(x => x.id === actual); if (!d) return;
  if (a === "aceptar") {
    if (vencido(d)) { say("Este reto ya venció"); pintar(); return; }
    if (d.ap) { if (d.ap > saldo()) return say("No tienes Aura suficiente"); const R = REG(); if (R.pag.indexOf(d.id) < 0) { moverAura(-d.ap, 0, "Apuesta duelo vs " + d.an); R.pag.push(d.id); guardar("ingles_gamer_duelos", R); } }
    empezar(d.tema, d.seed, d); return;
  }
  if (a === "rechazar") {
    ocupado = true;
    try { await updateDoc(doc(db, "duelos", d.id), { est:"rech" }); d.est = "rech"; vista = "lista"; say("Reto rechazado"); } catch (x) { say("No se pudo: " + (x.code || "error")); }
    ocupado = false; pintar();
  }
});
window.addEventListener("pageshow", () => { if (ME && vista === "lista") iniciar(); });
document.addEventListener("visibilitychange", () => { if (!document.hidden && ME && vista === "lista") iniciar(); });

/* arranque */
$("btnVolver").innerHTML = ic("back", 22, 2.4);
$("navbar").innerHTML = NAV.map(n => '<a' + (n.activo ? ' class="on" aria-current="page"' : '') + ' href="' + n.url + '">' + ic(n.i, 26) + n.nombre + '</a>').join("");
onAuthStateChanged(auth, u => {
  if (!u) { location.href = igURL("go:acceso"); return; }
  ME = u; iniciar();
});
</script>

  authDomain: "inglesgamer-5a3a9.firebaseapp.com",
  projectId: "inglesgamer-5a3a9",
  storageBucket: "inglesgamer-5a3a9.firebasestorage.app",
  messagingSenderId: "599532765222",
  appId: "1:599532765222:web:38fe3a7348b3c38e3426e7"
};

(function () {
  try {
    const PREF = "ingles_gamer_", META = "ig_nube_meta";
    const SKIP = /_(sesion|tema|sonido|buzon|buzon_pausa|acceso_modo)$/;   /* datos del celular que NO se guardan en la cuenta */
    const app = getApps().length ? getApp() : initializeApp(CONFIG);
    const auth = getAuth(app), db = getFirestore(app);
    let user = null, ocupado = false;

    const dormir = ms => new Promise(r => setTimeout(r, ms));
    const estado = (ok, e) => { try { localStorage.setItem("ig_nube_estado", JSON.stringify({ ok: !!ok, t: Date.now(), c: ok ? "" : String((e && (e.code || e.message)) || "error") })); } catch (x) {} };
    const ref = () => doc(db, "progreso", user.uid);
    const claves = () => { const k = []; try { for (let i = 0; i < localStorage.length; i++) { const n = localStorage.key(i); if (n.indexOf(PREF) === 0 && !SKIP.test(n)) k.push(n); } } catch (e) {} return k; };
    const snap = () => { const o = {}; claves().forEach(k => { o[k] = localStorage.getItem(k); }); return o; };
    const ser = o => JSON.stringify(Object.keys(o).sort().map(k => [k, o[k]]));
    const hash = s => { let h = 5381; for (let i = 0; i < s.length; i++) h = ((h << 5) + h + s.charCodeAt(i)) | 0; return h; };
    const getMeta = () => { try { return JSON.parse(localStorage.getItem(META)) || {}; } catch (e) { return {}; } };
    const setMeta = m => { try { localStorage.setItem(META, JSON.stringify(m)); } catch (e) {} };
    /* CORREGIDO: "vacío" = sin progreso real (solo el apodo/perfil no cuenta). Así un celular casi vacío nunca pisa la nube. */
    const vacio = o => !o || !(o.ingles_gamer_a1_repaso || o.ingles_gamer_aura || o.ingles_gamer_tienda);
    const limpiar = () => claves().forEach(k => localStorage.removeItem(k));
    const cambios = () => !!user && getMeta().uid === user.uid && hash(ser(snap())) !== getMeta().h;
    /* "puntos" = Aura + estrellas: sirve para decidir cuál progreso es mayor cuando no se sabe de quién es */
    const puntos = d => {
      try {
        const a = JSON.parse(d.ingles_gamer_aura || "null") || {}, r = JSON.parse(d.ingles_gamer_a1_repaso || "null") || {};
        return (+a.t || 0) + Object.values(r.est || {}).reduce((x, y) => x + (+y || 0), 0);
      } catch (e) { return 0; }
    };

    async function subir() {
      const o = snap(), t = Date.now();
      await setDoc(ref(), { datos: o, t: t, v: 1 });
      setMeta({ uid: user.uid, t: t, h: hash(ser(o)) });
      estado(true);
    }
    function bajar(c) {
      limpiar();
      const d = c.datos || {};
      for (const k in d) if (k.indexOf(PREF) === 0 && !SKIP.test(k) && typeof d[k] === "string") localStorage.setItem(k, d[k]);
      setMeta({ uid: user.uid, t: c.t || Date.now(), h: hash(ser(snap())) });
    }

    /* devuelve "subido", "bajado" (la página se recarga) o "igual" */
    async function sync(lanzar) {
      if (!user || ocupado) return "igual";
      ocupado = true;
      let res = "igual";
      try {
        const m = getMeta(), o = snap(), h = hash(ser(o)), s = await getDoc(ref()), c = s.exists() ? s.data() : null, cd = (c && c.datos) || {};
        if (m.uid && m.uid !== user.uid) {                       /* el progreso de este celular es de OTRA cuenta: se borra y se carga el de esta */
          limpiar();
          if (c) bajar(c); else await subir();
          res = "bajado"; location.reload();
        } else if (m.uid !== user.uid) {                         /* sin dueño: primera vez con cuentas, o celular recién limpiado */
          if (c && (vacio(o) || puntos(cd) >= puntos(o))) { bajar(c); res = "bajado"; location.reload(); }
          else { await subir(); res = "subido"; }
        } else if (c && vacio(o) && !vacio(cd)) {                /* nunca se pisa la nube con un celular vacío */
          bajar(c); res = "bajado"; location.reload();
        } else if (!c || h !== m.h) { await subir(); res = "subido"; }
        else if (c.t > m.t) { bajar(c); res = "bajado"; location.reload(); }
        else estado(true);                                       /* la nube ya tiene lo mismo que este celular */
      } catch (e) { ocupado = false; estado(false, e); if (lanzar) throw e; return "igual"; }
      ocupado = false;
      return res;
    }

    const guardarYa = () => { if (cambios()) sync(); };
    onAuthStateChanged(auth, u => { user = u; if (u) sync(); });
    document.addEventListener("visibilitychange", () => { if (document.hidden) guardarYa(); else sync(); });
    addEventListener("pagehide", guardarYa);
    setInterval(guardarYa, 45000);

    window.IGNube = {
      listo: true,
      sincronizar: () => sync(),
      usuario: () => user,
      /* para "Cerrar sesión": guarda ahora mismo y falla si no se pudo (así nunca se pierde progreso) */
      async subirYa() {
        for (let i = 0; i < 40 && !user; i++) await dormir(250);
        if (!user) throw new Error("sin-sesion");
        while (ocupado) await dormir(200);
        const r = await sync(true);
        if (r === "bajado") throw new Error("recargando");
      }
    };
  } catch (e) { console.error("[nube]", e); }
})();
</script>

    async function publicar(forzar) {
      if (!user || ocupado) return;

<script>
/* ===== SONIDO AL TOCAR: "Burbuja" (el mismo de toda la app). Respeta el botón de sonido ("ingles_gamer_sonido" = "0" apagado). ===== */
(function () {
  var AC = null;
  function activo() { try { return localStorage.getItem("ingles_gamer_sonido") !== "0"; } catch (e) { return true; } }
  function burbuja() {
    if (!activo()) return;
    try {
      if (!AC) { var C = window.AudioContext || window.webkitAudioContext; if (!C) return; AC = new C(); }
      if (AC.state === "suspended") AC.resume();
      var o = AC.createOscillator(), g = AC.createGain(), t = AC.currentTime;
      o.type = "sine"; o.frequency.setValueAtTime(450, t); o.frequency.exponentialRampToValueAtTime(650, t + 0.056);
      g.gain.setValueAtTime(0.0001, t); g.gain.exponentialRampToValueAtTime(0.07, t + 0.008); g.gain.exponentialRampToValueAtTime(0.0001, t + 0.07);
      o.connect(g); g.connect(AC.destination); o.start(t); o.stop(t + 0.12);
    } catch (e) {}
  }
  /* suena al tocar botones y enlaces; la palabra del día no, porque ya reproduce su propio audio */
  document.addEventListener("click", function (e) {
    var t = e.target && e.target.closest ? e.target : null; if (!t) return;
    if (t.closest("#vocab,[data-sin-sonido]")) return;
    if (t.closest("button,a,[role=button]")) burbuja();
  }, true);
  window.IGBurbuja = burbuja;
})();
