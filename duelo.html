<script>
/* ===== WEB (GitHub Pages): convierte los enlaces go:seccion en seccion.html. En App Creator no hace nada. ===== */
(function(){
  var web = /github\.io$/.test(location.hostname);
  window.igURL = function(u){
    u = String(u);
    if (!web || u.indexOf("go:") !== 0) return u;
    var s = u.slice(3);
    return (s === "inicio" ? "index" : s) + ".html";
  };
  if (!web) return;
  document.addEventListener("click", function(e){
    var a = e.target.closest && e.target.closest('a[href^="go:"]');
    if (a){ e.preventDefault(); location.href = igURL(a.getAttribute("href")); }
  }, true);
})();
</script>

  var p = PALETAS[id] || PALETAS.noche, r = document.documentElement;

window.addEventListener("storage", function (e) { if (e.key === TEMA_KEY) aplicarTema(temaActual()); });

<style>
:root{--bg:#000;--card:#141416;--bd:#2A2A2E;--ink:#F4F4F5;--mu:#B8B8C0;--chip:#222226;--gold:#FFD166;--hi:#FFFFFF;--on-hi:#000000;--track:#2A2A2E;--toff:#3A3A40;--nav:#0E0E10;--av1:#3A3A40;--av2:#101012;--ok:#7BE3A8;--mal:#FF6B6B}

nav{flex-shrink:0;background:var(--nav);border-radius:28px 28px 0 0;border-top:1px solid var(--bd)}

[hidden]{display:none!important}
.resb{display:flex;flex-direction:column;gap:12px}.resb:empty{display:none}
.hnm{font-size:26px;font-weight:800;letter-spacing:-.5px;overflow-wrap:anywhere}

.fr{display:inline-flex;align-items:flex-end;justify-content:center;overflow:hidden;border-radius:50%;border:5px solid var(--b,#9A6A3A);background:#0F0F12;box-shadow:0 0 var(--g,0px) var(--b);flex:none;position:relative;z-index:2}
.m0{--b:#9A6A3A}.m1{--b:#9A9AA6}.m2{--b:#FFC83D;--g:14px}.m3{--b:#3FD8C8;--g:14px}.m5{--b:#E8F7FF;--g:18px}
.m7{--b:#C9BFA0;border-style:dashed!important}
.m4{animation:fuego 1s ease-in-out infinite alternate}.m6{animation:arcoB 3s linear infinite}
@keyframes fuego{from{border-color:#FF4D4D;box-shadow:0 0 8px #FF4D4D}to{border-color:#FFC83D;box-shadow:0 0 22px #FF8A3D}}

.fx{position:absolute;inset:0;overflow:hidden;pointer-events:none}.fx::before,.fx::after{content:"";position:absolute;inset:0}
.f-mp0::before{background:radial-gradient(circle,#FFF28A 0 2px,transparent 3px) 0 0/70px 60px,radial-gradient(circle,#B6FF8A 0 1.5px,transparent 2.5px) 30px 25px/90px 70px;animation:luci 6s ease-in-out infinite alternate,parp2 1.8s ease-in-out infinite alternate}

/* ===== DUELOS v2: VS (choque de rayos), ARENA y PODIO ===== */
.chz{position:fixed;z-index:200;pointer-events:none;border-radius:2px}
.vsov{position:fixed;inset:0;z-index:120;overflow:hidden;background:#0A1E4A;font-family:Nunito,sans-serif;color:#fff;transition:opacity .25s}
.vsov.sale{opacity:0}
.vs-l,.vs-r{position:absolute;top:calc(90px + env(safe-area-inset-top));width:50%;display:flex;flex-direction:column;align-items:center;gap:8px}
.vs-l{left:0;transform:translateX(-120%)}.vs-r{right:0;transform:translateX(120%)}
.vs-l b,.vs-r b{font-size:20px;font-weight:900;max-width:90%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.vs-l small,.vs-r small{font-size:11px;font-weight:900;letter-spacing:.14em;opacity:.85}
.vs-l .lmini{box-shadow:0 0 0 4px #FF8A3D,0 10px 30px rgba(0,0,0,.5)}.vs-r .lmini{box-shadow:0 0 0 4px #4DA3FF,0 10px 30px rgba(0,0,0,.5)}
.vs-izq{position:absolute;inset:0;background:linear-gradient(160deg,#C2410C,#7A1F04);clip-path:polygon(0 0,62% 0,38% 100%,0 100%)}
.vs-rayo{position:absolute;inset:0;width:100%;height:100%;z-index:2;overflow:visible;pointer-events:none}
.vs-rayo line{stroke:#FFF6D0;stroke-width:5;stroke-dasharray:2000;stroke-dashoffset:2000;filter:drop-shadow(0 0 3px #FFD166) drop-shadow(0 0 8px #FFB020)}
.vs-txt{position:absolute;left:50%;top:calc(130px + env(safe-area-inset-top));width:140px;margin-left:-70px;text-align:center;font-size:66px;font-weight:900;font-style:italic;letter-spacing:-2px;color:#fff;text-shadow:0 0 22px #FFD166,0 5px 0 #000;transform:scale(0) rotate(-20deg);z-index:3}
.vs-flash{position:absolute;inset:0;background:#fff;opacity:0;pointer-events:none;z-index:4}
.vs-info{z-index:5;position:absolute;left:18px;right:18px;top:calc(300px + env(safe-area-inset-top));max-width:480px;margin:auto;display:flex;flex-direction:column;gap:8px;opacity:0;transform:translateY(20px)}
.vs-c{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:12px 16px;border-radius:18px;background:rgba(0,0,0,.45);border:1px solid rgba(255,255,255,.15)}
.vs-c span{font-size:12px;letter-spacing:.14em;color:#D8D8E0;font-weight:900}.vs-c b{display:flex;align-items:center;gap:4px;font-size:17px;font-weight:900}
.vs-bts{z-index:5;position:absolute;left:18px;right:18px;bottom:calc(22px + env(safe-area-inset-bottom));max-width:480px;margin:auto;display:flex;flex-direction:column;gap:6px;opacity:0}
.vs-go{width:100%;display:flex;align-items:center;justify-content:center;text-align:center;height:60px;border:0;border-radius:99px;background:linear-gradient(#FFE07A,#FF9A2E);color:#2A1408;font:900 22px Nunito,sans-serif;letter-spacing:.04em;box-shadow:0 5px 0 #A0561A;cursor:pointer}
.vs-go:disabled{filter:grayscale(1);opacity:.6;font-size:17px}.vs-go:active{transform:translateY(2px);box-shadow:0 3px 0 #A0561A}
.vs-no{width:100%;text-align:center;height:46px;border:0;background:none;color:#E8E0D0;font:800 15px Nunito,sans-serif;cursor:pointer}
.vs-x{position:absolute;left:14px;top:calc(14px + env(safe-area-inset-top));width:44px;height:44px;border-radius:50%;border:1px solid rgba(255,255,255,.25);background:rgba(0,0,0,.35);color:#fff;display:flex;align-items:center;justify-content:center;z-index:5;cursor:pointer}
.vsov.go .vs-l,.vsov.go .vs-r{animation:vsEntra .45s .1s cubic-bezier(.3,1.4,.5,1) forwards}
.vsov.go .vs-rayo line{animation:vsRayo .35s .55s ease-out forwards}.vsov.go .vs-flash{animation:vsFlash .45s .6s forwards}
.vsov.go .vs-txt{animation:vsIn .45s .65s cubic-bezier(.3,1.8,.5,1) forwards,vsLate 1s 1.2s ease-in-out infinite alternate}
.vsov.go .vs-info{animation:vsSube .45s 1.05s forwards}.vsov.go .vs-bts{animation:vsSube .4s 1.4s forwards}
.vsov.go .vs-go:not(:disabled){animation:vsPulso 1s 2s ease-in-out infinite alternate}
@keyframes vsEntra{to{transform:none}}@keyframes vsRayo{to{stroke-dashoffset:0}}@keyframes vsFlash{0%{opacity:.9}100%{opacity:0}}
@keyframes vsIn{to{transform:scale(1) rotate(-8deg)}}@keyframes vsLate{from{transform:scale(1) rotate(-8deg)}to{transform:scale(1.1) rotate(-4deg)}}
@keyframes vsSube{to{opacity:1;transform:none}}@keyframes vsPulso{to{transform:scale(1.04)}}

@keyframes atk{50%{transform:translateX(18px) scale(1.18)}}

.hbar{flex:1;height:14px;border-radius:99px;background:var(--track);overflow:hidden;position:relative}

.ring{position:relative;width:78px;height:78px;margin:2px auto 0}
.ring svg{transform:rotate(-90deg)}.ring circle{fill:none;stroke-width:6}.ring .t{stroke:var(--track)}
.ring .p{stroke:#FFD166;stroke-linecap:round;stroke-dasharray:213.6;stroke-dashoffset:0;animation:ringT linear forwards}
@keyframes ringT{70%{stroke:#FFD166}to{stroke-dashoffset:213.6;stroke:#FF6B6B}}
.ring b{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-size:26px;font-weight:900}
.ring b.urg{color:#FF6B6B;animation:urg .5s ease-in-out infinite alternate}@keyframes urg{to{transform:scale(1.2)}}
.preg{position:relative;overflow:hidden;padding:18px 14px;border-radius:24px;text-align:center;background:linear-gradient(160deg,#2A1A40,var(--card));border:1px solid #4A3A70;animation:pregIn .4s cubic-bezier(.3,1.4,.5,1)}
.preg small{display:block;font-size:13px;font-weight:900;color:#C9BEF0}.preg b{display:block;margin-top:6px;font-size:26px;font-weight:900;line-height:1.25}
.preg:before{content:"";position:absolute;top:0;bottom:0;width:40%;left:-40%;background:linear-gradient(90deg,transparent,rgba(255,255,255,.1),transparent);animation:brilloQ 2.8s linear infinite}
@keyframes brilloQ{to{left:110%}}@keyframes pregIn{from{opacity:0;transform:translateY(-16px) scale(.96)}}
.golpe{position:absolute;right:12px;top:8px;font-size:18px;font-weight:900;color:#FFD166;text-shadow:0 2px 0 #7A4300;opacity:0}
.golpe.on{animation:golpeT .9s ease-out}@keyframes golpeT{0%{opacity:0;transform:scale(.4)}30%{opacity:1;transform:scale(1.3) rotate(-8deg)}100%{opacity:0;transform:translateY(-24px)}}
.opts4{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.o4{position:relative;min-height:78px;padding:10px;border:0;border-radius:20px;display:flex;align-items:center;gap:10px;text-align:left;color:#fff;font:900 18px Nunito,sans-serif;cursor:pointer;box-shadow:0 5px 0 rgba(0,0,0,.35);touch-action:manipulation;animation:o4In .38s cubic-bezier(.3,1.7,.5,1) both}

@keyframes o4In{from{opacity:0;transform:scale(.6)}to{opacity:1;transform:none}}
@keyframes o4Ok{40%{transform:scale(1.08)}100%{transform:none}}@keyframes o4No{25%{transform:translateX(-7px)}75%{transform:translateX(7px)}}
/* PODIO */
.rp{position:relative;overflow:hidden;display:flex;flex-direction:column;align-items:center;padding:18px 12px 16px;border-radius:28px;text-align:center;border:1px solid var(--bd);background:radial-gradient(circle at 50% 30%,#4A2A08,#0E0A06 72%)}
.rp.lose{background:radial-gradient(circle at 50% 30%,#1E2230,#08090C 72%)}.rp.emp{background:radial-gradient(circle at 50% 30%,#14304A,#06090E 72%)}
.rp-rays{position:absolute;width:760px;height:760px;left:50%;top:190px;margin:-380px 0 0 -380px;border-radius:50%;background:repeating-conic-gradient(rgba(255,200,80,.15) 0 8deg,transparent 8deg 20deg);-webkit-mask:radial-gradient(circle,#000 10%,transparent 55%);mask:radial-gradient(circle,#000 10%,transparent 55%);animation:rpGira 16s linear infinite}
.rp.lose .rp-rays{display:none}
.rp-k{position:relative;font-size:11px;font-weight:900;letter-spacing:.16em;color:#E9DCC0}
.rp-tt{position:relative;margin:6px 0 0;font-size:40px;font-weight:900;font-style:italic;letter-spacing:.01em;color:#FFD166;text-shadow:0 4px 0 #7A4300,0 0 22px rgba(255,190,60,.5)}
.rp.lose .rp-tt{color:#AEB4C0;text-shadow:0 4px 0 #23262E}.rp.emp .rp-tt{color:#9FD0FF;text-shadow:0 4px 0 #0A2A4A}
.rp-pod{position:relative;display:flex;align-items:flex-end;justify-content:center;gap:12px;margin-top:16px}
.rp-col{display:flex;flex-direction:column;align-items:center;gap:6px;position:relative}
.rp-col b{font-size:15px;font-weight:900;max-width:110px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.rp-base{width:104px;height:74px;border-radius:12px 12px 0 0;display:flex;flex-direction:column;align-items:center;justify-content:flex-start;padding-top:8px;background:linear-gradient(#5A6A80,#2E3644)}
.rp-col.top .rp-base{height:112px;background:linear-gradient(#FFD166,#C98A1A);color:#2A1408}
.rp.lose .rp-col.top .rp-base{background:linear-gradient(#7A8AA0,#3E4656);color:#fff}
.rp-base span{font-size:32px;font-weight:900;line-height:1}.rp-base small{font-size:12px;font-weight:800;opacity:.8}
.rp-cor{position:absolute;top:-34px;font-size:30px;z-index:2}
.rp.lose .rp-col:not(.top){filter:grayscale(.6)}
.rp-aura{position:relative;margin-top:14px;display:inline-flex;align-items:center;gap:6px;padding:8px 18px;border-radius:99px;border:2px solid #FFD166;background:rgba(255,209,102,.12);color:#FFD166;font-size:19px;font-weight:900}

.rp.go .rp-base{animation:rpAlto .7s .45s cubic-bezier(.3,1.3,.5,1) both}.rp.go .rp-col.top .rp-base{animation-delay:.35s}
.rp.go .rp-cor{animation:rpCae .6s 1.2s cubic-bezier(.3,1.6,.5,1) both}
.rp.go .rp-aura{animation:rpSube .4s 1.7s both}

@keyframes rpGira{to{transform:rotate(360deg)}}@keyframes rpSello{0%{opacity:0;transform:scale(2.4)}100%{opacity:1;transform:none}}
@keyframes rpAlto{from{transform:scaleY(0);transform-origin:bottom}to{transform:scaleY(1);transform-origin:bottom}}
@keyframes rpCae{from{opacity:0;transform:translateY(-160px) rotate(-30deg)}to{opacity:1;transform:none}}
@keyframes rpSube{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
.tira i{animation:tiraIn .25s both}@keyframes tiraIn{from{transform:scaleY(0)}}
@media (prefers-reduced-motion:reduce){.vsov *,.rp *,.ar *{animation-duration:.01s!important;animation-delay:0s!important}}
