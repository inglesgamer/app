<script>
/* ===== WEB (GitHub Pages): convierte los enlaces go:seccion en seccion.html. En App Creator no hace nada. ===== */
(function(){
  var web = /github\.io$/.test(location.hostname);
  window.igURL = function(u){
    u = String(u);
    if (!web || u.indexOf("go:") !== 0) return u;
    var s = u.slice(3);
    return (s === "inicio" ? "index" : s) + ".html";
  };
  if (!web) return;
  document.addEventListener("click", function(e){
    var a = e.target.closest && e.target.closest('a[href^="go:"]');
    if (a){ e.preventDefault(); location.href = igURL(a.getAttribute("href")); }
  }, true);
})();
</script>

.mz:before{content:"";position:absolute;inset:0;z-index:3;pointer-events:none;background:radial-gradient(circle,#fff 0 1.6px,transparent 2.4px) 0 0/40px 40px,radial-gradient(circle,rgba(255,255,255,.7) 0 1.1px,transparent 1.8px) 18px 10px/26px 30px;animation:nieva 5s linear infinite}
.mz .luna{position:absolute;right:7%;top:8%;width:7%;aspect-ratio:1;border-radius:50%;box-shadow:-6px 4px 0 0 #F4F4F5}
.mz .pino{position:absolute;bottom:36%;width:12%;aspect-ratio:44/62;background:#1A6B5E;clip-path:polygon(50% 0,100% 100%,0 100%)}
.mz svg.mu{position:absolute;left:50%;bottom:4%;height:92%;width:auto;transform:translateX(-50%);overflow:visible;z-index:2}
.mz.baila svg.mu{animation:baila .5s ease-in-out infinite alternate}
.mz.shk svg.mu{animation:tiemb .3s ease 2}
.mu .pz{opacity:0;transform-box:fill-box;transform-origin:center bottom}
.mu .pz.on{opacity:1}.mu .pz.nuevo{animation:popP .55s cubic-bezier(.3,1.7,.5,1)}
.mz.baila .br{animation:saluda .35s ease-in-out infinite alternate;transform-box:fill-box;transform-origin:right bottom}
.cont{position:absolute;left:3%;top:5%;z-index:4;padding:4px 10px;border-radius:99px;background:rgba(0,0,0,.45);font-size:11px;font-weight:900;color:#BDE8FF}
.bub{position:absolute;right:4%;top:16%;z-index:4;max-width:42%;padding:6px 10px;border-radius:14px;background:#fff;color:#000;font-size:13px;font-weight:900;line-height:1.2}
.radio{display:flex;align-items:center;gap:12px;margin-top:10px;padding:10px 12px;border-radius:22px;background:linear-gradient(160deg,#2A1A10,var(--card));border:1px solid #4A2E1C}
.radio .play{flex:none;width:56px;height:56px;border-radius:50%;border:0;background:var(--hi);color:var(--on-hi);display:flex;align-items:center;justify-content:center;cursor:pointer;box-shadow:0 0 0 8px rgba(255,255,255,.06)}
.radio .t{flex:1;font-size:17px;font-weight:900}.radio .t span{display:block;font-size:13px;font-weight:700;color:var(--mu)}
.radio .len{flex:none;height:38px;padding:0 12px;border:1px solid var(--bd);border-radius:99px;background:var(--card);font:900 13px Nunito,sans-serif;cursor:pointer}
.ops2{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:12px}
.op2{min-height:62px;padding:8px;border-radius:18px;border:1px solid var(--bd);background:var(--card);cursor:pointer;font:900 19px Nunito,sans-serif;touch-action:manipulation}
.op2:active:not(:disabled){transform:translateY(2px)}.op2:disabled{cursor:default}
.op2.ok{border-color:var(--ok);background:color-mix(in srgb,var(--ok) 18%,var(--card))}.op2.mal{border-color:var(--mal);background:color-mix(in srgb,var(--mal) 16%,var(--card))}
/* dictado de copos */
.dic{display:flex;flex-direction:column;align-items:center;margin-top:8px;animation:entra .35s ease}
.dic .play{width:96px;height:96px;border-radius:50%;border:0;background:var(--hi);color:var(--on-hi);display:flex;align-items:center;justify-content:center;cursor:pointer;position:relative}
.dic .play:after{content:"";position:absolute;inset:-9px;border-radius:50%;border:2px solid var(--cc);animation:ring 2s ease-out infinite}
.dic .play svg{width:40px;height:40px}
.huecos{display:flex;gap:8px;justify-content:center;margin-top:26px;min-height:54px}
.huecos i{width:40px;height:52px;border-bottom:4px solid #BDE8FF;font-style:normal;font-size:30px;font-weight:900;text-align:center;line-height:50px}
.huecos i.pista{color:var(--gold)}.huecos.ok i{color:var(--ok);border-color:var(--ok)}.huecos.mal{animation:shk .35s}
.copos{display:flex;flex-wrap:wrap;gap:10px;justify-content:center;margin-top:22px;max-width:340px}
.copo{width:54px;height:54px;border-radius:16px;border:1px solid #2F5A75;background:linear-gradient(160deg,#16405F,#0E2433);color:#E8F7FF;font:900 24px Nunito,sans-serif;cursor:pointer;position:relative;touch-action:manipulation;box-shadow:0 4px 0 #0A1A26}
.copo:before{content:"❄";position:absolute;right:4px;top:1px;font-size:10px;opacity:.6}
.copo:active:not(:disabled){transform:translateY(2px);box-shadow:0 2px 0 #0A1A26}.copo:disabled{opacity:.25;cursor:default}
.dbts{display:flex;gap:10px;margin-top:20px}
@keyframes popP{0%{transform:scale(0)}100%{transform:scale(1)}}
@keyframes baila{from{transform:translateX(-50%) rotate(-4deg)}to{transform:translateX(-50%) rotate(4deg)}}
@keyframes tiemb{25%{transform:translateX(calc(-50% - 6px))}75%{transform:translateX(calc(-50% + 6px))}}
@keyframes saluda{from{transform:rotate(0)}to{transform:rotate(-25deg)}}
</style>

  ping:{p:{k:"#1E2433",w:"#F4F6FA",o:"#FF9F2E"},r:["....kkkk....","...kkkkkk...","..kkwwwwkk..","..kwkwwkwk..","..kwwoowwk..",".kkwwwwwwkk.","kkkwwwwwwkkk","k.kwwwwwwk.k","..kwwwwwwk..","..kkwwwwkk..","...kkkkkk...","..oo....oo.."]},
  muneco:{p:{w:"#FFFFFF",k:"#2B2B33",o:"#FF8A3D",r:"#E5483C"},r:["....kkkk....","...kkkkkk...","...wwwwww...","..wwkwwkww..","..wwwoowww..","..rrrrrrrr..","...wwwwwrr..","..wwwkwwww..",".wwwwwwwwww.",".wwwwkwwwww.",".wwwwwwwwww.","..wwwwwwww.."]}
};

const $ = id => document.getElementById(id);
const RM = window.matchMedia && window.matchMedia("(prefers-reduced-motion:reduce)").matches;
function on(id, fn) { const e = $(id); if (e) e.addEventListener("click", fn); }
function mezcla(a) { a = a.slice(); for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; }
const esc = s => String(s).replace(/[&<>"]/g, c => ({ "&":"\x26amp;", "<":"\x26lt;", ">":"\x26gt;", '"':"\x26quot;" }[c]));
$("aMapa").href = URL_MAPA;
const SV = (p, s, w) => '<svg width="' + s + '" height="' + s + '" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="' + (w || 2.2) + '" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">' + p + '</svg>';
const setCC = c => document.documentElement.style.setProperty("--cc", c);
const setBarra = p => { $("barra").style.width = p + "%"; $("fxl").style.width = p + "%"; };
/* pixel art */
function pix(g, p, px) { let o = ""; g.forEach((row, y) => row.split("").forEach((c, x) => { if (c !== "." && p[c]) o += '<rect x="' + x * px + '" y="' + y * px + '" width="' + px + '" height="' + px + '" fill="' + p[c] + '"></rect>'; })); return o; }
function dib(n, size) { const d = DIB[n]; return '<svg width="' + size + '" height="' + size + '" viewBox="0 0 12 12" shape-rendering="crispEdges" aria-hidden="true">' + pix(d.r, d.p, 1) + '</svg>'; }

/* ===== guardado: estrellas de la Isla de Nieve, racha y Aura ===== */
const CLAVE = "ingles_gamer_nieve_repaso", CLAVE_A1 = "ingles_gamer_a1_repaso", CLAVE_AURA = "ingles_gamer_aura";
function clave(d) { return d.getFullYear() + "-" + (d.getMonth() + 1) + "-" + d.getDate(); }
function cargarS(k) { let s = { est:{}, dia:{ u:"", r:0 } }; try { const g = JSON.parse(localStorage.getItem(k || CLAVE) || "null"); if (g && g.est) { s = g; if (!s.dia) s.dia = { u:"", r:0 }; } } catch (e) {} return s; }
function subirEstrellas(n) { const S = cargarS(); S.est[NIVEL.id] = Math.max(S.est[NIVEL.id] || 0, n); try { localStorage.setItem(CLAVE, JSON.stringify(S)); } catch (e) {} return S.est[NIVEL.id]; }
/* la racha del día es la misma de toda la app (la del Inicio) */
function marcarDia() {
  [CLAVE_A1, CLAVE].forEach(k => { const S = cargarS(k), hoy = new Date(), ayer = new Date(hoy.getTime() - 864e5), h = clave(hoy); if (S.dia.u === h) return; S.dia.r = (S.dia.u === clave(ayer)) ? S.dia.r + 1 : 1; S.dia.u = h; try { localStorage.setItem(k, JSON.stringify(S)); } catch (e) {} });
}
function leerAura() { let a = { t:0, r:0, e:0, g:{}, l:[] }; try { const x = JSON.parse(localStorage.getItem(CLAVE_AURA) || "null"); if (x && typeof x === "object") a = Object.assign(a, x); } catch (e) {} a.t = Math.max(0, +a.t || 0); a.e = Math.max(0, +a.e || 0); if (!a.g || typeof a.g !== "object") a.g = {}; if (!Array.isArray(a.l)) a.l = []; return a; }
function darAura(total) {
  total = Math.max(0, Math.round(+total || 0));
  const a = leerAura(), gk = "nieve_" + NIVEL.id, ya = +a.g[gk] || 0, dar = Math.max(0, total - ya);
  a.g[gk] = Math.max(ya, total); if (!dar) return 0;
  a.t += dar; a.e += dar; a.l = [[dar, NIVEL.nombre.slice(0, 30), Date.now()]].concat(a.l).slice(0, 20);
  try { localStorage.setItem(CLAVE_AURA, JSON.stringify(a)); } catch (e) { return 0; } return dar;
}
function mandarNube(cb) { try { if (window.IGNube && IGNube.subirYa) IGNube.subirYa().then(() => { try { if (window.IGFicha) IGFicha.publicar(); } catch (e) {} if (cb) cb(true); }).catch(e => { if (cb) cb(false, e); }); else if (cb) cb(false, { message: "el bloque NUBE no cargó" }); } catch (e) { if (cb) cb(false, e); } }
function nubeDiag(ok, e) { const p = $("diag"); if (p) p.textContent = p.dataset.base + (ok ? "nube: subido ✓" : "nube: NO subió (" + String((e && (e.message || e.code)) || "error") + ")"); }

/* ===== pantalla de APRENDE: una palabra por pantalla ===== */
const ICO_EJ = SV('<path d="M11 5 6 9H3v6h3l5 4z"></path><path d="M15.5 8.5a5 5 0 0 1 0 7"></path>', 22);
function pantallaAprende(i, lista, dibujo, alTerminar) {
  const w = lista[i], n = lista.length;
  setBarra(i / n * 100); setCC(COLOR);
  const ej = w.ej.replace(/\*(.+?)\*/, "<u>$1</u>");
  $("v").innerHTML = '<div class="hdr"><span class="chip">APRENDE · ' + esc(TEMA) + '</span><span class="rc">' + (i + 1) + ' / ' + n + '</span></div>' +
    '<section class="apr"><div class="dib">' + dibujo(w) + '</div><p class="pal">' + esc(w.en) + '</p><p class="tra">' + esc(w.es) + '</p>' +
    '<div class="bts"><button type="button" class="btnB" id="bOir">' + ICO_ON + 'Escuchar</button><button type="button" class="btnG" id="bLen">🐢 Lento</button></div>' +
    '<button type="button" class="ej" id="bEj"><span class="t"><b>' + ej + '</b><span>' + esc(w.ejEs) + '</span></span>' + ICO_EJ + '</button>' +
    '<button type="button" class="lase" id="bSe">¡LA SÉ!</button>' +
    '<div class="puntos">' + lista.map((_, k) => '<i class="' + (k <= i ? "on" : "") + '"></i>').join("") + '</div>' +
    '<p class="nota">Escucha la palabra y repítela en voz alta.</p></section>';
  on("bOir", () => oir(w.audio, w.en));
  on("bLen", () => oir(w.audio, w.en, .6));
  on("bEj", () => voz(w.ej.replace(/\*/g, ""), .9));
  on("bSe", () => { sonido("ok", i); if (i + 1 < n) pantallaAprende(i + 1, lista, dibujo, alTerminar); else alTerminar(); });
  window.scrollTo(0, 0);
  setTimeout(() => oir(w.audio, w.en), 350);
}
function pantallaIntro(titulo, texto, boton, pj, cb) {
  $("v").innerHTML = '<section class="intro"><div class="pj">' + pj + '</div><h2>' + esc(titulo) + '</h2><p>' + texto + '</p><button type="button" class="lase" id="bGo">' + esc(boton) + '</button></section>';

/* ===== pantalla final · MEDALLA con rayos ===== */
function finalHTML(d) {
  const estr = [0, 1, 2].map(k => '<span style="animation-delay:' + (.35 + k * .3) + 's">' + sprite(k < d.est ? "estrella" : "estrellaV", 44) + '</span>').join("");

function mostrarFinal(d, otra) {
  $("v").innerHTML = finalHTML(d); on("fmOtra", otra);
  if (DIAGNOSTICO && d.gano) { const q = document.createElement("p"); q.className = "ya"; q.id = "diag"; q.dataset.base = "Guardado en este celular: «" + NIVEL.id + "» = " + (cargarS().est[NIVEL.id] || 0) + " ★ · "; q.textContent = q.dataset.base + "nube: enviando…"; const sec = $("v").querySelector(".f2"); sec.insertBefore(q, sec.querySelector(".acc")); }

/* gana: guarda estrellas, racha y Aura, y sube a la nube */
function ganar(errores, total, titulo, msg3, msgMenos, rep, otra) {
  const est = errores <= 1 ? 3 : errores <= 3 ? 2 : 1, e = subirEstrellas(est); marcarDia();
  const dar = darAura(Math.round(AURA_NIVEL * e / 3)), ya = dar === 0;
  setBarra(100); mandarNube(DIAGNOSTICO ? nubeDiag : null); setCC("#5FA8E8");
  mostrarFinal({ gano:true, est, titulo, n1:Math.max(0, total - errores) + "/" + total, t1:"a la primera", aura:dar, ya, msg:est === 3 ? msg3 : msgMenos, rep }, otra);
}
function perder(n1, t1, msg, rep, otra) {
  setCC("#FF6B6B");
  mostrarFinal({ gano:false, est:0, titulo:"¡Sin corazones!", n1, t1, aura:0, ya:false, msg, rep }, otra);

/* sonidos */
const CLAVE_SON = "ingles_gamer_sonido";
let SON = true, AC = null, MASTER = null;
try { SON = localStorage.getItem(CLAVE_SON) !== "0"; } catch (e) {}
function audioCtx() { if (!AC) { const C = window.AudioContext || window.webkitAudioContext; if (!C) return null; AC = new C(); MASTER = AC.createGain(); MASTER.gain.value = 0.9; MASTER.connect(AC.destination); } if (AC.state === "suspended") AC.resume(); return AC; }
function tono(f, t0, d, vol, tipo) {
  const a = audioCtx(); if (!a) return;
  const o = a.createOscillator(), g = a.createGain(), t = a.currentTime + t0;
  o.type = tipo || "sine"; o.frequency.setValueAtTime(f, t);
  g.gain.setValueAtTime(0.0001, t); g.gain.exponentialRampToValueAtTime(vol || 0.12, t + 0.02); g.gain.exponentialRampToValueAtTime(0.0001, t + d);
  o.connect(g); g.connect(MASTER); o.start(t); o.stop(t + d + 0.05);
}
const PENTA = [523.25, 587.33, 659.25, 783.99, 880, 1046.5, 1174.7, 1318.5];
const SONIDOS = {
  click: () => tono(520, 0, 0.07, 0.06),
  ok: n => { tono(1318.5, 0, 0.09, 0.1, "square"); tono(1760, 0.08, 0.25, 0.09, "square"); tono(PENTA[Math.min(n || 0, 7)], 0.02, 0.3, 0.06); },
