<script>
/* ===== WEB (GitHub Pages): convierte los enlaces go:seccion en seccion.html. En App Creator no hace nada. ===== */
(function(){
  var web = /github\.io$/.test(location.hostname);
  window.igURL = function(u){
    u = String(u);
    if (!web || u.indexOf("go:") !== 0) return u;
    var s = u.slice(3);
    return (s === "inicio" ? "index" : s) + ".html";
  };
  if (!web) return;
  document.addEventListener("click", function(e){
    var a = e.target.closest && e.target.closest('a[href^="go:"]');
    if (a){ e.preventDefault(); location.href = igURL(a.getAttribute("href")); }
  }, true);
})();
</script>

<script>
/* ===== PALETAS: el mismo bloque de la pantalla de Inicio. La elección se guarda en "ingles_gamer_tema". ===== */
var TEMA_KEY = "ingles_gamer_tema";
var PALETAS = {
  noche: { n:"Noche", meta:"#000000", cs:"dark", v:{ "--bg":"#000000","--card":"#141416","--bd":"#2A2A2E","--ink":"#F4F4F5","--mu":"#B8B8C0","--chip":"#222226","--gold":"#FFD166","--hi":"#FFFFFF","--on-hi":"#000000","--track":"#2A2A2E","--toff":"#3A3A40","--nav":"#0E0E10","--av1":"#3A3A40","--av2":"#101012","--ok":"#7BE3A8" } },
  dia:   { n:"Día",   meta:"#F4F4F5", cs:"light", v:{ "--bg":"#F4F4F5","--card":"#FFFFFF","--bd":"#E4E4E7","--ink":"#0B0B0D","--mu":"#5C666B","--chip":"#EFEFF1","--gold":"#9A6000","--hi":"#0B0B0D","--on-hi":"#FFFFFF","--track":"#E4E4E7","--toff":"#D4D4D8","--nav":"#FFFFFF","--av1":"#FFFFFF","--av2":"#E4E4E7","--ok":"#0F7A44" } },
  rosa:  { n:"Rosa",  meta:"#FFF1F6", cs:"light", v:{ "--bg":"#FFF1F6","--card":"#FFFFFF","--bd":"#F8D9E5","--ink":"#2B1420","--mu":"#7A5568","--chip":"#FFE3ED","--gold":"#B3245A","--hi":"#D63B7A","--on-hi":"#FFFFFF","--track":"#F8D9E5","--toff":"#EEBFD1","--nav":"#FFFFFF","--av1":"#FFFFFF","--av2":"#F8D9E5","--ok":"#0F7A44" } },
  azul:  { n:"Azul",  meta:"#EFF6FF", cs:"light", v:{ "--bg":"#EFF6FF","--card":"#FFFFFF","--bd":"#D6E6F8","--ink":"#0E1B2B","--mu":"#4F647B","--chip":"#E0EFFD","--gold":"#0B5FB0","--hi":"#1C6FD6","--on-hi":"#FFFFFF","--track":"#D6E6F8","--toff":"#BDD6F0","--nav":"#FFFFFF","--av1":"#FFFFFF","--av2":"#D6E6F8","--ok":"#0F7A44" } }
};
function aplicarTema(id) {
  var p = PALETAS[id] || PALETAS.noche, r = document.documentElement;
  for (var k in p.v) r.style.setProperty(k, p.v[k]);
  r.style.colorScheme = p.cs; r.setAttribute("data-tema", PALETAS[id] ? id : "noche");
  var m = document.querySelector('meta[name="theme-color"]'); if (m) m.setAttribute("content", p.meta);
}
function temaActual() { try { var t = localStorage.getItem(TEMA_KEY); return PALETAS[t] ? t : "noche"; } catch (e) { return "noche"; } }
aplicarTema(temaActual());
</script>

<style>
:root{--bg:#000;--card:#141416;--bd:#2A2A2E;--ink:#F4F4F5;--mu:#B8B8C0;--chip:#222226;--gold:#FFD166;--hi:#FFFFFF;--on-hi:#000000;--track:#2A2A2E;--toff:#3A3A40;--nav:#0E0E10;--ok:#7BE3A8}
*{box-sizing:border-box;margin:0;padding:0}
html{height:100%}
body{height:100vh;height:100dvh;display:flex;flex-direction:column;overflow:hidden;overscroll-behavior:none;background:var(--bg);color:var(--ink);font-family:Nunito,system-ui,sans-serif;-webkit-tap-highlight-color:transparent}
a{color:inherit;text-decoration:none}
button{font-family:inherit;color:inherit;border:0;background:none;cursor:pointer}
a:focus-visible,button:focus-visible{outline:3px solid var(--hi);outline-offset:2px}
.app{width:100%;max-width:520px;margin:0 auto;flex:1;min-height:0;display:flex;flex-direction:column}

header{flex-shrink:0;display:flex;align-items:center;gap:10px;padding:calc(14px + env(safe-area-inset-top,0px)) 16px 10px}
.logo{flex:1;font-size:26px;font-weight:900;letter-spacing:-.01em}
.ib{width:44px;height:44px;display:flex;align-items:center;justify-content:center;border-radius:50%;border:1px solid var(--bd);background:var(--card);color:var(--ink)}
.ib.off{color:var(--mu)}
main{flex:1;min-height:0;overflow-y:auto;overscroll-behavior:none;padding:6px 16px 18px;display:flex;flex-direction:column;gap:14px;scrollbar-width:none}
main::-webkit-scrollbar{display:none}
main>*{flex-shrink:0}
.card{background:var(--card);border:1px solid var(--bd);border-radius:28px}
html:not([data-tema="noche"]) .card{box-shadow:0 1px 2px rgba(0,0,0,.04),0 10px 28px rgba(0,0,0,.06)}
.chip{display:inline-flex;align-items:center;gap:6px;height:32px;padding:0 13px;border-radius:99px;background:var(--chip);font-size:14px;font-weight:900;white-space:nowrap}
.chip.g{background:rgba(10,10,20,.62);color:#fff}
.h2{font-size:19px;font-weight:900}

/* ruta de estrellas */
.route{padding:14px 16px 12px;display:flex;flex-direction:column;gap:14px}
.rt1{display:flex;justify-content:space-between;align-items:center;gap:10px}
.track{position:relative;height:10px;border-radius:99px;background:var(--track);margin:4px 14px 32px}
.tf{height:100%;border-radius:99px;background:var(--hi);transition:width .5s}
.mk{position:absolute;top:-7px;transform:translateX(-50%);display:flex;flex-direction:column;align-items:center;gap:6px}
.mk i{width:24px;height:24px;border-radius:50%;background:var(--card);border:2px solid var(--toff);display:grid;place-items:center;font-size:12px;font-weight:900;font-style:normal;color:var(--mu)}
.mk i.on{background:var(--hi);border-color:var(--hi);color:var(--on-hi)}
.mk b{font-size:12px;font-weight:800;color:var(--mu)}

/* isla grande */
.feat{overflow:hidden}
.fb{position:relative;height:210px;overflow:hidden}
.fb .chip{position:absolute;top:12px;left:12px}
.ill{width:100%;height:100%;display:block}
.lk .ill{filter:grayscale(.7) brightness(.78)}
.fbd{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:14px 16px 16px}
.ft{display:flex;flex-direction:column;gap:6px;min-width:0;flex:1}
.nmr{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.nm{font-size:24px;font-weight:900;line-height:1.1}
.nm.s{font-size:18px}
.ds{color:var(--mu);font-size:14px;font-weight:600;line-height:1.35}
.pill{display:inline-flex;align-items:center;gap:5px;height:24px;padding:0 10px;border-radius:99px;font-size:11px;font-weight:900;letter-spacing:.08em}
.pill.ok{background:color-mix(in srgb,var(--ok) 16%,transparent);color:var(--ok)}
.pill.no{background:var(--chip);color:var(--mu)}
.pg{display:flex;align-items:center;gap:10px;margin-top:2px}
.req{display:flex;align-items:center;gap:5px;font-size:14px;font-weight:900;color:var(--gold);white-space:nowrap}
.bar{height:10px;border-radius:99px;background:var(--track);overflow:hidden;flex:1;min-width:30px}
.bar i{display:block;height:100%;border-radius:99px;background:var(--hi);transition:width .5s}
.btn{height:46px;padding:0 20px;border-radius:99px;background:var(--hi);color:var(--on-hi);font-size:15px;font-weight:900;display:inline-flex;align-items:center;justify-content:center;gap:8px;flex:none;box-shadow:0 4px 0 rgba(128,128,128,.35)}
.btn.off{background:var(--chip);color:var(--mu);box-shadow:none}
.btn:active{transform:translateY(2px)}

.lkov{position:absolute;inset:0;background:rgba(0,0,0,.18);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px}
.lkc{width:46px;height:46px;border-radius:50%;background:rgba(20,20,24,.7);border:1px solid rgba(255,255,255,.25);display:grid;place-items:center;color:#fff}
.lkt{white-space:nowrap;display:flex;align-items:center;gap:6px;font-size:12px;font-weight:900;color:#fff;background:rgba(20,20,24,.7);padding:5px 10px;border-radius:99px}

/* islas pequeñas */
.two{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.sc{overflow:hidden;min-width:0;text-align:left;display:block;width:100%;padding:0}
.sc:active{transform:scale(.98)}
.sb{position:relative;height:116px;overflow:hidden}
.sbd{padding:12px 14px 14px;display:flex;flex-direction:column;gap:6px}
.fl{display:flex;align-items:center;gap:6px;font-size:13px;font-weight:900;color:var(--mu)}
.fl.ok{color:var(--ok)}

nav{flex-shrink:0;background:var(--nav);border-radius:28px 28px 0 0;border-top:1px solid var(--bd)}
nav .inner{max-width:520px;margin:0 auto;display:flex;padding:8px 6px max(12px,env(safe-area-inset-bottom))}
nav a{flex:1;min-width:0;min-height:56px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;color:var(--mu);font-size:11px;font-weight:700}
nav a.on{color:var(--hi)}

.toast{position:fixed;left:50%;bottom:96px;transform:translateX(-50%);max-width:calc(100% - 32px);background:var(--hi);color:var(--on-hi);padding:11px 18px;font-size:14px;font-weight:900;border-radius:99px;opacity:0;transition:opacity .3s;pointer-events:none;z-index:20;text-align:center}
.toast.on{opacity:1}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style></head>

<script>
const P = {
  back: '<path d="M15 5l-7 7 7 7"></path>',
  sound: '<path d="M11 5 6 9H3v6h3l5 4z"></path><path d="M15.5 8.5a5 5 0 0 1 0 7"></path><path d="M18.5 5.5a9 9 0 0 1 0 13"></path>',
  flame: '<path d="M12 3c.6 3.2 5 5.2 5 10a5 5 0 0 1-10 0c0-2 .9-3.2 2.2-4.2.1 1.9.9 2.9 1.9 3.2C10.3 8.6 10.6 5.4 12 3z"></path>',
  lock: '<rect x="5" y="11" width="14" height="9" rx="2.5"></rect><path d="M8 11V8a4 4 0 0 1 8 0v3"></path>',
  chev: '<path d="M9 5l7 7-7 7"></path>',
  play: '<path d="M8 5v14l11-7z" fill="currentColor"></path>',
  home: '<path d="M3 11 12 3l9 8"></path><path d="M5 10v10h14V10"></path>',
  map: '<path d="M9 4 3 6.5v13L9 17l6 2.5 6-2.5v-13L15 7z"></path><path d="M9 4v13M15 7v12.5"></path>',
  shop: '<path d="M4 9h16l-1 11H5L4 9z"></path><path d="M8 9V7a4 4 0 0 1 8 0v2"></path>',
  cup: '<path d="M8 21h8M12 17v4M7 4h10v5a5 5 0 0 1-10 0z"></path><path d="M17 5h3v2a3 3 0 0 1-3 3M7 5H4v2a3 3 0 0 0 3 3"></path>',
  user: '<circle cx="12" cy="8" r="4"></circle><path d="M4 21a8 8 0 0 1 16 0"></path>'
};
const icon = (n, s = 22, sw = 2) =>
  `<svg width="${s}" height="${s}" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="${sw}" stroke-linecap="round" stroke-linejoin="round">${P[n]}</svg>`;
const star = (s = 16, c = 'var(--gold)') =>
  `<svg width="${s}" height="${s}" viewBox="0 0 24 24"><path d="M12 2.8l2.9 6 6.5.9-4.7 4.6 1.1 6.5L12 17.7l-5.8 3.1 1.1-6.5L2.6 9.7l6.5-.9z" style="fill:${c}"></path></svg>`;


/* ---------- ilustraciones vectoriales ---------- */
let _u = 0;
function rnd(i, k) { const x = Math.sin(i * 12.9898 + k * 78.233) * 43758.5453; return x - Math.floor(x); }
function cloud(x, y, s, col, op) {
  return `<g opacity="${op}" fill="${col}"><ellipse cx="${x}" cy="${y}" rx="${26 * s}" ry="${8 * s}"></ellipse><ellipse cx="${x - 12 * s}" cy="${y - 6 * s}" rx="${14 * s}" ry="${9 * s}"></ellipse><ellipse cx="${x + 10 * s}" cy="${y - 8 * s}" rx="${15 * s}" ry="${10 * s}"></ellipse></g>`;
}
function palm(x, y, s, lean) {
  const tx = x + lean * 16 * s, ty = y - 58 * s;
  const ang = [-160, -125, -90, -55, -20, 15, 165];
  const leaves = ang.map((a, i) => `<path transform="translate(${tx} ${ty}) rotate(${a}) scale(${s})" d="M0 0 C8 -13 28 -14 40 3 C27 -3 11 -3 0 0Z" fill="${i % 2 ? '#3E9A2A' : '#55B83A'}"></path>`).join('');
  return `<path d="M${x} ${y} Q${x + lean * 4 * s} ${y - 30 * s} ${tx} ${ty}" stroke="#9A6B3E" stroke-width="${6 * s}" fill="none" stroke-linecap="round"></path>${leaves}<circle cx="${tx - 2 * s}" cy="${ty + 4 * s}" r="${3 * s}" fill="#6B4423"></circle><circle cx="${tx + 3 * s}" cy="${ty + 5 * s}" r="${3 * s}" fill="#6B4423"></circle>`;
}
function pine(x, y, s) {
  return `<g transform="translate(${x} ${y}) scale(${s})"><rect x="-3" y="-2" width="6" height="10" fill="#6B4423"></rect><path d="M0 -64 L-16 -36 L16 -36Z" fill="#2F7A57"></path><path d="M0 -52 L-21 -18 L21 -18Z" fill="#2A6F4F"></path><path d="M0 -38 L-26 0 L26 0Z" fill="#256345"></path><path d="M0 -64 L-6.4 -52 L6.4 -52Z" fill="#F4F7FB"></path><path d="M0 -52 L-8.5 -38 L8.5 -38Z" fill="#F4F7FB"></path><path d="M0 -38 L-10.4 -24 L10.4 -24Z" fill="#F4F7FB"></path></g>`;
}
function snowman(x, y, s) {
  return `<g transform="translate(${x} ${y}) scale(${s})"><circle cx="0" cy="-10" r="11" fill="#fff"></circle><circle cx="0" cy="-27" r="8" fill="#fff"></circle><circle cx="0" cy="-39" r="6" fill="#fff"></circle><path d="M-6 -31 Q0 -27 6 -31" stroke="#E5484D" stroke-width="3" fill="none"></path><rect x="-5" y="-49" width="10" height="6" fill="#222"></rect><rect x="-8" y="-44" width="16" height="2.5" fill="#222"></rect><path d="M0 -39 L9 -37.5 L0 -36Z" fill="#FF8A3D"></path><circle cx="-2.2" cy="-41" r=".9" fill="#222"></circle><circle cx="2.2" cy="-41" r=".9" fill="#222"></circle></g>`;
}



/* ===== ILUSTRACIÓN DE LAS ISLAS: de NOCHE solo con el tema Noche; Día, Rosa y Azul usan la versión de día ===== */
const esNoche = () => (document.documentElement.getAttribute("data-tema") || "noche") === "noche";
function scene(kind, noche) {
  const id = 's' + (_u++), N = !!noche;
  const K = {
    verano: {
      dia:   { sky: [['0', '#4FB4F2'], ['1', '#C4ECFC']], sea: [['0', '#3FCFC4'], ['1', '#1E9FB0']], grass: '#7BD654', grass2: '#5BB33A', cliff: '#A07C55', cliff2: '#7A5A3A', foam: '#ffffff' },
      noche: { sky: [['0', '#060A22'], ['.55', '#17285C'], ['1', '#3A5796']], sea: [['0', '#1C5A86'], ['1', '#0A2748']], grass: '#7BD654', grass2: '#5BB33A', cliff: '#A07C55', cliff2: '#7A5A3A', foam: '#BFD6FF' }
    },
    fuego: {
      dia:   { sky: [['0', '#5FB0E6'], ['.55', '#E8C8A4'], ['1', '#F0A36B']], sea: [['0', '#3F7F97'], ['1', '#1F4A5E']], grass: '#5E4750', grass2: '#43323A', cliff: '#4A3A3F', cliff2: '#2E2226', foam: '#ffffff' },
      noche: { sky: [['0', '#12070A'], ['.55', '#4A1214'], ['1', '#C2401F']], sea: [['0', '#5A1A12'], ['1', '#1E0909']], grass: '#3E2C33', grass2: '#2A1D22', cliff: '#2B1F24', cliff2: '#1B1317', foam: '#FF8A3D' }
    },
    nieve: {
      dia:   { sky: [['0', '#5FB3EA'], ['1', '#DDF1FB']], sea: [['0', '#58AEDB'], ['1', '#2C7FB0']], grass: '#F4F7FB', grass2: '#CFE0EE', cliff: '#8FC3E6', cliff2: '#5C97C4', foam: '#ffffff' },
      noche: { sky: [['0', '#0A1330'], ['.55', '#244A7C'], ['1', '#86BEE0']], sea: [['0', '#2D6A9A'], ['1', '#16406A']], grass: '#F4F7FB', grass2: '#CFE0EE', cliff: '#8FC3E6', cliff2: '#5C97C4', foam: '#ffffff' }
    }
  };
  const K1 = K[kind][N ? 'noche' : 'dia'];
  const stops = a => a.map(([o, c]) => `<stop offset="${o}" stop-color="${c}"></stop>`).join('');
  let o = `<defs><linearGradient id="${id}k" x1="0" y1="0" x2="0" y2="1">${stops(K1.sky)}</linearGradient><linearGradient id="${id}w" x1="0" y1="0" x2="0" y2="1">${stops(K1.sea)}</linearGradient>
  <radialGradient id="${id}g" cx="50%" cy="50%" r="50%"><stop offset="0" stop-color="#FF6A1F" stop-opacity=".6"></stop><stop offset="1" stop-color="#FF6A1F" stop-opacity="0"></stop></radialGradient>
  <radialGradient id="${id}f" cx="50%" cy="50%" r="50%"><stop offset="0" stop-color="#FFB02E" stop-opacity=".75"></stop><stop offset="1" stop-color="#FFB02E" stop-opacity="0"></stop></radialGradient>
  <linearGradient id="${id}a" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#5DFFB0" stop-opacity="0"></stop><stop offset=".5" stop-color="#5DFFB0" stop-opacity=".75"></stop><stop offset="1" stop-color="#8E5BD6" stop-opacity="0"></stop></linearGradient>
  <filter id="${id}b"><feGaussianBlur stdDeviation="5"></feGaussianBlur></filter>
  <filter id="${id}n" color-interpolation-filters="sRGB"><feColorMatrix type="matrix" values="0.42 0.12 0 0 0.02  0.04 0.5 0.12 0 0.05  0.04 0.1 0.78 0 0.14  0 0 0 1 0"></feColorMatrix></filter></defs>`;
  o += `<rect x="-400" y="-400" width="1160" height="1100" fill="url(#${id}k)"></rect>`;

  /* cielo */
  const estrellas = (n, ymax, col) => { let s = ''; for (let i = 0; i < n; i++) s += `<circle cx="${rnd(i, 4) * 360}" cy="${rnd(i, 5) * ymax}" r="${.5 + rnd(i, 6) * .9}" fill="${col}" opacity="${.5 + rnd(i, 7) * .5}"></circle>`; return s; };
  if (kind === 'verano' && !N) o += `<circle cx="292" cy="52" r="44" fill="#FFE08A" opacity=".28"></circle><circle cx="292" cy="52" r="24" fill="#FFD257"></circle>` + cloud(70, 48, 1, '#fff', .9) + cloud(200, 30, .7, '#fff', .8) + cloud(120, 92, .6, '#fff', .7);
  if (kind === 'verano' && N) o += estrellas(34, 120, '#fff') + `<circle cx="288" cy="50" r="44" fill="#BFD2FF" opacity=".12"></circle><circle cx="288" cy="50" r="22" fill="#F4F1D0"></circle><circle cx="280" cy="44" r="4" fill="#DAD6AE"></circle><circle cx="296" cy="58" r="3" fill="#DAD6AE"></circle><circle cx="294" cy="40" r="2" fill="#DAD6AE"></circle>` + cloud(80, 56, .9, '#5B77B5', .35);
  if (kind === 'fuego' && N) { o += `<circle cx="180" cy="96" r="150" fill="url(#${id}g)"></circle>`; for (let i = 0; i < 14; i++) o += `<circle cx="${rnd(i, 1) * 360}" cy="${rnd(i, 2) * 90}" r="${.6 + rnd(i, 3)}" fill="#FFC83D" opacity=".6"></circle>`; }
  if (kind === 'fuego' && !N) o += `<circle cx="64" cy="48" r="38" fill="#FFF3C4" opacity=".3"></circle><circle cx="64" cy="48" r="20" fill="#FFF0B0"></circle>` + cloud(250, 44, 1, '#fff', .75) + cloud(150, 24, .7, '#fff', .65);
  if (kind === 'nieve' && N) {
    o += estrellas(26, 96, '#fff');
    o += `<g filter="url(#${id}b)"><path d="M-10 70 Q80 20 170 62 T370 50 L370 110 Q270 130 170 100 T-10 118Z" fill="url(#${id}a)" opacity=".8"></path><path d="M-10 100 Q90 70 190 96 T370 84 L370 130 Q270 150 190 128 T-10 140Z" fill="url(#${id}a)" opacity=".45"></path></g>`;
  }
  if (kind === 'nieve' && !N) o += `<circle cx="70" cy="50" r="36" fill="#FFF6D0" opacity=".35"></circle><circle cx="70" cy="50" r="19" fill="#FFF3B8"></circle>` + cloud(250, 40, 1, '#fff', .95) + cloud(160, 78, .7, '#fff', .8) + cloud(310, 100, .6, '#fff', .8);

function leerEstrellas(){
  let S=null;try{S=JSON.parse(localStorage.getItem(CLAVE_R)||"null")}catch(e){}

}

        for (let i = 0; i < 40 && !user; i++) await dormir(250);
        if (!user) throw new Error("sin-sesion");
        while (ocupado) await dormir(200);
        const r = await sync(true);
        if (r === "bajado") throw new Error("recargando");
      }
    };
  } catch (e) { console.error("[nube]", e); }
})();
