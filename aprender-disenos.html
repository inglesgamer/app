let SEL = (location.search.match(/d=(\w+)/) || [0, "yt"])[1];
function pintar() { document.getElementById("tabs").innerHTML = Object.keys(D).map((k, i) => '<button class="' + (k === SEL ? "on" : "") + '" data-k="' + k + '">' + (i + 1) + '. ' + D[k][0].split(" (")[0] + '</button>').join("");
  document.getElementById("desc").innerHTML = "<b>" + D[SEL][0] + "</b>" + D[SEL][1]; document.getElementById("tel").innerHTML = D[SEL][2](); }
document.getElementById("tabs").onclick = e => { const b = e.target.closest("button"); if (b) { SEL = b.dataset.k; pintar(); } };
pintar();
</script></body></html>
