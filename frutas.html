<script>
/* ===== WEB (GitHub Pages): convierte los enlaces go:seccion en seccion.html. En App Creator no hace nada. ===== */
(function(){
  var web = /github\.io$/.test(location.hostname);
  window.igURL = function(u){
    u = String(u);
    if (!web || u.indexOf("go:") !== 0) return u;
    var s = u.slice(3);
    return (s === "inicio" ? "index" : s) + ".html";
  };
  if (!web) return;
  document.addEventListener("click", function(e){
    var a = e.target.closest && e.target.closest('a[href^="go:"]');
    if (a){ e.preventDefault(); location.href = igURL(a.getAttribute("href")); }
  }, true);
})();
</script>

<title>Frutas · InglésGamer</title>
<meta name="theme-color" content="#000000">
<script>
/* Paletas: las mismas del Inicio, Perfil y Ranking (se lee "ingles_gamer_tema") */
var TEMA_KEY="ingles_gamer_tema";
var PALETAS={
noche:{meta:"#000000",cs:"dark",v:{"--bg":"#000000","--card":"#141416","--bd":"#2A2A2E","--ink":"#F4F4F5","--mu":"#B8B8C0","--chip":"#222226","--gold":"#FFD166","--hi":"#FFFFFF","--on-hi":"#000000","--track":"#2A2A2E","--toff":"#3A3A40","--ok":"#7BE3A8","--mal":"#FF6B6B"}},
dia:{meta:"#F4F4F5",cs:"light",v:{"--bg":"#F4F4F5","--card":"#FFFFFF","--bd":"#E4E4E7","--ink":"#0B0B0D","--mu":"#5C666B","--chip":"#EFEFF1","--gold":"#9A6000","--hi":"#0B0B0D","--on-hi":"#FFFFFF","--track":"#E4E4E7","--toff":"#D4D4D8","--ok":"#0F7A44","--mal":"#C0262D"}},
rosa:{meta:"#FFF1F6",cs:"light",v:{"--bg":"#FFF1F6","--card":"#FFFFFF","--bd":"#F8D9E5","--ink":"#2B1420","--mu":"#7A5568","--chip":"#FFE3ED","--gold":"#B3245A","--hi":"#D63B7A","--on-hi":"#FFFFFF","--track":"#F8D9E5","--toff":"#EEBFD1","--ok":"#0F7A44","--mal":"#C0262D"}},
azul:{meta:"#EFF6FF",cs:"light",v:{"--bg":"#EFF6FF","--card":"#FFFFFF","--bd":"#D6E6F8","--ink":"#0E1B2B","--mu":"#4F647B","--chip":"#E0EFFD","--gold":"#0B5FB0","--hi":"#1C6FD6","--on-hi":"#FFFFFF","--track":"#D6E6F8","--toff":"#BDD6F0","--ok":"#0F7A44","--mal":"#C0262D"}}};
function aplicarTema(id){var p=PALETAS[id]||PALETAS.noche,r=document.documentElement;for(var k in p.v)r.style.setProperty(k,p.v[k]);r.style.colorScheme=p.cs;var m=document.querySelector('meta[name="theme-color"]');if(m)m.setAttribute("content",p.meta);}
function temaActual(){try{var t=localStorage.getItem(TEMA_KEY);return PALETAS[t]?t:"noche";}catch(e){return "noche";}}
aplicarTema(temaActual());
window.addEventListener("storage",function(e){if(e.key===TEMA_KEY)aplicarTema(temaActual());});
</script>
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@600;700;800;900&display=swap" rel="stylesheet">
<style>
:root{--bg:#000;--card:#141416;--bd:#2A2A2E;--ink:#F4F4F5;--mu:#B8B8C0;--chip:#222226;--gold:#FFD166;--hi:#fff;--on-hi:#000;--track:#2A2A2E;--toff:#3A3A40;--ok:#7BE3A8;--mal:#FF6B6B;--cc:#FF8A3D}
*{box-sizing:border-box}
[hidden]{display:none!important}
body{margin:0;background:var(--bg);color:var(--ink);font-family:Nunito,system-ui,sans-serif}
a{color:inherit;text-decoration:none}
button{font-family:inherit;color:inherit}
a:focus-visible,button:focus-visible{outline:3px solid var(--hi);outline-offset:2px}
svg{display:block}
.app{max-width:520px;margin:0 auto;min-height:100dvh;padding:0 16px calc(28px + env(safe-area-inset-bottom))}
.app.pvx{padding-bottom:calc(84px + env(safe-area-inset-bottom))}

/* barra superior: X, barra única (racha), 3 corazones pixel, sonido */
.top{display:flex;align-items:center;gap:10px;position:sticky;top:0;z-index:5;padding:calc(30px + env(safe-area-inset-top)) 0 10px;background:var(--bg)}
.cir{flex:none;width:44px;height:44px;padding:0;display:flex;align-items:center;justify-content:center;cursor:pointer;border-radius:50%;border:1px solid var(--bd);background:var(--card)}
.cir:hover{border-color:var(--hi)}
.prog{position:relative;flex:1;height:14px;border-radius:99px;background:var(--track)}
.fill,.fxl{position:absolute;left:0;top:0;bottom:0;width:0;transition:width .4s ease}
.fill{border-radius:99px;background:var(--cc);transition:width .4s ease,background .3s,box-shadow .3s}
.fxl{pointer-events:none;overflow:visible}
.hearts{flex:none;display:flex;gap:5px}.top .hsv{width:25px;height:22px}
.hdr{display:flex;align-items:center;justify-content:space-between;gap:10px;margin:10px 4px 0}
.chip{padding:6px 12px;border-radius:99px;font-size:11px;font-weight:900;letter-spacing:.1em;border:1px solid color-mix(in srgb,var(--cc) 55%,var(--bd));background:color-mix(in srgb,var(--cc) 20%,var(--card))}
.rc{font-size:13px;font-weight:900;color:var(--mu)}
.combo{height:22px;margin:8px 4px 0;text-align:center;font-size:15px;font-weight:900;color:var(--gold)}

/* tarjeta del cliente */
.card{position:relative;margin-top:6px;padding:12px;border-radius:28px;border:1px solid color-mix(in srgb,var(--cc) 45%,var(--bd));background:linear-gradient(155deg,color-mix(in srgb,var(--cc) 14%,var(--bg)),var(--card) 70%);animation:entra .35s ease}
.card.sale{animation:sale .25s ease forwards}.card.shk{animation:shk .35s ease}
.head{position:relative}
.esc{position:relative;overflow:hidden;border-radius:20px;aspect-ratio:360/190;background:#8CCBF2}
.esc .bg{position:absolute;inset:0;width:100%;height:100%}
.cl{position:absolute;left:5%;bottom:4%;width:22%;z-index:2;line-height:0;animation:bob 2.2s ease-in-out infinite}
.cl.hop{animation:hop .5s ease}
.cl svg{width:100%;height:auto;overflow:visible;filter:drop-shadow(0 3px 0 rgba(0,0,0,.3))}
.ped{position:relative;margin-top:12px;text-align:center}
.ped small{font-size:11px;font-weight:900;letter-spacing:.12em;color:var(--mu)}
.pq{margin:4px 0 0;font-size:24px;font-weight:900;line-height:1.25}
.pq u{text-decoration:none;color:var(--cc);border-bottom:4px solid var(--cc)}
.listen{position:relative;display:inline-flex;align-items:center;justify-content:center;gap:8px;height:48px;margin-top:12px;padding:0 20px;border:0;border-radius:99px;cursor:pointer;background:var(--hi);color:var(--on-hi);font:900 15px Nunito,sans-serif;box-shadow:0 4px 0 rgba(128,128,128,.35);touch-action:manipulation}
.listen:active{transform:translateY(2px)}
.pac{height:10px;margin:14px 4px 0;border-radius:99px;background:var(--track);overflow:hidden}
.pac i{display:block;height:100%;width:100%;border-radius:99px;background:var(--ok);transition:width .15s linear,background .3s}
.pac i.mid{background:var(--gold)}.pac i.low{background:var(--mal)}
.inst{margin:12px 0 0;text-align:center;font-size:14px;font-weight:800;color:var(--mu)}
.ops{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:12px}
.op{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;min-height:92px;padding:10px 4px 8px;border-radius:22px;border:1px solid var(--bd);background:var(--card);cursor:pointer;font:900 16px Nunito,sans-serif;touch-action:manipulation;transition:transform .1s}
.op svg{width:46px;height:46px}
.op:active:not(:disabled){transform:translateY(2px)}.op:disabled{cursor:default}
.op.ok{border-color:var(--ok);background:color-mix(in srgb,var(--ok) 18%,var(--card))}
.op.mal{border-color:var(--mal);background:color-mix(in srgb,var(--mal) 16%,var(--card))}
.msg{min-height:26px;margin:12px 0 0;text-align:center;font-size:16px;font-weight:800}.msg.ok{color:var(--ok)}.msg.mal{color:var(--mal)}

/* ===== RESULTADO · MEDALLA con rayos ===== */
.f2{position:relative;text-align:center;padding-top:26px;overflow:hidden;animation:entra .5s ease}
.f2 .rayos{position:absolute;left:50%;top:-110px;width:560px;height:560px;margin-left:-280px;border-radius:50%;background:repeating-conic-gradient(color-mix(in srgb,var(--gold) 26%,transparent) 0 9deg,transparent 9deg 18deg);-webkit-mask-image:radial-gradient(circle,#000 25%,transparent 68%);mask-image:radial-gradient(circle,#000 25%,transparent 68%);animation:giroM 22s linear infinite}
.f2 .medw{position:relative;z-index:1;width:176px;margin:0 auto}
.f2 .cinta{position:absolute;left:50%;top:136px;transform:translateX(-50%);display:flex;gap:16px;z-index:0}
.f2 .cinta i{width:36px;height:62px;background:#E5322B;clip-path:polygon(0 0,100% 0,100% 100%,50% 82%,0 100%)}
.f2 .cinta i+i{background:#B8261F}
.f2 .med{position:relative;z-index:1;width:176px;height:176px;border-radius:50%;display:flex;align-items:center;justify-content:center;background:radial-gradient(circle at 35% 28%,#FFF0B8,#FFC83D 55%,#B8860B);box-shadow:0 0 0 8px color-mix(in srgb,var(--gold) 35%,transparent),0 16px 34px rgba(0,0,0,.4);animation:popM .7s ease both}
.f2 .med::before{content:"";position:absolute;inset:14px;border-radius:50%;border:3px dashed rgba(120,80,0,.45)}
.f2 .est{display:flex;justify-content:center;gap:8px;position:relative;z-index:2;margin:52px 0 6px}
.f2 .est span{line-height:0;opacity:0;animation:estrM .6s cubic-bezier(.2,1.6,.4,1) forwards}
.f2 h2{position:relative;z-index:2;margin:8px 0 0;font-size:30px;font-weight:900}
.f2 .chips{position:relative;z-index:2;display:flex;justify-content:center;gap:10px;margin-top:12px}
.f2 .chips span{padding:8px 16px;border-radius:99px;border:1px solid var(--bd);background:var(--card);font-size:14px;font-weight:800;color:var(--mu)}
.f2 .chips b{color:var(--ink);font-size:17px}
.f2 .aura{position:relative;z-index:2;display:inline-flex;gap:8px;align-items:center;height:44px;margin-top:10px;padding:0 18px;border-radius:99px;border:1px solid var(--gold);background:color-mix(in srgb,var(--gold) 14%,var(--card));font-size:19px;font-weight:900;color:var(--gold);animation:popM .5s ease .8s both}
.f2 .aura span{display:flex}
.f2 .ya{position:relative;z-index:2;margin:10px 0 0;font-size:14px;font-weight:700;color:var(--mu)}
.f2 .rep{position:relative;z-index:2;text-align:left;margin:18px 0 0}
.f2 .rep h3{margin:0 0 8px;font-size:12px;font-weight:900;letter-spacing:.14em;color:var(--mu)}
.f2 .rep .it{display:flex;align-items:center;gap:12px;margin-bottom:8px;padding:10px 14px;border-left:4px solid var(--ok);border-radius:0 18px 18px 0;background:var(--card);font-size:14px;font-weight:700;line-height:1.45;color:var(--mu)}
.f2 .rep .it svg{flex:none;width:36px;height:36px}
.f2 .rep .it b{font-size:17px;font-weight:900;color:var(--ok)}
.f2 .acc{position:relative;z-index:2;display:flex;gap:10px;margin-top:20px}
.f2 .g-btn{display:flex;align-items:center;justify-content:center;height:56px;border-radius:99px;border:1px solid var(--bd);background:var(--card);font:900 16px Nunito,sans-serif;cursor:pointer;touch-action:manipulation}
.f2 .g-btn:active{transform:translateY(2px)}
.f2 .g-btn.main{flex:2;background:var(--hi);color:var(--on-hi);border-color:var(--hi);box-shadow:0 4px 0 rgba(128,128,128,.35)}
.f2 .g-btn.alt{flex:1}
.f2.perdio .rayos{display:none}
.f2.perdio .medw{width:120px}
.f2.perdio .medw svg{width:100%;height:auto;overflow:visible;filter:drop-shadow(0 3px 0 rgba(0,0,0,.3))}
.f2.perdio .est{margin-top:14px}
@keyframes giroM{to{transform:rotate(360deg)}}
@keyframes popM{0%{transform:scale(.3);opacity:0}40%{transform:scale(1.18);opacity:1}100%{transform:scale(1);opacity:1}}
@keyframes estrM{from{opacity:0;transform:scale(.2) rotate(-40deg)}to{opacity:1;transform:none}}
@media (prefers-reduced-motion:reduce){.f2 .est span{opacity:1!important}}

/* ===== RACHA ORO + CORAZONES PUM ===== */
.top .pop{top:calc(4px + env(safe-area-inset-top))}
.pop{position:absolute;left:50%;top:4px;font-weight:900;white-space:nowrap;pointer-events:none;color:#E5A800;text-shadow:0 2px 0 rgba(0,0,0,.35);animation:popl 1.6s ease-out forwards}
.pop.bad{color:#FF5A5A}
@keyframes popl{0%{opacity:0;transform:translateX(-50%) scale(.3)}25%{opacity:1;transform:translateX(-50%) scale(1.25)}45%{transform:translateX(-50%) scale(1)}100%{opacity:0;transform:translateX(-50%) translateY(-14px)}}
@keyframes flow{to{background-position:-200% 0}}
@keyframes fly{to{transform:translate(var(--dx),var(--dy)) scale(.2) rotate(180deg);opacity:0}}
.on .fill{background:linear-gradient(90deg,#F5B301,#FFE27A,#F5B301);background-size:200% 100%;animation:flow var(--spd,1.4s) linear infinite;box-shadow:0 0 var(--glow,16px) 2px #F5B301}
.on[data-lv="4"] .fill{background:linear-gradient(90deg,#F5B301,#FFF3B0,#FFD84D,#FFFFFF,#FFD84D,#FFF3B0,#F5B301);background-size:200% 100%}
.sk{position:absolute;width:12px;height:12px;margin:-6px;background:#fff;clip-path:polygon(50% 0,62% 38%,100% 50%,62% 62%,50% 100%,38% 62%,0 50%,38% 38%);animation:tw .8s ease-out forwards}
@keyframes tw{0%{transform:scale(0) rotate(0)}50%{transform:scale(1.2) rotate(90deg)}100%{transform:scale(0) rotate(180deg)}}
.cf{position:absolute;right:0;top:50%;width:6px;height:9px;animation:fly 1s ease-out forwards}
.rghead,.rgring{position:absolute;right:-10px;top:50%;width:20px;height:20px;margin-top:-10px;border-radius:50%}
.rghead{background:radial-gradient(circle,#fff 0 30%,#FFE27A 31% 60%,transparent 70%);animation:pulse .6s ease-in-out infinite alternate}
@keyframes pulse{to{transform:scale(1.4)}}
.rgring{border:2px solid #FFD84D;animation:rgring 1s ease-out infinite}
@keyframes rgring{from{transform:scale(.6);opacity:.9}to{transform:scale(3);opacity:0}}
.shine{position:absolute;inset:0;border-radius:99px;overflow:hidden}
.shine::after{content:"";position:absolute;top:0;bottom:0;width:30%;background:linear-gradient(90deg,transparent,rgba(255,255,255,.85),transparent);animation:sweep 1s linear infinite}
@keyframes sweep{from{left:-30%}to{left:100%}}
.bolt{position:absolute;left:0;top:-22px;width:100%;height:60px;overflow:visible;animation:zap .34s ease-out forwards}
.bolt path{fill:none;stroke-linejoin:round;vector-effect:non-scaling-stroke}
.bolt .g{stroke:#F5B301;stroke-width:6;opacity:.55;filter:blur(2px)}
.bolt .c{stroke:#FFF6C2;stroke-width:2.4;filter:drop-shadow(0 0 4px #F5B301)}
@keyframes zap{0%{opacity:1}100%{opacity:0}}
.flash{animation:fla .6s ease-out}
@keyframes fla{0%,100%{box-shadow:0 0 0 0 rgba(255,216,77,0)}20%{box-shadow:0 0 44px 12px #FFD84D}}
.heart{display:block;transform-origin:50% 50%}
.hsv{display:block;overflow:visible}
.hsv rect{transform-box:fill-box;transform-origin:center}
.hp{fill:var(--mal)}
.hp.hl{fill:#FFD0D0}
.hp.off,.hp.off.hl{fill:var(--toff)}
.popin{animation:popin .35s ease-out}
@keyframes popin{0%{transform:scale(1.6)}100%{transform:scale(1)}}
@keyframes pix{to{transform:translate(var(--dx),var(--dy)) scale(.3) rotate(var(--rot,90deg));opacity:0}}
.pum{animation:pum .3s ease-out forwards}
@keyframes pum{0%{transform:scale(1)}60%{transform:scale(1.8);filter:brightness(2.2)}100%{transform:scale(1.5);filter:brightness(3)}}
.boom .hp{animation:pix .75s ease-out forwards}
.shake{animation:shake .4s}
@keyframes shake{0%,100%{transform:none}20%{transform:translateX(-7px)}40%{transform:translateX(6px)}60%{transform:translateX(-4px)}80%{transform:translateX(3px)}}
.err .prog{animation:errf .5s}
@keyframes errf{0%,100%{box-shadow:0 0 0 0 rgba(255,77,77,0)}30%{box-shadow:0 0 22px 4px #FF4D4D}}

/* ===== B · Pedido (ticket) ===== */
.d-B .card{border:2px dashed color-mix(in srgb,var(--cc) 60%,var(--bd));background:var(--card);border-radius:18px}
.d-B .head{display:flex;gap:12px;align-items:stretch}
.d-B .esc{flex:none;width:96px;aspect-ratio:auto;display:flex;align-items:flex-end;justify-content:center;border-radius:14px;background:color-mix(in srgb,var(--cc) 24%,var(--card))}
.d-B .esc .bg{display:none}
.d-B .cl{position:static;width:74px;margin:10px 0}
.d-B .ped{flex:1;margin:0;padding:12px 12px 14px;text-align:left;border-radius:6px;background:var(--chip);border:2px dashed var(--bd)}
.d-B .pq{font-size:21px}
.d-B .listen{height:42px;padding:0 16px;border-radius:12px;font-size:14px}
.d-B .pac{border-radius:4px}.d-B .pac i{border-radius:0}
.d-B .ops{grid-template-columns:1fr 1fr}
.d-B .op{flex-direction:row;justify-content:flex-start;gap:12px;min-height:64px;padding:8px 14px;border-radius:14px}
.d-B .op svg{width:38px;height:38px}

/* ===== C · Foco ===== */
.d-C .card{padding:0;border:0;background:none;box-shadow:none}
.d-C .esc{width:96px;aspect-ratio:auto;margin:0 auto;overflow:visible;background:none;border-radius:0}
.d-C .esc .bg{display:none}
.d-C .cl{position:static;width:96px}
.d-C .ped small{display:none}
.d-C .pq{font-size:17px;color:var(--mu)}
.d-C .pq u{display:block;margin-top:2px;font-size:54px;line-height:1.1;border:0;color:var(--ink)}
.d-C .listen{width:92px;height:92px;padding:0;border-radius:50%}
.d-C .listen svg{width:40px;height:40px}.d-C .lb{display:none}
.d-C .listen::after{content:"";position:absolute;inset:-9px;border-radius:50%;border:2px solid var(--cc);animation:ring 2s ease-out infinite}
.d-C .ped{margin-top:2px}
.d-C .pac{margin-top:22px}
.d-C .ops{gap:8px}
.d-C .op{aspect-ratio:1;min-height:0;border-radius:50%;padding:6px;gap:2px;font-size:13px}
.d-C .op svg{width:44px;height:44px}

/* ===== D · Jugos (azulejos de color) ===== */
.d-D .card{border:3px solid var(--bd);border-radius:24px;background:var(--card)}
.d-D .esc{aspect-ratio:360/118;border-radius:14px}
.d-D .esc .bg{height:auto;top:auto;bottom:0;aspect-ratio:360/190}
.d-D .cl{width:17%;bottom:3%}
.d-D .ops{gap:8px}
.d-D .op{min-height:112px;gap:8px;border:3px solid var(--fc);background:color-mix(in srgb,var(--fc) 22%,var(--card));border-radius:20px;font-size:15px}
.d-D .op svg{width:56px;height:56px}
.d-D .op.ok{background:var(--ok);border-color:var(--ok);color:var(--on-hi)}
.d-D .op.mal{background:var(--mal);border-color:var(--mal);color:var(--on-hi)}

/* selector de diseños (vista previa) */
.pv{position:fixed;left:50%;bottom:calc(14px + env(safe-area-inset-bottom));transform:translateX(-50%);z-index:20;display:flex;gap:2px;padding:5px;border-radius:99px;border:1px solid var(--bd);background:var(--card);box-shadow:0 10px 30px rgba(0,0,0,.45)}
.pv button{height:42px;padding:0 11px;border:0;border-radius:99px;cursor:pointer;background:transparent;font:800 12px Nunito,sans-serif;color:var(--mu);white-space:nowrap}
.pv button.on{background:var(--hi);color:var(--on-hi)}

/* personaje (animaciones de Acciones) */
.oc,.bo,.r1,.r2,.l1,.l2{opacity:0}
.oc{animation:parp 4s infinite}
@keyframes parp{0%,92%,100%{opacity:0}94%,97%{opacity:1}}
.sp{transform-box:fill-box;transform-origin:center;animation:brilla 1s ease-in-out infinite}
@keyframes brilla{0%,100%{transform:scale(.3);opacity:.2}50%{transform:scale(1);opacity:1}}
@keyframes ua{0%{opacity:1}50%{opacity:0}}
@keyframes ub{0%{opacity:0}50%{opacity:1}}
.saludo .mov{animation:resp 2.4s ease-in-out infinite}
@keyframes resp{0%,100%{transform:translateY(0)}50%{transform:translateY(-.25px)}}
.saludo .rd{animation:sd 7s step-end infinite}
.saludo .r1{animation:s1 7s step-end infinite}
.saludo .r2{animation:s2 7s step-end infinite}
.saludo .bo{animation:sb 7s step-end infinite}
@keyframes sd{0%{opacity:1}10%{opacity:0}50%{opacity:1}100%{opacity:1}}

  if (!r) box.insertAdjacentHTML("afterend", '<p class="igf-nota">Conéctate a internet para ver a los demás de tu liga.</p>');
  else box.insertAdjacentHTML("afterend", '<p class="igf-nota">Puesto ' + (pd + 1) + ' de ' + D.length + ' esta semana.</p>');
  setTimeout(() => {
    box.querySelectorAll(".igf-f").forEach(f => { const i = D.findIndex(x => x.uid === f.dataset.u); f.style.top = (i - off) * H + "px"; f.querySelector(".p").textContent = i + 1; });
    const y = box.querySelector(".igf-f.yo"); if (!y) return;
    contar(y.querySelector(".v"), Math.max(0, semana - gan), semana, 900);
    setTimeout(() => { const m = y.querySelector(".igf-mas"); if (m) m.classList.add("on"); y.classList.add("fl"); }, 600);
    if (sube > 0) setTimeout(() => { const u = y.querySelector(".igf-up"); u.textContent = "▲" + sube; u.classList.add("on"); tono(880, 0, .25, "triangle", .06); tono(1175, .1, .3, "triangle", .06); }, 900);
  }, 2000);
}
