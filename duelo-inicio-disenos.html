<style>
*{box-sizing:border-box}html,body{margin:0;background:var(--bg);color:var(--ink);font-family:Nunito,system-ui,sans-serif}

.nav{position:absolute;left:0;right:0;bottom:0;display:flex;justify-content:space-around;padding:10px 0 14px;background:var(--nav,var(--card));border-top:1px solid var(--bd);font-size:11px;font-weight:800;color:var(--mu)}

.h .tg{position:absolute;bottom:-6px;left:50%;transform:translateX(-50%);padding:1px 7px;border-radius:99px;background:#E5484D;color:#fff;font-size:10px;border:2px solid var(--bg);white-space:nowrap}

.h small{color:var(--mu);font-size:11px}

.hist-t b{color:#E5484D}

.eE{position:relative;z-index:1;margin-top:-26px;padding:30px 12px 12px;border-radius:0 0 24px 24px;background:#E5484D;color:#fff;display:flex;align-items:center;gap:10px;animation:sac 3s ease-in-out infinite}
