<script>
/* ===== WEB (GitHub Pages): convierte los enlaces go:seccion en seccion.html. En App Creator no hace nada. ===== */
(function(){
  var web = /github\.io$/.test(location.hostname);
  window.igURL = function(u){
    u = String(u);
    if (!web || u.indexOf("go:") !== 0) return u;
    var s = u.slice(3);
    return (s === "inicio" ? "index" : s) + ".html";
  };
  if (!web) return;
  document.addEventListener("click", function(e){
    var a = e.target.closest && e.target.closest('a[href^="go:"]');
    if (a){ e.preventDefault(); location.href = igURL(a.getAttribute("href")); }
  }, true);
})();
</script>

const NAV = [
  { nombre:"Inicio", url:"go:inicio", activo:true, icono:'<path d="M3 11 12 3l9 8"></path><path d="M5 10v10h14V10"></path>' },
  { nombre:"Mapa", url:"go:repaso", icono:'<path d="M9 4 3 6.5v13L9 17l6 2.5 6-2.5v-13L15 7z"></path><path d="M9 4v13M15 7v12.5"></path>' },
  { nombre:"Tienda", url:"go:tienda", icono:'<path d="M4 9h16l-1 11H5L4 9z"></path><path d="M8 9V7a4 4 0 0 1 8 0v2"></path>' },

];

/* ================= No necesitas tocar lo de abajo ================= */
const $ = id => document.getElementById(id);
let mudo = false;
const say = t => { if (mudo) return; try { speechSynthesis.cancel(); const u = new SpeechSynthesisUtterance(t); u.lang = "en-US"; u.rate = .85; speechSynthesis.speak(u); } catch (e) {} };
/* Se usa \x26 para que AppCreator24 no convierta las entidades */
const esc = s => String(s).replace(/&/g, "\x26amp;").replace(/"/g, "\x26quot;");
const spk = n => '<svg width="' + n + '" height="' + n + '" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M11 5 6 9H3v6h3l5 4z"></path><path d="M15.5 8.5a5 5 0 0 1 0 7"></path></svg>';

let audioActual = null;
const CACHE = {};
const srcDe = mp3 => mp3 ? (AUDIOS[mp3] || (AUDIO_BASE ? AUDIO_BASE + mp3 : "")) : "";
/* Precarga: descarga los mp3 al abrir la página para que suenen al instante */
const precarga = () => {
  document.querySelectorAll("[data-mp3]").forEach(el => {
    const m = el.dataset.mp3, s = srcDe(m);
    if (!m || !s || CACHE[m]) return;
    try { const a = new Audio(); a.preload = "auto"; a.src = s; a.load(); CACHE[m] = a; } catch (e) {}
  });
};
const play = (txt, mp3) => {
  try { if (window.speechSynthesis) speechSynthesis.cancel(); } catch (e) {}
  try { if (audioActual) { audioActual.pause(); audioActual.currentTime = 0; } } catch (e) {}
  if (mudo) return;
  const src = srcDe(mp3);
  if (src) {
    try {
      const a = CACHE[mp3] || new Audio(src);
      CACHE[mp3] = a;
      audioActual = a; a.volume = 1; a.currentTime = 0;
      a.onerror = () => say(txt);
      const p = a.play();
      if (p && p.catch) p.catch(() => say(txt));
      return;
    } catch (e) {}
  }
  say(txt);
};

const BASE = ["...kkkkkk...","..kkkkkkkk..","..kwwwwwwk..","..hhhhhhhh..","..hwessewh..","..ssssssss..","..sssmmsss..","ggggqllqgggg","ggggqllqgggg","ggggzllzgggg","gggggllggggg","llgggllgggll","ssgggllgggss","ssppppppppss","..ppp..ppp..","..fff..fff.."];
const PAL = { k:"#151518", w:"#F2F4F8", h:"#8A5A33", e:"#3A2414", s:"#F2B98F", m:"#B8704F", M:"#7A1F1F", g:"#5A5A5E", l:"#C4C4C8", q:"#A0A0A5", z:"#0B0B0D", p:"#1A1A1E", f:"#F2F4F8", W:"#FFFFFF", r:"#FF8FA3", t:"#6EC6FF", v:"#FF2D2D", S:"#E3A67C", H:"#FF4D8D", y:"#FFC83D" };
const solo = (r1, r2, c1, c2, k) => { const o = []; for (let r = r1; r <= r2; r++) for (let c = c1; c <= c2; c++) o.push([r, c, k]); return o; };
const rects = l => l.map(x => '<rect x="' + x[1] + '" y="' + x[0] + '" width="1" height="1" fill="' + PAL[x[2]] + '"></rect>').join("");
const arriba = (lado, top) => { const a = lado === "R" ? 10 : 0; return solo(top, top + 1, a, a + 1, "s").concat(solo(top + 2, top + 2, a, a + 1, "l"), solo(top + 3, 8, a, a + 1, "g")); };
const lado = top => solo(top, top + 1, 11, 12, "s").concat(solo(top + 2, top + 2, 11, 12, "l"), solo(top + 3, 8, 10, 11, "g"));
const chispa = (x, y, d) => '<g class="sp" style="animation-delay:' + d + 's"><rect x="' + (x + 1) + '" y="' + y + '" width="1" height="3" fill="#FFC83D"></rect><rect x="' + x + '" y="' + (y + 1) + '" width="3" height="1" fill="#FFC83D"></rect></g>';
const sudor = (a, b, d) => '<g class="tA" style="animation-delay:' + d + 's">' + rects([[a[0],a[1],"t"]]) + '</g><g class="tB" style="animation-delay:' + d + 's">' + rects([[b[0],b[1],"t"]]) + '</g>';
const SONRISA = [[6,4,7,"M"],[5,3,3,"M"],[5,8,8,"M"]];
const cara = () => solo(4,5,9,10,"s").concat(solo(6,6,10,11,"l"),solo(7,8,10,11,"g"));
const caraL = () => solo(4,5,1,2,"s").concat(solo(6,6,0,1,"l"),solo(7,8,0,1,"g"));
const corazon = (x, y, d) => '<g class="cor" style="animation-delay:' + d + 's">' + rects([[y,x,"H"],[y,x+2,"H"],[y+1,x,"H"],[y+1,x+1,"H"],[y+1,x+2,"H"],[y+2,x+1,"H"]]) + '</g>';
const interrog = '<g class="q">' + rects([[-2,10,"y"],[-2,11,"y"],[-2,12,"y"],[-1,12,"y"],[0,11,"y"],[2,11,"y"]]) + '</g>';
const excl = x => '<g class="vena">' + rects([[-2,x,"v"],[-1,x,"v"],[0,x,"v"],[2,x,"v"]]) + '</g>';
const PJ = {
  saludo:{ mod:[], bo:solo(5,6,5,6,"M"), r1:arriba("R",3), r2:lado(3), extra:"" },
  alegre:{ mod:SONRISA.concat([[5,2,2,"r"],[5,9,9,"r"]]), bo:solo(6,6,5,6,"W"), r1:arriba("R",3), r2:arriba("R",4), l1:arriba("L",3), l2:arriba("L",4), extra:"", fuera:chispa(-1,0,0)+chispa(11,0,.4)+chispa(5,-2,.8) },
  pulgar:{ mod:SONRISA, bo:[], gu:[[4,7,"e"],[4,8,"e"]], r1:arriba("R",5).concat(solo(3,4,11,11,"s")), r2:arriba("R",5).concat(solo(2,3,11,11,"s")), extra:"", fuera:chispa(11,-2,0)+chispa(-1,1,.5) },
  animo:{ mod:SONRISA, bo:solo(6,6,5,6,"W"), r1:arriba("R",3), extra:"", fuera:chispa(-1,0,0)+chispa(11,-1,.5) },
  ups:{ mod:[[5,5,6,"M"],[6,5,6,"M"]], bo:[], r1:arriba("R",3), l1:arriba("L",3), extra:sudor([1,1],[2,1],0), fuera:'<g class="vena">'+rects([[-2,10,"v"],[-1,10,"v"],[0,10,"v"],[2,10,"v"]])+'</g>' },
  triste:{ mod:[[6,5,6,"s"],[5,5,6,"m"],[6,4,4,"m"],[6,7,7,"m"]], bo:[], r1:arriba("R",4), r2:cara(),
    extra:'<g class="tA">'+rects([[5,3,"t"],[5,8,"t"]])+'</g><g class="tB">'+rects([[6,3,"t"],[6,8,"t"]])+'</g>' },
  amor:{ mod:[[4,3,4,"H"],[4,7,8,"H"],[5,2,3,"r"],[5,8,9,"r"],[6,4,7,"m"]], bo:[], r1:arriba("R",4), r2:cara(), extra:"", fuera:corazon(10,2,0)+corazon(-1,1,.8)+corazon(10,-2,1.6) },
  pienso:{ mod:[[6,5,6,"s"],[6,6,7,"m"]], bo:[],
    r1:solo(5,6,9,10,"S").concat(solo(7,7,10,11,"l"),solo(8,8,10,11,"g")), r2:solo(6,7,9,10,"S").concat(solo(8,8,10,11,"l")), extra:"", fuera:interrog },
  sorpresa:{ mod:[[4,3,4,"w"],[4,7,8,"w"],[5,3,4,"w"],[5,7,8,"w"],[5,4,4,"e"],[5,7,7,"e"],[6,5,6,"M"]], bo:[], r1:cara(), l1:caraL(), extra:"", fuera:excl(10)+excl(0) },
  cool:{ mod:[[4,3,8,"z"],[6,4,7,"m"],[5,8,8,"m"]], bo:[], gu:[[4,4,"W"],[4,7,"W"]], r1:arriba("R",4), r2:cara(), extra:"", fuera:chispa(11,-1,0)+chispa(-1,0,.7) }
};
function personaje(id) {
  const a = PJ[id], g = BASE.map(f => f.split(""));
  a.mod.forEach(m => { for (let c = m[1]; c <= m[2]; c++) g[m[0]][c] = m[3]; });
  const cab = [], cue = [], rd = [], ld = [];
  g.forEach((fila, r) => fila.forEach((k, c) => {
    if (k === ".") return;
    const x = [r, c, k];
    if (r <= 6) cab.push(x); else if (r <= 13 && c >= 10) rd.push(x); else if (r <= 13 && c <= 1) ld.push(x); else cue.push(x);
  }));
  return '<svg class="' + id + '" viewBox="-1 -2 14 18.8" shape-rendering="crispEdges" aria-hidden="true"><rect x="2" y="16" width="8" height=".6" fill="#000" opacity=".4"></rect>' +
    '<g class="mov">' + rects(cue) + '<g class="cab">' + rects(cab) + '<g class="oc">' + rects([[4,3,"e"],[4,4,"e"],[4,7,"e"],[4,8,"e"]]) + '</g><g class="bo">' + rects(a.bo) + '</g><g class="gu">' + rects(a.gu || []) + '</g>' + a.extra + '</g>' +
    '<g class="ld">' + rects(ld) + '</g><g class="l1">' + rects(a.l1 || []) + '</g><g class="l2">' + rects(a.l2 || []) + '</g>' +
    '<g class="rd">' + rects(rd) + '</g><g class="r1">' + rects(a.r1 || []) + '</g><g class="r2">' + rects(a.r2 || []) + '</g></g>' + (a.fuera || "") + '</svg>';
}

const QZ = [];
function bloque(b) {
  if (b.tipo === "titulo") return "<h2>" + b.texto + "</h2>";
  if (b.tipo === "subtitulo") return "<h3>" + b.texto + "</h3>";
  if (b.tipo === "tip" || b.tipo === "cuidado")
    return '<div class="tip"><div class="pj">' + personaje(b.pj || "alegre") + '</div><div class="bub"><strong>' + b.titulo + "</strong><p>" + b.texto + "</p>" +
      (b.ok ? '<div class="ej ok">✓ ' + b.ok + "</div>" : "") +
      (b.mal ? '<div class="ej mal">✗ ' + b.mal + "</div>" : "") + "</div></div>";
  if (b.tipo === "tabla")
    return '<div class="tabla">' + b.filas.map(f => '<div class="fila"><span class="a">' + f[0] + '</span><span class="b">' + f[1] + "</span></div>").join("") + "</div>";
  if (b.tipo === "chuleta")
    return '<div class="chus">' + b.items.map(c => '<div class="chu"><span class="p">' + c[0] + '<small>' + c[2] + '</small></span><span class="v">→ ' + c[1] + '</span></div>').join("") + "</div>";
  if (b.tipo === "frases")
    return b.items.map(f => '<div class="fr2"><div class="t"><b>' + f[0] + "</b><small>" + f[1] + '</small></div><button type="button" class="snd" aria-label="Escuchar ' + esc(f[0]) + '" data-say="' + esc(f[0]) + '" data-mp3="' + (f[2] || "") + '">' + spk(22) + '</button></div>').join("");
  if (b.tipo === "pronombres")
    return '<div class="pros">' + b.items.map(p => '<button type="button" class="pro" data-say="' + esc(p[0]) + '" data-mp3="' + (p[2] || "") + '"><b>' + p[0] + ' <i>' + spk(15) + '</i></b><small>' + p[1] + "</small></button>").join("") + "</div>";
  if (b.tipo === "quiz") { QZ.push({ items: b.items, i: 0, s: 0 }); return '<div class="quiz" data-q="' + (QZ.length - 1) + '"></div>'; }
  if (b.tipo === "flip")
    return '<p class="hint">Toca una tarjeta para ver la respuesta.</p><div class="flips">' + b.items.map(f => '<button type="button" class="flip" aria-label="Voltear tarjeta"><span class="in"><span class="f">' + f[0] + '</span><span class="b">' + f[1] + "</span></span></button>").join("") + "</div>";
  if (b.tipo === "siguiente")
    return '<div class="card fin"><div class="pj">' + personaje(b.pj || "pulgar") + '</div><strong>' + b.titulo + '</strong><p>' + b.texto + '</p><button type="button" class="btn marca" id="visto">☐ Marcar como vista</button><a class="btn main" id="jugar" href="' + esc(JUGAR) + '">Jugar</a></div>';
  return "<p>" + b.texto + "</p>";
}

function dibujaQuiz(el) {
  const q = QZ[+el.dataset.q], n = q.items.length;
  if (q.i >= n) {
    el.innerHTML = '<div class="qs">¡Listo! ' + q.s + "/" + n + ' ⭐</div><button type="button" class="qr">Jugar otra vez</button>';
    el.querySelector(".qr").onclick = () => { q.i = 0; q.s = 0; dibujaQuiz(el); };
    return;
  }
  const it = q.items[q.i];
  el.innerHTML = '<div class="qbar"><i style="width:' + (q.i / n * 100) + '%"></i></div><div class="qs">' + it[0] + '</div><div class="qo" style="grid-template-columns:repeat(' + it[2].length + ',1fr)">' +
    it[2].map(v => '<button type="button" data-v="' + v + '">' + v + "</button>").join("") + '</div><div class="qm"></div>';
  let fallo = false;
  el.querySelectorAll(".qo button").forEach(bt => bt.onclick = () => {
    const qm = el.querySelector(".qm");
    if (bt.dataset.v === it[1]) {
      bt.classList.add("ok"); el.querySelectorAll(".qo button").forEach(x => x.disabled = true);
      qm.className = "qm"; qm.textContent = "¡Correcto!";
      if (!fallo) q.s++;
      setTimeout(() => { q.i++; dibujaQuiz(el); }, 1500);
    } else { fallo = true; bt.classList.add("no"); bt.disabled = true; qm.className = "qm bad"; qm.textContent = "Casi... prueba otra"; }
  });
}

/* Video (si hay ID), imagen (si la pones) o tarjeta de video mientras tanto */
const vid = $("video");
if (VIDEO_ID) {
  vid.classList.add("yt");
  vid.innerHTML = '<iframe src="https://www.youtube-nocookie.com/embed/' + VIDEO_ID + '" title="Video de la publicación" loading="lazy" allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share" referrerpolicy="strict-origin-when-cross-origin" allowfullscreen></iframe>';
} else if (IMAGEN_VIDEO) {
  vid.innerHTML = '<img src="' + IMAGEN_VIDEO + '" alt="Video próximamente">';
} else {
  vid.innerHTML = '<span class="vt">RUTINA</span><span class="vs">Mi día en inglés · video pronto</span><span class="pl" aria-hidden="true"><svg width="26" height="26" viewBox="0 0 24 24" aria-hidden="true"><path d="M8 5v14l11-7z" fill="currentColor"></path></svg></span><div class="vp">' + personaje("saludo") + '</div>';
}
$("contenido").innerHTML = CONTENIDO.map(bloque).join("");
document.querySelectorAll(".quiz").forEach(dibujaQuiz);
precarga();
$("contenido").addEventListener("click", e => {
  const f = e.target.closest(".flip"); if (f) { f.classList.toggle("on"); return; }
  const s = e.target.closest("[data-say]"); if (s) play(s.dataset.say, s.dataset.mp3);
});

/* Botón de silencio del encabezado */
$("mudo").onclick = e => {
  mudo = !mudo;
  const b = e.currentTarget;
  b.classList.toggle("off", mudo); b.setAttribute("aria-pressed", mudo);
  b.setAttribute("aria-label", mudo ? "Activar audio" : "Silenciar audio");
  if (mudo) { try { speechSynthesis.cancel(); } catch (x) {} try { if (audioActual) audioActual.pause(); } catch (x) {} }
};

/* Marcar como vista: se guarda en "ig:vistos" y la página Refuerza tu inglés lo lee */
const KEY = "ig:vistos", vb = $("visto");
const leerVistos = () => { try { return JSON.parse(localStorage.getItem(KEY) || "[]"); } catch (e) { return []; } };
const pintaVisto = v => { vb.classList.toggle("on", v); vb.textContent = v ? "✅ Vista" : "☐ Marcar como vista"; };
let visto = leerVistos().includes(LECCION_ID);
if (vb) {
  pintaVisto(visto);
  vb.onclick = () => {
    visto = !visto;
    const l = leerVistos().filter(x => x !== LECCION_ID);
    if (visto) l.push(LECCION_ID);
    try { localStorage.setItem(KEY, JSON.stringify(l)); } catch (e) {}
    pintaVisto(visto);
  };
}

$("navbar").innerHTML = NAV.map(n => '<a' + (n.activo ? ' class="on" aria-current="page"' : '') + ' href="' + n.url + '"><svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">' + n.icono + '</svg>' + n.nombre + '</a>').join("");
/* Si llegaste desde «Ver lección» de un nivel, la flecha de atrás te regresa a ese nivel */
(function () {
  let v = null; try { v = JSON.parse(localStorage.getItem("ig:volver") || "null"); } catch (e) {}
  if (!v || !v.u || Date.now() - (v.t || 0) > 3 * 3600e3) return;
  document.querySelectorAll('a.bk[href="go:refuerza"]').forEach(a => a.setAttribute("href", v.u));
})();
/* Al ir a jugar ya no hace falta recordar el nivel */
document.addEventListener("click", e => { if (e.target.closest("#jugar, a.bk")) { try { localStorage.removeItem("ig:volver"); } catch (x) {} } });
</script>
