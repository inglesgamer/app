<script>
/* ===== WEB (GitHub Pages): convierte los enlaces go:seccion en seccion.html. En App Creator no hace nada. ===== */
(function(){
  var web = /github\.io$/.test(location.hostname);
  window.igURL = function(u){
    u = String(u);
    if (!web || u.indexOf("go:") !== 0) return u;
    var s = u.slice(3);
    return (s === "inicio" ? "index" : s) + ".html";
  };
  if (!web) return;
  document.addEventListener("click", function(e){
    var a = e.target.closest && e.target.closest('a[href^="go:"]');
    if (a){ e.preventDefault(); location.href = igURL(a.getAttribute("href")); }
  }, true);
})();
</script>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Tienda · InglésGamer</title>
<meta name="theme-color" content="#000000">
<script>
/* ===== PALETAS: las mismas del Inicio (clave "ingles_gamer_tema"). Si el jugador elige Noche, Día, Rosa o Azul en el Inicio, la Tienda también. ===== */
var TEMA_KEY = "ingles_gamer_tema";
var PALETAS = {
  noche: { meta:"#000000", cs:"dark", v:{ "--bg":"#000000","--card":"#141416","--bd":"#2A2A2E","--ink":"#F4F4F5","--mu":"#B8B8C0","--chip":"#222226","--tile":"#1E1E22","--gold":"#FFD166","--hi":"#FFFFFF","--on-hi":"#000000","--toff":"#3A3A40","--nav":"#0E0E10","--ok":"#7BE3A8" } },
  dia:   { meta:"#F4F4F5", cs:"light", v:{ "--bg":"#F4F4F5","--card":"#FFFFFF","--bd":"#E4E4E7","--ink":"#0B0B0D","--mu":"#5C666B","--chip":"#EFEFF1","--tile":"#EFEFF1","--gold":"#9A6000","--hi":"#0B0B0D","--on-hi":"#FFFFFF","--toff":"#D4D4D8","--nav":"#FFFFFF","--ok":"#0F7A44" } },
  rosa:  { meta:"#FFF1F6", cs:"light", v:{ "--bg":"#FFF1F6","--card":"#FFFFFF","--bd":"#F8D9E5","--ink":"#2B1420","--mu":"#7A5568","--chip":"#FFE3ED","--tile":"#FFE3ED","--gold":"#B3245A","--hi":"#D63B7A","--on-hi":"#FFFFFF","--toff":"#EEBFD1","--nav":"#FFFFFF","--ok":"#0F7A44" } },
  azul:  { meta:"#EFF6FF", cs:"light", v:{ "--bg":"#EFF6FF","--card":"#FFFFFF","--bd":"#D6E6F8","--ink":"#0E1B2B","--mu":"#4F647B","--chip":"#E0EFFD","--tile":"#E0EFFD","--gold":"#0B5FB0","--hi":"#1C6FD6","--on-hi":"#FFFFFF","--toff":"#BDD6F0","--nav":"#FFFFFF","--ok":"#0F7A44" } }
};
function aplicarTema(id) {
  var p = PALETAS[id] || PALETAS.noche, r = document.documentElement;
  for (var k in p.v) r.style.setProperty(k, p.v[k]);
  r.style.colorScheme = p.cs; r.setAttribute("data-tema", PALETAS[id] ? id : "noche");
  var m = document.querySelector('meta[name="theme-color"]'); if (m) m.setAttribute("content", p.meta);
}
function temaActual() { try { var t = localStorage.getItem(TEMA_KEY); return PALETAS[t] ? t : "noche"; } catch (e) { return "noche"; } }
aplicarTema(temaActual());
window.addEventListener("storage", function (e) { if (e.key === TEMA_KEY) aplicarTema(temaActual()); });
window.addEventListener("pageshow", function () { aplicarTema(temaActual()); });
</script>
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@600;700;800;900&display=swap" rel="stylesheet">
<style>
:root{--bg:#000;--card:#141416;--bd:#2A2A2E;--ink:#F4F4F5;--mu:#B8B8C0;--chip:#222226;--tile:#1E1E22;--gold:#FFD166;--ok:#7BE3A8;--hi:#fff;--on-hi:#000;--toff:#3A3A40;--nav:#0E0E10}
*{box-sizing:border-box}
[hidden]{display:none!important}
body{margin:0;background:var(--bg);color:var(--ink);font-family:Nunito,system-ui,sans-serif}
a{color:inherit;text-decoration:none}
button{font-family:inherit;color:inherit}
a:focus-visible,button:focus-visible{outline:3px solid var(--hi);outline-offset:2px}
.app{max-width:520px;margin:0 auto;min-height:100vh;padding-bottom:calc(120px + env(safe-area-inset-bottom));position:relative}
header{position:sticky;top:0;z-index:10;display:flex;align-items:center;gap:10px;padding:calc(14px + env(safe-area-inset-top)) 16px 12px;background:linear-gradient(var(--bg) 80%,transparent)}
header h1{flex:1;margin:0;font-size:28px;font-weight:900}
.rb{display:flex;align-items:center;justify-content:center;width:46px;height:46px;padding:0;cursor:pointer;border-radius:50%;border:1px solid var(--bd);background:var(--card);color:var(--ink)}
.rb:hover{border-color:var(--hi)}
main{padding:6px 16px 0;display:flex;flex-direction:column;gap:14px}
.card{background:var(--card);border:1px solid var(--bd);border-radius:28px}

/* ---------- tu look ---------- */
.look{position:relative;height:230px;overflow:hidden;border-radius:30px;border:1px solid var(--bd)}
.lb{position:absolute;left:14px;top:14px;z-index:3;padding:5px 12px;border-radius:99px;background:rgba(255,255,255,.2);color:#fff;font-size:11px;font-weight:900;letter-spacing:.12em}
.lg{position:absolute;left:0;right:0;bottom:0;height:34px;z-index:1;opacity:.9}
.lc{position:absolute;left:50%;bottom:36px;transform:translateX(-50%);z-index:2;animation:flota 2.4s ease-in-out infinite}
.tchip{position:absolute;left:50%;bottom:10px;transform:translateX(-50%);z-index:3;padding:5px 16px;border-radius:99px;background:#fff;color:#000;font-size:13px;font-weight:900;white-space:nowrap}
.xpb{position:absolute;right:12px;top:10px;z-index:3;display:inline-flex;align-items:center;gap:6px;height:38px;padding:0 14px;border-radius:99px;background:var(--card);border:1px solid var(--bd);color:var(--gold);font-size:17px;font-weight:900}
.xpb.pulso{animation:pop .5s ease}
.fl{display:inline-flex;color:var(--gold)}

/* ---------- personaje, skins y marcos ---------- */
.sk{display:inline-flex}.sk svg{display:block;filter:drop-shadow(0 4px 0 rgba(0,0,0,.3))}
.arco{animation:hue 3s linear infinite}@keyframes hue{to{filter:hue-rotate(360deg)}}
.fr{display:inline-flex;align-items:flex-end;justify-content:center;overflow:hidden;border-radius:50%;border:5px solid var(--b,#9A6A3A);background:#0F0F12;box-shadow:0 0 var(--g,0px) var(--b)}
.m0{--b:#9A6A3A}.m1{--b:#9A9AA6}.m2{--b:#FFC83D;--g:14px}.m3{--b:#3FD8C8;--g:14px}.m5{--b:#E8F7FF;--g:18px}
.m7{--b:#C9BFA0;border-style:dashed!important}
.m4{animation:fuego 1s ease-in-out infinite alternate}.m6{animation:arcoB 3s linear infinite}
@keyframes fuego{from{border-color:#FF4D4D;box-shadow:0 0 8px #FF4D4D}to{border-color:#FFC83D;box-shadow:0 0 22px #FF8A3D}}
@keyframes arcoB{0%,100%{border-color:#FF4D4D}20%{border-color:#FFC83D}40%{border-color:#5DB33A}60%{border-color:#3FD8C8}80%{border-color:#8E5BD6}}
.dor{background:linear-gradient(90deg,#B8860B,#FFE27A,#FFC83D,#FFF6C0,#B8860B);background-size:200% auto;-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent;color:transparent;animation:oro 2.4s linear infinite}
@keyframes oro{to{background-position:200% center}}
@keyframes orob{from{box-shadow:0 0 6px color-mix(in srgb,var(--hi) 20%,transparent)}to{box-shadow:0 0 22px color-mix(in srgb,var(--hi) 55%,transparent)}}

/* ---------- mapas con movimiento ---------- */
.fx{position:absolute;inset:0;overflow:hidden;pointer-events:none}.fx::before,.fx::after{content:"";position:absolute;inset:0}
.f-mp0::before{background:radial-gradient(circle,#FFF28A 0 2px,transparent 3px) 0 0/70px 60px,radial-gradient(circle,#B6FF8A 0 1.5px,transparent 2.5px) 30px 25px/90px 70px;animation:luci 6s ease-in-out infinite alternate,parp2 1.8s ease-in-out infinite alternate}
.f-mp0::after{top:12%;height:14%;background:radial-gradient(ellipse at 20% 50%,rgba(255,255,255,.18) 0 40%,transparent 41%) 0 0/160px 100%;animation:nube 28s linear infinite}
@keyframes luci{from{background-position:0 0,30px 25px}to{background-position:26px -30px,0 -10px}}
@keyframes parp2{from{opacity:.25}to{opacity:1}}@keyframes nube{from{background-position:0 0}to{background-position:160px 0}}
.f-mp1::before{background:radial-gradient(circle,#fff 0 1.5px,transparent 2px) 10px 10px/46px 38px;animation:parp2 1.4s ease-in-out infinite alternate}
.f-mp1::after{left:-80px;top:10%;width:70px;height:2px;inset:auto;background:linear-gradient(90deg,transparent,#fff);transform:rotate(25deg);animation:fugaz 4s ease-in infinite}
@keyframes fugaz{0%{transform:translate(0,0) rotate(25deg);opacity:0}8%{opacity:1}30%{transform:translate(520px,240px) rotate(25deg);opacity:0}100%{opacity:0}}
.f-mp2::before{background:repeating-linear-gradient(0deg,transparent 0 14px,rgba(255,235,170,.16) 14px 16px),radial-gradient(circle,rgba(255,240,190,.7) 0 1px,transparent 1.5px) 0 0/30px 22px;animation:viento 1.6s linear infinite}
.f-mp2::after{background:linear-gradient(transparent 55%,rgba(255,220,140,.22) 70%,transparent 85%);animation:calor 2.2s ease-in-out infinite alternate}
@keyframes viento{from{background-position:0 0,0 0}to{background-position:-120px 0,-120px 6px}}@keyframes calor{from{transform:translateY(-3px)}to{transform:translateY(3px)}}
.f-mp3::before{background:radial-gradient(circle,#fff 0 2px,transparent 2.8px) 0 0/40px 40px;animation:nieva 3s linear infinite}
.f-mp3::after{background:radial-gradient(circle,rgba(255,255,255,.8) 0 1.2px,transparent 2px) 14px 0/24px 28px;animation:nieva 1.8s linear infinite}
@keyframes nieva{from{background-position-y:0}to{background-position-y:40px}}
.f-mp4::before{background:radial-gradient(circle,#FFB347 0 2px,transparent 3px) 0 0/44px 50px,radial-gradient(circle,#FF5A2A 0 1.5px,transparent 2.5px) 20px 20px/62px 60px;animation:brasas 2.6s linear infinite}
.f-mp4::after{top:auto;height:45%;background:linear-gradient(transparent,rgba(255,90,30,.55));animation:late2 1.2s ease-in-out infinite alternate}
@keyframes brasas{from{background-position:0 0,20px 20px}to{background-position:14px -50px,6px -40px}}@keyframes late2{from{opacity:.35}to{opacity:1}}
.f-mp5::before{background:radial-gradient(circle,#fff 0 1px,transparent 1.6px) 0 0/30px 26px,radial-gradient(circle,#9FD8FF 0 1.4px,transparent 2px) 12px 8px/50px 44px;animation:viaja 2.4s linear infinite}
.f-mp5::after{background:radial-gradient(circle at 25% 70%,rgba(63,216,200,.35),transparent 40%),radial-gradient(circle at 80% 25%,rgba(214,91,214,.35),transparent 45%);animation:respira 4s ease-in-out infinite alternate}
@keyframes viaja{from{background-position:0 0,12px 8px}to{background-position:-60px 26px,-100px 44px}}@keyframes respira{from{opacity:.4;transform:scale(1)}to{opacity:1;transform:scale(1.15)}}

/* ---------- ofertas ---------- */
.ofs{display:flex;gap:12px}
.of{position:relative;flex:1;min-width:0;display:flex;flex-direction:column;align-items:center;gap:6px;padding:10px 10px 12px;text-align:center}
.of b{font-size:16px;font-weight:900}.of .sb{margin-top:-2px;font-size:12px;font-weight:700;color:var(--mu)}
.of.dk{background:linear-gradient(135deg,var(--chip),var(--card));border-color:var(--bd)}
.tag{position:absolute;left:8px;top:8px;z-index:2;padding:3px 10px;border-radius:99px;background:var(--gold);color:var(--bg);font-size:11px;font-weight:900}
.cf{display:flex;animation:flota 2s ease-in-out infinite}

.ad{position:relative;display:flex;align-items:center;gap:14px;min-height:96px;padding:14px 14px 14px 18px;border-radius:30px;border:2px solid var(--hi);background:linear-gradient(110deg,var(--chip),var(--card));overflow:hidden}
.ad::after{content:"";position:absolute;top:0;bottom:0;width:60px;left:-80px;background:linear-gradient(100deg,transparent,rgba(255,255,255,.22),transparent);transform:skewX(-20deg);animation:brillo 3.6s ease-in-out infinite}
@keyframes brillo{0%,60%{left:-80px}100%{left:120%}}
.ad:hover{box-shadow:0 0 24px color-mix(in srgb,var(--hi) 30%,transparent)}.ad:active{transform:translateY(2px)}
.ad .cf{flex:none;animation-duration:1.6s}
.ad .tx{flex:1;min-width:0;display:flex;flex-direction:column;gap:2px;line-height:1.15}
.ad .tx b{font-size:21px;font-weight:900}.ad .tx span{font-size:13px;font-weight:700;color:var(--mu)}
.ad .go{flex:none;display:inline-flex;align-items:center;gap:6px;height:46px;padding:0 18px;border-radius:99px;background:var(--hi);color:var(--on-hi);font-size:16px;font-weight:900;animation:latido 1.8s ease-in-out infinite}
.ad .go .fl{color:var(--on-hi)}
@keyframes latido{0%,100%{transform:scale(1)}50%{transform:scale(1.07)}}

/* ---------- pestañas y tarjetas ---------- */
.tabs{display:flex;gap:8px;overflow-x:auto;margin:0 -16px;padding:2px 16px 4px;scrollbar-width:none}.tabs::-webkit-scrollbar{display:none}
.tab{flex:none;height:42px;padding:0 18px;display:flex;align-items:center;gap:6px;cursor:pointer;border-radius:99px;border:1px solid var(--bd);background:var(--card);color:var(--mu);font:800 14px Nunito,sans-serif}
.tab span{font-size:12px;opacity:.7}.tab.on{background:var(--hi);color:var(--on-hi);border-color:var(--hi)}.tab:hover:not(.on){border-color:var(--mu)}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.it{position:relative;display:flex;flex-direction:column;align-items:center;gap:8px;padding:10px 10px 12px;animation:entra .35s ease both}
.it.eq{border:2px solid var(--hi)}.it.uni{animation:entra .35s ease both,orob 1.6s ease-in-out .4s infinite alternate;border-color:var(--hi)}
.pv{position:relative;width:100%;height:104px;display:flex;align-items:center;justify-content:center;overflow:hidden;border-radius:20px;background:var(--tile)}
.pv .tt{padding:0 8px;font-size:16px;font-weight:900;line-height:1.2;text-align:center;color:var(--gold)}
.strip{position:relative;width:100%;height:100%;overflow:hidden}.strip i{position:absolute;left:0;right:0;bottom:0;height:20px;z-index:1}
.rar{padding:3px 10px;border-radius:99px;font-size:10px;font-weight:900;letter-spacing:.1em}
.rar.ru{background:linear-gradient(90deg,#FFC83D,#FFF6C0,#FFC83D)!important;background-size:200% auto!important;animation:oro 2s linear infinite}
.chk{position:absolute;right:12px;top:12px;z-index:2;width:24px;height:24px;display:flex;align-items:center;justify-content:center;border-radius:50%;background:var(--hi);color:var(--on-hi);font-size:13px;font-weight:900}
.nm{font-size:17px;font-weight:900;text-align:center}
.bn{display:flex;align-items:center;justify-content:center;gap:6px;width:100%;height:44px;border:0;border-radius:99px;cursor:pointer;font:900 15px Nunito,sans-serif}
.bn:active{transform:translateY(2px)}.bn:disabled{cursor:default}
.bn.buy{background:var(--hi);color:var(--on-hi)}.bn.no{background:var(--chip);color:var(--mu)}
.bn.use{background:transparent;color:var(--ink);border:2px solid var(--hi)}.bn.on{background:var(--chip);color:var(--ink)}
.bn.wh{background:var(--hi);color:var(--on-hi)}.bn.buy .fl,.bn.wh .fl{color:var(--on-hi)}.old{text-decoration:line-through;opacity:.6;font-weight:700}
.it.sac{animation:shake .4s ease}
.foot{margin-top:6px;text-align:center}
.foot p{margin:8px 0 0;font-size:12px;color:var(--mu)}

/* ---------- ventanas ---------- */
.mo{position:fixed;inset:0;z-index:80;display:flex;align-items:center;justify-content:center;padding:20px;background:rgba(0,0,0,.72);animation:fade .2s ease}
.mb{width:100%;max-width:380px;padding:20px;text-align:center;border-radius:32px;border:2px solid var(--hi);background:var(--card);box-shadow:0 0 40px color-mix(in srgb,var(--hi) 14%,transparent)}
.mb h3{margin:12px 0 4px;font-size:26px;font-weight:900}.mb p{margin:0;font-size:15px;line-height:1.5;color:var(--mu)}
.mb .pv{height:136px;margin-top:4px}.mb .rar{display:inline-block;margin-top:10px}
.mb .bn{margin-top:12px;height:52px}.mb .bn.ghost{background:transparent;color:var(--ink);border:2px solid var(--bd)}.mb .bn.ghost:hover{border-color:var(--hi)}
.cofreg{display:flex;justify-content:center;padding:14px 0}.cofreg.tiembla{animation:tiembla .25s linear infinite}
.toast{position:fixed;left:50%;bottom:calc(96px + env(safe-area-inset-bottom));transform:translateX(-50%);z-index:90;max-width:90%;padding:10px 18px;border-radius:99px;background:var(--hi);color:var(--on-hi);font-size:14px;font-weight:800;text-align:center}
.conf{position:fixed;inset:0;z-index:95;pointer-events:none;overflow:hidden}.conf i{position:absolute;width:9px;height:9px;border-radius:2px}
@keyframes flota{0%,100%{transform:translateY(0)}50%{transform:translateY(-6px)}}
.lc{animation-name:flotaC}@keyframes flotaC{0%,100%{transform:translate(-50%,0)}50%{transform:translate(-50%,-6px)}}
@keyframes pop{0%{transform:scale(1)}40%{transform:scale(1.18)}100%{transform:scale(1)}}
@keyframes shake{0%,100%{transform:translateX(0)}20%,60%{transform:translateX(-6px)}40%,80%{transform:translateX(6px)}}
@keyframes entra{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:none}}
@keyframes fade{from{opacity:0}to{opacity:1}}
@keyframes tiembla{0%,100%{transform:rotate(-6deg)}50%{transform:rotate(6deg)}}

nav{position:fixed;bottom:0;left:0;right:0;z-index:10;background:var(--nav);border-radius:28px 28px 0 0;border-top:1px solid var(--bd)}
nav .inner{max-width:520px;margin:0 auto;display:flex;padding:8px 6px max(12px,env(safe-area-inset-bottom))}
nav a{flex:1;min-width:0;min-height:56px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;color:var(--mu);font-size:11px;font-weight:700;white-space:nowrap}
nav a:hover{color:var(--ink)}nav a.on,nav a.on:hover{color:var(--hi)}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

/* ===== NUEVOS FONDOS ===== */
.f-mp6::before{top:auto;bottom:20px;height:62%;background:linear-gradient(#141C40,#141C40) 4% 100%/16% 70% no-repeat,linear-gradient(#18214A,#18214A) 22% 100%/12% 100% no-repeat,linear-gradient(#141C40,#141C40) 38% 100%/18% 55% no-repeat,linear-gradient(#18214A,#18214A) 60% 100%/14% 85% no-repeat,linear-gradient(#141C40,#141C40) 78% 100%/12% 62% no-repeat,linear-gradient(#18214A,#18214A) 96% 100%/14% 92% no-repeat}
.f-mp6::after{top:auto;bottom:24px;height:50%;background:radial-gradient(circle,#FFD95A 0 1.4px,transparent 2px) 6px 4px/13px 12px;-webkit-mask:linear-gradient(90deg,#000 0 20%,transparent 20% 22%,#000 22% 34%,transparent 34% 38%,#000 38% 56%,transparent 56% 60%,#000 60% 74%,transparent 74% 78%,#000 78% 90%,transparent 90% 96%,#000 96%);animation:parp2 1.6s ease-in-out infinite alternate}
.f-mp7::before{top:auto;bottom:20px;height:58%;background:linear-gradient(#7A3A20,#4A2414);clip-path:polygon(4% 100%,26% 22%,32% 30%,38% 20%,62% 100%)}
.f-mp7::after{background:radial-gradient(circle,#FFB347 0 1.8px,transparent 2.6px) 0 0/34px 40px,radial-gradient(circle,#FF6A2B 0 1.4px,transparent 2.2px) 16px 20px/46px 52px;animation:humo 2.6s linear infinite}
@keyframes humo{from{background-position:0 0,16px 20px}to{background-position:10px -40px,4px -32px}}
.f-mp8::before{background:radial-gradient(circle,#fff 0 1.2px,transparent 1.8px) 8px 6px/36px 30px;animation:parp2 1.2s ease-in-out infinite alternate}
.f-mp8::after{left:-60px;top:14%;right:auto;bottom:auto;width:54px;height:60px;background:radial-gradient(ellipse 50% 22% at 50% 22%,#A8FFE0 0 60%,transparent 62%),radial-gradient(ellipse 50% 16% at 50% 36%,#A0AAB8 0 96%,transparent 100%);filter:drop-shadow(0 6px 8px rgba(168,255,224,.6));animation:ovni 6s linear infinite}
@keyframes ovni{from{transform:translateX(0)}to{transform:translateX(480px)}}
.f-mp9::before{background:radial-gradient(circle,transparent 0 2.4px,rgba(200,240,255,.7) 2.6px 3.6px,transparent 4px) 0 0/40px 46px,radial-gradient(circle,transparent 0 1.5px,rgba(200,240,255,.6) 1.7px 2.6px,transparent 3px) 18px 12px/30px 34px;animation:burbu 3s linear infinite}
@keyframes burbu{from{background-position:0 0,18px 12px}to{background-position:4px -46px,14px -56px}}
.f-mp9::after{background:repeating-linear-gradient(105deg,rgba(255,255,255,.08) 0 18px,transparent 18px 46px);animation:respira 4s ease-in-out infinite alternate}

let tT = null;

function ventana(html) {
  const o = document.createElement("div"); o.className = "mo"; o.setAttribute("role", "dialog"); o.setAttribute("aria-modal", "true");

  if (RM) return;

/* ---------- comprar y equipar ---------- */
function equipar(id) {
  const it = get(id); ST.eq[it.cat] = id;
  if (it.cat === "av") { const p = lee(K_PERFIL, {}) || {}; p.a = Number(id.slice(2)); guarda(K_PERFIL, p); }
  guardar(); sonido("ok"); todo(); aviso("Equipado: " + it.n);

function falta(id) {
  const it = get(id), card = $("c_" + id);
  sonido("mal"); aviso("Te faltan " + (precio(it) - saldo()) + " de Aura");
  if (card) { card.classList.remove("sac"); void card.offsetWidth; card.classList.add("sac"); }
}
function comprar(id) {
  const it = get(id), pr = precio(it), r = rareza(it.base);
  if (id === EXCLUSIVO) return;
  if (owns(id)) return;
  if (it.tmp) { sonido("mal"); aviso("Se consigue con el Pase Jurásico"); return; }
  if (saldo() < pr) return falta(id);
  const v = ventana('<div class="pv">' + prev(it, true) + '</div><h3>' + nombre(it) + '</h3><p>Cuesta ' + pr + ' de Aura. Te quedarían ' + (saldo() - pr) + '.</p>' +
    '<button class="bn buy" id="vOk" type="button">Comprar por ' + pr + ' Aura</button><button class="bn ghost" id="vNo" type="button">Ahora no</button>');
  v.q("#vNo").onclick = v.cerrar; v.q("#vOk").focus();
  v.q("#vOk").onclick = () => {
    if (owns(id)) { v.cerrar(); return; }
    if (saldo() < pr) { v.cerrar(); return falta(id); }
    moverAura(-pr, "Tienda: " + it.n);
    ST.own.push(id); guardar(); sonido(it.base >= 600 ? "raro" : "compra"); confeti(r[3]); todo(); pintarSaldo();
    v.set('<div class="pv">' + prev(it, true) + '</div><h3>¡Es tuyo!</h3><p>' + nombre(it) + '</p>' + etiqueta(it.base) +
      '<button class="bn use" id="vEq" type="button">Equipar ahora</button><button class="bn ghost" id="vSeg" type="button">Seguir comprando</button>');
    v.q("#vEq").onclick = () => { v.cerrar(); equipar(id); };
    v.q("#vSeg").onclick = v.cerrar;
  };
}
function nivel(it) { return it.base >= 600 ? "legendario" : it.base >= 300 ? "epico" : it.base >= 100 ? "raro" : "comun"; }
function elegirCofre(pool) {
  const g = {}; pool.forEach(x => { (g[nivel(x)] = g[nivel(x)] || []).push(x); });
  const ks = Object.keys(g), tot = ks.reduce((a, k) => a + (PROB_COFRE[k] || 0), 0);
  let r = Math.random() * tot;
  for (const k of ks) { r -= (PROB_COFRE[k] || 0); if (r < 0) return g[k][Math.floor(Math.random() * g[k].length)]; }
  return pool[Math.floor(Math.random() * pool.length)];
}
function cofre() {
  if (saldo() < PRECIO_COFRE) { sonido("mal"); aviso("Te faltan " + (PRECIO_COFRE - saldo()) + " de Aura para el cofre"); return; }
  const pool = ALL.filter(x => x.p > 0 && !esUnico(x) && !x.tmp && !owns(x.id));
  if (!pool.length) { aviso("¡Ya tienes todo! Eres leyenda."); return; }
  const it = elegirCofre(pool), r = rareza(it.base);
  moverAura(-PRECIO_COFRE, "Tienda: Cofre sorpresa (" + it.n + ")");
  ST.own.push(it.id); guardar(); pintarSaldo();
  const v = ventana('<div class="cofreg tiembla">' + sprite("cofre", 110) + '</div><h3>Abriendo...</h3><p>¿Qué habrá dentro?</p>');
  sonido("cofre");
  setTimeout(() => {
    sonido(it.base >= 300 ? "raro" : "compra"); confeti(r[3]); todo();
    v.set('<div class="pv">' + prev(it, true) + '</div><h3>' + it.n + '</h3>' + etiqueta(it.base) +
      '<p style="margin-top:8px">' + CATS.find(c => c.k === it.cat).t.slice(0, -1) + ' nuevo en tu colección</p>' +
      '<button class="bn use" id="vEq" type="button">Equipar ahora</button><button class="bn ghost" id="vSeg" type="button">Genial</button>');
    v.q("#vEq").onclick = () => { v.cerrar(); equipar(it.id); };
    v.q("#vSeg").onclick = v.cerrar;
  }, RM ? 300 : 1400);
}

/* personaje exclusivo: se le da a la cuenta del creador y se le quita a cualquier otra */
function sesionCreador(uid) {
  ES_CREADOR = uid === CREADOR;
  let cambio = false;
  if (ES_CREADOR) { if (ST.own.indexOf(EXCLUSIVO) < 0) { ST.own.push(EXCLUSIVO); cambio = true; } }
  else if (uid) {
