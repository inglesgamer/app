<script>
/* ===== WEB (GitHub Pages): convierte los enlaces go:seccion en seccion.html. En App Creator no hace nada. ===== */
(function(){
  var web = /github\.io$/.test(location.hostname);
  window.igURL = function(u){
    u = String(u);
    if (!web || u.indexOf("go:") !== 0) return u;
    var s = u.slice(3);
    return (s === "inicio" ? "index" : s) + ".html";
  };
  if (!web) return;
  document.addEventListener("click", function(e){
    var a = e.target.closest && e.target.closest('a[href^="go:"]');
    if (a){ e.preventDefault(); location.href = igURL(a.getAttribute("href")); }
  }, true);
})();
</script>

<script>
/* ===== PALETAS: una sola fuente de colores. La elección se guarda en "ingles_gamer_tema". ===== */
var TEMA_KEY = "ingles_gamer_tema";
var PALETAS = {
  noche: { n:"Noche", meta:"#000000", cs:"dark", v:{ "--bg":"#000000","--card":"#141416","--bd":"#2A2A2E","--ink":"#F4F4F5","--mu":"#B8B8C0","--chip":"#222226","--gold":"#FFD166","--hi":"#FFFFFF","--on-hi":"#000000","--track":"#2A2A2E","--toff":"#3A3A40","--nav":"#0E0E10","--av1":"#3A3A40","--av2":"#101012","--ok":"#7BE3A8" } },
  dia:   { n:"Día",   meta:"#F4F4F5", cs:"light", v:{ "--bg":"#F4F4F5","--card":"#FFFFFF","--bd":"#E4E4E7","--ink":"#0B0B0D","--mu":"#5C666B","--chip":"#EFEFF1","--gold":"#9A6000","--hi":"#0B0B0D","--on-hi":"#FFFFFF","--track":"#E4E4E7","--toff":"#D4D4D8","--nav":"#FFFFFF","--av1":"#FFFFFF","--av2":"#E4E4E7","--ok":"#0F7A44" } },
  rosa:  { n:"Rosa",  meta:"#FFF1F6", cs:"light", v:{ "--bg":"#FFF1F6","--card":"#FFFFFF","--bd":"#F8D9E5","--ink":"#2B1420","--mu":"#7A5568","--chip":"#FFE3ED","--gold":"#B3245A","--hi":"#D63B7A","--on-hi":"#FFFFFF","--track":"#F8D9E5","--toff":"#EEBFD1","--nav":"#FFFFFF","--av1":"#FFFFFF","--av2":"#F8D9E5","--ok":"#0F7A44" } },
  azul:  { n:"Azul",  meta:"#EFF6FF", cs:"light", v:{ "--bg":"#EFF6FF","--card":"#FFFFFF","--bd":"#D6E6F8","--ink":"#0E1B2B","--mu":"#4F647B","--chip":"#E0EFFD","--gold":"#0B5FB0","--hi":"#1C6FD6","--on-hi":"#FFFFFF","--track":"#D6E6F8","--toff":"#BDD6F0","--nav":"#FFFFFF","--av1":"#FFFFFF","--av2":"#D6E6F8","--ok":"#0F7A44" } }
};
function aplicarTema(id) {
  var p = PALETAS[id] || PALETAS.noche, r = document.documentElement;
  for (var k in p.v) r.style.setProperty(k, p.v[k]);
  r.style.colorScheme = p.cs; r.setAttribute("data-tema", PALETAS[id] ? id : "noche");
  var m = document.querySelector('meta[name="theme-color"]'); if (m) m.setAttribute("content", p.meta);
}
function temaActual() { try { var t = localStorage.getItem(TEMA_KEY); return PALETAS[t] ? t : "noche"; } catch (e) { return "noche"; } }
aplicarTema(temaActual());
window.addEventListener("storage", function (e) { if (e.key === TEMA_KEY) aplicarTema(temaActual()); });
</script>
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@600;700;800;900&display=swap" rel="stylesheet">
<style>
:root{--bg:#000;--card:#141416;--bd:#2A2A2E;--ink:#F4F4F5;--mu:#B8B8C0;--chip:#222226;--gold:#FFD166;--hi:#FFFFFF;--on-hi:#000000;--track:#2A2A2E;--toff:#3A3A40;--nav:#0E0E10;--av1:#3A3A40;--av2:#101012;--ok:#7BE3A8}
*{box-sizing:border-box}
html{height:100%}
body{margin:0;height:100vh;height:100dvh;display:flex;flex-direction:column;overflow:hidden;overscroll-behavior:none;background:var(--bg);color:var(--ink);font-family:Nunito,system-ui,sans-serif}
a{color:inherit;text-decoration:none}
button{font-family:inherit;color:inherit}
a:focus-visible,button:focus-visible{outline:3px solid var(--hi);outline-offset:2px}
.app{width:100%;max-width:520px;margin:0 auto;flex:1;min-height:0;display:flex;flex-direction:column;position:relative}
header{flex-shrink:0;display:flex;align-items:center;gap:8px;padding:calc(14px + env(safe-area-inset-top)) 16px 10px;z-index:10}
.logo{flex:1;min-width:0;margin:0;font-size:clamp(20px,6.2vw,26px);font-weight:900;letter-spacing:-.01em;white-space:nowrap;overflow:hidden}.logo span{opacity:.55}
.chip{display:flex;align-items:center;gap:6px;height:44px;padding:0 16px;border-radius:99px;border:1px solid var(--bd);background:var(--card);color:var(--gold);font-size:17px;font-weight:900}
.menu-btn{display:flex;align-items:center;justify-content:center;width:44px;height:44px;padding:0;cursor:pointer;border-radius:50%;border:1px solid var(--bd);background:var(--card)}
header .chip{padding:0 14px;gap:5px}
@media (max-width:400px){header{gap:6px}.logo{font-size:5.4vw}header .chip{height:40px;padding:0 10px;gap:4px;font-size:15px}header .menu-btn{width:40px;height:40px}.punto{top:5px;right:7px}}
.bell{position:relative;flex:none}
.punto{position:absolute;top:7px;right:9px;width:13px;height:13px;border-radius:50%;background:#FF4D4D;border:2px solid var(--card)}
.punto[hidden]{display:none}
.menu{display:none;position:absolute;top:70px;left:16px;right:16px;z-index:20;padding:8px;border-radius:24px;border:1px solid var(--bd);background:var(--card);box-shadow:0 16px 40px rgba(0,0,0,.7)}
.menu.open{display:block}
.menu a{display:flex;align-items:center;min-height:48px;padding:0 16px;border-radius:16px;font-size:16px;font-weight:800}.menu a:hover{background:var(--chip)}
main{flex:1;min-height:0;overflow-y:auto;overscroll-behavior:none;padding:6px 16px 14px;display:flex;flex-direction:column;gap:14px}
main>*{flex-shrink:0}
.card{background:var(--card);border:1px solid var(--bd);border-radius:28px}
.fl{display:inline-flex}
.sr{display:inline-flex;gap:3px}.sr svg{display:block}.sr .f{fill:var(--hi)}.sr .e{fill:var(--toff)}
#player{order:1}#racha{order:2}#secVocab{order:3}#seguir{order:4}#secRetos{order:5}#secRef{order:6}#ayuda{order:7}

/* jugador */
.player{display:flex;align-items:center;gap:14px;padding:14px}
.avatar{flex:none;width:100px;height:100px;display:flex;align-items:flex-end;justify-content:center;overflow:hidden;border-radius:50%;border:3px solid var(--hi);background:radial-gradient(circle at 50% 30%,var(--av1),var(--av2))}
.p-info{flex:1;min-width:0}
.p-row{display:flex;justify-content:space-between;align-items:baseline;gap:8px}
.p-nm{min-width:0;font-size:25px;font-weight:900;line-height:1.15;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.p-st{flex:none;display:inline-flex;align-items:center;gap:4px;font-size:13px;font-weight:900;color:var(--gold)}
.rk{display:inline-flex;align-items:center;gap:6px;margin-top:4px;padding:4px 12px 4px 8px;border-radius:99px;background:var(--hi);color:var(--on-hi);font-size:12px;font-weight:900;letter-spacing:.06em}
.rk svg{display:block}
.bar{height:12px;margin-top:10px;border-radius:99px;background:var(--track);overflow:hidden}.bar i{display:block;height:100%;border-radius:99px;background:var(--hi)}
.p-nx{margin-top:6px;font-size:13px;font-weight:700;color:var(--mu)}.p-nx b{color:var(--ink)}
.dor{background:linear-gradient(90deg,#B8860B,#FFE27A,#FFC83D,#FFF6C0,#B8860B);background-size:200% auto;-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent;color:transparent;animation:oro 2.4s linear infinite}
@keyframes oro{to{background-position:200% center}}

/* títulos */
.t{display:flex;justify-content:space-between;align-items:baseline;margin:4px 4px 10px;font-size:20px;font-weight:900}
.t small{font-size:13px;font-weight:700;color:var(--mu)}

/* seguir jugando */
.seguir{display:flex;align-items:center;gap:12px;padding:12px 12px 12px 14px;border-radius:28px;border:1px solid var(--bd);background:var(--card)}
.seguir:hover{border-color:var(--hi)}
.sg-ic{flex:none;width:62px;height:62px;display:flex;align-items:center;justify-content:center;border-radius:50%;background:var(--hi);color:var(--on-hi)}
.sg-tx{flex:1;min-width:0}
.sg-tag{display:block;font-size:11px;font-weight:900;letter-spacing:.12em;color:var(--mu)}
.sg-tx b{display:block;margin-top:1px;font-size:19px;line-height:1.2;overflow-wrap:anywhere}
.sg-es{margin-top:5px}
.sg-bar{height:8px;margin-top:8px;border-radius:99px;background:var(--track);overflow:hidden}.sg-bar i{display:block;height:100%;border-radius:99px;background:var(--hi);transition:width .6s}
.sg-meta{display:flex;justify-content:space-between;margin-top:4px;font-size:12px;font-weight:700;color:var(--mu)}
.go{flex:none;width:56px;height:56px;display:flex;align-items:center;justify-content:center;border-radius:50%;background:var(--hi);color:var(--on-hi);box-shadow:0 4px 0 rgba(128,128,128,.35)}
.seguir:active .go{transform:translateY(2px)}

/* racha */
.racha{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:12px 14px}
.rc-l{display:flex;align-items:center;gap:10px;min-width:0;flex:1}.rc-l>div{min-width:0}
.rc-ic{flex:none;width:44px;height:44px;display:flex;align-items:center;justify-content:center;border-radius:50%;background:var(--chip);color:var(--gold)}
.rc-n{font-size:25px;font-weight:900;line-height:1}.rc-n small{font-size:13px;font-weight:700;color:var(--mu)}
.rc-msg{margin-top:3px;font-size:12px;font-weight:700;line-height:1.25;color:var(--mu)}
.rc-days{flex:none;display:grid;grid-template-columns:repeat(7,20px);gap:4px}
.rc-d{display:flex;flex-direction:column;align-items:center;gap:4px;font-size:10px;font-weight:800;color:var(--mu)}
.rc-d i{display:block;width:20px;height:28px;border-radius:99px;background:var(--track)}
.rc-d.on i{background:var(--hi)}.rc-d.hoy span{color:var(--ink)}.rc-d.hoy i{outline:2px solid var(--hi);outline-offset:2px}

/* vocabulario del día: una sola palabra, con su ejemplo */
.vdia{display:block;width:100%;text-align:left;cursor:pointer;-webkit-tap-highlight-color:transparent;padding:16px 18px 16px;border-radius:28px;border:1px solid color-mix(in srgb,var(--lc) 45%,var(--bd));background:linear-gradient(155deg,color-mix(in srgb,var(--lc) 16%,var(--bg)),var(--card) 70%)}
.vdia:active{transform:translateY(2px)}
.v-top{display:flex;align-items:center;gap:8px}
.tag{display:block;font-size:11px;font-weight:900;letter-spacing:.12em;color:var(--mu)}
.v-tx{flex:1;min-width:0}
.v-en{display:block;font-size:34px;font-weight:900;line-height:1.1;overflow-wrap:anywhere}.v-es{display:block;margin-top:2px;font-size:17px;font-weight:700;color:var(--mu)}
.listen{display:inline-flex;align-items:center;gap:8px;height:42px;margin-top:10px;padding:0 18px;border:0;border-radius:99px;cursor:pointer;background:var(--hi);color:var(--on-hi);font:900 14px Nunito,sans-serif;box-shadow:0 4px 0 rgba(128,128,128,.35)}
.listen:active{transform:translateY(2px)}
.vdia.suena .listen svg{animation:onda .5s ease-in-out infinite alternate}
@keyframes onda{from{transform:scale(1)}to{transform:scale(1.25)}}
.pj{flex:0 0 92px}.pj svg{display:block;width:100%;height:auto;overflow:visible}
.v-ejb{margin-top:14px;padding-top:12px;border-top:1px dashed var(--bd)}
.ej{margin-top:6px;font-size:20px;font-weight:900;line-height:1.3}.ej b{background:var(--track);padding:0 6px;border-radius:8px}
.ej-es{margin-top:4px;font-size:14px;font-weight:600;color:var(--mu)}

/* retos */
.rt-list{display:flex;flex-direction:column;gap:8px}
.rt{display:flex;align-items:center;gap:12px;min-height:64px;padding:8px 14px 8px 10px;border-radius:24px}
.rt:hover{border-color:var(--hi)}.rt:active{transform:translateY(2px)}
.rt-ic{flex:none;width:44px;height:44px;display:flex;align-items:center;justify-content:center;border-radius:50%;background:var(--chip)}
.rt-tx{flex:1;min-width:0}.rt-tx b{display:block;font-size:17px}
.rt-au{display:inline-flex;align-items:center;gap:4px;margin-top:2px;font-size:13px;font-weight:900;color:var(--gold)}
.rt-go{flex:none;color:var(--mu)}

/* refuerza (tarjeta blanca) */
.refuerza{position:relative;overflow:hidden;display:block;min-height:96px;padding:16px 100px 24px 18px;border-radius:28px;background:var(--hi);color:var(--on-hi)}
.refuerza::after{content:"";position:absolute;left:0;right:0;bottom:0;height:8px;background:repeating-linear-gradient(90deg,var(--on-hi) 0 12px,transparent 12px 24px) 0 3px/100% 2px no-repeat,rgba(128,128,128,.35)}
.rf-tx small{display:block;font-size:11px;font-weight:900;letter-spacing:.12em;color:var(--on-hi);opacity:.7}
.rf-tx b{display:block;margin-top:2px;font-size:22px;font-weight:900;line-height:1.15}
.rf-tx em{display:block;margin-top:2px;font-size:14px;font-weight:700;font-style:normal;color:var(--on-hi);opacity:.7}
.rf-pj{position:absolute;right:16px;bottom:12px;width:60px}.rf-pj svg{display:block;width:100%;height:auto;overflow:visible}

/* ayuda */
.ay-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.ay{display:flex;align-items:center;gap:10px;min-height:64px;padding:8px 14px;text-align:left;cursor:pointer;border-radius:24px}
.ay:hover{border-color:var(--hi)}.ay:active{transform:translateY(2px)}
.ay-ic{flex:none;width:40px;height:40px;display:flex;align-items:center;justify-content:center;border-radius:50%;background:var(--chip)}
.ay-tx b{display:block;font-size:15px}.ay-tx small{display:block;margin-top:1px;font-size:11px;font-weight:700;line-height:1.3;color:var(--mu)}

/* ventana de sugerencias */
.fb{position:fixed;inset:0;z-index:70;display:flex;align-items:flex-end;justify-content:center;background:rgba(0,0,0,.78)}
.fb[hidden]{display:none}
.fb-box{width:100%;max-width:520px;max-height:92dvh;overflow-y:auto;padding:18px 16px calc(18px + env(safe-area-inset-bottom));border-radius:32px 32px 0 0;border:1px solid var(--bd);border-bottom:0;background:var(--card)}
.fb-top{display:flex;align-items:center;justify-content:space-between;gap:10px}.fb-top h2{margin:0;font-size:24px;font-weight:900}
.fb-x{display:flex;align-items:center;justify-content:center;width:44px;height:44px;padding:0;cursor:pointer;border-radius:50%;border:1px solid var(--bd);background:var(--chip)}
.fb-tabs{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:12px}
.fb-tabs button{height:46px;cursor:pointer;border-radius:99px;border:1px solid var(--bd);background:var(--chip);color:var(--mu);font:800 14px Nunito,sans-serif}
.fb-tabs button.on{background:var(--hi);border-color:var(--hi);color:var(--on-hi)}
.fb-p{margin:12px 0 0;font-size:14px;font-weight:600;line-height:1.4;color:var(--mu)}
.fb-txt{display:block;width:100%;min-height:120px;margin-top:8px;padding:14px;resize:vertical;border-radius:22px;border:1px solid var(--bd);background:var(--bg);color:var(--ink);font:600 16px/1.4 Nunito,sans-serif}
.fb-txt:focus{outline:none;border-color:var(--hi)}
.fb-info{display:flex;justify-content:space-between;gap:10px;margin-top:6px;font-size:12px;font-weight:600;color:var(--mu)}
.fb-msg{min-height:20px;margin-top:6px;font-size:14px;font-weight:800;color:var(--gold)}.fb-msg.ok{color:var(--ok)}
.fb-send{display:flex;align-items:center;justify-content:center;width:100%;height:54px;margin-top:8px;border:0;border-radius:99px;cursor:pointer;background:var(--hi);color:var(--on-hi);font:900 16px Nunito,sans-serif}
.fb-send:disabled{opacity:.5;cursor:default}

/* animación de "enviado" y estado de envío */
.fb-box{position:relative}
.fb-box.ok>*:not(.fb-done){display:none}
.fb-done{display:flex;flex-direction:column;align-items:center;text-align:center;padding:22px 6px 6px}
.fb-done[hidden]{display:none}
.ok-ic{position:relative;width:104px;height:104px;animation:okpop .5s cubic-bezier(.2,1.4,.4,1) both}
.ok-ic svg{display:block;overflow:visible}
.ok-c{fill:color-mix(in srgb,var(--ok) 16%,transparent);stroke:var(--ok);stroke-width:3;stroke-dasharray:145;stroke-dashoffset:145;animation:okdraw .6s .1s ease forwards}
.ok-t{fill:none;stroke:var(--ok);stroke-width:4;stroke-linecap:round;stroke-linejoin:round;stroke-dasharray:40;stroke-dashoffset:40;animation:okdraw .4s .55s ease forwards}
.ok-d{position:absolute;left:50%;top:50%;width:8px;height:8px;margin:-4px;border-radius:50%;background:var(--c);opacity:0;animation:okchispa .9s .6s ease-out forwards}
.fb-done h3{margin:16px 0 4px;font-size:28px;font-weight:900}
.fb-done p{margin:0;max-width:300px;font-size:15px;font-weight:600;line-height:1.45;color:var(--mu)}
.fb-done .fb-send{margin-top:18px}
.spn{width:18px;height:18px;margin-right:8px;border-radius:50%;border:3px solid color-mix(in srgb,var(--on-hi) 30%,transparent);border-top-color:var(--on-hi);animation:giro .7s linear infinite}
@keyframes okpop{from{transform:scale(.4);opacity:0}to{transform:scale(1);opacity:1}}
@keyframes okdraw{to{stroke-dashoffset:0}}
@keyframes okchispa{0%{opacity:1;transform:rotate(var(--a)) translateY(-52px) scale(1)}100%{opacity:0;transform:rotate(var(--a)) translateY(-92px) scale(.4)}}
@keyframes giro{to{transform:rotate(360deg)}}
@media (prefers-reduced-motion:reduce){.ok-c,.ok-t{stroke-dashoffset:0}.ok-d{display:none}}

/* nav */
nav{flex-shrink:0;background:var(--nav);border-radius:28px 28px 0 0;border-top:1px solid var(--bd)}
nav .inner{max-width:520px;margin:0 auto;display:flex;padding:8px 6px max(12px,env(safe-area-inset-bottom))}
nav a{flex:1;min-width:0;min-height:56px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;color:var(--mu);font-size:11px;font-weight:700}
nav a.on{color:var(--hi)}

/* personajes animados */
.oc,.bo,.r1,.r2,.l1,.l2,.rb{opacity:0}
.oc{animation:parp 4s infinite}@keyframes parp{0%,92%,100%{opacity:0}94%,97%{opacity:1}}
.chs{transform-box:fill-box;transform-origin:center;animation:chisp 1s ease-in-out infinite}
@keyframes chisp{0%,100%{transform:scale(.3);opacity:.2}50%{transform:scale(1);opacity:1}}
@keyframes ua{0%{opacity:1}50%{opacity:0}}@keyframes ub{0%{opacity:0}50%{opacity:1}}
.alegre .mov{animation:salta .6s ease-in-out infinite alternate}@keyframes salta{from{transform:translateY(0)}to{transform:translateY(-1px)}}
.alegre .r1,.alegre .l1{animation:ua .6s step-end infinite}.alegre .r2,.alegre .l2{animation:ub .6s step-end infinite}.alegre .bo{animation:ua .3s step-end infinite}
.pienso .cab{animation:ladea 2s ease-in-out infinite alternate}@keyframes ladea{from{transform:translateX(-.15px)}to{transform:translateX(.25px)}}
.pienso .rd{opacity:0}.pienso .r1{animation:ua 1.2s step-end infinite}.pienso .r2{animation:ub 1.2s step-end infinite}
.pienso .q{animation:flota 1.6s ease-in-out infinite alternate}@keyframes flota{from{transform:translateY(0)}to{transform:translateY(-.6px)}}
.carro .mov,.carro .fuera{animation:vibra .12s linear infinite alternate}@keyframes vibra{from{transform:translateY(0)}to{transform:translateY(.15px)}}
.carro .ra{animation:ua .08s step-end infinite}.carro .rb{animation:ub .08s step-end infinite}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}.alegre .r1,.alegre .l1,.pienso .r1{opacity:1}}

/* guardia de internet */
#sinNet{position:fixed;inset:0;z-index:9999;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;padding:24px;text-align:center;background:radial-gradient(circle at 50% 35%,#1E1E22,#000)}
#sinNet[hidden]{display:none}
.sn-pj{width:110px}.sn-pj svg{display:block;width:100%;height:auto;overflow:visible;filter:grayscale(.6);animation:snNod 2.4s ease-in-out infinite alternate}
@keyframes snNod{from{transform:translateY(0)}to{transform:translateY(4px)}}
.sn-t{margin:0;font-size:26px;font-weight:900}
.sn-p{margin:0;max-width:280px;font-size:16px;font-weight:600;line-height:1.45;color:var(--mu)}
.sn-btn{height:50px;padding:0 26px;cursor:pointer;border:0;border-radius:99px;background:#fff;color:#000;font:900 15px Nunito,sans-serif}
.sn-btn:active{transform:translateY(2px)}

/* jugador: se lee del Perfil y de la Tienda, y se actualiza solo al volver a esta pantalla */
function pintarJugador() {
  const perfil = leer("ingles_gamer_perfil"), auraG = leer("ingles_gamer_aura");
  const tienda = leer("ingles_gamer_tienda"), own = (tienda && Array.isArray(tienda.own)) ? tienda.own : [];
  let av = perfil && Number(perfil.a) >= 0 && Number(perfil.a) < AVATARES.length ? Number(perfil.a) : 0;
  if (av > 1 && own.indexOf("av" + av) < 0) av = 0;          // si no lo tiene comprado, vuelve al Constructor
  const nombre = (perfil && String(perfil.n || "").trim().slice(0, 14)) || "Gamer";
  const aura = Math.max(0, +(auraG && auraG.t) || 0);

  /* rango por estrellas (igual que el Perfil) */
  const rep0 = leer("ingles_gamer_a1_repaso"), est = (rep0 && rep0.est) || {};
  const maxE = TEMAS_IDS.length * 3;
  const totE = TEMAS_IDS.reduce((a, id) => a + Math.min(3, +est[id] || 0), 0);
  const minR = i => RANGOS[i].m;
  let ri = 0; RANGOS.forEach((r, i) => { if (totE >= minR(i)) ri = i; });
  const rk = RANGOS[ri], sigR = RANGOS[ri + 1];
  const pct = sigR ? Math.round((totE - minR(ri)) / Math.max(1, minR(ri + 1) - minR(ri)) * 100) : 100;

  $("chip").innerHTML = '<span class="fl">' + sprite("llama", 20) + '</span>' + aura;
  const nm = AVATARES[av].oro ? '<span class="dor">' + esc(nombre) + '</span>' : esc(nombre);
  const nx = sigR ? 'Faltan <b>' + (minR(ri + 1) - totE) + ' ★</b> para ser <b>' + sigR.n + '</b>' : '¡Rango máximo alcanzado!';
  $("player").innerHTML = lookHTML(sprite("av" + av, 64), 100, 14, 14) + '<div class="p-info">' +
    '<div class="p-row"><span class="p-nm">' + nm + '</span><span class="p-st">' + estrella("f", 14).replace('class="f"', 'style="fill:currentColor"') + totE + '/' + maxE + '</span></div>' +

}

/* ---------- SEGUIR JUGANDO ---------- */
const clave = d => d.getFullYear() + "-" + (d.getMonth() + 1) + "-" + d.getDate();
function datosSeguir() {
  const rep = leer("ingles_gamer_a1_repaso"), est = (rep && rep.est) || {};
  const e = id => Math.min(3, Math.max(0, +est[id] || 0));
  const total = NIVELES.length, pasados = NIVELES.filter(n => e(n[0]) >= 1).length, pct = Math.round(pasados / total * 100);
  let sig = NIVELES.find(n => e(n[0]) < 1), modo = "nuevo";
  if (!sig) { sig = NIVELES.find(n => e(n[0]) < 3); modo = "mejorar"; }
  const d = { e, total, pasados, pct, sig, modo };
  if (!sig) { Object.assign(d, { tag:"¡Mapa completo!", nombre:"Lo lograste todo", dib:"cup", st:3 }); }
  else {
    const idx = NIVELES.indexOf(sig) + 1;
    Object.assign(d, { dib:sig[2], nombre:sig[1], st:e(sig[0]),
      tag: pasados === 0 ? "Empieza aquí" : modo === "mejorar" ? "Mejora tus estrellas" : "Seguir jugando", idx });
  }
  return d;
}
function pintarSeguir() {
  const d = datosSeguir();
  /* entra directo al nivel que toca (1 toque); si no hay nivel pendiente, abre el mapa */
  $("seguir").href = (d.sig && NIVEL_URL[d.sig[0]]) || MAPA_URL;
  $("seguir").innerHTML = '<div class="sg-ic">' + ic(d.dib, 30) + '</div>' +
    '<div class="sg-tx"><small class="sg-tag">' + d.tag + '</small><b>' + esc(d.nombre) + '</b><div class="sg-es">' + estrellasHTML(d.st, 16) + '</div>' +
    '<div class="sg-bar" role="img" aria-label="' + d.pct + ' por ciento del mapa"><i style="width:' + d.pct + '%"></i></div>' +
    '<div class="sg-meta"><span>' + d.pasados + '/' + d.total + ' niveles</span><span>' + d.pct + '%</span></div></div>' +
    '<div class="go" aria-label="Continuar">' + ic("play", 26) + '</div>';
}

/* ---------- RACHA ---------- */
function pintarRacha() {
  const rep = leer("ingles_gamer_a1_repaso"), dia = (rep && rep.dia) || { u:"", r:0 };
  const kHoy = clave(new Date()), kAyer = clave(new Date(Date.now() - 864e5));
  const vivo = (dia.u === kHoy || dia.u === kAyer) && +dia.r > 0;
  const racha = vivo ? Math.min(+dia.r, 9999) : 0, jugoHoy = vivo && dia.u === kHoy;
  const marcados = {};
  if (vivo) {
    const p = String(dia.u).split("-").map(Number), d0 = new Date(p[0], p[1] - 1, p[2]);
    for (let i = 0; i < Math.min(racha, 400); i++) { const d = new Date(d0); d.setDate(d0.getDate() - i); marcados[clave(d)] = 1; }
  }
  const msg = racha === 0 ? "Juega hoy para empezar" : jugoHoy ? "¡Hoy ya sumaste!" : "¡Juega hoy!";
  const letras = ["D", "L", "M", "M", "J", "V", "S"];
  let semana = "";
  for (let i = 6; i >= 0; i--) {
    const d = new Date(); d.setDate(d.getDate() - i);
    semana += '<div class="rc-d' + (marcados[clave(d)] ? " on" : "") + (i === 0 ? " hoy" : "") + '"><i></i><span>' + letras[d.getDay()] + '</span></div>';
  }
  $("racha").innerHTML = '<div class="rc-l"><span class="rc-ic">' + ic("bolt", 24) + '</span><div><div class="rc-n">' + racha + ' <small>' + (racha === 1 ? "día" : "días") + '</small></div><div class="rc-msg">' + msg + '</div></div></div>' +

const PAUSA_K = "ingles_gamer_buzon_pausa";

async function postBuzon(x) {

async function enviarPendientes(idNuevo) {
  if (fbOcupado) return;
  if (!idNuevo) { let p = 0; try { p = +localStorage.getItem(PAUSA_K) || 0; } catch (e) {} if (Date.now() < p) return; }
  fbOcupado = true;

/* ===== AUDIO DE LA PALABRA DEL DÍA =====
   Los mp3 están en Netlify. El audio de HOY se descarga apenas abre la pantalla (se prueba la raíz del sitio y,
   si no está, la carpeta /audios/), así al tocar suena de una vez. Si por algo todavía no llegó, habla la voz del
   teléfono en ese instante (nunca se queda esperando). */
const AUDIO_URL = "https://deluxe-biscochitos-3cc3fb.netlify.app";
const AUDIO_RUTAS = ["/", "/audios/"];
let sonido = null, candidato = null, hoyIdx = -1, diaClave = "";

function parar() {
  [sonido, candidato].forEach(a => { if (a) { try { a.pause(); a.currentTime = 0; } catch (e) {} } });
  try { speechSynthesis.cancel(); } catch (e) {}
  $("vocab").classList.remove("suena");
}
function voz(texto) {
  try { speechSynthesis.cancel(); const u = new SpeechSynthesisUtterance(texto); u.lang = "en-US"; u.rate = .9; speechSynthesis.speak(u); } catch (e) {}
}
function prepararAudio(p) {
  sonido = null; candidato = null;
  const rutas = AUDIO_RUTAS.map(r => AUDIO_URL + r + p.audio + ".mp3");
  let i = 0;
  const probar = () => {
    if (i >= rutas.length) return;                       // ninguna sirve: se usará la voz
    const a = new Audio(); a.preload = "auto"; candidato = a;
    a.addEventListener("canplay", () => { if (!sonido && candidato === a) sonido = a; }, { once: true });
    a.addEventListener("ended", () => $("vocab").classList.remove("suena"));
    a.addEventListener("error", () => { if (candidato === a) { candidato = null; probar(); } }, { once: true });
    a.src = rutas[i++]; a.load();
  };
  probar();
}
function oir() {
  const p = PALABRAS[hoyIdx], caja = $("vocab");
  parar();
  const a = sonido || candidato;                          // listo → suena al instante; si aún carga, se pide play ya mismo
  if (a) {
    caja.classList.add("suena");
    try { a.currentTime = 0; } catch (e) {}
    const r = a.play();
    if (r && r.catch) r.catch(() => { caja.classList.remove("suena"); voz(p.en); });
    if (a !== sonido) a.addEventListener("error", () => { caja.classList.remove("suena"); voz(p.en); }, { once: true });
  } else voz(p.en);
}

<script>
(function () {
  var caja = document.getElementById("sinNet");
  if (!caja) return;

  /* personaje triste, llorando bajo una nube (si falla el dibujo, la guardia funciona igual) */
  try {
    PAL.t = "#6EC6FF"; PAL.q = "#A0A0A5";
    var g = BASE.map(function (f) { return f.split(""); });
    [[6,5,6,"s"],[5,5,6,"m"],[6,4,4,"m"],[6,7,7,"m"]].forEach(function (m) { for (var c = m[1]; c <= m[2]; c++) g[m[0]][c] = m[3]; });
    var l = []; g.forEach(function (f, r) { f.forEach(function (k, c) { if (k !== ".") l.push([r, c, k]); }); });
    document.getElementById("snPj").innerHTML = '<svg viewBox="-1 -3 14 19.8" shape-rendering="crispEdges" aria-hidden="true">' + rects(l) +
      '<g class="snA">' + rects([[5,3,"t"],[5,8,"t"],[7,3,"t"]]) + '</g>' +
      '<g class="snB">' + rects([[6,3,"t"],[6,8,"t"],[8,8,"t"]]) + '</g>' +
      rects(solo(-2,-2,3,8,"q").concat(solo(-1,-1,2,9,"q"))) + '</svg>';
  } catch (e) {}

  /* MODO PRUEBA: muestra una franja verde arriba con el estado de la conexión. Cuando termines de probar, déjalo en false. */
  var DEBUG = false;
  var panel = null;
  if (DEBUG) {
    panel = document.createElement("div");
    panel.style.cssText = "position:fixed;left:0;right:0;top:0;z-index:99999;background:#000;color:#0f0;font:11px monospace;padding:4px 6px;pointer-events:none";
    panel.textContent = "guardia v2 cargada...";
    document.body.appendChild(panel);
  }

  /* sondas de conexión: si una está bloqueada en la red del usuario, se prueba la otra.
     Solo cuenta como "hay internet" una respuesta de tipo opaque (la que da una petición real a otro sitio). */
  var SONDAS = ["https://clients3.google.com/generate_204", "https://www.gstatic.com/generate_204"];
  var fallos = 0, revisando = false, info = "";

  function probar(url) {
    return new Promise(function (res) {
      var c = new AbortController(), t = setTimeout(function () { c.abort(); }, 4000);
      fetch(url + "?t=" + Date.now(), { mode: "no-cors", cache: "no-store", signal: c.signal })
        .then(function (r) { clearTimeout(t); res(r.type); })
        .catch(function () { clearTimeout(t); res("falla"); });
    });
  }
  async function hayInternet() {
    var partes = ["onLine=" + navigator.onLine], ok = false;
    if (navigator.onLine) {
      for (var i = 0; i < SONDAS.length; i++) {
        var tipo = await probar(SONDAS[i]);
        partes.push("sonda" + (i + 1) + "=" + tipo);
        if (tipo === "opaque") { ok = true; break; }
      }
    }
    info = partes.join(" · ");
    return ok;
  }
  async function revisar() {
    if (revisando) return; revisando = true;
    var ok = await hayInternet();
    fallos = ok ? 0 : fallos + 1;
    /* sin conexión (modo avión) bloquea al instante; con wifi sin internet espera 2 fallos seguidos */
    caja.hidden = !(navigator.onLine === false || fallos >= 2);
    if (panel) panel.textContent = "guardia v2 · " + info + " · fallos=" + fallos + " · pantalla=" + (caja.hidden ? "oculta" : "VISIBLE");
    revisando = false;
    if (!ok && fallos < 2) setTimeout(revisar, 2000);
  }

  document.getElementById("snRe").addEventListener("click", revisar);
  addEventListener("online", revisar);
  addEventListener("offline", revisar);
  addEventListener("pageshow", revisar);
  document.addEventListener("visibilitychange", function () { if (!document.hidden) revisar(); });
  setInterval(revisar, 15000);
  revisar();
})();
</script>

  storageBucket: "inglesgamer-5a3a9.firebasestorage.app",
  messagingSenderId: "599532765222",
  appId: "1:599532765222:web:38fe3a7348b3c38e3426e7"
};

(function () {
  try {
    const PREF = "ingles_gamer_", META = "ig_nube_meta";
    const SKIP = /_(sesion|tema|sonido|buzon|buzon_pausa|acceso_modo)$/;
    const app = getApps().length ? getApp() : initializeApp(CONFIG);
    const auth = getAuth(app), db = getFirestore(app);
    let user = null, ocupado = false;

    const dormir = ms => new Promise(r => setTimeout(r, ms));
    const estado = (ok, e) => { try { localStorage.setItem("ig_nube_estado", JSON.stringify({ ok: !!ok, t: Date.now(), c: ok ? "" : String((e && (e.code || e.message)) || "error") })); } catch (x) {} };
    const ref = () => doc(db, "progreso", user.uid);
    const claves = () => { const k = []; try { for (let i = 0; i < localStorage.length; i++) { const n = localStorage.key(i); if (n.indexOf(PREF) === 0 && !SKIP.test(n)) k.push(n); } } catch (e) {} return k; };
    const snap = () => { const o = {}; claves().forEach(k => { o[k] = localStorage.getItem(k); }); return o; };
    const ser = o => JSON.stringify(Object.keys(o).sort().map(k => [k, o[k]]));
    const hash = s => { let h = 5381; for (let i = 0; i < s.length; i++) h = ((h << 5) + h + s.charCodeAt(i)) | 0; return h; };
    const getMeta = () => { try { return JSON.parse(localStorage.getItem(META)) || {}; } catch (e) { return {}; } };
    const setMeta = m => { try { localStorage.setItem(META, JSON.stringify(m)); } catch (e) {} };
    /* CORREGIDO: "vacío" = sin progreso real (solo el apodo/perfil no cuenta) */
    const vacio = o => !o || !(o.ingles_gamer_a1_repaso || o.ingles_gamer_aura || o.ingles_gamer_tienda);
    const limpiar = () => claves().forEach(k => localStorage.removeItem(k));
    const cambios = () => !!user && getMeta().uid === user.uid && hash(ser(snap())) !== getMeta().h;
    const puntos = d => {
      try {
        const a = JSON.parse(d.ingles_gamer_aura || "null") || {}, r = JSON.parse(d.ingles_gamer_a1_repaso || "null") || {};
        return (+a.t || 0) + Object.values(r.est || {}).reduce((x, y) => x + (+y || 0), 0);
      } catch (e) { return 0; }
    };

    async function subir() {
      const o = snap(), t = Date.now();
      await setDoc(ref(), { datos: o, t: t, v: 1 });
      setMeta({ uid: user.uid, t: t, h: hash(ser(o)) });
      estado(true);
    }
    function bajar(c) {
      limpiar();
      const d = c.datos || {};
      for (const k in d) if (k.indexOf(PREF) === 0 && !SKIP.test(k) && typeof d[k] === "string") localStorage.setItem(k, d[k]);
      setMeta({ uid: user.uid, t: c.t || Date.now(), h: hash(ser(snap())) });
    }

    async function sync(lanzar) {
      if (!user || ocupado) return "igual";
      ocupado = true;
      let res = "igual";
      try {
        const m = getMeta(), o = snap(), h = hash(ser(o)), s = await getDoc(ref()), c = s.exists() ? s.data() : null, cd = (c && c.datos) || {};
        if (m.uid && m.uid !== user.uid) {
          limpiar();
          if (c) bajar(c); else await subir();
          res = "bajado"; location.reload();
        } else if (m.uid !== user.uid) {
          if (c && (vacio(o) || puntos(cd) >= puntos(o))) { bajar(c); res = "bajado"; location.reload(); }
          else { await subir(); res = "subido"; }
        } else if (c && vacio(o) && !vacio(cd)) {
          bajar(c); res = "bajado"; location.reload();
        } else if (!c || h !== m.h) { await subir(); res = "subido"; }
        else if (c.t > m.t) { bajar(c); res = "bajado"; location.reload(); }
        else estado(true);
      } catch (e) { ocupado = false; estado(false, e); if (lanzar) throw e; return "igual"; }
      ocupado = false;
      return res;
    }

    const guardarYa = () => { if (cambios()) sync(); };
    onAuthStateChanged(auth, u => { user = u; if (u) sync(); });
    document.addEventListener("visibilitychange", () => { if (document.hidden) guardarYa(); else sync(); });
    addEventListener("pagehide", guardarYa);
    setInterval(guardarYa, 45000);

    window.IGNube = {
      listo: true,
      sincronizar: () => sync(),
      usuario: () => user,
      async subirYa() {
        for (let i = 0; i < 40 && !user; i++) await dormir(250);
        if (!user) throw new Error("sin-sesion");
        while (ocupado) await dormir(200);
        const r = await sync(true);
        if (r === "bajado") throw new Error("recargando");
      }
    };
  } catch (e) { console.error("[nube]", e); }
})();
</script>
</body>
</html>
