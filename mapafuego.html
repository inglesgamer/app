<script>
/* ===== WEB (GitHub Pages): convierte los enlaces go:seccion en seccion.html. En App Creator no hace nada. ===== */
(function(){
  var web = /github\.io$/.test(location.hostname);
  window.igURL = function(u){
    u = String(u);
    if (!web || u.indexOf("go:") !== 0) return u;
    var s = u.slice(3);
    return (s === "inicio" ? "index" : s) + ".html";
  };
  if (!web) return;
  document.addEventListener("click", function(e){
    var a = e.target.closest && e.target.closest('a[href^="go:"]');
    if (a){ e.preventDefault(); location.href = igURL(a.getAttribute("href")); }
  }, true);
})();
</script>

<style>
/* ============ TEMA NOCHE (por defecto) ============ */
:root{

}

.app{max-width:430px;min-height:100vh;margin:0 auto;position:relative;overflow-x:hidden;background:var(--bg);padding-bottom:calc(104px + env(safe-area-inset-bottom))}

/* ---------- cabecera ---------- */

.chi{animation:chi var(--t,2.4s) ease-out infinite;animation-delay:var(--d,0s)}@keyframes chi{0%{transform:translate(0,0);opacity:0}10%{opacity:1}100%{transform:translate(var(--dx),var(--dy));opacity:0}}

.sk{display:inline-flex}.sk svg{display:block;filter:drop-shadow(0 4px 0 rgba(0,0,0,.3))}
.arco{animation:hue 3s linear infinite}@keyframes hue{to{filter:hue-rotate(360deg)}}

.lkfx{position:absolute;inset:0;overflow:hidden;pointer-events:none}.lkfx::before,.lkfx::after{content:"";position:absolute;inset:0}

<script>
/* ================= TUS DATOS: edita solo esta parte ================= */

// BLOQUEO: true = cada nivel se abre al pasar el anterior. false = todos abiertos.
const BLOQUEO = true;

// Dónde se guardan las estrellas de esta isla
const CLAVE = "ingles_gamer_fuego_repaso";

const NODOS = [
  { id:"oraciones",     nombre:"Fundamentos",        spr:"bloque",     url:"go:fuego_oraciones" },
  { id:"pronombres",    nombre:"Pronombres",         spr:"carnet",     url:"go:fuego_pronombres" },

function textoTema(v) {
  if (v === null || v === undefined || v === "") return "";
  try {
    const j = JSON.parse(v);
    if (j && typeof j === "object") v = j.tema || j.apariencia || j.theme || j.modo || "";
    else v = j;
  } catch (e) {}
  return String(v).toLowerCase();
}
function leerTema() {
  let r = "";
  try {
    const q = new URLSearchParams(location.search).get("tema");
    if (q) r = q.toLowerCase();
  } catch (e) {}
  if (!r) {
    try {
      for (let i = 0; i < CLAVES_TEMA.length && !r; i++) r = textoTema(localStorage.getItem(CLAVES_TEMA[i]));
      if (!r) r = textoTema(JSON.parse(localStorage.getItem("ingles_gamer_perfil") || "null") && JSON.parse(localStorage.getItem("ingles_gamer_perfil")).tema);
    } catch (e) {}
  }
  return /rosa|pink/.test(r) ? "rosa" : /azul|blue/.test(r) ? "azul" : /d[ií]a|claro|light|day/.test(r) ? "dia" : "noche";
}

function escenaHTML(H, P) {
  let s = '<svg class="sc" viewBox="0 0 ' + W + ' ' + H + '" aria-hidden="true"><defs>' +
    '<linearGradient id="gk" x1="0" y1="0" x2="0" y2="1"><stop offset="0" class="s-k1"></stop><stop offset="1" class="s-k2"></stop></linearGradient>' +
    '<linearGradient id="gm" x1="0" y1="0" x2="0" y2="1"><stop offset="0" class="s-e1"></stop><stop offset="1" class="s-e2"></stop></linearGradient>' +
    '<radialGradient id="gs"><stop offset="0" stop-color="#FFB070" stop-opacity=".8"></stop><stop offset=".45" stop-color="#FF6A1F" stop-opacity=".3"></stop><stop offset="1" stop-color="#FF6A1F" stop-opacity="0"></stop></radialGradient>' +
    /* volcancito */
    '<symbol id="volc" viewBox="0 0 100 80"><path class="l1" d="M0 78L36 16H64L100 78Z"></path><path class="l2" d="M64 16L100 78H74Z" opacity=".8"></path>' +
      '<ellipse cx="50" cy="16" rx="15" ry="4" fill="#FF8A3D"></ellipse><ellipse cx="50" cy="16" rx="8" ry="2" fill="#FFD36B"></ellipse>' +
      '<path class="glw" d="M46 18L42 36L48 52L44 70M55 18L60 38L56 56" fill="none" stroke="#FF6A1F" stroke-width="4" stroke-linecap="round"></path></symbol>' +
    /* roca con grietas de lava */
    '<symbol id="roca" viewBox="0 0 90 60"><path class="l1" d="M4 58L14 24L36 8L62 14L82 34L88 58Z"></path><path class="l2" d="M36 8L62 14L56 30L32 26Z" opacity=".9"></path>' +
      '<path class="glw" d="M22 56L30 40L26 30M50 58L54 42L66 34" fill="none" stroke="#FF6A1F" stroke-width="3.5" stroke-linecap="round"></path></symbol>' +
    /* cristal rojo */
    '<symbol id="cris" viewBox="0 0 60 70"><path d="M30 2L44 22L38 68H22L16 22Z" fill="#E5484D"></path><path d="M30 2L16 22L22 68L28 22Z" fill="#FF8A8F"></path>' +
      '<path d="M48 26L58 40L52 68H42Z" fill="#B8333A"></path><path d="M12 30L2 44L8 68H18Z" fill="#C93D44"></path></symbol>' +
    '</defs>';

  /* cielo */
  s += '<rect width="390" height="140" fill="url(#gk)"></rect>';
  /* noche: luna roja, estrellas tenues y nubes de ceniza */
  s += '<g class="only-n"><g fill="#FFB89A" class="est"><circle cx="30" cy="24" r="1.2"></circle><circle cx="130" cy="18" r="1"></circle><circle cx="200" cy="44" r="1.2"></circle><circle cx="60" cy="96" r="1"></circle><circle cx="160" cy="92" r="1"></circle></g>' +
    '<circle cx="78" cy="62" r="56" fill="url(#gs)" opacity=".5"></circle><circle cx="78" cy="62" r="18" fill="#C9402A" opacity=".85"></circle>' +
    '<g fill="#2A1216" opacity=".85" class="nb"><ellipse cx="70" cy="36" rx="34" ry="9"></ellipse><ellipse cx="92" cy="29" rx="22" ry="10"></ellipse><ellipse cx="50" cy="31" rx="18" ry="8"></ellipse></g></g>';
  /* día: sol entre humo */
  s += '<g class="only-d"><circle cx="78" cy="58" r="56" fill="url(#gs)"></circle><circle cx="78" cy="58" r="22" fill="#FFE08A"></circle>' +
    '<g fill="#fff" opacity=".7" class="nb"><ellipse cx="150" cy="40" rx="30" ry="9"></ellipse><ellipse cx="170" cy="32" rx="18" ry="10"></ellipse></g></g>';

  /* volcán grande en erupción */
  let ch = "";
  for (let k = 0; k < 9; k++) ch += '<rect x="' + (300 + ((k * 37) % 13) - 6) + '" y="46" width="3.4" height="3.4" fill="' + (k % 2 ? "#FFC83D" : "#FF6A1F") + '" class="chi" style="--dx:' + (((k * 53) % 90) - 45) + 'px;--dy:' + (-32 - (k * 17) % 34) + 'px;--t:' + (1.8 + (k % 4) * .35) + 's;--d:-' + ((k * 0.41) % 3).toFixed(2) + 's"></rect>';
  s += '<path class="mt1" d="M0 132L56 86L84 96L140 132Z"></path>' +
       '<path class="mt2" d="M180 132L272 52L290 58L306 48L324 54L392 132Z"></path>' +
       '<circle cx="300" cy="52" r="62" fill="url(#gs)" class="glw"></circle>' +
       '<ellipse cx="298" cy="51" rx="17" ry="4.5" fill="#FF8A3D"></ellipse><ellipse cx="298" cy="51" rx="9" ry="2.2" fill="#FFD36B"></ellipse>' +
       '<g class="glw" fill="none" stroke="#FF6A1F" stroke-width="3" stroke-linecap="round"><path d="M292 56L286 80L293 104L285 132"></path><path d="M305 56L313 84L307 110L316 132"></path></g>' +
       '<g fill="#4A3034"><circle class="humo" cx="294" cy="44" r="7" style="--dx:-16px"></circle><circle class="humo" cx="302" cy="42" r="6" style="--dx:12px;--d:-2s"></circle><circle class="humo" cx="298" cy="44" r="8" style="--dx:2px;--d:-4s"></circle></g>' + ch;

  /* mar de lava y olas brillantes */
  s += '<rect y="130" width="390" height="180" fill="url(#gm)"></rect><rect y="129" width="390" height="2" fill="#FFC83D" opacity=".6"></rect>';
  s += '<g fill="none" stroke="#FFC83D" stroke-width="2" stroke-linecap="round">' +
    '<path class="ond" opacity=".35" d="' + onda(160) + '"></path><path class="ond b" opacity=".3" d="' + onda(194) + '"></path>' +
    '<path class="ond" opacity=".3" d="' + onda(228) + '"></path><path class="ond b" opacity=".25" d="' + onda(262) + '"></path></g>';
  s += '<g fill="#FFD36B" class="bri"><circle cx="60" cy="176" r="2.2"></circle><circle cx="300" cy="212" r="2"></circle><circle cx="170" cy="250" r="2.2"></circle><circle cx="40" cy="270" r="1.6"></circle></g>';
  /* roca flotando en la lava */
  s += '<g class="hielo"><g transform="translate(80 140)"><path d="M0 10L8 -6L18 -2L26 -12L40 10Z" style="fill:var(--bt2)"></path><path d="M26 -12L20 -2L28 0L33 -5Z" style="fill:var(--bt1)"></path><path d="M6 10L12 2L16 10" fill="none" stroke="#FF8A3D" stroke-width="2"></path></g></g>';

  /* suelo volcánico */
  s += '<path d="M0 300 Q49 284 97 300 T195 300 T292 300 T390 300 V' + H + ' H0Z" style="fill:var(--sa);stroke:var(--fo)" stroke-width="6"></path>';
  s += '<path d="M0 314 Q49 298 97 314 T195 314 T292 314 T390 314" fill="none" style="stroke:var(--sb)" stroke-width="2" opacity=".5"></path>';
  s += '<g style="fill:var(--sb)" opacity=".8">';
  for (let k = 0, y = 340; y < H - 30; k++, y += 83) {
    s += '<circle cx="' + (20 + (97 * k) % 350) + '" cy="' + y + '" r="2.4"></circle>';
    s += '<circle cx="' + (20 + (97 * k + 300) % 350) + '" cy="' + (y + 15) + '" r="2.4"></circle>';
  }
  s += '</g>';
  /* charcos de lava en el suelo */
  s += '<g fill="#FF6A1F" class="glw">';
  for (let k = 0, y = 420; y < H - 60; k++, y += 260) s += '<ellipse cx="' + (k % 2 ? 330 : 60) + '" cy="' + y + '" rx="26" ry="6" opacity=".55"></ellipse>';
  s += '</g>';

  /* volcancitos, rocas y cristales, siempre del lado contrario al nivel */
  let j = 0;
  P.forEach(function (p, i) {
    const t = NODOS[i]; if (t.tipo === "escucha" || t.tipo === "final") return;
    const tipo = ["volc", "roca", "cris"][j % 3], yc = p.y + 20; j++;
    const w = tipo === "volc" ? 100 : (tipo === "roca" ? 84 : 52), h = tipo === "volc" ? 80 : (tipo === "roca" ? 56 : 62), y = yc - h / 2;
    if (p.x === XL) s += '<use href="#' + tipo + '" x="' + (390 - w - 6) + '" y="' + y + '" width="' + w + '" height="' + h + '"></use>';
    else s += '<use href="#' + tipo + '" x="6" y="' + y + '" width="' + w + '" height="' + h + '"></use>';
  });

  /* camino de roca: brillo de lava en lo que ya pasaste */
  let base = "", guia = "";
  for (let i = 0; i < P.length - 1; i++) {
    const a = P[i], b = P[i + 1], d = 'M' + a.x + ' ' + a.y + ' C' + a.x + ' ' + (a.y + PASO / 2) + ' ' + b.x + ' ' + (b.y - PASO / 2) + ' ' + b.x + ' ' + b.y;
    base += '<path d="' + d + '" fill="none" style="stroke:var(--p2)" stroke-width="46" stroke-linecap="round"></path>' +
            '<path d="' + d + '" fill="none" style="stroke:var(--p1)" stroke-width="38" stroke-linecap="round"></path>';
    if (est(NODOS[i].id) >= 1) guia += '<path d="' + d + '" fill="none" style="stroke:var(--pg)" stroke-width="9" stroke-linecap="round"></path>';
    else guia += '<path d="' + d + '" fill="none" style="stroke:var(--umb)" stroke-width="5" stroke-linecap="round" stroke-dasharray="2 12" opacity=".7"></path>';
  }
  s += base + guia + '</svg>';
  return s;
}

function pctX(x) { return (x / W * 100).toFixed(3) + "%"; }

function nodosHTML(H, P, act) {
  let h = "";
  NODOS.forEach(function (t, i) {
    const e = est(t.id), bloq = !desbloq(i), esc = t.tipo === "escucha", fin = t.tipo === "final";
    const st = bloq ? "lock" : (i === act ? "act" : (e >= 1 ? "done" : "open"));
    const nombre = fin ? "Jefe final" : "Nivel " + (i + 1) + ": " + t.nombre;
    const abre = bloq ? '<button type="button" data-bloq="' + i + '"' : '<a href="' + t.url + '"';
    const cierra = bloq ? '</button>' : '</a>';
    const pos = ' style="left:' + pctX(P[i].x) + ';top:' + (P[i].y / H * 100).toFixed(3) + '%" aria-label="' + nombre + ', ' + (bloq ? 'bloqueado' : e + ' de 3 estrellas') + '"';
    const tag = i === act ? '<span class="tg">¡AQUÍ!</span>' : '';
    const cl = 'nodo ' + (bloq ? 'bloq ' : '') + (esc ? 'esc ' : '') + (fin ? 'jefe ' : '') + st;
    if (esc) {
      h += abre + ' class="' + cl + '"' + pos + '>' + tag +
        '<span class="ci">' + icono(bloq ? "candado" : t.spr, 26) + '</span>' +
        '<span class="tx"><small>ESCUCHA</small><b>' + t.nombre + '</b>' + (bloq ? '' : '<span class="srw">' + estrellasHTML(e, 15) + '</span>') + '</span>' + cierra;
      return;
    }
    const ic = fin ? icono("jefe", 46) : icono(bloq ? "candado" : t.spr, 38);
    h += abre + ' class="' + cl + '"' + pos + '>' + tag +
      '<span class="nA ' + st + (fin ? ' big' : '') + '">' + ic + '</span>' +
      '<span class="lbl' + (bloq ? ' l' : '') + '">' + (fin ? 'Jefe final' : (i + 1) + ' · ' + t.nombre) + '</span>' +
      (bloq ? '' : '<span class="srw">' + estrellasHTML(e, 16) + '</span>') + cierra;
  });
  return h;
}

function personajesHTML(H, P, act) {
  const am = amigos(), dichos = ["Great!", "Nice job!", "Well done!", "Awesome!"]; let h = "";
  P.forEach(function (p, i) {
    const t = NODOS[i];
    if (t.tipo === "escucha" || t.tipo === "final") return;
    const yo = (i === act), hecho = est(t.id) >= 1, bloq = !desbloq(i);
    if (!(yo || i % 3 === 1)) return;
    const spr = yo ? "av" + miAvatar() : am[i % am.length];
    const dicho = yo ? "Let’s go!" : (hecho ? dichos[i % 4] : "Zzz...");
    const x = p.x < XC ? p.x + 108 : p.x - 108;
    h += '<div class="fx' + (bloq ? ' zz' : '') + '" aria-hidden="true" style="left:' + pctX(x) + ';top:' + ((p.y - 66) / H * 100).toFixed(3) + '%;--d:-' + ((i * 0.7) % 2.6).toFixed(1) + 's">' +
      '<span class="bub">' + dicho + '</span><span class="sprw">' + (yo ? lookSkin(sprite(spr, 72)) : sprite(spr, 64)) + '</span></div>';
  });
  return h;
}

function pintarMapa() {
  const n = NODOS.length, H = Y0 + (n - 1) * PASO + 150, act = actualIdx();
  let c = 0;
  const P = NODOS.map(function (t, i) {
    let x;
    if (t.tipo === "escucha" || t.tipo === "final") x = XC;
    else { x = (c % 2 === 0) ? XL : XR; c++; }
    return { x: x, y: Y0 + i * PASO };
  });
  const m = $("mapa");
  m.style.aspectRatio = W + " / " + H;
  m.innerHTML = escenaHTML(H, P) + '<div class="nv" aria-hidden="true"></div>' + personajesHTML(H, P, act) + nodosHTML(H, P, act);
}
$("mapa").addEventListener("click", function (e) {
  const b = e.target.closest("[data-bloq]"); if (!b) return;
  const i = Number(b.dataset.bloq), t = NODOS[i];
  aviso(t.tipo === "final" ? "El jefe final se abre cuando pases todos los niveles." : "Primero pasa el nivel «" + NODOS[i - 1].nombre + "».");
});

/* ---------- arranque ---------- */
pintarHero();
pintarMapa();
function refrescar() {
  try { const g = JSON.parse(localStorage.getItem(CLAVE) || "null"); if (g && g.est) S = g; } catch (e) {}
  aplicarTema(); pintarHero(); pintarMapa();
}
window.addEventListener("pageshow", refrescar);
window.addEventListener("storage", function (e) { refrescar(); });
document.addEventListener("visibilitychange", function () { if (!document.hidden) refrescar(); });
</script>
</body>
</html>
